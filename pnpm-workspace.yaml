packages:
  - apps/*
  - packages/*

overrides:
  '@babel/plugin-transform-modules-systemjs@7.29.0': 7.29.7
  '@codemirror/autocomplete': 6.20.3
  '@codemirror/lang-javascript': 6.2.5
  '@codemirror/language': 6.12.3
  '@codemirror/lint': 6.9.6
  '@codemirror/state': 6.6.0
  '@codemirror/view': 6.43.0
  '@hono/node-server@1.19.9': 1.19.14
  '@xmldom/xmldom@0.8.11': 0.8.13
  ajv@6.12.6: 6.14.0
  ajv@8.17.1: 8.20.0
  brace-expansion: 5.0.8
  cookie@0.6.0: 0.7.2
  express-rate-limit@8.2.1: 8.5.2
  'fast-uri@>=3.0.0 <3.1.4': 3.1.4
  flatted@3.3.3: 3.4.2
  hono@4.11.9: 4.12.23
  ip-address@10.0.1: 10.2.0
  lodash@4.17.23: 4.18.1
  minimatch@9.0.5: 9.0.9
  path-to-regexp@8.3.0: 8.4.2
  picomatch@2.3.1: 2.3.2
  picomatch@4.0.3: 4.0.4
  'postcss@>=8.5.8 <8.5.18': 8.5.18
  qs@6.14.2: 6.15.2
  rollup@4.57.1: 4.61.0
  serialize-javascript@6.0.2: 7.0.5
  'tar@<7.5.19': 7.5.19
  'shell-quote@<1.9.0': 1.9.0
  tmp@0.2.5: 0.2.7
  # Vitest/jsdom and Electron currently resolve the vulnerable 7.27.0 line.
  # Keep electron-builder's unrelated undici 6.x line untouched.
  'undici@7.27.0': 7.28.0
  yaml@1.10.2: 1.10.3

allowBuilds:
  # electron's install script downloads its prebuilt binary — required to package the gm-react
  # desktop shell (apps/gm-react/electron). electron-winstaller stays off: Windows is not a target.
  electron: true
  electron-winstaller: false
  esbuild: true

onlyBuiltDependencies:
  - esbuild
  - electron

ignoredBuiltDependencies:
  - electron-winstaller

# Delay newly published versions for one day so compromised releases have time to be reported before
# an intentional dependency refresh can select them. Frozen-lockfile CI remains fully deterministic.
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - '@codemirror/autocomplete@6.20.3'

name: Set up workspace
description: >-
  pnpm, Node 24 with the pnpm store cache, and a frozen-lockfile install. Every CI job starts
  here so the toolchain pin lives in one place. Requires a checkout.
inputs:
  electron:
    description: Download the Electron binary (only the desktop smoke needs it)
    required: false
    default: 'false'
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      with:
        version: 10.34.5
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 24
        cache: pnpm
    - name: Install dependencies
      shell: bash
      env:
        WITH_ELECTRON: ${{ inputs.electron }}
      run: |
        if [[ "$WITH_ELECTRON" != "true" ]]; then export ELECTRON_SKIP_BINARY_DOWNLOAD=1; fi
        pnpm install --frozen-lockfile

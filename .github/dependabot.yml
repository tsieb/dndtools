version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: America/Vancouver
    cooldown:
      default-days: 7
    open-pull-requests-limit: 6
    groups:
      runtime-patches:
        dependency-type: production
        update-types: [patch, minor]
      tooling-patches:
        dependency-type: development
        update-types: [patch, minor]
    # Majors remain ungrouped so breaking changes get focused review instead of disappearing from
    # the update queue. This also leaves Dependabot free to propose a major-only security fix.

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:30'
      timezone: America/Vancouver
    cooldown:
      default-days: 7
    open-pull-requests-limit: 4
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: gradle
    directory: /apps/gm-react/android
    schedule:
      interval: weekly
      day: monday
      time: '10:00'
      timezone: America/Vancouver
    cooldown:
      default-days: 7
    open-pull-requests-limit: 4
    ignore:
      # Gradle 9.6+ removed the internal Problems API that AGP 8.x still uses, so a wrapper bump
      # past 9.5 breaks every Android build (release v0.3.4 died on 9.7.1). Lift this together
      # with an AGP 9 upgrade, never on its own.
      - dependency-name: 'gradle'
        versions: ['>=9.6']

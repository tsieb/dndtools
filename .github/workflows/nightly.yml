name: Nightly

# The checks that are too slow or too environment-sensitive to block a landing, run once a day
# against the integration branch so a regression is seen before it is promoted (ADR-043):
#   • the Android emulator legs (instrumentation + lifecycle acceptance on API 36);
#   • browser tests tagged @quarantine (docs/development/TESTING.md §10);
#   • the whole-application validation harness (`pnpm validate`).
# A failure opens or updates one `nightly` issue with the run link; nothing here creates work
# for the dispatcher by itself.

on:
  schedule:
    - cron: '0 6 * * *' # 06:00 UTC daily
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag or SHA to check (blank: loop/rc)'
        required: false
        type: string
        default: ''

concurrency:
  group: nightly-${{ inputs.ref || 'loop/rc' }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CHECK_REF: ${{ inputs.ref || 'loop/rc' }}

jobs:
  android-emulator:
    name: Android instrumentation and lifecycle acceptance (API 36)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.CHECK_REF }}
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
      - name: Set up JDK 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          # Google retired the obsolete 'tools' package the action defaults to; everything the
          # job needs is installed explicitly below through the retrying script.
          packages: platform-tools
      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Install Android API 36 toolchain
        shell: bash
        run: >-
          bash scripts/android-sdk-install.sh
          'platform-tools'
          'platforms;android-36'
          'build-tools;36.0.0'
          'emulator'
          'system-images;android-36;google_apis;x86_64'
      - name: Build renderer, synchronize Capacitor, and package the debug APK
        run: |
          pnpm --filter @dndtools/gm-react build
          pnpm --filter @dndtools/gm-react exec cap sync android
          (cd apps/gm-react/android && ./gradlew --no-daemon --stacktrace assembleDebug)
      - name: Enable KVM for the API 36 emulator
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run instrumentation and lifecycle acceptance on API 36
        env:
          ANDROID_EXPECT_PRIVATE_DATA: '1'
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          # The pixel_6 default left API 36 google_apis paging system code in and out under the
          # acceptance script; a stalled rotation frame then tripped an input-dispatch ANR.
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            (cd apps/gm-react/android && ./gradlew --no-daemon --stacktrace :app:connectedDebugAndroidTest)
            scripts/android-emulator-acceptance.sh apps/gm-react/android/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload Android diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-android
          path: |
            apps/gm-react/android/app/build/reports
            apps/gm-react/android/app/build/outputs/androidTest-results
          if-no-files-found: warn
          retention-days: 14

  quarantine:
    name: quarantined browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble@sha256:5b8f294aff9041b7191c34a4bab3ac270157a28774d4b0660e9743297b697e48
      options: --ipc=host
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.CHECK_REF }}
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
      - name: Run every test tagged @quarantine, five times each
        working-directory: apps/gm-react
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: quarantine.json
        run: >-
          pnpm exec playwright test --grep @quarantine --repeat-each=5 --retries=0
          --pass-with-no-tests --reporter=line,json
      - name: Summarize
        if: always()
        working-directory: apps/gm-react
        run: test -f quarantine.json && node ../../scripts/ci/e2e-summary.mjs quarantine.json >> "$GITHUB_STEP_SUMMARY" || true
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-quarantine
          path: |
            apps/gm-react/quarantine.json
            apps/gm-react/test-results
          if-no-files-found: ignore
          retention-days: 14

  validate:
    name: whole-application validation harness
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.CHECK_REF }}
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
      # Browser-driven checks (e2e / axe / React verify) resolve Playwright from apps/gm-react.
      - name: Set up browser tests
        uses: ./.github/actions/setup-e2e
      - name: Run validation
        run: pnpm validate
      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: validation-report
          path: test-results/validation
          if-no-files-found: warn
          retention-days: 14

  report:
    name: open or update the nightly issue
    needs: [android-emulator, quarantine, validate]
    if: always() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write # open, comment on, or close the single `nightly` tracking issue
    steps:
      - name: File the result
        env:
          GH_TOKEN: ${{ github.token }}
          RESULTS: ${{ toJSON(needs) }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REF: ${{ env.CHECK_REF }}
        run: |
          FAILED=$(jq -r 'to_entries[] | select(.value.result == "failure" or .value.result == "cancelled") | .key' <<<"$RESULTS" | tr '\n' ' ')
          EXISTING=$(gh issue list --repo "$GITHUB_REPOSITORY" --label nightly --state open --json number --jq '.[0].number // empty')
          if [[ -z "$FAILED" ]]; then
            if [[ -n "$EXISTING" ]]; then
              gh issue comment "$EXISTING" --repo "$GITHUB_REPOSITORY" --body "Nightly passed on \`$REF\`: $RUN_URL. Closing."
              gh issue close "$EXISTING" --repo "$GITHUB_REPOSITORY"
            fi
            exit 0
          fi
          BODY=$(printf 'Nightly failed on `%s`: %s\n\nFailed jobs: %s\n\n%s' "$REF" "$RUN_URL" "$FAILED" \
            "$(jq -r 'to_entries[] | "- \(.key): \(.value.result)"' <<<"$RESULTS")")
          if [[ -n "$EXISTING" ]]; then
            gh issue comment "$EXISTING" --repo "$GITHUB_REPOSITORY" --body "$BODY"
          else
            gh label create nightly --repo "$GITHUB_REPOSITORY" --description 'Opened by nightly.yml' --color B60205 2>/dev/null || true
            gh issue create --repo "$GITHUB_REPOSITORY" --label nightly \
              --title "Nightly checks failing on $REF ($FAILED)" --body "$BODY"
          fi

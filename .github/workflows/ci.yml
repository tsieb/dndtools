name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.base.ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: detect runtime changes
    runs-on: ubuntu-latest
    outputs:
      runtime: ${{ steps.filter.outputs.runtime }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        id: filter
        with:
          filters: |
            runtime:
              - 'apps/gm-react/**'
              - 'packages/core/**'
              - 'scripts/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'vitest.*.config.ts'
              - '.github/workflows/ci.yml'
              - '.github/workflows/release.yml'

  build-and-test:
    name: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.34.5

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Enforce tiered quality gates (PLAT-010)
        run: pnpm gates

      - name: Scan tracked files for high-confidence credentials
        run: pnpm security:secrets

      - name: Enforce the incremental formatting baseline
        run: pnpm format:check:changed

      # `pnpm gates` only cross-checks gate metadata; it runs no compiler or linter.
      # The changed-file format gate advances the baseline without reformatting historical files.
      - name: Lint (eslint + boundary + non-text contrast)
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Run unit tests
        run: pnpm test

      - name: Enforce core and security coverage floors
        run: pnpm test:coverage:core

      - name: Upload core coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: core-coverage
          path: coverage/core
          if-no-files-found: warn
          retention-days: 14

  browser-e2e:
    name: browser E2E (${{ matrix.name }})
    needs: [changes, build-and-test]
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.runtime == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: 1/2
            name: 1-of-2
          - shard: 2/2
            name: 2-of-2
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.34.5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm --filter @dndtools/gm-react exec playwright install --with-deps chromium
      - name: Run Playwright shard
        env:
          PLAYWRIGHT_HTML_OPEN: never
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report
          PLAYWRIGHT_SHARD: ${{ matrix.shard }}
        run: >-
          pnpm --filter @dndtools/gm-react exec playwright test
          --shard="$PLAYWRIGHT_SHARD" --reporter=line,html
      - name: Upload Playwright diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-e2e-${{ matrix.name }}
          path: |
            apps/gm-react/playwright-report
            apps/gm-react/test-results
          if-no-files-found: warn
          retention-days: 14

  accessibility:
    name: accessibility (desktop + mobile)
    needs: [changes, build-and-test]
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.runtime == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.34.5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm --filter @dndtools/gm-react exec playwright install --with-deps chromium
      - name: Run axe scan
        run: pnpm a11y:axe
      - name: Apply accessibility release policy
        if: always()
        run: pnpm a11y:report
      - name: Upload accessibility diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: accessibility-report
          path: |
            apps/gm-react/test-results
            tmp/a11y
          if-no-files-found: warn
          retention-days: 14

  desktop-smoke:
    name: Electron smoke (Linux)
    needs: [changes, build-and-test]
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.runtime == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.34.5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies (including Electron)
        run: pnpm install --frozen-lockfile
      - name: Boot packaged renderer twice and verify persistence
        run: xvfb-run --auto-servernum pnpm --filter @dndtools/gm-react desktop:smoke

  android-checks:
    name: Android unit, lint, and package checks
    needs: [changes, build-and-test]
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.runtime == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.34.5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: pnpm
      - name: Set up JDK 21
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5.5.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
      - name: Install Android API 36 toolchain
        shell: bash
        run: |
          set +o pipefail
          yes | sdkmanager --licenses >/dev/null
          SDKMANAGER_STATUS=${PIPESTATUS[1]}
          set -o pipefail
          test "$SDKMANAGER_STATUS" -eq 0
          sdkmanager \
            'platform-tools' \
            'platforms;android-36' \
            'build-tools;36.0.0' \
            'emulator' \
            'system-images;android-36;google_apis;x86_64'
      - name: Install dependencies
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: pnpm install --frozen-lockfile
      - name: Build renderer and synchronize Capacitor
        run: |
          pnpm --filter @dndtools/gm-react build
          pnpm --filter @dndtools/gm-react exec cap sync android
      - name: Run Android unit, lint, and debug APK/AAB packaging gates
        working-directory: apps/gm-react/android
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest lintDebug assembleDebug bundleDebug
      - name: Normalize CI-only Android debug packages
        shell: bash
        run: |
          VERSION=$(node -p "require('./apps/gm-react/package.json').version")
          mkdir -p apps/gm-react/android/app/build/outputs/ci-packages
          install -m 0644 \
            apps/gm-react/android/app/build/outputs/apk/debug/app-debug.apk \
            "apps/gm-react/android/app/build/outputs/ci-packages/DND-Tools-GM-${VERSION}-android-ci-debug.apk"
          install -m 0644 \
            apps/gm-react/android/app/build/outputs/bundle/debug/app-debug.aab \
            "apps/gm-react/android/app/build/outputs/ci-packages/DND-Tools-GM-${VERSION}-android-ci-debug.aab"
      - name: Enable KVM for the API 36 emulator
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run instrumentation and lifecycle acceptance on API 36
        env:
          ANDROID_EXPECT_PRIVATE_DATA: '1'
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            (cd apps/gm-react/android && ./gradlew --no-daemon --stacktrace :app:connectedDebugAndroidTest)
            scripts/android-emulator-acceptance.sh apps/gm-react/android/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload Android diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-checks
          path: |
            apps/gm-react/android/app/build/reports
            apps/gm-react/android/app/build/outputs/apk/debug
            apps/gm-react/android/app/build/outputs/bundle/debug
            apps/gm-react/android/app/build/outputs/ci-packages
          if-no-files-found: warn
          retention-days: 14

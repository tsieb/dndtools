name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: full-ci-${{ github.workflow }}-${{ github.event.pull_request.base.ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  quality-core:
    name: quality-core
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Export regression coverage thresholds
        run: pnpm test:coverage

  docs-validation:
    name: docs-validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate docs invariants
        run: pnpm docs:validate

  desktop-e2e-critical:
    name: desktop-e2e-critical
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run desktop critical E2E suite
        run: xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" pnpm desktop:test:critical

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-desktop-critical
          path: playwright-report/
          if-no-files-found: ignore

  desktop-e2e-accessibility:
    name: desktop-e2e-accessibility
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run desktop accessibility E2E suite
        run: xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" pnpm desktop:test:a11y

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-desktop-a11y
          path: playwright-report/
          if-no-files-found: ignore

  metrics-report:
    name: metrics-report
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Capture current metrics
        run: xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" pnpm metrics:capture -- --profile ci --outputDir tmp/metrics/latest

      - name: Compare metrics against baselines
        run: pnpm metrics:compare -- --baselineDir tests/perf --currentDir tmp/metrics/latest --markdown tmp/metrics/latest/metrics-summary.md --json tmp/metrics/latest/metrics-summary.json --enforceRegression

      - name: Upload metrics artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metrics-report
          path: tmp/metrics/latest/
          if-no-files-found: warn

      - name: Comment metrics summary on PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const summaryPath = 'tmp/metrics/latest/metrics-summary.md';
            if (!fs.existsSync(summaryPath)) {
              core.warning(`Metrics summary not found at ${summaryPath}`);
              return;
            }
            const body = fs.readFileSync(summaryPath, 'utf8').trim();
            const issueNumber = context.issue.number;
            const marker = '<!-- dndtools-metrics-report -->';
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
            });
            const existing = comments.find((comment) => comment.body && comment.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
              return;
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body,
            });

  quality:
    name: quality
    if: ${{ always() }}
    needs:
      - quality-core
      - docs-validation
      - desktop-e2e-critical
      - desktop-e2e-accessibility
      - metrics-report
    runs-on: ubuntu-latest
    steps:
      - name: Enforce required job success
        run: |
          if [ "${{ needs.quality-core.result }}" != "success" ]; then
            echo "quality-core did not succeed (result: ${{ needs.quality-core.result }})." >&2
            exit 1
          fi
          if [ "${{ needs.docs-validation.result }}" != "success" ]; then
            echo "docs-validation did not succeed (result: ${{ needs.docs-validation.result }})." >&2
            exit 1
          fi
          if [ "${{ needs.desktop-e2e-critical.result }}" != "success" ]; then
            echo "desktop-e2e-critical did not succeed (result: ${{ needs.desktop-e2e-critical.result }})." >&2
            exit 1
          fi
          if [ "${{ needs.desktop-e2e-accessibility.result }}" != "success" ]; then
            echo "desktop-e2e-accessibility did not succeed (result: ${{ needs.desktop-e2e-accessibility.result }})." >&2
            exit 1
          fi
          if [ "${{ needs.metrics-report.result }}" != "success" ] && [ "${{ needs.metrics-report.result }}" != "skipped" ]; then
            echo "metrics-report did not succeed (result: ${{ needs.metrics-report.result }})." >&2
            exit 1
          fi

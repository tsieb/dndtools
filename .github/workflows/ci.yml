name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-matrix:
    name: quality-matrix (${{ matrix.os }}, node-${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [22]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests (coverage thresholds enforced)
        run: pnpm test -- --coverage --coverage.thresholds.statements=80 --coverage.thresholds.branches=75 --coverage.thresholds.functions=80 --coverage.thresholds.lines=80

  check-script-contract:
    name: check-script-contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate check script contract
        run: pnpm check

  docs-validation:
    name: docs-validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate docs invariants
        run: pnpm docs:validate

  desktop-e2e-critical:
    name: desktop-e2e-critical
    runs-on: ubuntu-latest
    env:
      PERF_BENCHMARK: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Build desktop bundles
        run: pnpm desktop:build

      - name: Run desktop critical e2e suite
        run: xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" pnpm test:e2e:desktop:critical

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-desktop-critical
          path: playwright-report/
          if-no-files-found: ignore

  quality:
    name: quality
    if: ${{ always() }}
    needs:
      - quality-matrix
      - docs-validation
      - check-script-contract
      - desktop-e2e-critical
    runs-on: ubuntu-latest
    steps:
      - name: Enforce matrix success
        run: |
          if [ "${{ needs.quality-matrix.result }}" != "success" ]; then
            echo "quality-matrix did not succeed (result: ${{ needs.quality-matrix.result }})." >&2
            exit 1
          fi
          if [ "${{ needs.docs-validation.result }}" != "success" ]; then
            echo "docs-validation did not succeed (result: ${{ needs.docs-validation.result }})." >&2
            exit 1
          fi
          if [ "${{ needs.check-script-contract.result }}" != "success" ]; then
            echo "check-script-contract did not succeed (result: ${{ needs.check-script-contract.result }})." >&2
            exit 1
          fi
          if [ "${{ needs.desktop-e2e-critical.result }}" != "success" ]; then
            echo "desktop-e2e-critical did not succeed (result: ${{ needs.desktop-e2e-critical.result }})." >&2
            exit 1
          fi

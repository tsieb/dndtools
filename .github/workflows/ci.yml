name: V2 Planning Validation

on:
  push:
    branches:
      - master
      - remake
      - v2**
  pull_request:
  workflow_dispatch:

concurrency:
  group: v2-planning-${{ github.workflow }}-${{ github.event.pull_request.base.ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docs-and-workpack:
    name: docs-and-workpack
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate V2 workpack
        run: pnpm v2:workpack:validate

      - name: Enforce tiered quality gates (PLAT-010)
        run: pnpm v2:gates

      - name: Validate docs
        run: pnpm docs:validate

      - name: Run v2 unit tests (MCP-005 AC1 merge gate)
        run: pnpm v2:test

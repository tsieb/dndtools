name: Desktop Release

# Builds the gm-react desktop app (macOS .dmg + Linux .AppImage, unsigned) and attaches the installers
# to a DRAFT GitHub Release. macOS binaries can't be built on Linux, so this fans out across a
# macos-latest + ubuntu-latest matrix — each runner builds its own OS and publishes into the same draft.
#
# Trigger: push a tag `vX.Y.Z` (matching apps/gm-react/package.json "version", e.g. 0.2.0 -> v0.2.0).
# After the run, open the draft release on GitHub, sanity-check the artifacts, and publish it.
# Unsigned — testers follow apps/gm-react/INSTALL-ALPHA.md to get past Gatekeeper / mark the AppImage
# executable.

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write # create/update the GitHub Release and upload assets

jobs:
  release:
    name: package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        # electron-builder downloads its own Electron distributable, so the electron package's
        # postinstall binary isn't needed here — skip the ~200 MB download to keep installs fast.
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: pnpm install --frozen-lockfile

      - name: Build web bundle
        run: pnpm --filter @dndtools/gm-react build

      - name: Package + publish (electron-builder)
        # Builds for the host OS only (dmg on macOS, AppImage on Linux) and publishes to the draft
        # release for this tag. Unsigned: disable macOS signing autodiscovery.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: pnpm --filter @dndtools/gm-react exec electron-builder --publish always

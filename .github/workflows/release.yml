name: Desktop + Android Release

# Builds all documented desktop installers plus signed Android alpha packages from one verified
# semver tag. Packages are checked as a complete set before a draft release is created.

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing semver tag to package (for example v0.3.0)'
        required: true
        type: string
      channel:
        description: 'Preview is unsigned; production requires signing and notarization credentials'
        required: true
        default: preview
        type: choice
        options:
          - preview
          - production

concurrency:
  group: desktop-release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  # Tag pushes are deliberately previews. A production build is an explicit manual action so the
  # workflow can fail closed when signing/notarization credentials are not configured.
  RELEASE_CHANNEL: ${{ github.event_name == 'workflow_dispatch' && inputs.channel || 'preview' }}

jobs:
  verify:
    name: release gates
    runs-on: ubuntu-latest
    timeout-minutes: 75
    outputs:
      release_sha: ${{ steps.release_ref.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false
      - name: Pin a release tag reachable from main
        id: release_ref
        shell: bash
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          TAG_REF="refs/tags/$RELEASE_TAG"
          git show-ref --verify --quiet "$TAG_REF"
          TAG_SHA=$(git rev-parse "$TAG_REF^{commit}")
          test "$(git rev-parse HEAD)" = "$TAG_SHA"
          git merge-base --is-ancestor "$TAG_SHA" refs/remotes/origin/main
          echo "sha=$TAG_SHA" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 10.34.5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify tag and package versions
        run: pnpm release:verify version --tag "$RELEASE_TAG"
      - name: Scan tracked files for credentials
        run: pnpm security:secrets
      - name: Reject high-severity dependency advisories
        run: pnpm security:audit
      - name: Run static, type, and unit release gates
        run: pnpm check
      - name: Enforce core and security coverage floors
        run: pnpm test:coverage:core
      - name: Run full lint policy
        run: pnpm lint
      - name: Build production bundles
        run: pnpm build
      - name: Install Chromium
        run: pnpm --filter @dndtools/gm-react exec playwright install --with-deps chromium
      - name: Run browser release suite
        env:
          PLAYWRIGHT_HTML_OPEN: never
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report
        run: pnpm --filter @dndtools/gm-react exec playwright test --reporter=line,html
      - name: Apply accessibility release policy
        run: pnpm a11y:report
      - name: Run Electron boot and persistence smoke
        run: xvfb-run --auto-servernum pnpm --filter @dndtools/gm-react desktop:smoke
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: spdx-json
          output-file: dndtools.spdx.json
          upload-artifact: false
      - name: Upload release-gate diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-gate-diagnostics
          path: |
            apps/gm-react/playwright-report
            apps/gm-react/test-results
            tmp/a11y
          if-no-files-found: warn
          retention-days: 30
      - name: Stage SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-sbom
          path: dndtools.spdx.json
          if-no-files-found: error

  production-cloud-config:
    name: read trusted production cloud config
    if: github.event_name == 'workflow_dispatch' && inputs.channel == 'production'
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write # read authoritative build coordinates through the production AWS role
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.verify.outputs.release_sha }}
          persist-credentials: false
      - name: Require production OIDC role configuration
        env:
          ROLE_ARN: ${{ vars.AWS_PROD_DEPLOY_ROLE_ARN }}
        run: test -n "$ROLE_ARN"
      - uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6
        with:
          role-to-assume: ${{ vars.AWS_PROD_DEPLOY_ROLE_ARN }}
          aws-region: ca-central-1
      - name: Materialize the profile used by the env puller
        shell: bash
        run: |
          aws configure set aws_access_key_id "$AWS_ACCESS_KEY_ID" --profile dndtools
          aws configure set aws_secret_access_key "$AWS_SECRET_ACCESS_KEY" --profile dndtools
          aws configure set aws_session_token "$AWS_SESSION_TOKEN" --profile dndtools
          aws configure set region ca-central-1 --profile dndtools
      - name: Pull and validate authoritative SSM coordinates
        run: |
          node apps/gm-react/scripts/pull-cloud-env.mjs prod
          node --env-file=apps/gm-react/.env.local apps/gm-react/scripts/validate-cloud-env.mjs --required
      - name: Stage trusted build coordinates
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: production-cloud-config
          path: apps/gm-react/.env.local
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  package:
    name: package (${{ matrix.label }})
    needs: [verify, production-cloud-config]
    if: >-
      always() && needs.verify.result == 'success' &&
      ((github.event_name == 'workflow_dispatch' && inputs.channel == 'production' &&
        needs.production-cloud-config.result == 'success') ||
       ((github.event_name != 'workflow_dispatch' || inputs.channel != 'production') &&
        needs.production-cloud-config.result == 'skipped'))
    runs-on: ${{ matrix.os }}
    environment: desktop-release
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macOS
            artifact: desktop-macos
            installers: apps/gm-react/release/*.dmg
          - os: ubuntu-latest
            label: Linux
            artifact: desktop-linux
            installers: apps/gm-react/release/*.AppImage
          - os: windows-latest
            label: Windows
            artifact: desktop-windows
            installers: apps/gm-react/release/*.exe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.verify.outputs.release_sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 10.34.5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install dependencies
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: pnpm install --frozen-lockfile
      - name: Require macOS signing and notarization credentials
        if: env.RELEASE_CHANNEL == 'production' && runner.os == 'macOS'
        shell: bash
        env:
          MACOS_CSC_LINK: ${{ secrets.MACOS_CSC_LINK }}
          MACOS_CSC_KEY_PASSWORD: ${{ secrets.MACOS_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          test -n "$MACOS_CSC_LINK"
          test -n "$MACOS_CSC_KEY_PASSWORD"
          test -n "$APPLE_ID"
          test -n "$APPLE_APP_SPECIFIC_PASSWORD"
          test -n "$APPLE_TEAM_ID"
      - name: Require Windows signing credentials
        if: env.RELEASE_CHANNEL == 'production' && runner.os == 'Windows'
        shell: bash
        env:
          WINDOWS_CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          WINDOWS_CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
        run: |
          test -n "$WINDOWS_CSC_LINK"
          test -n "$WINDOWS_CSC_KEY_PASSWORD"
      - name: Bundle Electron LAN discovery
        run: pnpm --filter @dndtools/gm-react desktop:bundle-discovery
      - name: Download trusted production cloud coordinates
        if: env.RELEASE_CHANNEL == 'production'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: production-cloud-config
          path: apps/gm-react
      - name: Require production cloud coordinates
        if: env.RELEASE_CHANNEL == 'production'
        run: >-
          node --env-file=apps/gm-react/.env.local
          apps/gm-react/scripts/validate-cloud-env.mjs --required
      - name: Build preview renderer
        if: env.RELEASE_CHANNEL != 'production'
        run: pnpm --filter @dndtools/gm-react build
      - name: Build production renderer from trusted coordinates
        if: env.RELEASE_CHANNEL == 'production'
        run: pnpm --filter @dndtools/gm-react build
      - name: Verify packaged network policy
        if: env.RELEASE_CHANNEL == 'production'
        run: >-
          node --env-file=apps/gm-react/.env.local
          apps/gm-react/scripts/validate-cloud-env.mjs --required
          --policy apps/gm-react/dist/electron-network-policy.json
      - name: Package unsigned preview installers
        if: env.RELEASE_CHANNEL != 'production'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: pnpm --filter @dndtools/gm-react exec electron-builder --publish never
      - name: Package signed production installers
        if: env.RELEASE_CHANNEL == 'production'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ runner.os == 'Linux' && 'false' || 'true' }}
          CSC_LINK: ${{ runner.os == 'macOS' && secrets.MACOS_CSC_LINK || runner.os == 'Windows' && secrets.WINDOWS_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ runner.os == 'macOS' && secrets.MACOS_CSC_KEY_PASSWORD || runner.os == 'Windows' && secrets.WINDOWS_CSC_KEY_PASSWORD || '' }}
          APPLE_ID: ${{ runner.os == 'macOS' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ runner.os == 'macOS' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ runner.os == 'macOS' && secrets.APPLE_TEAM_ID || '' }}
          TARGET_OS: ${{ runner.os }}
        shell: bash
        run: |
          if [ "$TARGET_OS" = macOS ]; then
            pnpm --filter @dndtools/gm-react exec electron-builder --publish never --config.mac.notarize=true
          else
            pnpm --filter @dndtools/gm-react exec electron-builder --publish never
          fi
      - name: Verify macOS signature and notarization ticket
        if: env.RELEASE_CHANNEL == 'production' && runner.os == 'macOS'
        shell: bash
        run: |
          APP_PATH=$(find apps/gm-react/release -type d -name 'DND Tools GM.app' -print -quit)
          test -n "$APP_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          for installer in apps/gm-react/release/*.dmg; do xcrun stapler validate "$installer"; done
      - name: Verify Windows Authenticode signature
        if: env.RELEASE_CHANNEL == 'production' && runner.os == 'Windows'
        shell: pwsh
        run: |
          $installers = Get-ChildItem apps/gm-react/release/*.exe
          if ($installers.Count -eq 0) { throw 'No Windows installer was produced.' }
          foreach ($installer in $installers) {
            $signature = Get-AuthenticodeSignature $installer.FullName
            if ($signature.Status -ne 'Valid') {
              throw "Invalid Authenticode signature on $($installer.Name): $($signature.Status)"
            }
            if ($null -eq $signature.TimeStamperCertificate) {
              throw "Authenticode signature on $($installer.Name) has no trusted timestamp."
            }
          }
      - name: Stage installers
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.installers }}
          if-no-files-found: error
          retention-days: 30

  draft-release:
    name: verify and draft release
    needs: [verify, package]
    if: ${{ !cancelled() && needs.verify.result == 'success' && needs.package.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: write # create or refresh the draft GitHub release
      id-token: write # obtain the Sigstore identity used to sign build provenance
      attestations: write # publish signed provenance for the release artifacts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.verify.outputs.release_sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 10.34.5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          cache-disabled: true
      - name: Install Android API 36 toolchain
        shell: bash
        run: |
          # sdkmanager closes stdin after the final prompt, so GNU yes may exit 141 under pipefail.
          set +o pipefail
          yes | sdkmanager --licenses >/dev/null
          SDKMANAGER_STATUS=${PIPESTATUS[1]}
          set -o pipefail
          test "$SDKMANAGER_STATUS" -eq 0
          sdkmanager \
            'platform-tools' \
            'platforms;android-36' \
            'build-tools;36.0.0' \
            'emulator' \
            'system-images;android-36;google_apis;x86_64'
      - run: pnpm install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - name: Build renderer and synchronize Capacitor
        run: |
          pnpm --filter @dndtools/gm-react build
          pnpm --filter @dndtools/gm-react exec cap sync android
      - name: Materialize permanent Android alpha signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_ALPHA_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_ALPHA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_ALPHA_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_ALPHA_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          KEYSTORE_PATH="$RUNNER_TEMP/dndtools-alpha.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          chmod 0600 "$KEYSTORE_PATH"
          {
            echo "ANDROID_ALPHA_KEYSTORE_PATH=$KEYSTORE_PATH"
            echo "ANDROID_ALPHA_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "ANDROID_ALPHA_KEY_ALIAS=$KEY_ALIAS"
            echo "ANDROID_ALPHA_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"
      - name: Run Android unit and lint gates and build signed packages
        working-directory: apps/gm-react/android
        run: ./gradlew --no-daemon --stacktrace testReleaseUnitTest lintRelease assembleRelease bundleRelease
      - name: Verify Android APK and AAB signatures
        working-directory: apps/gm-react/android
        shell: bash
        run: |
          EXPECTED_SHA256='A9:34:D3:0B:1D:F9:F3:43:68:06:78:0B:B8:37:B3:E4:FE:CC:A6:95:CB:7B:37:F7:AF:03:72:AD:30:4C:AD:70'
          VERSION=${RELEASE_TAG#v}
          IFS=. read -r MAJOR MINOR PATCH <<<"$VERSION"
          EXPECTED_CODE=$((10#$MAJOR * 1000000 + 10#$MINOR * 1000 + 10#$PATCH))
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging \
            app/build/outputs/apk/release/app-release.apk \
            > "$RUNNER_TEMP/apk-badging.txt"
          grep -F "package: name='com.dndtools.gm' versionCode='$EXPECTED_CODE' versionName='$VERSION'" \
            "$RUNNER_TEMP/apk-badging.txt"
          grep -F "minSdkVersion:'24'" "$RUNNER_TEMP/apk-badging.txt"
          grep -F "targetSdkVersion:'36'" "$RUNNER_TEMP/apk-badging.txt"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify \
            --verbose --print-certs app/build/outputs/apk/release/app-release.apk \
            | tee "$RUNNER_TEMP/apk-signature-verification.txt"
          EXPECTED_COMPACT=$(tr -d ':' <<<"$EXPECTED_SHA256" | tr '[:upper:]' '[:lower:]')
          APK_SIGNER=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' \
            "$RUNNER_TEMP/apk-signature-verification.txt" | head -1 | tr -d ':' | tr '[:upper:]' '[:lower:]')
          test "$APK_SIGNER" = "$EXPECTED_COMPACT"
          jarsigner -verify app/build/outputs/bundle/release/app-release.aab \
            | tee "$RUNNER_TEMP/aab-signature-verification.txt"
          grep -q 'jar verified.' "$RUNNER_TEMP/aab-signature-verification.txt"
          AAB_SIGNER=$(keytool -printcert -jarfile app/build/outputs/bundle/release/app-release.aab \
            | sed -n 's/^[[:space:]]*SHA256: //p' | head -1)
          test "$AAB_SIGNER" = "$EXPECTED_SHA256"
      - name: Enable KVM for the API 36 emulator
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run instrumentation and signed release acceptance on API 36
        env:
          ANDROID_EXPECT_PRIVATE_DATA: '1'
          ANDROID_EXPECTED_SIGNER_SHA256: 'A9:34:D3:0B:1D:F9:F3:43:68:06:78:0B:B8:37:B3:E4:FE:CC:A6:95:CB:7B:37:F7:AF:03:72:AD:30:4C:AD:70'
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            (cd apps/gm-react/android && ./gradlew --no-daemon --stacktrace :app:connectedDebugAndroidTest)
            scripts/android-emulator-acceptance.sh apps/gm-react/android/app/build/outputs/apk/release/app-release.apk
      - name: Normalize Android release package names
        shell: bash
        run: |
          VERSION=${RELEASE_TAG#v}
          mkdir -p release-artifacts
          install -m 0644 \
            apps/gm-react/android/app/build/outputs/apk/release/app-release.apk \
            "release-artifacts/DND-Tools-GM-${VERSION}-android.apk"
          install -m 0644 \
            apps/gm-react/android/app/build/outputs/bundle/release/app-release.aab \
            "release-artifacts/DND-Tools-GM-${VERSION}-android.aab"
      - name: Stage signed Android packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: android-release
          path: release-artifacts/*-android.*
          if-no-files-found: error
          retention-days: 30
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: desktop-*
          path: release-artifacts
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-sbom
          path: release-artifacts
      - name: Verify six-package release completeness
        run: pnpm release:verify artifacts --tag "$RELEASE_TAG" --dir release-artifacts
      - name: Generate SPDX inventory for every release package
        run: >-
          pnpm release:verify sbom --tag "$RELEASE_TAG" --dir release-artifacts
          --out release-artifacts/dndtools-artifacts.spdx.json
      - name: Write SHA-256 checksums
        working-directory: release-artifacts
        shell: bash
        run: |
          mapfile -d '' FILES < <(find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -print0 | sort -z)
          sha256sum -- "${FILES[@]}" > SHA256SUMS.txt
      - name: Verify checksum and SPDX coverage for all six packages
        run: >-
          pnpm release:verify supply-chain --tag "$RELEASE_TAG" --dir release-artifacts
          --checksums release-artifacts/SHA256SUMS.txt
          --sbom release-artifacts/dndtools-artifacts.spdx.json
      - name: Protect published and signed releases from preview replacement
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            exit 0
          fi
          IS_DRAFT=$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft')
          test "$IS_DRAFT" = true || {
            echo "refusing to mutate an already-published release: $RELEASE_TAG" >&2
            exit 1
          }
          if [ "$RELEASE_CHANNEL" = preview ]; then
            VERSION=${RELEASE_TAG#v}
            EXISTING_TITLE=$(gh release view "$RELEASE_TAG" --json name --jq '.name')
            test "$EXISTING_TITLE" = "DND Tools GM ${VERSION} — Alpha (Windows · macOS · Linux · Android)" || {
              echo "refusing to replace a signed production draft with unsigned preview artifacts" >&2
              exit 1
            }
          fi
      - name: Sign build provenance for installers, checksums, and SBOM
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: 'release-artifacts/*'
      - name: Create or refresh draft GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          if [ "$RELEASE_CHANNEL" = production ]; then
            TITLE="DND Tools GM $RELEASE_TAG"
            cat > "$RUNNER_TEMP/release-notes.md" <<'NOTES'
          Signed and notarized production desktop builds with alpha-key-signed Android packages. Review the staged packages, checksums, SBOMs, and release-gate artifacts before publishing.
          NOTES
            PRERELEASE_FLAG=()
          else
            VERSION=${RELEASE_TAG#v}
            TITLE="DND Tools GM ${VERSION} — Alpha (Windows · macOS · Linux · Android)"
            cat > "$RUNNER_TEMP/release-notes.md" <<'NOTES'
          ## Install

          - Android: install the APK for direct testing. The AAB is an alpha-key-signed package for future Play Console use, not a directly installable file.
          - Windows, macOS, and Linux: these desktop installers are unsigned alpha builds. Your operating system may require an explicit override before launch.

          ## Back up and upgrade

          Export a vault backup before installing or upgrading. Android upgrades must use an APK signed by the same permanent DND Tools alpha key; uninstalling removes app-private vault data and secure credentials. Native Android share/save exports are limited to 32 MiB for this alpha; larger vaults can be exported from desktop.

          ## Alpha limitations

          The alpha is local-first when trusted production cloud coordinates are unavailable. Advanced precision map drawing, automatic LAN discovery, and local Ollama providers remain desktop-only. Android uses Quick Map mode and hosted HTTPS AI providers.

          ## Verify downloads

          Run `sha256sum -c SHA256SUMS.txt` from the download directory. Verify GitHub build provenance with `gh attestation verify <artifact> --repo tsieb/dndtools`. `dndtools.spdx.json` records source dependencies and `dndtools-artifacts.spdx.json` records SHA-256 coverage for every installer/package.

          Android APK/AAB: signed with the permanent `dndtools-alpha` key. Desktop installers: unsigned alpha builds.
          NOTES
            PRERELEASE_FLAG=(--prerelease)
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-artifacts/* --clobber
            gh release edit "$RELEASE_TAG" --draft "${PRERELEASE_FLAG[@]}" \
              --title "$TITLE" --notes-file "$RUNNER_TEMP/release-notes.md"
          else
            gh release create "$RELEASE_TAG" release-artifacts/* \
              --draft "${PRERELEASE_FLAG[@]}" --verify-tag --title "$TITLE" \
              --notes-file "$RUNNER_TEMP/release-notes.md"
          fi

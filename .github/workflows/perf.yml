# RC-ENG-1.3: measure a pinned reference and the candidate interleaved, batch by batch, on the same
# runner, five times over, and verify the five runs agree. Raw batches, the CI baselines, reports and
# agreement evidence are retained.
name: Performance

on:
  push:
    branches:
      - main
    paths:
      - 'apps/gm-react/**'
      - 'packages/core/**'
      - 'scripts/perf/**'
      - 'tests/perf/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/perf.yml'
      - '.github/actions/setup-e2e/**'
  pull_request:
    paths:
      - 'apps/gm-react/**'
      - 'packages/core/**'
      - 'scripts/perf/**'
      - 'tests/perf/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/perf.yml'
      - '.github/actions/setup-e2e/**'
  # A manual run can capture any ref, so an unmerged candidate gets hosted evidence before it lands.
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag or full commit SHA to capture as the candidate (blank: the branch run from)'
        required: false
        type: string
        default: ''

concurrency:
  group: perf-${{ inputs.ref || github.event.pull_request.base.ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  measure:
    name: capture and compare budgets
    runs-on: ubuntu-24.04
    # Five paired runs measure both revisions every time; GitHub-hosted jobs cap at 360.
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Blank on push, pull_request and schedule, which keeps checkout's own default. The capture
          # records the checked-out SHA, so every run file names the exact revision it measured.
          ref: ${{ inputs.ref }}
          persist-credentials: false
          # Full history: ci.sh checks out the pinned reference SHA into a second worktree.
          fetch-depth: 0

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.34.5

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: pnpm install --frozen-lockfile

      - name: Test performance measurement and comparison
        run: pnpm exec vitest run --config tests/perf/vitest.config.ts

      # The capture drives the real app in Chromium and resolves Playwright from apps/gm-react.
      - name: Set up browser tests
        uses: ./.github/actions/setup-e2e

      - name: Measure reference and candidate interleaved, five runs
        run: bash scripts/perf/ci.sh

      - name: Upload the run and the report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: perf-run
          path: |
            tmp/perf/
          if-no-files-found: warn
          retention-days: 30

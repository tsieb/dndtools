name: Release Please

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: release-please-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    env:
      RELEASE_PLEASE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
    steps:
      - name: Skip when release token is not configured
        if: ${{ env.RELEASE_PLEASE_TOKEN == '' }}
        run: |
          echo "RELEASE_PLEASE_TOKEN is not configured."
          echo "Skipping Release Please to avoid GITHUB_TOKEN pull-request permission failures."

      - name: Run release-please
        if: ${{ env.RELEASE_PLEASE_TOKEN != '' }}
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ env.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

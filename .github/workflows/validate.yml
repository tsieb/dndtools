# Whole-application validation harness (`pnpm validate`).
#
# Complementary to ci.yml (which gates every push/PR with `pnpm gates` + `pnpm test`):
# this workflow runs the FULL offline validation matrix — static + unit + build +
# browser (Playwright e2e, axe, React verify + P2P) + feature-gap audit — and uploads
# the consolidated report. It is manual + weekly, not per-PR, so it never slows the
# fast CI gate. Live cloud (`--live`) is intentionally NOT run here (needs AWS creds).
name: Validate (full app)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Validation scope'
        type: choice
        default: default
        options: [fast, default, full]
  schedule:
    - cron: '0 7 * * 1' # Mondays 07:00 UTC

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: full application validation
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 10.34.5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Browser-driven checks (e2e / axe / React verify) resolve Playwright from apps/gm-react.
      - run: pnpm --filter @dndtools/gm-react exec playwright install --with-deps chromium
      - name: Run validation
        env:
          VALIDATION_MODE: ${{ github.event.inputs.mode }}
        run: |
          case "$VALIDATION_MODE" in
            fast) pnpm validate:fast ;;
            full) pnpm validate --full ;;      # desktop/cloud self-skip without a display/AWS
            *)    pnpm validate ;;
          esac
      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: validation-report
          path: test-results/validation
          retention-days: 14

  android:
    name: Android API 36 validation
    needs: validate
    if: github.event_name == 'schedule' || github.event.inputs.mode != 'fast'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 10.34.5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
      - name: Install Android API 36 toolchain
        shell: bash
        run: |
          set +o pipefail
          yes | sdkmanager --licenses >/dev/null
          SDKMANAGER_STATUS=${PIPESTATUS[1]}
          set -o pipefail
          test "$SDKMANAGER_STATUS" -eq 0
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'
      - name: Install dependencies
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: pnpm install --frozen-lockfile
      - name: Build and synchronize Android renderer
        run: |
          pnpm --filter @dndtools/gm-react build
          pnpm --filter @dndtools/gm-react exec cap sync android
      - name: Run Android unit, lint, and debug packaging validation
        working-directory: apps/gm-react/android
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest lintDebug assembleDebug
      - name: Upload Android validation report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: android-validation
          path: |
            apps/gm-react/android/app/build/reports
            apps/gm-react/android/app/build/outputs/apk/debug
          if-no-files-found: warn
          retention-days: 14

# Whole-application validation harness (`pnpm validate`).
#
# Complementary to ci.yml (which gates every push/PR with `pnpm gates` + `pnpm test`):
# this workflow runs the FULL offline validation matrix — static + unit + build +
# browser (Playwright e2e, axe, React verify + P2P) + feature-gap audit — and uploads
# the consolidated report. It is manual + weekly, not per-PR, so it never slows the
# fast CI gate. Live cloud (`--live`) is intentionally NOT run here (needs AWS creds).
name: Validate (full app)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Validation scope'
        type: choice
        default: default
        options: [fast, default, full]
  schedule:
    - cron: '0 7 * * 1' # Mondays 07:00 UTC

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: full application validation
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 10.34.5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Browser-driven checks (e2e / axe / React verify) resolve Playwright from apps/gm-react.
      - run: pnpm --filter @dndtools/gm-react exec playwright install --with-deps chromium
      - name: Run validation
        env:
          VALIDATION_MODE: ${{ github.event.inputs.mode }}
        run: |
          case "$VALIDATION_MODE" in
            fast) pnpm validate:fast ;;
            full) pnpm validate --full ;;      # desktop/cloud self-skip without a display/AWS
            *)    pnpm validate ;;
          esac
      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: validation-report
          path: test-results/validation
          retention-days: 14

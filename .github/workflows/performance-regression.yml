name: Performance Regression

on:
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:

concurrency:
  group: performance-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop-performance:
    runs-on: ubuntu-latest
    env:
      PERF_BENCHMARK: '1'
      PERF_RESULTS_PATH: tmp/metrics/latest/performance-baseline.json
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Build desktop bundles
        run: pnpm desktop:build

      - name: Run desktop performance benchmarks
        run: xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" pnpm desktop:test:perf

      - name: Compare against baseline
        run: pnpm metrics:compare -- --only performance --baselineDir tests/perf --currentDir tmp/metrics/latest --enforceRegression

      - name: Upload benchmark metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-benchmark-results
          path: ${{ env.PERF_RESULTS_PATH }}
          if-no-files-found: warn

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-desktop-performance
          path: playwright-report/
          if-no-files-found: ignore

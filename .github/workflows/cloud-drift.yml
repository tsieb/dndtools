name: CloudFormation Drift

on:
  schedule:
    - cron: '30 8 * * 1'
  workflow_dispatch:

concurrency:
  group: cloud-drift-dev
  cancel-in-progress: true

permissions:
  contents: read

env:
  AWS_REGION: ca-central-1
  DNDTOOLS_PROFILE: dndtools

jobs:
  dev-drift:
    name: dev stack drift
    if: vars.AWS_DEPLOY_ROLE_ARN != ''
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      id-token: write # exchange GitHub's OIDC token for the scoped dev deploy role
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6.2.2
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Materialize dndtools profile
        run: |
          aws configure set aws_access_key_id "$AWS_ACCESS_KEY_ID" --profile dndtools
          aws configure set aws_secret_access_key "$AWS_SECRET_ACCESS_KEY" --profile dndtools
          aws configure set aws_session_token "$AWS_SESSION_TOKEN" --profile dndtools
          aws configure set region "$AWS_REGION" --profile dndtools
      - name: Detect stack drift
        run: bash scripts/check-cloudformation-drift.sh dev

name: Supply Chain

on:
  pull_request:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

concurrency:
  group: supply-chain-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  workflow-security:
    name: workflow and shell policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install checksum-pinned analyzers
        env:
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
          SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
          ZIZMOR_SHA256: 277f2bd8fd37cf60c42ab7afca6faa884e65440fa31e02b44bdaae60f62a358f
        run: |
          TOOLS="$RUNNER_TEMP/workflow-tools"
          mkdir -p "$TOOLS"
          curl --fail --silent --show-error --location \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$RUNNER_TEMP/actionlint.tar.gz"
          curl --fail --silent --show-error --location \
            https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz \
            --output "$RUNNER_TEMP/shellcheck.tar.xz"
          curl --fail --silent --show-error --location \
            https://github.com/zizmorcore/zizmor/releases/download/v1.27.0/zizmor-x86_64-unknown-linux-gnu.tar.gz \
            --output "$RUNNER_TEMP/zizmor.tar.gz"
          printf '%s  %s\n' "$ACTIONLINT_SHA256" "$RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check -
          printf '%s  %s\n' "$SHELLCHECK_SHA256" "$RUNNER_TEMP/shellcheck.tar.xz" | sha256sum --check -
          printf '%s  %s\n' "$ZIZMOR_SHA256" "$RUNNER_TEMP/zizmor.tar.gz" | sha256sum --check -
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$TOOLS" actionlint
          tar -xJf "$RUNNER_TEMP/shellcheck.tar.xz" -C "$TOOLS" --strip-components=1 \
            shellcheck-v0.11.0/shellcheck
          tar -xzf "$RUNNER_TEMP/zizmor.tar.gz" -C "$TOOLS" zizmor
          echo "$TOOLS" >> "$GITHUB_PATH"
      - name: Validate GitHub Actions semantics and embedded shell
        run: actionlint -color
      - name: Enforce GitHub Actions security policy
        env:
          GH_TOKEN: ${{ github.token }}
        run: zizmor --pedantic .
      - name: Lint repository deployment scripts
        run: >-
          shellcheck infra/deploy.sh infra/verify-signaling.sh infra/verify-sync.sh
          infra/verify-turn.sh scripts/check-cloudformation-drift.sh

  dependency-review:
    name: dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: high
          license-check: true

  audit-and-sbom:
    name: audit, secrets, and SBOM
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.34.5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install locked dependency graph
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: pnpm install --frozen-lockfile
      - name: Scan tracked files for credentials
        run: pnpm security:secrets
      - name: Reject high-severity advisories
        run: pnpm security:audit
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: spdx-json
          output-file: dndtools.spdx.json
          upload-artifact: false
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scheduled-sbom-${{ github.run_id }}
          path: dndtools.spdx.json
          if-no-files-found: error
          retention-days: 30

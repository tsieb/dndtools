name: Release Artifacts

on:
  release:
    types: [published, edited]
  workflow_dispatch:

concurrency:
  group: release-assets-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  validate-release-notes:
    runs-on: ubuntu-latest
    steps:
      - name: Require human-reviewed release notes section
        if: github.event_name == 'release'
        env:
          RELEASE_BODY: ${{ github.event.release.body || '' }}
        run: |
          if ! printf '%s' "$RELEASE_BODY" | grep -q "## Human Reviewed Notes"; then
            echo "Release notes must include a '## Human Reviewed Notes' section before publishing." >&2
            exit 1
          fi

  build-desktop-assets:
    runs-on: ${{ matrix.os }}
    needs:
      - validate-release-notes
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'release'
    strategy:
      fail-fast: true
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build desktop bundles
        run: pnpm desktop:build

      - name: Upload raw desktop bundle
        uses: actions/upload-artifact@v4
        with:
          name: raw-desktop-${{ matrix.os }}
          path: |
            build/**
            electron/dist/**
            mcp/dist/**
          if-no-files-found: error

  publish-release-assets:
    runs-on: ubuntu-latest
    needs:
      - build-desktop-assets
    if: github.event_name == 'release'
    steps:
      - name: Download built desktop artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: raw-desktop-*
          path: artifacts

      - name: Package release artifacts
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          mkdir -p release
          for dir in artifacts/raw-desktop-*; do
            os="${dir##*raw-desktop-}"
            archive="release/dndtools-desktop-${os}-${RELEASE_TAG}.tar.gz"
            tar -czf "$archive" -C "$dir" .
          done

          if [ -d "artifacts/raw-desktop-ubuntu-latest/mcp/dist" ]; then
            tar -czf "release/dndtools-mcp-${RELEASE_TAG}.tar.gz" \
              -C "artifacts/raw-desktop-ubuntu-latest/mcp/dist" .
          else
            echo "Expected MCP build output from ubuntu artifact was not found." >&2
            exit 1
          fi

          (cd release && sha256sum * > SHA256SUMS.txt)

      - name: Require signing key
        env:
          RELEASE_SIGNING_PRIVATE_KEY: ${{ secrets.RELEASE_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$RELEASE_SIGNING_PRIVATE_KEY" ]; then
            echo "Missing RELEASE_SIGNING_PRIVATE_KEY secret. Signed artifacts are required for releases." >&2
            exit 1
          fi
          printf '%s\n' "$RELEASE_SIGNING_PRIVATE_KEY" > release-signing-key.pem
          chmod 600 release-signing-key.pem

      - name: Sign checksums
        run: |
          openssl dgst -sha256 -sign release-signing-key.pem \
            -out release/SHA256SUMS.txt.sig release/SHA256SUMS.txt
          rm -f release-signing-key.pem

      - name: Upload artifacts to GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$RELEASE_TAG" release/* --clobber

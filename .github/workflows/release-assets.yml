name: Release Artifacts

on:
  release:
    types: [published, edited]
  workflow_dispatch:

concurrency:
  group: release-assets-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  validate-release-notes:
    runs-on: ubuntu-latest
    steps:
      - name: Require human-reviewed release notes section
        if: github.event_name == 'release'
        env:
          RELEASE_BODY: ${{ github.event.release.body || '' }}
        run: |
          if ! printf '%s' "$RELEASE_BODY" | grep -q "## Human Reviewed Notes"; then
            echo "Release notes must include a '## Human Reviewed Notes' section before publishing." >&2
            exit 1
          fi

  build-desktop-installers:
    runs-on: ${{ matrix.os }}
    needs:
      - validate-release-notes
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'release'
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: windows-latest
            package_script: desktop:package:win
          - os: macos-latest
            package_script: desktop:package:mac
          - os: ubuntu-latest
            package_script: desktop:package:linux
    env:
      CSC_LINK: ${{ secrets.DNDTOOLS_CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.DNDTOOLS_CSC_KEY_PASSWORD }}
      APPLE_ID: ${{ secrets.DNDTOOLS_APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.DNDTOOLS_APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.DNDTOOLS_APPLE_TEAM_ID }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate signing prerequisites (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          if [ -z "$CSC_LINK" ] || [ -z "$CSC_KEY_PASSWORD" ]; then
            echo "Missing DNDTOOLS_CSC_LINK or DNDTOOLS_CSC_KEY_PASSWORD secret for Windows code signing." >&2
            exit 1
          fi

      - name: Validate signing + notarization prerequisites (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          if [ -z "$CSC_LINK" ] || [ -z "$CSC_KEY_PASSWORD" ] || [ -z "$APPLE_ID" ] || [ -z "$APPLE_APP_SPECIFIC_PASSWORD" ] || [ -z "$APPLE_TEAM_ID" ]; then
            echo "Missing macOS signing/notarization secrets (DNDTOOLS_CSC_LINK, DNDTOOLS_CSC_KEY_PASSWORD, DNDTOOLS_APPLE_ID, DNDTOOLS_APPLE_APP_SPECIFIC_PASSWORD, DNDTOOLS_APPLE_TEAM_ID)." >&2
            exit 1
          fi

      - name: Build signed desktop installers
        run: pnpm ${{ matrix.package_script }}

      - name: Upload desktop installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: signed-desktop-${{ matrix.os }}
          path: |
            dist-desktop/*.exe
            dist-desktop/*.dmg
            dist-desktop/*.zip
            dist-desktop/*.AppImage
            dist-desktop/*.deb
            dist-desktop/*.yml
            dist-desktop/*.yaml
            dist-desktop/*.blockmap
          if-no-files-found: error

  build-android-apk:
    runs-on: ubuntu-latest
    needs:
      - validate-release-notes
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'release'
    env:
      DNDTOOLS_ANDROID_KEYSTORE_BASE64: ${{ secrets.DNDTOOLS_ANDROID_KEYSTORE_BASE64 }}
      DNDTOOLS_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.DNDTOOLS_ANDROID_KEYSTORE_PASSWORD }}
      DNDTOOLS_ANDROID_KEY_ALIAS: ${{ secrets.DNDTOOLS_ANDROID_KEY_ALIAS }}
      DNDTOOLS_ANDROID_KEY_PASSWORD: ${{ secrets.DNDTOOLS_ANDROID_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Android signing prerequisites
        run: |
          if [ -z "$DNDTOOLS_ANDROID_KEYSTORE_BASE64" ] || [ -z "$DNDTOOLS_ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$DNDTOOLS_ANDROID_KEY_ALIAS" ] || [ -z "$DNDTOOLS_ANDROID_KEY_PASSWORD" ]; then
            echo "Missing Android signing secrets (DNDTOOLS_ANDROID_KEYSTORE_BASE64, DNDTOOLS_ANDROID_KEYSTORE_PASSWORD, DNDTOOLS_ANDROID_KEY_ALIAS, DNDTOOLS_ANDROID_KEY_PASSWORD)." >&2
            exit 1
          fi

      - name: Build web assets and sync Android project
        run: pnpm android:sync

      - name: Materialize release keystore
        run: |
          mkdir -p android/app
          echo "$DNDTOOLS_ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/dndtools-release.jks
          cat > android/keystore.properties <<EOF
          storeFile=app/dndtools-release.jks
          storePassword=$DNDTOOLS_ANDROID_KEYSTORE_PASSWORD
          keyAlias=$DNDTOOLS_ANDROID_KEY_ALIAS
          keyPassword=$DNDTOOLS_ANDROID_KEY_PASSWORD
          EOF
          chmod 600 android/keystore.properties android/app/dndtools-release.jks

      - name: Build signed Android release APK
        run: |
          cd android
          ./gradlew assembleRelease

      - name: Upload signed Android APK
        uses: actions/upload-artifact@v4
        with:
          name: signed-android-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  publish-release-assets:
    runs-on: ubuntu-latest
    needs:
      - build-desktop-installers
      - build-android-apk
    if: github.event_name == 'release'
    steps:
      - name: Download signed installer artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: signed-*
          path: artifacts

      - name: Package checksums
        run: |
          mkdir -p release
          find artifacts -type f -print0 | while IFS= read -r -d '' file; do
            cp "$file" "release/$(basename "$file")"
          done
          (cd release && sha256sum * > SHA256SUMS.txt)

      - name: Require release signing key
        env:
          RELEASE_SIGNING_PRIVATE_KEY: ${{ secrets.RELEASE_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$RELEASE_SIGNING_PRIVATE_KEY" ]; then
            echo "Missing RELEASE_SIGNING_PRIVATE_KEY secret. Signed checksums are required for releases." >&2
            exit 1
          fi
          printf '%s\n' "$RELEASE_SIGNING_PRIVATE_KEY" > release-signing-key.pem
          chmod 600 release-signing-key.pem

      - name: Sign checksums
        run: |
          openssl dgst -sha256 -sign release-signing-key.pem \
            -out release/SHA256SUMS.txt.sig release/SHA256SUMS.txt
          rm -f release-signing-key.pem

      - name: Upload artifacts to GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$RELEASE_TAG" release/* --clobber

name: Deploy Cloud

# Deploys the dndtools cloud stacks (infra/*) and the hosted SPA to the `dev` stage on
# every push to main, PATH-FILTERED so only what changed redeploys. Keyless: GitHub's
# OIDC token is exchanged for the scoped `foundation` deploy role (no long-lived AWS
# keys). The desktop release pipeline (release.yml) and CI gates (ci.yml) are untouched.
#
# Activation (one-time, manual — see infra/README.md):
#   • Deploy infra/foundation once locally so the OIDC provider + CI deploy role exist.
#   • Set the repo variable AWS_DEPLOY_ROLE_ARN to that role's ARN
#     (foundation stack output `CiDeployRoleArn`):
#       gh variable set AWS_DEPLOY_ROLE_ARN --body 'arn:aws:iam::<acct>:role/<role>'
# The foundation role trusts refs/heads/main only, so this workflow deploys from main.
#
# UNTIL that variable is set, the `preflight` job below emits a notice and the deploy
# jobs SKIP (neutral) instead of failing — so an unconfigured cloud deploy never turns
# the repo's push status red. It activates automatically the moment the variable exists.

on:
  push:
    branches: [main]
    paths:
      - 'infra/**'
      - 'packages/cloud-fns/**'
      - 'packages/core/**'
      - 'apps/gm-react/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

concurrency:
  # Never cancel an in-flight deploy — a half-applied CloudFormation change is worse
  # than a queued one.
  group: deploy-cloud-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  AWS_REGION: ca-central-1
  STAGE: dev

jobs:
  # --- Decide which stacks/app changed so we only redeploy those. --------------------
  changes:
    name: detect changes
    runs-on: ubuntu-latest
    outputs:
      foundation: ${{ steps.filter.outputs.foundation }}
      identity: ${{ steps.filter.outputs.identity }}
      signaling: ${{ steps.filter.outputs.signaling }}
      turn: ${{ steps.filter.outputs.turn }}
      sync_api: ${{ steps.filter.outputs.sync_api }}
      app_api: ${{ steps.filter.outputs.app_api }}
      web_hosting: ${{ steps.filter.outputs.web_hosting }}
      app: ${{ steps.filter.outputs.app }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        id: filter
        with:
          filters: |
            foundation:
              - 'infra/foundation/**'
            identity:
              - 'infra/identity/**'
            signaling:
              - 'infra/signaling/**'
              # A pool/client replacement changes the issuer/audience embedded in the authorizer.
              - 'infra/identity/**'
              # Signaling enforces hosted-play entitlements from app-api's table.
              # A table replacement must refresh the SSM-resolved table name.
              - 'infra/app-api/**'
              # Signaling resolves TURN coordinates from SSM at deploy time. A TURN
              # replacement must refresh those resolved values in signaling.
              - 'infra/turn/**'
              - 'packages/cloud-fns/**'
              - 'packages/core/**'
            turn:
              - 'infra/turn/**'
            sync_api:
              - 'infra/sync-api/**'
              # A pool/client replacement changes the issuer/audience embedded in the authorizer.
              - 'infra/identity/**'
              # Sync enforces backup entitlements from app-api's table.
              - 'infra/app-api/**'
              - 'packages/cloud-fns/**'
              - 'packages/core/**'
            app_api:
              - 'infra/app-api/**'
              # A pool/client replacement changes the issuer/audience embedded in the authorizer.
              - 'infra/identity/**'
              - 'packages/cloud-fns/**'
              - 'packages/core/**'
            web_hosting:
              - 'infra/web-hosting/**'
              # The CSP resolves the exact deployed API origins from SSM. Refresh it
              # whenever a stack replacement can change one of those origins.
              - 'infra/signaling/**'
              - 'infra/sync-api/**'
              - 'infra/app-api/**'
            app:
              - 'apps/gm-react/**'
              - 'packages/core/**'
              # Identity replacements change the client-side pool/client coordinates.
              - 'infra/identity/**'

      - name: Report manual foundation rollout
        if: steps.filter.outputs.foundation == 'true'
        run: >-
          echo "::warning title=Manual foundation rollout required::The OIDC deploy role is not
          authorized to mutate its own role or permissions boundary. Validate this workflow run,
          then deploy infra/foundation with the bootstrap administrator profile."

  # --- Is the cloud deploy activated? (repo variable AWS_DEPLOY_ROLE_ARN set?) --------
  # Runs with no AWS access. If the variable is unset we emit a notice and every deploy
  # job downstream skips, keeping the push status green instead of failing on missing
  # credentials. Gating here (not in each job's `if`) makes the reason self-documenting.
  preflight:
    name: check deploy config
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - id: check
        env:
          ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
        run: |
          if [ -n "$ROLE_ARN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "Cloud deploy is active (AWS_DEPLOY_ROLE_ARN is set)."
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Cloud deploy skipped::Repo variable AWS_DEPLOY_ROLE_ARN is not set, so infra + web deploy jobs were skipped (not failed). Set it to the foundation stack's CiDeployRoleArn to activate — see infra/README.md."
          fi

  # --- Deploy changed CloudFormation stacks, in dependency order. --------------------
  infra:
    name: deploy infra
    needs: [changes, preflight]
    if: >-
      needs.preflight.outputs.configured == 'true' &&
      (needs.changes.outputs.identity == 'true' ||
       needs.changes.outputs.signaling == 'true' ||
       needs.changes.outputs.turn == 'true' ||
       needs.changes.outputs.sync_api == 'true' ||
       needs.changes.outputs.app_api == 'true' ||
       needs.changes.outputs.web_hosting == 'true')
    runs-on: ubuntu-latest
    permissions:
      id-token: write # request the GitHub OIDC token to assume the AWS deploy role
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.34.5

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Setup AWS SAM CLI
        uses: aws-actions/setup-sam@89ddb14d60e682855e3fea4be85b3c56485de310 # v3
        with:
          use-installer: true

      - name: Assume deploy role (OIDC)
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Materialize `dndtools` profile from assumed creds
        # samconfig.toml and deploy.sh reference `--profile dndtools`; SAM reads it from
        # config even when CLI creds live in the environment. Mirror the assumed-role
        # env creds into a named profile so the local-dev deploy path works verbatim in CI.
        run: |
          aws configure set aws_access_key_id "$AWS_ACCESS_KEY_ID" --profile dndtools
          aws configure set aws_secret_access_key "$AWS_SECRET_ACCESS_KEY" --profile dndtools
          aws configure set aws_session_token "$AWS_SESSION_TOKEN" --profile dndtools
          aws configure set region "$AWS_REGION" --profile dndtools

      - name: Install dependencies
        # Needed so deploy.sh can build the @dndtools/cloud-fns Lambda bundles.
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: pnpm install --frozen-lockfile

      - name: Validate declarative stage configuration
        run: pnpm cloud:stage-config:validate

      # Deploy in dependency order; foundation remains a separate bootstrap-admin operation.
      - name: Deploy identity
        if: needs.changes.outputs.identity == 'true'
        run: infra/deploy.sh identity "$STAGE"

      - name: Deploy turn
        if: needs.changes.outputs.turn == 'true'
        run: infra/deploy.sh turn "$STAGE"

      - name: Deploy app-api
        if: needs.changes.outputs.app_api == 'true'
        run: infra/deploy.sh app-api "$STAGE"

      - name: Deploy signaling
        if: needs.changes.outputs.signaling == 'true'
        run: infra/deploy.sh signaling "$STAGE"

      - name: Deploy sync-api
        if: needs.changes.outputs.sync_api == 'true'
        run: infra/deploy.sh sync-api "$STAGE"

      - name: Refresh app-api sync purge verifier
        # New stages must create app-api first because sync consumes its entitlement table. Once sync
        # publishes its generated operations-table name, this bounded second pass grants app-api only
        # GetItem on that table. Existing stages follow the same idempotent path on sync changes.
        if: needs.changes.outputs.sync_api == 'true'
        run: infra/deploy.sh app-api "$STAGE"

      - name: Deploy web-hosting
        if: needs.changes.outputs.web_hosting == 'true'
        run: infra/deploy.sh web-hosting "$STAGE"

      - name: Refresh identity callbacks with the deployed web origin
        if: needs.changes.outputs.web_hosting == 'true'
        run: |
          WEB_ORIGIN=$(aws ssm get-parameter --name "/dndtools/$STAGE/web/url" --query 'Parameter.Value' --output text)
          DNDTOOLS_WEB_ORIGIN="$WEB_ORIGIN" infra/deploy.sh identity "$STAGE"

      - name: Refresh API CORS with the deployed web origin
        if: needs.changes.outputs.web_hosting == 'true'
        run: |
          WEB_ORIGIN=$(aws ssm get-parameter --name "/dndtools/$STAGE/web/url" --query 'Parameter.Value' --output text)
          DNDTOOLS_WEB_ORIGIN="$WEB_ORIGIN" infra/deploy.sh sync-api "$STAGE"
          DNDTOOLS_WEB_ORIGIN="$WEB_ORIGIN" infra/deploy.sh app-api "$STAGE"

  # --- Build the SPA against deployed cloud coordinates, upload, invalidate. ---------
  web:
    name: publish web app
    needs: [changes, preflight, infra]
    # Run when the app or the hosting stack changed, as long as deploy is activated and
    # infra didn't fail. (`always()` is needed so this still runs when the infra job was
    # skipped — a pure app change deploys no stacks but still republishes the SPA.)
    if: >-
      always() &&
      needs.preflight.outputs.configured == 'true' &&
      (needs.changes.outputs.app == 'true' || needs.changes.outputs.web_hosting == 'true') &&
      (needs.infra.result == 'success' || needs.infra.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      id-token: write # request the GitHub OIDC token to assume the AWS deploy role
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.34.5

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Assume deploy role (OIDC)
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Materialize `dndtools` profile from assumed creds
        run: |
          aws configure set aws_access_key_id "$AWS_ACCESS_KEY_ID" --profile dndtools
          aws configure set aws_secret_access_key "$AWS_SECRET_ACCESS_KEY" --profile dndtools
          aws configure set aws_session_token "$AWS_SESSION_TOKEN" --profile dndtools
          aws configure set region "$AWS_REGION" --profile dndtools

      - name: Install dependencies
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: pnpm install --frozen-lockfile

      - name: Validate declarative stage configuration
        run: pnpm cloud:stage-config:validate

      - name: Pull cloud coordinates into .env.local
        # Writes apps/gm-react/.env.local from the deployed SSM params so the built bundle
        # carries the Cognito pool/client, signaling WS, and sync API URLs.
        run: node apps/gm-react/scripts/pull-cloud-env.mjs "$STAGE"

      - name: Validate complete cloud coordinates
        run: >-
          node --env-file=apps/gm-react/.env.local
          apps/gm-react/scripts/validate-cloud-env.mjs --required

      - name: Build web bundle
        run: pnpm --filter @dndtools/gm-react build

      - name: Resolve hosting target from SSM
        id: target
        run: |
          BUCKET=$(aws ssm get-parameter --name "/dndtools/$STAGE/web/bucket-name" --query 'Parameter.Value' --output text)
          DIST=$(aws ssm get-parameter --name "/dndtools/$STAGE/web/distribution-id" --query 'Parameter.Value' --output text)
          URL=$(aws ssm get-parameter --name "/dndtools/$STAGE/web/url" --query 'Parameter.Value' --output text)
          {
            echo "bucket=$BUCKET"
            echo "distribution=$DIST"
            echo "url=$URL"
          } >> "$GITHUB_OUTPUT"

      - name: Sync dist/ to S3
        # Long-cache the fingerprinted assets; short-cache index.html (the invalidation
        # below guarantees a fresh index even if an edge kept the old one).
        env:
          HOSTING_BUCKET: ${{ steps.target.outputs.bucket }}
        run: |
          aws s3 sync apps/gm-react/dist "s3://$HOSTING_BUCKET" \
            --delete \
            --cache-control 'public, max-age=31536000, immutable' \
            --exclude 'index.html'
          aws s3 cp apps/gm-react/dist/index.html "s3://$HOSTING_BUCKET/index.html" \
            --cache-control 'no-cache'

      - name: Invalidate and wait for CloudFront
        env:
          DISTRIBUTION_ID: ${{ steps.target.outputs.distribution }}
        run: |
          INVALIDATION=$(aws cloudfront create-invalidation \
            --distribution-id "$DISTRIBUTION_ID" \
            --paths '/*' --query Invalidation.Id --output text)
          aws cloudfront wait invalidation-completed \
            --distribution-id "$DISTRIBUTION_ID" \
            --id "$INVALIDATION"

      - name: Report
        env:
          PUBLISHED_URL: ${{ steps.target.outputs.url }}
        run: echo "Published to $PUBLISHED_URL"

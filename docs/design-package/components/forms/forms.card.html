<!DOCTYPE html>
<html lang="en" data-theme="tavern">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../styles.css" />
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;padding:20px;}</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const { Field, Input, Textarea, Select, Checkbox, Switch } = window.DNDToolsDesignSystem_8ae046;
function Demo() {
  const [v, setV] = React.useState('players');
  const [c, setC] = React.useState(true);
  const [s, setS] = React.useState(true);
  return (
    <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:20 }}>
      <Field label="Note title" htmlFor="t" required><Input id="t" defaultValue="The Sunken Outpost" /></Field>
      <Field label="Search" htmlFor="q" help="Find scenes, notes, maps, characters"><Input id="q" icon="search" placeholder="Search everything…" /></Field>
      <Field label="Visibility" htmlFor="vis"><Select id="vis" value={v} onChange={(e)=>setV(e.target.value)} options={[{value:'dm-only',label:'DM only'},{value:'players',label:'Players can see'},{value:'hidden',label:'Hidden'}]} /></Field>
      <Field label="Average level" htmlFor="lvl" error="Must be 1–20"><Input id="lvl" invalid type="number" defaultValue="3" /></Field>
      <Field label="Terrain notes" htmlFor="tn" style={{ gridColumn:'1 / -1' }}><Textarea id="tn" rows={2} defaultValue="Crumbling stone pier, knee-deep brackish water, dim light." /></Field>
      <div style={{ display:'flex', gap:24, alignItems:'center', gridColumn:'1 / -1' }}>
        <Checkbox checked={c} onChange={setC} label="Surprise round" />
        <Checkbox checked={false} onChange={()=>{}} label="Lair actions" />
        <Switch checked={s} onChange={setS} label="Project to players" />
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
</body>
</html>

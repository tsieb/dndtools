<!-- @dsCard group="Components" viewport="700x280" name="Feedback & Status" subtitle="State badges, condition chips, the DM-only visibility signal" -->
<!DOCTYPE html>
<html lang="en" data-theme="tavern">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../styles.css" />
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;padding:20px;}</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const { Badge, Chip, VisibilityChip, StatusDot } = window.DNDToolsDesignSystem_8ae046;
function Row({ children, label }) {
  return (
    <div style={{ display:'flex', flexDirection:'column', gap:8 }}>
      <span style={{ fontSize:11, letterSpacing:'.08em', textTransform:'uppercase', color:'var(--color-text-tertiary)', fontFamily:'var(--font-sans)' }}>{label}</span>
      <div style={{ display:'flex', gap:10, alignItems:'center', flexWrap:'wrap' }}>{children}</div>
    </div>
  );
}
function Demo() {
  return (
    <div style={{ display:'flex', flexDirection:'column', gap:18 }}>
      <Row label="Status badges (color + redundant shape)">
        <Badge status="success">Combat live</Badge>
        <Badge status="warning">Queued</Badge>
        <Badge status="error">Low HP</Badge>
        <Badge status="info">Syncing</Badge>
        <Badge status="accent" icon="pin">Pinned</Badge>
        <Badge status="neutral">Idle</Badge>
      </Row>
      <Row label="Visibility — the safety-critical DM signal">
        <VisibilityChip level="dm-only" />
        <VisibilityChip level="players" />
        <VisibilityChip level="hidden" />
        <VisibilityChip level="mixed" />
      </Row>
      <Row label="Condition chips">
        <Chip tone="danger" icon="heart">Poisoned</Chip>
        <Chip tone="info">Prone</Chip>
        <Chip tone="accent" icon="sparkle">Blessed</Chip>
        <Chip tone="neutral" onRemove={()=>{}}>Grappled</Chip>
      </Row>
      <Row label="Live state dots">
        <StatusDot status="live" pulse label="Session live" />
        <StatusDot status="syncing" label="Syncing to players" />
        <StatusDot status="idle" label="Idle" />
        <StatusDot status="error" label="Disconnected" />
      </Row>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
</body>
</html>

<!-- @dsCard group="Components" viewport="700x360" name="Game — HP, Stats, Initiative, Dice" subtitle="Live-play domain components for the combat hot path" -->
<!DOCTYPE html>
<html lang="en" data-theme="tavern">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../styles.css" />
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;padding:20px;}</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const { HPBar, StatPill, InitiativeRow, DiceResult, Card } = window.DNDToolsDesignSystem_8ae046;
function Demo() {
  const [hp, setHp] = React.useState(22);
  return (
    <div style={{ display:'flex', flexDirection:'column', gap:16 }}>
      <Card elevation="flat" style={{ display:'flex', gap:28 }}>
        <StatPill label="Round" value="2" tone="accent" />
        <StatPill label="Current turn" value="Mara" mono={false} />
        <StatPill label="Players" value="4" />
        <StatPill label="Lowest HP" value="6/30" tone="error" />
      </Card>
      <div style={{ display:'flex', flexDirection:'column', gap:6 }}>
        <InitiativeRow name="Mara Quill" initiative={19} current={hp} max={30} active conditions={['Blessed']} onHpDown={()=>setHp(h=>Math.max(0,h-1))} onHpUp={()=>setHp(h=>Math.min(30,h+1))} />
        <InitiativeRow name="Bandit Captain" initiative={15} current={6} max={52} dmOnly conditions={['Prone']} />
        <InitiativeRow name="Bran Ironwood" initiative={12} current={41} max={44} />
      </div>
      <div style={{ display:'flex', gap:12 }}>
        <DiceResult notation="1d20+7" total={27} rolls={[20]} modifier={7} crit="success" style={{ flex:1 }} />
        <DiceResult notation="2d6+3" total={11} rolls={[4,4]} modifier={3} style={{ flex:1 }} />
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
</body>
</html>

<!-- @dsCard group="Components" viewport="760x460" name="Map layers" subtitle="The Atlas layer system: type badges, layer rows, and the full render-ordered panel" -->
<!DOCTYPE html>
<html lang="en" data-theme="tavern">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../styles.css" />
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;padding:20px;}</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const { LayerPanel, LayerTypeBadge } = window.DNDToolsDesignSystem_8ae046;

function Row({ children, label }) {
  return (
    <div style={{ display:'flex', flexDirection:'column', gap:8 }}>
      <span style={{ fontSize:11, letterSpacing:'.08em', textTransform:'uppercase', color:'var(--color-text-tertiary)', fontFamily:'var(--font-sans)' }}>{label}</span>
      <div style={{ display:'flex', gap:8, alignItems:'center', flexWrap:'wrap' }}>{children}</div>
    </div>
  );
}

const LAYERS = [
  { id: 'l1', name: 'DM annotations', type: 'dm', visibility: 'dm-only', opacity: 100, dmDisplay: true, locked: false },
  { id: 'l2', name: 'Tokens', type: 'combat', visibility: 'players', opacity: 100, dmDisplay: true, locked: false },
  { id: 'l3', name: 'Fog of war', type: 'fog', visibility: 'players', opacity: 85, dmDisplay: true, locked: false },
  { id: 'l4', name: 'Points of interest', type: 'poi', visibility: 'players', opacity: 100, dmDisplay: true, locked: false },
  { id: 'l5', name: 'Roads & routes', type: 'roads', visibility: 'players', opacity: 70, dmDisplay: true, locked: false },
  { id: 'l6', name: 'Base map', type: 'base', visibility: 'players', opacity: 100, dmDisplay: true, locked: true },
];

function Demo() {
  return (
    <div style={{ display:'grid', gridTemplateColumns:'1fr 300px', gap:24, alignItems:'start' }}>
      <div style={{ display:'flex', flexDirection:'column', gap:18 }}>
        <Row label="Layer type badges — 13 warm-harmonised types">
          <LayerTypeBadge type="base" />
          <LayerTypeBadge type="height" />
          <LayerTypeBadge type="political" />
          <LayerTypeBadge type="water" />
          <LayerTypeBadge type="roads" />
          <LayerTypeBadge type="poi" />
          <LayerTypeBadge type="combat" />
          <LayerTypeBadge type="player" />
        </Row>
        <Row label="DM-only adds a grayscale-safe hatch — never color alone">
          <LayerTypeBadge type="dm" />
          <LayerTypeBadge type="fog" />
          <LayerTypeBadge type="custom" label="BRINE HAND" />
        </Row>
        <p style={{ margin:0, maxWidth:380, fontFamily:'var(--font-sans)', fontSize:'var(--text-sm)', lineHeight:1.6, color:'var(--color-text-secondary)' }}>
          The panel manages reorder (top of list = top of the render stack), three independent
          controls per row — DM display, player visibility, opacity — plus lock and inline rename,
          mirroring every change through <code style={{ fontFamily:'var(--font-mono)', fontSize:'var(--text-xs)' }}>onChange</code>.
        </p>
      </div>
      <LayerPanel layers={LAYERS} style={{ height:400 }} onAddLayer={()=>{}} />
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
</body>
</html>

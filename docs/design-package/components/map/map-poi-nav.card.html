<!-- @dsCard group="Maps" viewport="840x560" name="POI, wayfinding & primitives" subtitle="Leak-safe POI popover & markers, nested-map breadcrumb, minimap, stepper, slider, segmented control" -->
<!DOCTYPE html>
<html lang="en" data-theme="tavern">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../styles.css" />
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;padding:20px;}</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const { POIPopover, POIMarker, Breadcrumb, Minimap, Stepper, Slider, SegmentedControl } = window.DNDToolsDesignSystem_8ae046;
function Label({ children }) {
  return <span style={{ fontSize:11, letterSpacing:'.08em', textTransform:'uppercase', color:'var(--color-text-tertiary)', fontFamily:'var(--font-sans)' }}>{children}</span>;
}
function Demo() {
  const [vis, setVis] = React.useState('dm-only');
  const [gen, setGen] = React.useState('terrain');
  const [brush, setBrush] = React.useState(12);
  return (
    <div style={{ display:'grid', gridTemplateColumns:'330px 1fr', gap:28, alignItems:'start' }}>
      <div style={{ display:'flex', flexDirection:'column', gap:8 }}>
        <Label>POI popover · leak-safe dismiss, own visibility axis</Label>
        <POIPopover
          poi={{ name:"Dragon's Lair", category:'danger', categoryLabel:'Danger', linkedNote:'Cinderfang — lair', visibility:vis }}
          onClose={()=>{}} onVisibilityChange={setVis}
          onFocus={()=>{}} onEdit={()=>{}} onDeepLink={()=>{}} onDelete={()=>{}} onOpenNote={()=>{}} />
        <div style={{ display:'flex', gap:14, alignItems:'center', marginTop:6 }}>
          <POIMarker category='location' label='Silverdale' />
          <POIMarker category='quest' label='Quest start' />
          <POIMarker category='danger' label='Lair' dmOnly active />
          <POIMarker category='treasure' label='Cache' />
          <span style={{ fontFamily:'var(--font-sans)', fontSize:12, color:'var(--color-text-tertiary)' }}>map markers</span>
        </div>
      </div>

      <div style={{ display:'flex', flexDirection:'column', gap:18 }}>
        <div style={{ display:'flex', flexDirection:'column', gap:8 }}>
          <Label>Nested-map breadcrumb</Label>
          <div style={{ padding:'8px 12px', background:'var(--color-surface)', border:'1px solid var(--color-border)', borderRadius:6 }}>
            <Breadcrumb items={[{id:'w',label:'World'},{id:'r',label:'Northern Region'},{id:'s',label:'Silverdale'},{id:'i',label:'Inn (Ground Floor)'}]} onNavigate={()=>{}} />
          </div>
        </div>
        <div style={{ display:'flex', gap:24, alignItems:'flex-start' }}>
          <div style={{ display:'flex', flexDirection:'column', gap:8 }}>
            <Label>Minimap</Label>
            <Minimap />
          </div>
          <div style={{ display:'flex', flexDirection:'column', gap:8, flex:1 }}>
            <Label>Import stepper</Label>
            <Stepper steps={['Source','Preview','Result']} current={1} />
            <div style={{ marginTop:6 }}><Label>Segmented control</Label></div>
            <SegmentedControl value={gen} onChange={setGen} options={[{value:'terrain',label:'Terrain'},{value:'settlement',label:'Settlement'},{value:'dungeon',label:'Dungeon'}]} />
            <div style={{ marginTop:6 }}><Label>Slider · brush size in map units</Label></div>
            <Slider min={0.5} max={50} step={0.5} value={brush} onChange={setBrush} valueLabel={brush + ' ft'} steppers />
          </div>
        </div>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
</body>
</html>

<!-- @dsCard group="Brand" viewport="700x200" name="Iconography — Lucide" subtitle="One family, 2px stroke, currentColor; status icons each have a distinct shape" -->
<!DOCTYPE html>
<html lang="en" data-theme="tavern">
<head><meta charset="utf-8" /><link rel="stylesheet" href="../styles.css" />
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<style>
  body{margin:0;padding:20px;color:var(--color-text-primary);}
  .grp{margin-bottom:14px;}
  .lab{font:var(--font-weight-semibold) var(--text-2xs) var(--font-sans);letter-spacing:.08em;text-transform:uppercase;color:var(--color-text-tertiary);margin-bottom:8px;}
  .row{display:flex;gap:18px;align-items:center;}
  .row i{width:24px;height:24px;}
</style></head>
<body>
  <div class="grp"><div class="lab">Navigation sections</div>
    <div class="row" style="color:var(--color-text-secondary)">
      <i data-lucide="house"></i><i data-lucide="zap"></i><i data-lucide="users"></i><i data-lucide="map"></i><i data-lucide="scroll"></i><i data-lucide="book-open"></i><i data-lucide="settings"></i>
    </div>
  </div>
  <div class="grp"><div class="lab">Status — distinct shape per severity (not color alone)</div>
    <div class="row">
      <i data-lucide="circle-check" style="color:var(--color-status-success)"></i>
      <i data-lucide="triangle-alert" style="color:var(--color-status-warning)"></i>
      <i data-lucide="circle-x" style="color:var(--color-status-error)"></i>
      <i data-lucide="info" style="color:var(--color-status-info)"></i>
    </div>
  </div>
  <div class="grp"><div class="lab">Visibility & live-play</div>
    <div class="row" style="color:var(--color-text-secondary)">
      <i data-lucide="eye" style="color:var(--color-dm-only-badge)"></i><i data-lucide="eye-off"></i><i data-lucide="dices" style="color:var(--color-accent)"></i><i data-lucide="heart"></i><i data-lucide="swords"></i><i data-lucide="volume-2"></i><i data-lucide="send"></i>
    </div>
  </div>
  <script>lucide.createIcons();</script>
</body></html>

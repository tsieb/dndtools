<!-- @dsCard group="Spacing" viewport="700x180" name="Elevation" subtitle="Shadow + surface tone separate primary from secondary panels" -->
<!DOCTYPE html>
<html lang="en" data-theme="tavern">
<head><meta charset="utf-8" /><link rel="stylesheet" href="../styles.css" />
<style>
  body{margin:0;padding:26px;background:var(--color-bg);}
  .row{display:flex;gap:26px;}
  .col{display:flex;flex-direction:column;align-items:center;gap:12px;flex:1;}
  .box{width:100%;height:64px;background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-md);}
  .lab{font:var(--font-weight-semibold) var(--text-xs) var(--font-sans);color:var(--color-text-primary);}
  .val{font:var(--text-2xs) var(--font-mono);color:var(--color-text-tertiary);}
</style></head>
<body>
<div class="row">
  <div class="col"><div class="box" style="box-shadow:none"></div><span class="lab">none — flat / sunken tiles</span><span class="val">supporting widgets</span></div>
  <div class="col"><div class="box" style="box-shadow:var(--shadow-sm)"></div><span class="lab">sm</span><span class="val">resting cards</span></div>
  <div class="col"><div class="box" style="background:var(--color-surface-raised);box-shadow:var(--shadow-md)"></div><span class="lab">md — the primary panel</span><span class="val">raised + accent</span></div>
  <div class="col"><div class="box" style="background:var(--color-surface-overlay);box-shadow:var(--shadow-lg)"></div><span class="lab">lg</span><span class="val">menus / modals</span></div>
</div>
</body></html>

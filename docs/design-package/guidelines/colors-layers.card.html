<!-- @dsCard group="Colors" viewport="720x300" name="Map layer palette" subtitle="13 layer-type hues, re-harmonised to the warm brand in OKLCH" -->
<!DOCTYPE html>
<html lang="en" data-theme="tavern">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../_ds_bundle.js"></script>
<style>body{margin:0;padding:20px;}</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const { LayerTypeBadge, LAYER_TYPES } = window.DNDToolsDesignSystem_8ae046;
const order = ['base','height','political','climate','roads','water','wshed','fog','poi','dm','player','combat','custom'];
function Demo() {
  return (
    <div style={{ display:'flex', flexDirection:'column', gap:14 }}>
      <p style={{ margin:0, maxWidth:660, fontFamily:'var(--font-sans)', fontSize:13, lineHeight:1.5, color:'var(--color-text-secondary)' }}>
        The maps spec lists raw Material primaries (#4CAF50, #2196F3…). Those fight the candle-lit brand, so every layer hue is re-derived in OKLCH at a controlled lightness (~0.72) and tamed chroma (~0.10) — distinguishable at a glance, unmistakably warm. One token per type drives the chip; the fill is mixed from it. The <strong style={{color:'var(--color-text-primary)'}}>DM</strong> type adds a grayscale-safe hatch.
      </p>
      <div style={{ display:'grid', gridTemplateColumns:'repeat(auto-fill, minmax(150px,1fr))', gap:10 }}>
        {order.map((t) => (
          <div key={t} style={{ display:'flex', alignItems:'center', gap:10, padding:'8px 10px', background:'var(--color-surface)', border:'1px solid var(--color-border)', borderRadius:6 }}>
            <span style={{ width:26, height:26, borderRadius:6, flex:'0 0 auto', background:`var(${LAYER_TYPES[t].token})`, boxShadow:'inset 0 0 0 1px rgba(0,0,0,.25)' }} />
            <div style={{ minWidth:0 }}>
              <LayerTypeBadge type={t} />
              <div style={{ fontFamily:'var(--font-mono)', fontSize:10, color:'var(--color-text-tertiary)', marginTop:3, whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis' }}>{LAYER_TYPES[t].token}</div>
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
</body>
</html>

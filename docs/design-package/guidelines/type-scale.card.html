<!-- @dsCard group="Type" viewport="700x230" name="Type scale" subtitle="9 steps; switch to Cinzel display at 24px (text-xl) and above" -->
<!DOCTYPE html>
<html lang="en" data-theme="tavern">
<head><meta charset="utf-8" /><link rel="stylesheet" href="../styles.css" />
<style>
  body{margin:0;padding:20px;color:var(--color-text-primary);}
  .row{display:flex;align-items:baseline;gap:16px;padding:3px 0;}
  .tok{font:var(--text-2xs) var(--font-mono);color:var(--color-text-tertiary);width:120px;flex:0 0 auto;}
</style></head>
<body>
  <div class="row"><span class="tok">3xl · 36 · Cinzel</span><span style="font:var(--font-weight-bold) var(--text-3xl) var(--font-display)">Dragons</span></div>
  <div class="row"><span class="tok">2xl · 30 · Cinzel</span><span style="font:var(--font-weight-semibold) var(--text-2xl) var(--font-display)">Initiative</span></div>
  <div class="row"><span class="tok">xl · 24 · Cinzel</span><span style="font:var(--font-weight-semibold) var(--text-xl) var(--font-display)">Command Center</span></div>
  <div class="row"><span class="tok">lg · 20 · Inter</span><span style="font:var(--font-weight-semibold) var(--text-lg) var(--font-sans)">Section sub-heading</span></div>
  <div class="row"><span class="tok">md · 17 · Inter</span><span style="font:var(--font-weight-semibold) var(--text-md) var(--font-sans)">Card title</span></div>
  <div class="row"><span class="tok">base · 15 · Inter</span><span style="font:var(--text-base) var(--font-sans)">Body & default UI</span></div>
  <div class="row"><span class="tok">sm · 13 · Inter</span><span style="font:var(--text-sm) var(--font-sans);color:var(--color-text-secondary)">Secondary / dense</span></div>
  <div class="row"><span class="tok">xs · 12 · Inter</span><span style="font:var(--text-xs) var(--font-sans);color:var(--color-text-secondary)">Meta, chips, kbd</span></div>
</body></html>

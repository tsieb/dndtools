<!-- @dsCard group="Colors" viewport="700x150" name="Text & Ink" subtitle="Warm parchment ink on espresso — a clear 3-step text hierarchy" -->
<!DOCTYPE html>
<html lang="en" data-theme="tavern">
<head><meta charset="utf-8" /><link rel="stylesheet" href="../styles.css" />
<style>
  body{margin:0;padding:20px;display:flex;flex-direction:column;gap:10px;}
  .line{display:flex;align-items:baseline;gap:14px;}
  .val{font:var(--text-2xs) var(--font-mono);color:var(--color-text-tertiary);margin-left:auto;}
</style></head>
<body>
  <div class="line"><span style="font:var(--font-weight-semibold) var(--text-md) var(--font-sans);color:var(--color-text-primary)">Primary — combatant names, values, headings</span><span class="val">#f2e8d8 · text-primary</span></div>
  <div class="line"><span style="font:var(--text-base) var(--font-sans);color:var(--color-text-secondary)">Secondary — labels, supporting copy, meta</span><span class="val">#bcab92 · text-secondary</span></div>
  <div class="line"><span style="font:var(--text-base) var(--font-sans);color:var(--color-text-tertiary)">Tertiary — eyebrows, hints, disabled, IDs</span><span class="val">#897a64 · text-tertiary</span></div>
  <div class="line"><a href="#" style="font:var(--font-weight-medium) var(--text-base) var(--font-sans);color:var(--color-text-link)">Link — gold, for inline navigation</a><span class="val">#e0b06f · text-link</span></div>
</body></html>

<!-- @dsCard group="Colors" viewport="700x150" name="Surfaces — Tavern (dark)" subtitle="The warm espresso elevation ramp; tone separates primary from secondary" -->
<!DOCTYPE html>
<html lang="en" data-theme="tavern">
<head><meta charset="utf-8" /><link rel="stylesheet" href="../styles.css" />
<style>
  body{margin:0;padding:18px;}
  .ramp{display:flex;gap:10px;}
  .sw{flex:1;display:flex;flex-direction:column;gap:8px;}
  .chip{height:64px;border-radius:var(--radius-md);border:1px solid var(--color-border);}
  .lab{font:var(--font-weight-semibold) var(--text-xs)/1.3 var(--font-sans);color:var(--color-text-primary);}
  .val{font:var(--text-2xs)/1.3 var(--font-mono);color:var(--color-text-tertiary);}
</style></head>
<body>
<div class="ramp">
  <div class="sw"><div class="chip" style="background:var(--color-bg)"></div><span class="lab">bg</span><span class="val">#14100b</span></div>
  <div class="sw"><div class="chip" style="background:var(--color-surface-sunken)"></div><span class="lab">sunken</span><span class="val">#0e0a06</span></div>
  <div class="sw"><div class="chip" style="background:var(--color-surface)"></div><span class="lab">surface</span><span class="val">#1f1810</span></div>
  <div class="sw"><div class="chip" style="background:var(--color-surface-raised)"></div><span class="lab">raised</span><span class="val">#2a2117</span></div>
  <div class="sw"><div class="chip" style="background:var(--color-surface-overlay)"></div><span class="lab">overlay</span><span class="val">#362a1d</span></div>
  <div class="sw"><div class="chip" style="background:var(--color-border)"></div><span class="lab">border</span><span class="val">#3a2e20</span></div>
  <div class="sw"><div class="chip" style="background:var(--color-border-strong)"></div><span class="lab">border-strong</span><span class="val">#5c4630</span></div>
</div>
</body></html>

<!-- @dsCard group="Brand" viewport="700x200" name="Candle-glow motif" subtitle="The one decorative surface: a single warm radial glow on the page root" -->
<!DOCTYPE html>
<html lang="en" data-theme="tavern">
<head><meta charset="utf-8" /><link rel="stylesheet" href="../styles.css" />
<style>
  /* This card intentionally re-states the body glow on its own root so the motif shows in the frame. */
  html{height:100%;}
  body{margin:0;height:100%;min-height:200px;padding:0;
    background-color:var(--color-bg);
    background-image:radial-gradient(900px 380px at 50% -160px, var(--color-accent-subtle), transparent 70%);
    display:flex;align-items:center;justify-content:center;}
  .note{text-align:center;}
  .h{font:var(--font-weight-semibold) var(--text-xl) var(--font-display);color:var(--color-text-primary);}
  .p{font:var(--text-sm) var(--font-sans);color:var(--color-text-secondary);margin-top:8px;max-width:46ch;}
</style></head>
<body>
  <div class="note">
    <div class="h">Warm light from above</div>
    <div class="p">No textures on contrast-bearing components. The glow lives on the page root only — candlelight, not decoration.</div>
  </div>
</body></html>

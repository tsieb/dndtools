<!-- @dsCard group="Brand" viewport="700x180" name="Wordmark" subtitle="Cinzel wordmark + gold dice mark; the product is 'DND Tools'" -->
<!DOCTYPE html>
<html lang="en" data-theme="tavern">
<head><meta charset="utf-8" /><link rel="stylesheet" href="../styles.css" />
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<style>
  body{margin:0;padding:30px;display:flex;align-items:center;gap:40px;}
  .mark{display:inline-flex;align-items:center;justify-content:center;width:56px;height:56px;border-radius:var(--radius-md);background:var(--color-accent);color:var(--color-accent-foreground);box-shadow:var(--shadow-md);}
  .lock{display:flex;align-items:center;gap:16px;}
  .word{font:var(--font-weight-bold) 34px/1 var(--font-display);letter-spacing:.04em;color:var(--color-text-primary);}
  .word b{color:var(--color-accent);font-weight:700;}
  .small{display:inline-flex;align-items:center;gap:9px;}
  .small .word{font-size:20px;}
  .small .mark{width:34px;height:34px;}
</style></head>
<body>
  <div class="lock"><span class="mark"><i data-lucide="dices" style="width:32px;height:32px"></i></span><span class="word">DND<b>Tools</b></span></div>
  <div class="small"><span class="mark"><i data-lucide="dices" style="width:20px;height:20px"></i></span><span class="word">DND<b>Tools</b></span></div>
  <script>lucide.createIcons();</script>
</body></html>

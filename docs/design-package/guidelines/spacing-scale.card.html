<!-- @dsCard group="Spacing" viewport="700x170" name="Spacing scale" subtitle="4px grid with a 2px micro half-step" -->
<!DOCTYPE html>
<html lang="en" data-theme="tavern">
<head><meta charset="utf-8" /><link rel="stylesheet" href="../styles.css" />
<style>
  body{margin:0;padding:20px;}
  .row{display:flex;align-items:flex-end;gap:14px;}
  .col{display:flex;flex-direction:column;align-items:center;gap:6px;}
  .bar{background:var(--color-accent);border-radius:var(--radius-sm);width:22px;}
  .tok{font:var(--text-2xs) var(--font-mono);color:var(--color-text-tertiary);}
  .px{font:var(--font-weight-semibold) var(--text-2xs) var(--font-sans);color:var(--color-text-secondary);}
</style></head>
<body>
<div class="row">
  <div class="col"><div class="bar" style="height:2px"></div><span class="px">2</span><span class="tok">0-5</span></div>
  <div class="col"><div class="bar" style="height:4px"></div><span class="px">4</span><span class="tok">1</span></div>
  <div class="col"><div class="bar" style="height:8px"></div><span class="px">8</span><span class="tok">2</span></div>
  <div class="col"><div class="bar" style="height:12px"></div><span class="px">12</span><span class="tok">3</span></div>
  <div class="col"><div class="bar" style="height:16px"></div><span class="px">16</span><span class="tok">4</span></div>
  <div class="col"><div class="bar" style="height:24px"></div><span class="px">24</span><span class="tok">6</span></div>
  <div class="col"><div class="bar" style="height:32px"></div><span class="px">32</span><span class="tok">8</span></div>
  <div class="col"><div class="bar" style="height:48px"></div><span class="px">48</span><span class="tok">12</span></div>
  <div class="col"><div class="bar" style="height:64px"></div><span class="px">64</span><span class="tok">16</span></div>
  <div class="col"><div class="bar" style="height:80px"></div><span class="px">80</span><span class="tok">20</span></div>
</div>
</body></html>

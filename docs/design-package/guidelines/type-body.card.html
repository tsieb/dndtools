<!-- @dsCard group="Type" viewport="700x200" name="Body — Inter" subtitle="The UI workhorse — carries ~95% of the interface" -->
<!DOCTYPE html>
<html lang="en" data-theme="tavern">
<head><meta charset="utf-8" /><link rel="stylesheet" href="../styles.css" />
<style>body{margin:0;padding:22px;color:var(--color-text-primary);}</style></head>
<body>
  <div style="font:var(--font-weight-semibold) var(--text-md) var(--font-sans)">Card title — 17px semibold</div>
  <div style="font:var(--text-base)/1.5 var(--font-sans);color:var(--color-text-secondary);margin-top:6px;max-width:60ch">Body copy at 15px / 1.5. Run the live session: build encounters, advance combat, and reveal maps. Players see the state filtered to what they may see.</div>
  <div style="display:flex;gap:18px;margin-top:12px;align-items:baseline">
    <span style="font:var(--font-weight-medium) var(--text-sm) var(--font-sans);color:var(--color-text-secondary)">Label · 13px</span>
    <span style="font:var(--font-weight-semibold) var(--text-2xs) var(--font-sans);letter-spacing:var(--tracking-wider);text-transform:uppercase;color:var(--color-text-tertiary)">Eyebrow · 10px tracked</span>
  </div>
  <div style="font:var(--text-sm) var(--font-mono);color:var(--color-text-tertiary);margin-top:14px">Inter · 400 / 500 / 600 / 700</div>
</body></html>

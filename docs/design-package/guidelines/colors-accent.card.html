<!-- @dsCard group="Colors" viewport="700x150" name="Accent — Warm Gold" subtitle="The single primary action & active-nav color; used sparingly" -->
<!DOCTYPE html>
<html lang="en" data-theme="tavern">
<head><meta charset="utf-8" /><link rel="stylesheet" href="../styles.css" />
<style>
  body{margin:0;padding:18px;}
  .ramp{display:flex;gap:10px;}
  .sw{flex:1;display:flex;flex-direction:column;gap:8px;}
  .chip{height:64px;border-radius:var(--radius-md);border:1px solid var(--color-border);display:flex;align-items:center;justify-content:center;font:var(--font-weight-bold) var(--text-sm) var(--font-sans);}
  .lab{font:var(--font-weight-semibold) var(--text-xs)/1.3 var(--font-sans);color:var(--color-text-primary);}
  .val{font:var(--text-2xs)/1.3 var(--font-mono);color:var(--color-text-tertiary);}
</style></head>
<body>
<div class="ramp">
  <div class="sw"><div class="chip" style="background:var(--color-accent);color:var(--color-accent-foreground)">Aa</div><span class="lab">accent</span><span class="val">#e0b06f</span></div>
  <div class="sw"><div class="chip" style="background:var(--color-accent-hover);color:var(--color-accent-foreground)">Aa</div><span class="lab">accent-hover</span><span class="val">#efc587</span></div>
  <div class="sw"><div class="chip" style="background:var(--color-accent-active);color:var(--color-accent-foreground)">Aa</div><span class="lab">accent-active</span><span class="val">#c8964f</span></div>
  <div class="sw"><div class="chip" style="background:var(--color-accent-subtle);color:var(--color-accent)">Aa</div><span class="lab">accent-subtle</span><span class="val">#2f2414</span></div>
  <div class="sw"><div class="chip" style="background:var(--color-accent-border)"></div><span class="lab">accent-border</span><span class="val">#8a6736</span></div>
</div>
</body></html>

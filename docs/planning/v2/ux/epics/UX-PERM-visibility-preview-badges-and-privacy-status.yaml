id: UX-PERM-visibility-preview-badges-and-privacy-status
title: Visibility Controls, Preview Mode, Badges, and Privacy Status
status: complete
approved: true
phase: 04 Trust and Safety
productPriority: P0
domain: UX-PERM
objective: Give DMs safe inline visibility controls, preview-as-player/observer,
  ambient visibility badges, and privacy/cache status before deeper
  player-facing projection work lands.
requirementIds:
  - UX-PERM-001
  - UX-PERM-006
  - UX-PERM-007
  - UX-PERM-008
sourceDocs:
  - docs/remake-review/ux-requirements/00-overview-and-principles.md
  - docs/remake-review/ux-requirements/11-collaboration-permissions.md
  - docs/remake-review/ux-requirements/16-ideal-gui-architecture.md
  - docs/remake-review/ux-requirements/README.md
expectedAffectedAreas:
  - visibility controls
  - preview-as actor state
  - content badges
  - session privacy panel
  - cache purge UI
dependencies:
  - UX-SHELL-actor-filtered-nav-recents
  - UX-A11Y-spatial-live-region-and-leakage
parallelSafety:
  fileOwnership:
    - docs/planning/v2/ux/
    - apps/gm/src/lib/gui/ux-perm/
    - apps/gm/src/routes/
  notes: Parallel execution is safe only with non-overlapping component, route,
    and generated UX workpack ownership; shared shell/component contracts must
    be agreed before implementation.
stories:
  - id: UX-PERM-001-S01
    title: "DM visibility control: 3-state inline toggle"
    requirementIds:
      - UX-PERM-001
    acceptanceCriteria:
      - Given the DM hovers over a note's header, when the toggle expands, then
        all three visibility states are visible with icon and label.
      - Given the DM changes a player-visible note to `dm-only` while a player
        has an active grant on it, when the change is initiated, then the
        conflict warning appears before the command is dispatched.
      - Given a player views the note's surface, when they inspect the entity,
        then no visibility toggle is rendered.
      - Given the DM sets a section to `dm-only` on a `player-visible` entity,
        when a player queries the entity, then the entity is visible but the
        section is absent from their data.
    tasks:
      - id: UX-PERM-001-S01-T01
        title: Confirm UI contract, responsive profile behavior, and actor-safety
          implications for UX-PERM-001
        kind: design
      - id: UX-PERM-001-S01-T02
        title: Implement the shared or surface-specific UI behavior for UX-PERM-001
        kind: implementation
      - id: UX-PERM-001-S01-T03
        title: Add automated and manual coverage for UX-PERM-001 acceptance criteria
        kind: test
      - id: UX-PERM-001-S01-T04
        title: Record demo notes and traceability evidence for UX-PERM-001
        kind: demo
  - id: UX-PERM-006-S01
    title: '"Preview as player / observer" mode'
    requirementIds:
      - UX-PERM-006
    acceptanceCriteria:
      - Given the DM enters "Preview as player" (no specific player), when the
        mode activates, then the amber banner is visible, all write controls are
        disabled, and `dm-only` content is absent.
      - Given the DM is in preview mode and presses `Shift+Escape`, when the
        shortcut is processed, then the DM's full view is restored within 200
        ms.
      - Given the DM enters "Preview as [specific player]", when preview
        renders, then content reflects that player's exact grants (e.g.,
        sections grantable to them are visible).
      - Given the DM opens a modal dialog in preview mode, when the modal
        renders, then write actions within the modal are also disabled.
    tasks:
      - id: UX-PERM-006-S01-T01
        title: Confirm UI contract, responsive profile behavior, and actor-safety
          implications for UX-PERM-006
        kind: design
      - id: UX-PERM-006-S01-T02
        title: Implement the shared or surface-specific UI behavior for UX-PERM-006
        kind: implementation
      - id: UX-PERM-006-S01-T03
        title: Add automated and manual coverage for UX-PERM-006 acceptance criteria
        kind: test
      - id: UX-PERM-006-S01-T04
        title: Record demo notes and traceability evidence for UX-PERM-006
        kind: demo
  - id: UX-PERM-007-S01
    title: Visibility state ambient badge on content items
    requirementIds:
      - UX-PERM-007
    acceptanceCriteria:
      - Given a `dm-only` note is displayed in the DM's content list, when the
        list renders, then the amber "DM only" badge is visible without
        hovering.
      - Given a content item has section-level visibility overrides, when the DM
        views the item in the list, then a "Mixed" badge appears.
      - Given a player views the same content list, when the list renders, then
        no visibility badges are present.
    tasks:
      - id: UX-PERM-007-S01-T01
        title: Confirm UI contract, responsive profile behavior, and actor-safety
          implications for UX-PERM-007
        kind: design
      - id: UX-PERM-007-S01-T02
        title: Implement the shared or surface-specific UI behavior for UX-PERM-007
        kind: implementation
      - id: UX-PERM-007-S01-T03
        title: Add automated and manual coverage for UX-PERM-007 acceptance criteria
        kind: test
      - id: UX-PERM-007-S01-T04
        title: Record demo notes and traceability evidence for UX-PERM-007
        kind: demo
  - id: UX-PERM-008-S01
    title: Cache purge and session privacy status (DM view)
    requirementIds:
      - UX-PERM-008
    acceptanceCriteria:
      - Given a player leaves the session and cache purge cannot be confirmed,
        when the DM opens "Session privacy", then a "Purge unconfirmed" row
        appears with advisory copy and no device secrets.
      - Given cache purge succeeds for all participants, when the panel renders,
        then the empty-state copy is shown.
    tasks:
      - id: UX-PERM-008-S01-T01
        title: Confirm UI contract, responsive profile behavior, and actor-safety
          implications for UX-PERM-008
        kind: design
      - id: UX-PERM-008-S01-T02
        title: Implement the shared or surface-specific UI behavior for UX-PERM-008
        kind: implementation
      - id: UX-PERM-008-S01-T03
        title: Add automated and manual coverage for UX-PERM-008 acceptance criteria
        kind: test
      - id: UX-PERM-008-S01-T04
        title: Record demo notes and traceability evidence for UX-PERM-008
        kind: demo
qualityBar:
  - "Product fit: the delivered UI follows the canvas-first command platform
    model and never regresses to a document-list home."
  - "Traceability: every mapped UX requirement is tied to implementation, tests,
    and demo evidence."
  - "Foundations first: design tokens, shared components, platform profiles, and
    accessibility primitives are reused rather than reimplemented per surface."
  - "Actor safety: player and observer routes, search, ARIA, errors, skeletons,
    previews, and command results never leak DM-only content."
  - "Platform parity: Desktop, Tablet, and Mobile expose the same Must-have
    commands through profile-appropriate surfaces and the same processing-core
    commands."
  - "Live-play readiness: hot paths acknowledge within 100 ms, support
    undo/retry where appropriate, and stay glanceable under table pressure."
  - "Accessibility: WCAG 2.2 AA, keyboard parity, reduced motion, touch targets,
    non-color state, and screen-reader QA are part of the acceptance bar."
  - "Production polish: empty/loading/error states, responsive constraints,
    visual hierarchy, motion, and help affordances are complete enough to
    share."
gitWorkflow:
  - Start from `git status --short` and work around unrelated local edits unless
    they block the epic.
  - Use one branch per UX epic and keep commits scoped to that epic plus its
    generated UX workpack evidence.
  - Do not hand-edit generated files under `docs/planning/v2/ux` for status
    changes; use the UX workpack commands.
  - Do not reset, overwrite, or reformat unrelated user changes.
  - Before handoff, run targeted tests plus `pnpm ux-workpack:validate` and
    leave no stale generated UX planning diffs.
statusAutomation:
  - Do not hand-edit generated UX epic packets, `status.yaml`,
    `requirements-index.yaml`, `initiative-map.yaml`, or `parallel-batches.yaml`
    for status changes.
  - Use `pnpm ux-workpack:set-status -- --epic
    UX-PERM-visibility-preview-badges-and-privacy-status --status active` when
    implementation starts.
  - Create
    `docs/planning/v2/ux/epics/UX-PERM-visibility-preview-badges-and-privacy-status.completion.md`
    with demo, tests, traceability, gaps, and git evidence before marking
    complete.
  - Use `pnpm ux-workpack:complete -- --epic
    UX-PERM-visibility-preview-badges-and-privacy-status` to update
    `docs/planning/v2/ux/workpack-state.yaml` and regenerate all derived UX
    planning files together.
  - Run `pnpm ux-workpack:validate` after any status or generation command.
testPlan:
  - Run `pnpm ux-workpack:validate` before handoff.
  - Run targeted unit tests for stores, query shaping, route metadata, component
    state, and command dispatch touched by this epic.
  - Run app tests or Playwright coverage for visible route, profile, keyboard,
    touch, empty/loading/error, and player-safe behavior touched by this epic.
  - Run axe and manual accessibility checks when the epic touches focus,
    landmarks, dialogs, menus, tabs, drag alternatives, live regions, or
    screen-reader output.
  - Run DM/player/observer no-leak fixtures across DOM, ARIA, command palette,
    search, and previews touched by this epic.
demoNotesTemplate:
  - Describe the user-visible path demonstrated on Desktop, Tablet, and Mobile
    where applicable.
  - List the UX requirement IDs and acceptance criteria exercised by the demo.
  - Record actor roles used in the demo, especially DM/player/observer safety
    cases.
  - Record remaining polish, research, or product-decision gaps explicitly.
stopConditions:
  - Stop if the epic needs a product decision that the architecture
    reconciliation epic has not resolved.
  - Stop if a UX requirement conflicts with a functional requirement and the
    conflict has not been raised in docs.
  - Stop if a player-visible route, ARIA label, command result, search result,
    preview, skeleton, or error can reveal hidden DM-only content.
  - Stop if a Must-have action is pointer-only, gesture-only, desktop-only, or
    depends on an optional network/cloud/AI feature.
  - Stop if generated UX workpack validation fails and the cause is not
    understood.
completionEvidence:
  - Targeted tests and profile checks pass.
  - Requirement IDs are traced to implementation, tests, and demo notes.
  - Desktop, Tablet, and Mobile behavior is covered or explicitly scoped with a
    reason.
  - Accessibility, actor-safety, no-leak, reduced-motion, touch-target, and
    keyboard parity evidence is recorded where applicable.
  - Completion file records demo path, tests run, changed files, requirement
    coverage, known gaps, git branch/commit or PR, and final `git status
    --short` output.
  - The UX workpack status is updated with the programmatic complete command
    after completion evidence exists.
completionEvidenceFile: docs/planning/v2/ux/epics/UX-PERM-visibility-preview-badges-and-privacy-status.completion.md

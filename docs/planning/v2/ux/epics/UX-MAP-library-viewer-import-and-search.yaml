id: UX-MAP-library-viewer-import-and-search
title: Map Library, Viewer, Import, and Search
status: approved
approved: true
phase: 06 Core Library Workspaces
productPriority: P1
domain: UX-MAP
objective: Turn Atlas into a production map workspace with map library, viewer
  pan/zoom, nested transitions, minimap, create/import flows, and actor-filtered
  map search.

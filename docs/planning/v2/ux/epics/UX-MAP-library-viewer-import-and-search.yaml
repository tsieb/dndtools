parallelSafety:
  fileOwnership:
    - docs/planning/v2/ux/
    - apps/gm/src/lib/gui/ux-map/
    - apps/gm/src/routes/
  notes: Parallel execution is safe only with non-overlapping component, route,
    and generated UX workpack ownership; shared shell/component contracts must
    be agreed before implementation.
stories:
  - id: UX-MAP-001-S01
    title: Map viewer pan and zoom
    requirementIds:
      - UX-MAP-001
    acceptanceCriteria:
      - Given the map is loaded, when the user scrolls the wheel, then the map
        zooms centered on the pointer position within one animation frame (≤16
        ms initial response).
      - Given `prefers-reduced-motion` is set, when a zoom occurs, then no scale
        animation plays; instead a cross-fade at ≤100 ms is used.
      - Given the map is at minimum zoom, when the user zooms out further, then
        zoom stops and no blank space appears outside the map extent.
      - Given focus is on the canvas, when the user presses arrow keys, then the
        viewport pans and a live-region announces direction.
    tasks:
      - id: UX-MAP-001-S01-T01
        title: Confirm UI contract, responsive profile behavior, and actor-safety
          implications for UX-MAP-001
        kind: design
      - id: UX-MAP-001-S01-T02
        title: Implement the shared or surface-specific UI behavior for UX-MAP-001
        kind: implementation
      - id: UX-MAP-001-S01-T03
        title: Add automated and manual coverage for UX-MAP-001 acceptance criteria
        kind: test
      - id: UX-MAP-001-S01-T04
        title: Record demo notes and traceability evidence for UX-MAP-001
        kind: demo
  - id: UX-MAP-002-S01
    title: Nested-map zoom transition and wayfinding breadcrumb
    requirementIds:
      - UX-MAP-002
    acceptanceCriteria:
      - Given a visible nested map, when the user zooms to 40% viewport fill,
        then an "Enter [Name]" affordance appears on the nested area.
      - Given the user triggers transition, when the transition plays, then the
        viewport animates from parent to child in ≤350 ms (including the 300 ms
        ease).
      - Given the child map has DM-only layers, when a player triggers the
        transition, then the child map renders only player-visible layers and
        DM-only content is absent.
      - Given `prefers-reduced-motion` is active, when the transition triggers,
        then no scale animation plays; a cross-fade occurs in ≤100 ms.
      - Given the user is at nesting level 3, when they click a breadcrumb level
        1 crumb, then the viewport returns to the ancestor map in one step.
    tasks:
      - id: UX-MAP-002-S01-T01
        title: Confirm UI contract, responsive profile behavior, and actor-safety
          implications for UX-MAP-002
        kind: design
      - id: UX-MAP-002-S01-T02
        title: Implement the shared or surface-specific UI behavior for UX-MAP-002
        kind: implementation
      - id: UX-MAP-002-S01-T03
        title: Add automated and manual coverage for UX-MAP-002 acceptance criteria
        kind: test
      - id: UX-MAP-002-S01-T04
        title: Record demo notes and traceability evidence for UX-MAP-002
        kind: demo
  - id: UX-MAP-003-S01
    title: Minimap overlay
    requirementIds:
      - UX-MAP-003
    acceptanceCriteria:
      - Given the map is loaded, when the user pans the main viewport, then the
        minimap viewport rectangle updates within 100 ms.
      - Given the user clicks the minimap, when the click position is valid,
        then the main viewport animates to center on that map coordinate within
        200 ms.
      - Given mobile profile, when the map loads, then the minimap is collapsed
        and only a globe icon button is visible.
    tasks:
      - id: UX-MAP-003-S01-T01
        title: Confirm UI contract, responsive profile behavior, and actor-safety
          implications for UX-MAP-003
        kind: design
      - id: UX-MAP-003-S01-T02
        title: Implement the shared or surface-specific UI behavior for UX-MAP-003
        kind: implementation
      - id: UX-MAP-003-S01-T03
        title: Add automated and manual coverage for UX-MAP-003 acceptance criteria
        kind: test
      - id: UX-MAP-003-S01-T04
        title: Record demo notes and traceability evidence for UX-MAP-003
        kind: demo
  - id: UX-MAP-006-S01
    title: Map creation form (MAP-001)
    requirementIds:
      - UX-MAP-006
    acceptanceCriteria:
      - Given the DM opens "New map" without filling the name, when they attempt
        to submit, then the submit button remains disabled (or form validation
        prevents submission) and the name field shows an error.
      - Given the form is submitted without specifying visibility, when the map
        is created, then its default visibility is `dm-only`.
      - Given the form submits successfully, when the dialog closes, then the
        new empty map opens in the viewer.
    tasks:
      - id: UX-MAP-006-S01-T01
        title: Confirm UI contract, responsive profile behavior, and actor-safety
          implications for UX-MAP-006
        kind: design
      - id: UX-MAP-006-S01-T02
        title: Implement the shared or surface-specific UI behavior for UX-MAP-006
        kind: implementation
      - id: UX-MAP-006-S01-T03
        title: Add automated and manual coverage for UX-MAP-006 acceptance criteria
        kind: test
      - id: UX-MAP-006-S01-T04
        title: Record demo notes and traceability evidence for UX-MAP-006
        kind: demo
  - id: UX-MAP-009-S01
    title: Map import wizard (MAP-002, MAP-020)
    requirementIds:
      - UX-MAP-009
    acceptanceCriteria:
      - Given a file exceeds the size limit, when the user selects it in step 1,
        then an error appears and the Preview button remains disabled.
      - Given an external format with no declared adapter, when step 2 renders,
        then no commit button is visible.
      - Given the user cancels in step 2, when the wizard closes, then no map
        entity, asset record, or partial layer exists in the store.
      - Given the import commit fails after staging, when rollback completes,
        then the user sees "No data was written" and no orphaned assets remain.
    tasks:
      - id: UX-MAP-009-S01-T01
        title: Confirm UI contract, responsive profile behavior, and actor-safety
          implications for UX-MAP-009
        kind: design
      - id: UX-MAP-009-S01-T02
        title: Implement the shared or surface-specific UI behavior for UX-MAP-009
        kind: implementation
      - id: UX-MAP-009-S01-T03
        title: Add automated and manual coverage for UX-MAP-009 acceptance criteria
        kind: test
      - id: UX-MAP-009-S01-T04
        title: Record demo notes and traceability evidence for UX-MAP-009
        kind: demo
  - id: UX-MAP-018-S01
    title: Actor-filtered map search (MAP-018)
    requirementIds:
      - UX-MAP-018
    acceptanceCriteria:
      - Given a player searches "Dragon's Lair" (a DM-only POI), when results
        appear, then the player-side result list is empty.
      - Given a deep link targets a hidden map, when a player opens the link,
        then the URL bar does not show the hidden map's ID in any visible UI
        element beyond the address bar.
    tasks:
      - id: UX-MAP-018-S01-T01
        title: Confirm UI contract, responsive profile behavior, and actor-safety
          implications for UX-MAP-018
        kind: design
      - id: UX-MAP-018-S01-T02
        title: Implement the shared or surface-specific UI behavior for UX-MAP-018
        kind: implementation
      - id: UX-MAP-018-S01-T03
        title: Add automated and manual coverage for UX-MAP-018 acceptance criteria
        kind: test
      - id: UX-MAP-018-S01-T04
        title: Record demo notes and traceability evidence for UX-MAP-018
        kind: demo
qualityBar:
  - "Product fit: the delivered UI follows the canvas-first command platform
    model and never regresses to a document-list home."
  - "Traceability: every mapped UX requirement is tied to implementation, tests,
    and demo evidence."
  - "Foundations first: design tokens, shared components, platform profiles, and
    accessibility primitives are reused rather than reimplemented per surface."
  - "Actor safety: player and observer routes, search, ARIA, errors, skeletons,
    previews, and command results never leak DM-only content."
  - "Platform parity: Desktop, Tablet, and Mobile expose the same Must-have
    commands through profile-appropriate surfaces and the same processing-core
    commands."
  - "Live-play readiness: hot paths acknowledge within 100 ms, support
    undo/retry where appropriate, and stay glanceable under table pressure."
  - "Accessibility: WCAG 2.2 AA, keyboard parity, reduced motion, touch targets,
    non-color state, and screen-reader QA are part of the acceptance bar."
  - "Production polish: empty/loading/error states, responsive constraints,
    visual hierarchy, motion, and help affordances are complete enough to
    share."
gitWorkflow:
  - Start from `git status --short` and work around unrelated local edits unless
    they block the epic.
  - Use one branch per UX epic and keep commits scoped to that epic plus its
    generated UX workpack evidence.
  - Do not hand-edit generated files under `docs/planning/v2/ux` for status
    changes; use the UX workpack commands.
  - Do not reset, overwrite, or reformat unrelated user changes.
  - Before handoff, run targeted tests plus `pnpm ux-workpack:validate` and
    leave no stale generated UX planning diffs.
statusAutomation:
  - Do not hand-edit generated UX epic packets, `status.yaml`,
    `requirements-index.yaml`, `initiative-map.yaml`, or `parallel-batches.yaml`
    for status changes.
  - Use `pnpm ux-workpack:set-status -- --epic
    UX-MAP-library-viewer-import-and-search --status active` when implementation
    starts.
  - Create
    `docs/planning/v2/ux/epics/UX-MAP-library-viewer-import-and-search.completion.md`
    with demo, tests, traceability, gaps, and git evidence before marking
    complete.
  - Use `pnpm ux-workpack:complete -- --epic
    UX-MAP-library-viewer-import-and-search` to update
    `docs/planning/v2/ux/workpack-state.yaml` and regenerate all derived UX
    planning files together.
  - Run `pnpm ux-workpack:validate` after any status or generation command.
testPlan:
  - Run `pnpm ux-workpack:validate` before handoff.
  - Run targeted unit tests for stores, query shaping, route metadata, component
    state, and command dispatch touched by this epic.
  - Run app tests or Playwright coverage for visible route, profile, keyboard,
    touch, empty/loading/error, and player-safe behavior touched by this epic.
  - Run axe and manual accessibility checks when the epic touches focus,
    landmarks, dialogs, menus, tabs, drag alternatives, live regions, or
    screen-reader output.
demoNotesTemplate:
  - Describe the user-visible path demonstrated on Desktop, Tablet, and Mobile
    where applicable.
  - List the UX requirement IDs and acceptance criteria exercised by the demo.
  - Record actor roles used in the demo, especially DM/player/observer safety
    cases.
  - Record remaining polish, research, or product-decision gaps explicitly.
stopConditions:
  - Stop if the epic needs a product decision that the architecture
    reconciliation epic has not resolved.
  - Stop if a UX requirement conflicts with a functional requirement and the
    conflict has not been raised in docs.
  - Stop if a player-visible route, ARIA label, command result, search result,
    preview, skeleton, or error can reveal hidden DM-only content.
  - Stop if a Must-have action is pointer-only, gesture-only, desktop-only, or
    depends on an optional network/cloud/AI feature.
  - Stop if generated UX workpack validation fails and the cause is not
    understood.
completionEvidence:
  - Targeted tests and profile checks pass.
  - Requirement IDs are traced to implementation, tests, and demo notes.
  - Desktop, Tablet, and Mobile behavior is covered or explicitly scoped with a
    reason.
  - Accessibility, actor-safety, no-leak, reduced-motion, touch-target, and
    keyboard parity evidence is recorded where applicable.
  - Completion file records demo path, tests run, changed files, requirement
    coverage, known gaps, git branch/commit or PR, and final `git status
    --short` output.
  - The UX workpack status is updated with the programmatic complete command
    after completion evidence exists.

schemaVersion: 1
kind: ux-ui-remake-epic
id: UX-COLLAB-presence-join-roster-connection-and-catchup
title: Presence, Join, Roster, Connection, and Catch-Up
status: approved
approved: true
phase: 07 Collaboration and Permissions
productPriority: P0
domain: UX-COLLAB
objective: Make collaboration visible and recoverable through presence, full
  participant roster, join/invite/leave, degradation feedback, reconnect, and
  mobile catch-up UI.
requirementIds:
  - UX-COLLAB-001
  - UX-COLLAB-002
  - UX-COLLAB-003
  - UX-COLLAB-006
  - UX-COLLAB-009
sourceDocs:
  - docs/remake-review/ux-requirements/00-overview-and-principles.md
  - docs/remake-review/ux-requirements/11-collaboration-permissions.md
  - docs/remake-review/ux-requirements/16-ideal-gui-architecture.md
  - docs/remake-review/ux-requirements/README.md
expectedAffectedAreas:
  - presence strip
  - participant roster panel
  - join/invite flow
  - connection degradation banner
  - reconnect catch-up UI
dependencies:
  - UX-SHELL-actor-filtered-nav-recents
parallelSafety:
  fileOwnership:
    - docs/planning/v2/ux/
    - apps/gm/src/lib/gui/ux-collab/
    - apps/gm/src/routes/
  notes: Parallel execution is safe only with non-overlapping component, route,
    and generated UX workpack ownership; shared shell/component contracts must
    be agreed before implementation.
stories:
  - id: UX-COLLAB-001-S01
    title: "Presence strip: persistent, glanceable participant roster"
    requirementIds:
      - UX-COLLAB-001
    acceptanceCriteria:
      - Given 6 participants are connected, when the strip renders, then 5
        avatars are visible and "+1 others" chip is shown.
      - Given a participant disconnects, when the strip updates, then their
        avatar desaturates and the screen reader announces "[name]
        disconnected".
      - Given the user is on Mobile, when they tap the session icon, then the
        participant roster opens as a bottom sheet.
      - Given no participants are in the session, when the strip renders, then
        it is not visible.
    tasks:
      - id: UX-COLLAB-001-S01-T01
        title: Confirm UI contract, responsive profile behavior, and actor-safety
          implications for UX-COLLAB-001
        kind: design
      - id: UX-COLLAB-001-S01-T02
        title: Implement the shared or surface-specific UI behavior for UX-COLLAB-001
        kind: implementation
      - id: UX-COLLAB-001-S01-T03
        title: Add automated and manual coverage for UX-COLLAB-001 acceptance criteria
        kind: test
      - id: UX-COLLAB-001-S01-T04
        title: Record demo notes and traceability evidence for UX-COLLAB-001
        kind: demo
  - id: UX-COLLAB-002-S01
    title: "Participant roster panel: full session view"
    requirementIds:
      - UX-COLLAB-002
    acceptanceCriteria:
      - Given the DM clicks "+2 others" in the presence strip, when the roster
        panel opens, then all participants are listed with role, connection
        state, and (for players) a Player View selector.
      - Given an observer row is shown, when the DM opens the action overflow,
        then "Manage Access" is absent.
      - Given the DM selects a Scene in the Player View selector for Player A,
        when confirmed, then COLLAB-005 is satisfied and Player A's view
        updates.
    tasks:
      - id: UX-COLLAB-002-S01-T01
        title: Confirm UI contract, responsive profile behavior, and actor-safety
          implications for UX-COLLAB-002
        kind: design
      - id: UX-COLLAB-002-S01-T02
        title: Implement the shared or surface-specific UI behavior for UX-COLLAB-002
        kind: implementation
      - id: UX-COLLAB-002-S01-T03
        title: Add automated and manual coverage for UX-COLLAB-002 acceptance criteria
        kind: test
      - id: UX-COLLAB-002-S01-T04
        title: Record demo notes and traceability evidence for UX-COLLAB-002
        kind: demo
  - id: UX-COLLAB-003-S01
    title: Session join / invite / leave flows
    requirementIds:
      - UX-COLLAB-003
    acceptanceCriteria:
      - Given a player uses a valid invitation, when they join, then their role,
        assigned view, and grants are applied and their avatar appears in the
        presence strip.
      - Given an expired invitation is used, when join is attempted, then no
        session state is disclosed in the error message.
      - Given a player confirms "Leave session", when the leave completes, then
        their row is removed from the roster and the DM sees cache-purge status.
    tasks:
      - id: UX-COLLAB-003-S01-T01
        title: Confirm UI contract, responsive profile behavior, and actor-safety
          implications for UX-COLLAB-003
        kind: design
      - id: UX-COLLAB-003-S01-T02
        title: Implement the shared or surface-specific UI behavior for UX-COLLAB-003
        kind: implementation
      - id: UX-COLLAB-003-S01-T03
        title: Add automated and manual coverage for UX-COLLAB-003 acceptance criteria
        kind: test
      - id: UX-COLLAB-003-S01-T04
        title: Record demo notes and traceability evidence for UX-COLLAB-003
        kind: demo
  - id: UX-COLLAB-006-S01
    title: "Connection state feedback: session-specific degradation"
    requirementIds:
      - UX-COLLAB-006
    acceptanceCriteria:
      - Given the participant's session connection drops, when degradation is
        detected, then the session banner appears within 1 s with "Reconnecting
        to session…" copy.
      - Given the participant reconnects, when catch-up completes, then the
        "Back online" banner shows for 3 s then dismisses, and queued commands
        are applied in order.
      - Given reconnection fails after 30 s, when the escalated banner appears,
        then grant/visibility commands remain blocked and the "Try again" link
        is keyboard-accessible.
    tasks:
      - id: UX-COLLAB-006-S01-T01
        title: Confirm UI contract, responsive profile behavior, and actor-safety
          implications for UX-COLLAB-006
        kind: design
      - id: UX-COLLAB-006-S01-T02
        title: Implement the shared or surface-specific UI behavior for UX-COLLAB-006
        kind: implementation
      - id: UX-COLLAB-006-S01-T03
        title: Add automated and manual coverage for UX-COLLAB-006 acceptance criteria
        kind: test
      - id: UX-COLLAB-006-S01-T04
        title: Record demo notes and traceability evidence for UX-COLLAB-006
        kind: demo
  - id: UX-COLLAB-009-S01
    title: Reconnect and mobile catch-up feedback
    requirementIds:
      - UX-COLLAB-009
    acceptanceCriteria:
      - Given a mobile device wakes after missing a grant revocation, when
        catch-up completes, then the revoked control is disabled and a safe
        generic notification appears.
      - Given catch-up fails mid-stream, when the participant UI renders, then
        durable commands are disabled and a "Session data may be outdated"
        banner is shown.
      - Given a handout was revoked while the player was offline, when catch-up
        applies the revocation, then the handout widget is removed during the
        skeleton phase, not after reveal.
    tasks:
      - id: UX-COLLAB-009-S01-T01
        title: Confirm UI contract, responsive profile behavior, and actor-safety
          implications for UX-COLLAB-009
        kind: design
      - id: UX-COLLAB-009-S01-T02
        title: Implement the shared or surface-specific UI behavior for UX-COLLAB-009
        kind: implementation
      - id: UX-COLLAB-009-S01-T03
        title: Add automated and manual coverage for UX-COLLAB-009 acceptance criteria
        kind: test
      - id: UX-COLLAB-009-S01-T04
        title: Record demo notes and traceability evidence for UX-COLLAB-009
        kind: demo
qualityBar:
  - "Product fit: the delivered UI follows the canvas-first command platform
    model and never regresses to a document-list home."
  - "Traceability: every mapped UX requirement is tied to implementation, tests,
    and demo evidence."
  - "Foundations first: design tokens, shared components, platform profiles, and
    accessibility primitives are reused rather than reimplemented per surface."
  - "Actor safety: player and observer routes, search, ARIA, errors, skeletons,
    previews, and command results never leak DM-only content."
  - "Platform parity: Desktop, Tablet, and Mobile expose the same Must-have
    commands through profile-appropriate surfaces and the same processing-core
    commands."
  - "Live-play readiness: hot paths acknowledge within 100 ms, support
    undo/retry where appropriate, and stay glanceable under table pressure."
  - "Accessibility: WCAG 2.2 AA, keyboard parity, reduced motion, touch targets,
    non-color state, and screen-reader QA are part of the acceptance bar."
  - "Production polish: empty/loading/error states, responsive constraints,
    visual hierarchy, motion, and help affordances are complete enough to
    share."
gitWorkflow:
  - Start from `git status --short` and work around unrelated local edits unless
    they block the epic.
  - Use one branch per UX epic and keep commits scoped to that epic plus its
    generated UX workpack evidence.
  - Do not hand-edit generated files under `docs/planning/v2/ux` for status
    changes; use the UX workpack commands.
  - Do not reset, overwrite, or reformat unrelated user changes.
  - Before handoff, run targeted tests plus `pnpm ux-workpack:validate` and
    leave no stale generated UX planning diffs.
statusAutomation:
  - Do not hand-edit generated UX epic packets, `status.yaml`,
    `requirements-index.yaml`, `initiative-map.yaml`, or `parallel-batches.yaml`
    for status changes.
  - Use `pnpm ux-workpack:set-status -- --epic
    UX-COLLAB-presence-join-roster-connection-and-catchup --status active` when
    implementation starts.
  - Create
    `docs/planning/v2/ux/epics/UX-COLLAB-presence-join-roster-connection-and-catchup.completion.md`
    with demo, tests, traceability, gaps, and git evidence before marking
    complete.
  - Use `pnpm ux-workpack:complete -- --epic
    UX-COLLAB-presence-join-roster-connection-and-catchup` to update
    `docs/planning/v2/ux/workpack-state.yaml` and regenerate all derived UX
    planning files together.
  - Run `pnpm ux-workpack:validate` after any status or generation command.
testPlan:
  - Run `pnpm ux-workpack:validate` before handoff.
  - Run targeted unit tests for stores, query shaping, route metadata, component
    state, and command dispatch touched by this epic.
  - Run app tests or Playwright coverage for visible route, profile, keyboard,
    touch, empty/loading/error, and player-safe behavior touched by this epic.
  - Run axe and manual accessibility checks when the epic touches focus,
    landmarks, dialogs, menus, tabs, drag alternatives, live regions, or
    screen-reader output.
  - Run DM/player/observer no-leak fixtures across DOM, ARIA, command palette,
    search, and previews touched by this epic.
demoNotesTemplate:
  - Describe the user-visible path demonstrated on Desktop, Tablet, and Mobile
    where applicable.
  - List the UX requirement IDs and acceptance criteria exercised by the demo.
  - Record actor roles used in the demo, especially DM/player/observer safety
    cases.
  - Record remaining polish, research, or product-decision gaps explicitly.
stopConditions:
  - Stop if the epic needs a product decision that the architecture
    reconciliation epic has not resolved.
  - Stop if a UX requirement conflicts with a functional requirement and the
    conflict has not been raised in docs.
  - Stop if a player-visible route, ARIA label, command result, search result,
    preview, skeleton, or error can reveal hidden DM-only content.
  - Stop if a Must-have action is pointer-only, gesture-only, desktop-only, or
    depends on an optional network/cloud/AI feature.
  - Stop if generated UX workpack validation fails and the cause is not
    understood.
completionEvidence:
  - Targeted tests and profile checks pass.
  - Requirement IDs are traced to implementation, tests, and demo notes.
  - Desktop, Tablet, and Mobile behavior is covered or explicitly scoped with a
    reason.
  - Accessibility, actor-safety, no-leak, reduced-motion, touch-target, and
    keyboard parity evidence is recorded where applicable.
  - Completion file records demo path, tests run, changed files, requirement
    coverage, known gaps, git branch/commit or PR, and final `git status
    --short` output.
  - The UX workpack status is updated with the programmatic complete command
    after completion evidence exists.

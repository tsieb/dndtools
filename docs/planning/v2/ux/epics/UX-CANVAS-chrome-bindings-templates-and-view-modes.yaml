stories:
  - id: UX-CANVAS-007-S01
    title: Widget chrome and anatomy
    requirementIds:
      - UX-CANVAS-007
    acceptanceCriteria:
      - Given an inactive widget, when no pointer is over it, the title bar and
        handles are at 20% opacity.
      - Given a Desktop user hovers a widget, when the pointer enters, the
        chrome fades to 100% opacity within 120 ms.
      - Given a widget has `dm-only` visibility, the DM-only badge is visible at
        all times, uses an icon + text label, and uses a diagonal-stripe pattern
        (not color alone).
      - Given a widget has a missing binding, the chain-link icon renders in
        `--color-warning` and the content area shows a "Binding missing"
        placeholder with a "Rebind" action.
      - Given a screen-reader user focuses the `⋯` button, the accessible name
        is "[Widget name] actions".
    tasks:
      - id: UX-CANVAS-007-S01-T01
        title: Confirm UI contract, responsive profile behavior, and actor-safety
          implications for UX-CANVAS-007
        kind: design
      - id: UX-CANVAS-007-S01-T02
        title: Implement the shared or surface-specific UI behavior for UX-CANVAS-007
        kind: implementation
      - id: UX-CANVAS-007-S01-T03
        title: Add automated and manual coverage for UX-CANVAS-007 acceptance criteria
        kind: test
      - id: UX-CANVAS-007-S01-T04
        title: Record demo notes and traceability evidence for UX-CANVAS-007
        kind: demo
  - id: UX-CANVAS-008-S01
    title: Widget data binding affordances
    requirementIds:
      - UX-CANVAS-008
    acceptanceCriteria:
      - Given a Desktop user hovers near a widget border, binding anchors appear
        within 120 ms.
      - Given the user drags from a widget anchor to a character entity, a
        binding is created and the chain-link indicator changes to
        `--color-accent-secondary`.
      - Given a Mobile user opens the context menu and selects "Bind to
        entity…", the binding panel opens and they can complete binding without
        any drag gesture.
      - Given a widget has a binding to a `dm-only` entity in a player session,
        the content area renders a blank placeholder and the chain-link shows
        `--color-muted`.
      - Given the "Show bindings" overlay is toggled, all binding curves render
        as dashed bezier lines on the canvas.
    tasks:
      - id: UX-CANVAS-008-S01-T01
        title: Confirm UI contract, responsive profile behavior, and actor-safety
          implications for UX-CANVAS-008
        kind: design
      - id: UX-CANVAS-008-S01-T02
        title: Implement the shared or surface-specific UI behavior for UX-CANVAS-008
        kind: implementation
      - id: UX-CANVAS-008-S01-T03
        title: Add automated and manual coverage for UX-CANVAS-008 acceptance criteria
        kind: test
      - id: UX-CANVAS-008-S01-T04
        title: Record demo notes and traceability evidence for UX-CANVAS-008
        kind: demo
  - id: UX-CANVAS-010-S01
    title: "Canvas templates: save and recall"
    requirementIds:
      - UX-CANVAS-010
    acceptanceCriteria:
      - Given a canvas with 5 widgets, when the DM saves it as a template and
        instantiates it, a new canvas appears with 5 new widget instances and
        the same entity bindings, in ≤2 seconds.
      - Given a template binding references a deleted entity, when the template
        is instantiated, the affected widget shows "Binding missing" state and
        the warning banner lists the entity name.
      - Given a system template is shown in the library, it is marked "Built-in"
        and has no "Delete" option.
    tasks:
      - id: UX-CANVAS-010-S01-T01
        title: Confirm UI contract, responsive profile behavior, and actor-safety
          implications for UX-CANVAS-010
        kind: design
      - id: UX-CANVAS-010-S01-T02
        title: Implement the shared or surface-specific UI behavior for UX-CANVAS-010
        kind: implementation
      - id: UX-CANVAS-010-S01-T03
        title: Add automated and manual coverage for UX-CANVAS-010 acceptance criteria
        kind: test
      - id: UX-CANVAS-010-S01-T04
        title: Record demo notes and traceability evidence for UX-CANVAS-010
        kind: demo
  - id: UX-CANVAS-011-S01
    title: DM view vs. player view affordance
    requirementIds:
      - UX-CANVAS-011
    acceptanceCriteria:
      - Given the DM right-clicks a `dm-only` widget and selects "Show to
        players", the widget badge changes to "Players" and the player canvas
        receives the widget on next sync.
      - Given the DM presses Shift+P, the canvas enters preview mode; `dm-only`
        widgets are hidden; the orange preview banner is visible.
      - Given preview mode is active, when the DM attempts to move a widget, no
        move occurs and the canvas remains read-only.
      - Given the DM exits preview mode (Esc or Shift+P), the canvas returns to
        full DM view with all widgets and their actual visibility badges.
      - Given a widget is `dm-only`, the badge uses both the diagonal-stripe
        texture and the closed-eye icon — not color alone — and survives a
        grayscale test.
    tasks:
      - id: UX-CANVAS-011-S01-T01
        title: Confirm UI contract, responsive profile behavior, and actor-safety
          implications for UX-CANVAS-011
        kind: design
      - id: UX-CANVAS-011-S01-T02
        title: Implement the shared or surface-specific UI behavior for UX-CANVAS-011
        kind: implementation
      - id: UX-CANVAS-011-S01-T03
        title: Add automated and manual coverage for UX-CANVAS-011 acceptance criteria
        kind: test
      - id: UX-CANVAS-011-S01-T04
        title: Record demo notes and traceability evidence for UX-CANVAS-011
        kind: demo
  - id: UX-CANVAS-013-S01
    title: Empty-canvas teaching state
    requirementIds:
      - UX-CANVAS-013
    acceptanceCriteria:
      - Given a newly created canvas, when it opens, the center callout and
        secondary hints are visible.
      - Given the DM places the first widget, when placement is confirmed, the
        empty-state elements fade out within 200 ms (or instantly under
        reduced-motion).
      - Given the user presses the CTA button in the empty state, the widget
        library opens.
      - "Given `prefers-reduced-motion: reduce` is active, the fade-out is
        replaced by an instant display change."
    tasks:
      - id: UX-CANVAS-013-S01-T01
        title: Confirm UI contract, responsive profile behavior, and actor-safety
          implications for UX-CANVAS-013
        kind: design
      - id: UX-CANVAS-013-S01-T02
        title: Implement the shared or surface-specific UI behavior for UX-CANVAS-013
        kind: implementation
      - id: UX-CANVAS-013-S01-T03
        title: Add automated and manual coverage for UX-CANVAS-013 acceptance criteria
        kind: test
      - id: UX-CANVAS-013-S01-T04
        title: Record demo notes and traceability evidence for UX-CANVAS-013
        kind: demo
qualityBar:
  - "Product fit: the delivered UI follows the canvas-first command platform
    model and never regresses to a document-list home."
  - "Traceability: every mapped UX requirement is tied to implementation, tests,
    and demo evidence."
  - "Foundations first: design tokens, shared components, platform profiles, and
    accessibility primitives are reused rather than reimplemented per surface."
  - "Actor safety: player and observer routes, search, ARIA, errors, skeletons,
    previews, and command results never leak DM-only content."
  - "Platform parity: Desktop, Tablet, and Mobile expose the same Must-have
    commands through profile-appropriate surfaces and the same processing-core
    commands."
  - "Live-play readiness: hot paths acknowledge within 100 ms, support
    undo/retry where appropriate, and stay glanceable under table pressure."
  - "Accessibility: WCAG 2.2 AA, keyboard parity, reduced motion, touch targets,
    non-color state, and screen-reader QA are part of the acceptance bar."
  - "Production polish: empty/loading/error states, responsive constraints,
    visual hierarchy, motion, and help affordances are complete enough to
    share."
gitWorkflow:
  - Start from `git status --short` and work around unrelated local edits unless
    they block the epic.
  - Use one branch per UX epic and keep commits scoped to that epic plus its
    generated UX workpack evidence.
  - Do not hand-edit generated files under `docs/planning/v2/ux` for status
    changes; use the UX workpack commands.
  - Do not reset, overwrite, or reformat unrelated user changes.
  - Before handoff, run targeted tests plus `pnpm v2:ux-workpack:validate` and
    leave no stale generated UX planning diffs.
statusAutomation:
  - Do not hand-edit generated UX epic packets, `status.yaml`,
    `requirements-index.yaml`, `initiative-map.yaml`, or `parallel-batches.yaml`
    for status changes.
  - Use `pnpm v2:ux-workpack:set-status -- --epic
    UX-CANVAS-chrome-bindings-templates-and-view-modes --status active` when
    implementation starts.
  - Create
    `docs/planning/v2/ux/epics/UX-CANVAS-chrome-bindings-templates-and-view-modes.completion.md`
    with demo, tests, traceability, gaps, and git evidence before marking
    complete.
  - Use `pnpm v2:ux-workpack:complete -- --epic
    UX-CANVAS-chrome-bindings-templates-and-view-modes` to update
    `docs/planning/v2/ux/workpack-state.yaml` and regenerate all derived UX
    planning files together.
  - Run `pnpm v2:ux-workpack:validate` after any status or generation command.
testPlan:
  - Run `pnpm v2:ux-workpack:validate` before handoff.
  - Run targeted unit tests for stores, query shaping, route metadata, component
    state, and command dispatch touched by this epic.
  - Run app tests or Playwright coverage for visible route, profile, keyboard,
    touch, empty/loading/error, and player-safe behavior touched by this epic.
  - Run axe and manual accessibility checks when the epic touches focus,
    landmarks, dialogs, menus, tabs, drag alternatives, live regions, or
    screen-reader output.
demoNotesTemplate:
  - Describe the user-visible path demonstrated on Desktop, Tablet, and Mobile
    where applicable.
  - List the UX requirement IDs and acceptance criteria exercised by the demo.
  - Record actor roles used in the demo, especially DM/player/observer safety
    cases.
  - Record remaining polish, research, or product-decision gaps explicitly.
stopConditions:
  - Stop if the epic needs a product decision that the architecture
    reconciliation epic has not resolved.
  - Stop if a UX requirement conflicts with a functional requirement and the
    conflict has not been raised in docs.
  - Stop if a player-visible route, ARIA label, command result, search result,
    preview, skeleton, or error can reveal hidden DM-only content.
  - Stop if a Must-have action is pointer-only, gesture-only, desktop-only, or
    depends on an optional network/cloud/AI feature.
  - Stop if generated UX workpack validation fails and the cause is not
    understood.
completionEvidence:
  - Targeted tests and profile checks pass.
  - Requirement IDs are traced to implementation, tests, and demo notes.
  - Desktop, Tablet, and Mobile behavior is covered or explicitly scoped with a
    reason.
  - Accessibility, actor-safety, no-leak, reduced-motion, touch-target, and
    keyboard parity evidence is recorded where applicable.
  - Completion file records demo path, tests run, changed files, requirement
    coverage, known gaps, git branch/commit or PR, and final `git status
    --short` output.
  - The UX workpack status is updated with the programmatic complete command
    after completion evidence exists.
completionEvidenceFile: docs/planning/v2/ux/epics/UX-CANVAS-chrome-bindings-templates-and-view-modes.completion.md

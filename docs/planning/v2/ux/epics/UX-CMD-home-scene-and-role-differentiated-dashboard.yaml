schemaVersion: 1
kind: ux-ui-remake-epic
id: UX-CMD-home-scene-and-role-differentiated-dashboard
title: Command Center Home Scene and Role-Differentiated Dashboard
status: complete
approved: true
phase: 03 Canvas and Command Center
productPriority: P0
domain: UX-CMD
objective: Make the home route a populated live-play Command Center with clear
  session state, recoverable layout presets, and distinct DM/player/observer
  dashboards.
requirementIds:
  - UX-CMD-001
  - UX-CMD-002
  - UX-CMD-003
  - UX-CMD-008
  - UX-CMD-012
sourceDocs:
  - docs/remake-review/ux-requirements/00-overview-and-principles.md
  - docs/remake-review/ux-requirements/05-command-center.md
  - docs/remake-review/ux-requirements/16-ideal-gui-architecture.md
  - docs/remake-review/ux-requirements/README.md
expectedAffectedAreas:
  - home route
  - Command Center layout preset store
  - session status strip
  - role-specific dashboards
dependencies:
  - UX-SHELL-route-layout-and-platform-profiles
  - UX-CANVAS-chrome-bindings-templates-and-view-modes
parallelSafety:
  fileOwnership:
    - docs/planning/v2/ux/
    - apps/v2/app/src/lib/gui/ux-cmd/
    - apps/v2/app/src/routes/
  notes: Parallel execution is safe only with non-overlapping component, route,
    and generated UX workpack ownership; shared shell/component contracts must
    be agreed before implementation.
stories:
  - id: UX-CMD-001-S01
    title: Persistent home affordance reachable in one action
    requirementIds:
      - UX-CMD-001
    acceptanceCriteria:
      - Given the DM is viewing a character sheet, when they press `G` then `H`,
        then the Command Center is displayed within 500 ms.
      - Given the DM is on Mobile with no hardware keyboard, when they tap the
        Home tab, then the Command Center is displayed.
      - Given the Command Center is already active, when the DM presses `G H`,
        then focus is returned to the Command Center without a route change
        (no-op navigation).
    tasks:
      - id: UX-CMD-001-S01-T01
        title: Confirm UI contract, responsive profile behavior, and actor-safety
          implications for UX-CMD-001
        kind: design
      - id: UX-CMD-001-S01-T02
        title: Implement the shared or surface-specific UI behavior for UX-CMD-001
        kind: implementation
      - id: UX-CMD-001-S01-T03
        title: Add automated and manual coverage for UX-CMD-001 acceptance criteria
        kind: test
      - id: UX-CMD-001-S01-T04
        title: Record demo notes and traceability evidence for UX-CMD-001
        kind: demo
  - id: UX-CMD-002-S01
    title: Default populated layout on first run (no blank-canvas home)
    requirementIds:
      - UX-CMD-002
    acceptanceCriteria:
      - Given a fresh vault with no saved Command Center, when the DM opens the
        app, then the default six-zone layout is displayed with at least five of
        the six system widgets pre-placed.
      - Given the default layout is displayed, when the DM does not configure
        anything and clicks the Dice widget, then at least one die roll executes
        successfully.
      - Given a first-run layout, when the DM dismisses the first-run tips, then
        tips do not reappear on the next launch.
    tasks:
      - id: UX-CMD-002-S01-T01
        title: Confirm UI contract, responsive profile behavior, and actor-safety
          implications for UX-CMD-002
        kind: design
      - id: UX-CMD-002-S01-T02
        title: Implement the shared or surface-specific UI behavior for UX-CMD-002
        kind: implementation
      - id: UX-CMD-002-S01-T03
        title: Add automated and manual coverage for UX-CMD-002 acceptance criteria
        kind: test
      - id: UX-CMD-002-S01-T04
        title: Record demo notes and traceability evidence for UX-CMD-002
        kind: demo
  - id: UX-CMD-003-S01
    title: Glanceable session status strip
    requirementIds:
      - UX-CMD-003
    acceptanceCriteria:
      - Given an active session with combat, when the DM is at the Command
        Center, then the current combatant's name is visible in the status strip
        without any click or scroll.
      - Given audio is playing, when the DM reads the status strip, then the
        track name is visible without opening a panel.
      - Given a session pause, when the DM views the status strip on a
        reduced-motion device, then the Phase badge shows "Paused" as a static
        label without animation.
    tasks:
      - id: UX-CMD-003-S01-T01
        title: Confirm UI contract, responsive profile behavior, and actor-safety
          implications for UX-CMD-003
        kind: design
      - id: UX-CMD-003-S01-T02
        title: Implement the shared or surface-specific UI behavior for UX-CMD-003
        kind: implementation
      - id: UX-CMD-003-S01-T03
        title: Add automated and manual coverage for UX-CMD-003 acceptance criteria
        kind: test
      - id: UX-CMD-003-S01-T04
        title: Record demo notes and traceability evidence for UX-CMD-003
        kind: demo
  - id: UX-CMD-008-S01
    title: Named layout presets (save, apply, recover)
    requirementIds:
      - UX-CMD-008
    acceptanceCriteria:
      - Given the DM has arranged a custom layout and clicks "Save current
        layout", then the preset appears in the Layouts menu with the chosen
        name.
      - Given two saved presets exist, when the DM applies one, then the widget
        arrangement changes and other Scenes are unaffected.
      - Given the app crashes and the DM reopens, when they open the Layouts
        menu, then "Restore last auto-save" is available with a timestamp not
        older than the last layout change.
      - 'Given a preset references a deleted widget type, when it is applied,
        then the system applies all valid widgets and shows a warning: "Widget
        [name] is no longer available and was skipped."'
    tasks:
      - id: UX-CMD-008-S01-T01
        title: Confirm UI contract, responsive profile behavior, and actor-safety
          implications for UX-CMD-008
        kind: design
      - id: UX-CMD-008-S01-T02
        title: Implement the shared or surface-specific UI behavior for UX-CMD-008
        kind: implementation
      - id: UX-CMD-008-S01-T03
        title: Add automated and manual coverage for UX-CMD-008 acceptance criteria
        kind: test
      - id: UX-CMD-008-S01-T04
        title: Record demo notes and traceability evidence for UX-CMD-008
        kind: demo
  - id: UX-CMD-012-S01
    title: Role-differentiated Command Center views
    requirementIds:
      - UX-CMD-012
    acceptanceCriteria:
      - Given a Player user navigates to the "/" route, then they see their
        player canvas, not the DM dashboard.
      - Given a Player user navigates directly to a DM-only panel URL, then they
        receive a redirect with a toast and no DM-only content is rendered in
        the page.
      - Given an Observer user at the home route, then all interactive controls
        are absent and an "Observer mode" label is visible.
    tasks:
      - id: UX-CMD-012-S01-T01
        title: Confirm UI contract, responsive profile behavior, and actor-safety
          implications for UX-CMD-012
        kind: design
      - id: UX-CMD-012-S01-T02
        title: Implement the shared or surface-specific UI behavior for UX-CMD-012
        kind: implementation
      - id: UX-CMD-012-S01-T03
        title: Add automated and manual coverage for UX-CMD-012 acceptance criteria
        kind: test
      - id: UX-CMD-012-S01-T04
        title: Record demo notes and traceability evidence for UX-CMD-012
        kind: demo
qualityBar:
  - "Product fit: the delivered UI follows the canvas-first command platform
    model and never regresses to a document-list home."
  - "Traceability: every mapped UX requirement is tied to implementation, tests,
    and demo evidence."
  - "Foundations first: design tokens, shared components, platform profiles, and
    accessibility primitives are reused rather than reimplemented per surface."
  - "Actor safety: player and observer routes, search, ARIA, errors, skeletons,
    previews, and command results never leak DM-only content."
  - "Platform parity: Desktop, Tablet, and Mobile expose the same Must-have
    commands through profile-appropriate surfaces and the same processing-core
    commands."
  - "Live-play readiness: hot paths acknowledge within 100 ms, support
    undo/retry where appropriate, and stay glanceable under table pressure."
  - "Accessibility: WCAG 2.2 AA, keyboard parity, reduced motion, touch targets,
    non-color state, and screen-reader QA are part of the acceptance bar."
  - "Production polish: empty/loading/error states, responsive constraints,
    visual hierarchy, motion, and help affordances are complete enough to
    share."
gitWorkflow:
  - Start from `git status --short` and work around unrelated local edits unless
    they block the epic.
  - Use one branch per UX epic and keep commits scoped to that epic plus its
    generated UX workpack evidence.
  - Do not hand-edit generated files under `docs/planning/v2/ux` for status
    changes; use the UX workpack commands.
  - Do not reset, overwrite, or reformat unrelated user changes.
  - Before handoff, run targeted tests plus `pnpm v2:ux-workpack:validate` and
    leave no stale generated UX planning diffs.
statusAutomation:
  - Do not hand-edit generated UX epic packets, `status.yaml`,
    `requirements-index.yaml`, `initiative-map.yaml`, or `parallel-batches.yaml`
    for status changes.
  - Use `pnpm v2:ux-workpack:set-status -- --epic
    UX-CMD-home-scene-and-role-differentiated-dashboard --status active` when
    implementation starts.
  - Create
    `docs/planning/v2/ux/epics/UX-CMD-home-scene-and-role-differentiated-dashboard.completion.md`
    with demo, tests, traceability, gaps, and git evidence before marking
    complete.
  - Use `pnpm v2:ux-workpack:complete -- --epic
    UX-CMD-home-scene-and-role-differentiated-dashboard` to update
    `docs/planning/v2/ux/workpack-state.yaml` and regenerate all derived UX
    planning files together.
  - Run `pnpm v2:ux-workpack:validate` after any status or generation command.
testPlan:
  - Run `pnpm v2:ux-workpack:validate` before handoff.
  - Run targeted unit tests for stores, query shaping, route metadata, component
    state, and command dispatch touched by this epic.
  - Run app tests or Playwright coverage for visible route, profile, keyboard,
    touch, empty/loading/error, and player-safe behavior touched by this epic.
  - Run axe and manual accessibility checks when the epic touches focus,
    landmarks, dialogs, menus, tabs, drag alternatives, live regions, or
    screen-reader output.
demoNotesTemplate:
  - Describe the user-visible path demonstrated on Desktop, Tablet, and Mobile
    where applicable.
  - List the UX requirement IDs and acceptance criteria exercised by the demo.
  - Record actor roles used in the demo, especially DM/player/observer safety
    cases.
  - Record remaining polish, research, or product-decision gaps explicitly.
stopConditions:
  - Stop if the epic needs a product decision that the architecture
    reconciliation epic has not resolved.
  - Stop if a UX requirement conflicts with a functional requirement and the
    conflict has not been raised in docs.
  - Stop if a player-visible route, ARIA label, command result, search result,
    preview, skeleton, or error can reveal hidden DM-only content.
  - Stop if a Must-have action is pointer-only, gesture-only, desktop-only, or
    depends on an optional network/cloud/AI feature.
  - Stop if generated UX workpack validation fails and the cause is not
    understood.
completionEvidence:
  - Targeted tests and profile checks pass.
  - Requirement IDs are traced to implementation, tests, and demo notes.
  - Desktop, Tablet, and Mobile behavior is covered or explicitly scoped with a
    reason.
  - Accessibility, actor-safety, no-leak, reduced-motion, touch-target, and
    keyboard parity evidence is recorded where applicable.
  - Completion file records demo path, tests run, changed files, requirement
    coverage, known gaps, git branch/commit or PR, and final `git status
    --short` output.
  - The UX workpack status is updated with the programmatic complete command
    after completion evidence exists.
completionEvidenceFile: docs/planning/v2/ux/epics/UX-CMD-home-scene-and-role-differentiated-dashboard.completion.md

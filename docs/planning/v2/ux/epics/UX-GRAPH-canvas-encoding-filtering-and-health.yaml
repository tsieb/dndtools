id: UX-GRAPH-canvas-encoding-filtering-and-health
title: Graph Canvas, Encoding, Filtering, and Health
status: complete
approved: true
phase: 08 Campaign and Discovery
productPriority: P2
domain: UX-GRAPH
objective: "Ship a useful graph, not a decorative graph: readable canvas,
  non-color encoding, legend, filters, local mode, clustering, health
  indicators, and sparse/empty states."
requirementIds:
  - UX-GRAPH-001
  - UX-GRAPH-002
  - UX-GRAPH-003
  - UX-GRAPH-004
  - UX-GRAPH-005
  - UX-GRAPH-006
  - UX-GRAPH-008
  - UX-GRAPH-010

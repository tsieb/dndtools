id: UX-MCP-settings-policy-provenance-staged-writes-and-fallback
title: AI/MCP Settings, Policy, Provenance, Staged Writes, and Fallback
status: complete
approved: true
phase: 09 Reliability and Optional Capabilities
productPriority: P1
domain: UX-MCP
objective: Make AI optional, bounded, and reviewable through global disable
  parity, tool config, provenance, staged writes, streaming stop, policy labels,
  actor boundaries, and fallback detection.

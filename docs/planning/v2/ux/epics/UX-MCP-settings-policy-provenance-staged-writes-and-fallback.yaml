parallelSafety:
  fileOwnership:
    - docs/planning/v2/ux/
    - apps/gm/src/lib/gui/ux-mcp/
    - apps/gm/src/routes/
  notes: Parallel execution is safe only with non-overlapping component, route,
    and generated UX workpack ownership; shared shell/component contracts must
    be agreed before implementation.
stories:
  - id: UX-MCP-001-S01
    title: Global AI enable/disable toggle with complete UI parity when off
    requirementIds:
      - UX-MCP-001
    acceptanceCriteria:
      - Given AI is disabled, when the DM edits a note, then no AI trigger icon
        appears in the editor toolbar and Tab-order contains no AI elements.
      - Given AI is disabled, when the DM opens the command palette, then no MCP
        or AI commands appear in the results list.
      - Given AI is disabled, when core workflows (notes, maps, sessions,
        characters, sync, graph, search) are used, then they complete
        successfully with identical output to their pre-AI state.
      - Given AI is re-enabled, when the DM opens the editor, then AI
        affordances reappear within one render cycle (< 200 ms).
    tasks:
      - id: UX-MCP-001-S01-T01
        title: Confirm UI contract, responsive profile behavior, and actor-safety
          implications for UX-MCP-001
        kind: design
      - id: UX-MCP-001-S01-T02
        title: Implement the shared or surface-specific UI behavior for UX-MCP-001
        kind: implementation
      - id: UX-MCP-001-S01-T03
        title: Add automated and manual coverage for UX-MCP-001 acceptance criteria
        kind: test
      - id: UX-MCP-001-S01-T04
        title: Record demo notes and traceability evidence for UX-MCP-001
        kind: demo
  - id: UX-MCP-004-S01
    title: MCP tool-configuration panel anatomy
    requirementIds:
      - UX-MCP-004
    acceptanceCriteria:
      - Given the DM opens Settings → AI & Tools, when the panel renders, then
        all baseline tools are listed as checkboxes with capability badges, and
        connected agents are listed with their current policy mode.
      - Given the DM changes an agent's policy mode, when the agent invokes a
        tool next, then the new policy is enforced (verified in the audit log,
        not just the UI display).
      - Given a new agent connects with no existing policy, when it appears in
        the agent list, then its policy mode is shown as `strict_review`.
      - Given staged changes are pending, when the DM opens Settings → AI &
        Tools, then the pending banner is visible above the agent list.
    tasks:
      - id: UX-MCP-004-S01-T01
        title: Confirm UI contract, responsive profile behavior, and actor-safety
          implications for UX-MCP-004
        kind: design
      - id: UX-MCP-004-S01-T02
        title: Implement the shared or surface-specific UI behavior for UX-MCP-004
        kind: implementation
      - id: UX-MCP-004-S01-T03
        title: Add automated and manual coverage for UX-MCP-004 acceptance criteria
        kind: test
      - id: UX-MCP-004-S01-T04
        title: Record demo notes and traceability evidence for UX-MCP-004
        kind: demo
  - id: UX-MCP-006-S01
    title: AI content provenance badge and detail popover
    requirementIds:
      - UX-MCP-006
    acceptanceCriteria:
      - Given the user accepts an AI-generated paragraph, when the editor
        renders, then a provenance badge is visible in the paragraph margin and
        is focusable via keyboard.
      - Given the user opens the provenance popover, when the popover renders,
        then it shows the tool name, agent identity, context sources, and date —
        with no hidden content exposed.
      - Given the user clicks [Remove badge] and confirms, when the editor
        renders, then the badge is absent and the content is unchanged.
      - Given AI is disabled, when the editor renders, then existing provenance
        badges on prior AI-generated content remain visible (provenance is
        historical record, not AI-dependent).
    tasks:
      - id: UX-MCP-006-S01-T01
        title: Confirm UI contract, responsive profile behavior, and actor-safety
          implications for UX-MCP-006
        kind: design
      - id: UX-MCP-006-S01-T02
        title: Implement the shared or surface-specific UI behavior for UX-MCP-006
        kind: implementation
      - id: UX-MCP-006-S01-T03
        title: Add automated and manual coverage for UX-MCP-006 acceptance criteria
        kind: test
      - id: UX-MCP-006-S01-T04
        title: Record demo notes and traceability evidence for UX-MCP-006
        kind: demo
  - id: UX-MCP-007-S01
    title: Staged-write review panel
    requirementIds:
      - UX-MCP-007
    acceptanceCriteria:
      - Given an AI write tool proposes a new note in `strict_review` mode, when
        the proposal is made, then a staged entry appears in the panel and the
        notification badge shows "1 pending" — with no note created in the
        vault.
      - Given the DM clicks Reject on a staged entry, when the panel re-renders,
        then the entry is absent and no vault state change has occurred.
      - Given the DM approves a staged entry, when the Processing Core validates
        it, and validation fails, then the entry remains in the panel with an
        inline error and the vault is unchanged.
      - Given no staged entries exist, when the panel is open, then the empty
        state is displayed with no "N pending" badge in the nav.
    tasks:
      - id: UX-MCP-007-S01-T01
        title: Confirm UI contract, responsive profile behavior, and actor-safety
          implications for UX-MCP-007
        kind: design
      - id: UX-MCP-007-S01-T02
        title: Implement the shared or surface-specific UI behavior for UX-MCP-007
        kind: implementation
      - id: UX-MCP-007-S01-T03
        title: Add automated and manual coverage for UX-MCP-007 acceptance criteria
        kind: test
      - id: UX-MCP-007-S01-T04
        title: Record demo notes and traceability evidence for UX-MCP-007
        kind: demo
  - id: UX-MCP-009-S01
    title: Streaming feedback and stop control
    requirementIds:
      - UX-MCP-009
    acceptanceCriteria:
      - Given AI generation is streaming, when the user clicks Stop, then
        streaming halts within one rendering frame and the Stop button is
        replaced by [Accept partial] [Discard].
      - Given AI generation is streaming, when the user navigates by keyboard
        only, then pressing Tab reaches the Stop button without requiring a
        mouse hover.
      - Given a tool call has not responded in 30 s, when the timeout elapses,
        then an error card appears with a Retry action and no partial content is
        committed.
    tasks:
      - id: UX-MCP-009-S01-T01
        title: Confirm UI contract, responsive profile behavior, and actor-safety
          implications for UX-MCP-009
        kind: design
      - id: UX-MCP-009-S01-T02
        title: Implement the shared or surface-specific UI behavior for UX-MCP-009
        kind: implementation
      - id: UX-MCP-009-S01-T03
        title: Add automated and manual coverage for UX-MCP-009 acceptance criteria
        kind: test
      - id: UX-MCP-009-S01-T04
        title: Record demo notes and traceability evidence for UX-MCP-009
        kind: demo
  - id: UX-MCP-010-S01
    title: Policy mode labels and human-readable mode descriptions
    requirementIds:
      - UX-MCP-010
    acceptanceCriteria:
      - Given the DM opens the agent policy mode selector, when all options are
        rendered, then each option shows its display label and one-line
        description is visible below the selected option without requiring a
        tooltip hover.
      - Given `trusted_direct` is available as an option, when it is highlighted
        or selected, then the warning chip is visible adjacent to the label.
    tasks:
      - id: UX-MCP-010-S01-T01
        title: Confirm UI contract, responsive profile behavior, and actor-safety
          implications for UX-MCP-010
        kind: design
      - id: UX-MCP-010-S01-T02
        title: Implement the shared or surface-specific UI behavior for UX-MCP-010
        kind: implementation
      - id: UX-MCP-010-S01-T03
        title: Add automated and manual coverage for UX-MCP-010 acceptance criteria
        kind: test
      - id: UX-MCP-010-S01-T04
        title: Record demo notes and traceability evidence for UX-MCP-010
        kind: demo
  - id: UX-MCP-011-S01
    title: AI actor and visibility boundary enforcement in UI
    requirementIds:
      - UX-MCP-011
    acceptanceCriteria:
      - Given a Player opens the editor for their character, when they invoke
        the inline AI suggestion, then the context sources available to the AI
        are limited to their character data and DM-exposed content, as enforced
        by the Processing Core (MCP-004).
      - Given a Player receives an AI error, when the error message is rendered,
        then the message contains no entity names, path fragments, or content
        counts from DM-hidden data.
      - Given an Observer is using the app, when they navigate to any route,
        then no AI trigger or AI suggestion affordance is visible.
      - Given a DM-only semantic bundle is generated, when the output card
        renders in a DM context, then the warning section shows only "N items
        omitted" for hidden content — no hidden entity names or details.
    tasks:
      - id: UX-MCP-011-S01-T01
        title: Confirm UI contract, responsive profile behavior, and actor-safety
          implications for UX-MCP-011
        kind: design
      - id: UX-MCP-011-S01-T02
        title: Implement the shared or surface-specific UI behavior for UX-MCP-011
        kind: implementation
      - id: UX-MCP-011-S01-T03
        title: Add automated and manual coverage for UX-MCP-011 acceptance criteria
        kind: test
      - id: UX-MCP-011-S01-T04
        title: Record demo notes and traceability evidence for UX-MCP-011
        kind: demo
  - id: UX-MCP-012-S01
    title: Local AI capability detection and fallback
    requirementIds:
      - UX-MCP-012
    acceptanceCriteria:
      - Given no AI model is configured, when the user opens the note editor,
        then no AI trigger icon is visible in the toolbar and no tooltip or
        placeholder references "AI unavailable."
      - Given AI is configured but the session recap AI tool fails, when the
        user opens Session → Recap, then a deterministic template is shown and
        the template label does not reference AI.
      - Given no AI is configured, when the user right-clicks selected text in
        the editor, then "Link to entity" appears in the context menu and
        produces the same result as the AI-assisted entity linking flow.
    tasks:
      - id: UX-MCP-012-S01-T01
        title: Confirm UI contract, responsive profile behavior, and actor-safety
          implications for UX-MCP-012
        kind: design
      - id: UX-MCP-012-S01-T02
        title: Implement the shared or surface-specific UI behavior for UX-MCP-012
        kind: implementation
      - id: UX-MCP-012-S01-T03
        title: Add automated and manual coverage for UX-MCP-012 acceptance criteria
        kind: test
      - id: UX-MCP-012-S01-T04
        title: Record demo notes and traceability evidence for UX-MCP-012
        kind: demo
qualityBar:
  - "Product fit: the delivered UI follows the canvas-first command platform
    model and never regresses to a document-list home."
  - "Traceability: every mapped UX requirement is tied to implementation, tests,
    and demo evidence."
  - "Foundations first: design tokens, shared components, platform profiles, and
    accessibility primitives are reused rather than reimplemented per surface."
  - "Actor safety: player and observer routes, search, ARIA, errors, skeletons,
    previews, and command results never leak DM-only content."
  - "Platform parity: Desktop, Tablet, and Mobile expose the same Must-have
    commands through profile-appropriate surfaces and the same processing-core
    commands."
  - "Live-play readiness: hot paths acknowledge within 100 ms, support
    undo/retry where appropriate, and stay glanceable under table pressure."
  - "Accessibility: WCAG 2.2 AA, keyboard parity, reduced motion, touch targets,
    non-color state, and screen-reader QA are part of the acceptance bar."
  - "Production polish: empty/loading/error states, responsive constraints,
    visual hierarchy, motion, and help affordances are complete enough to
    share."
gitWorkflow:
  - Start from `git status --short` and work around unrelated local edits unless
    they block the epic.
  - Use one branch per UX epic and keep commits scoped to that epic plus its
    generated UX workpack evidence.
  - Do not hand-edit generated files under `docs/planning/v2/ux` for status
    changes; use the UX workpack commands.
  - Do not reset, overwrite, or reformat unrelated user changes.
  - Before handoff, run targeted tests plus `pnpm ux-workpack:validate` and
    leave no stale generated UX planning diffs.
statusAutomation:
  - Do not hand-edit generated UX epic packets, `status.yaml`,
    `requirements-index.yaml`, `initiative-map.yaml`, or `parallel-batches.yaml`
    for status changes.
  - Use `pnpm ux-workpack:set-status -- --epic
    UX-MCP-settings-policy-provenance-staged-writes-and-fallback --status
    active` when implementation starts.
  - Create
    `docs/planning/v2/ux/epics/UX-MCP-settings-policy-provenance-staged-writes-and-fallback.completion.md`
    with demo, tests, traceability, gaps, and git evidence before marking
    complete.
  - Use `pnpm ux-workpack:complete -- --epic
    UX-MCP-settings-policy-provenance-staged-writes-and-fallback` to update
    `docs/planning/v2/ux/workpack-state.yaml` and regenerate all derived UX
    planning files together.
  - Run `pnpm ux-workpack:validate` after any status or generation command.
testPlan:
  - Run `pnpm ux-workpack:validate` before handoff.
  - Run targeted unit tests for stores, query shaping, route metadata, component
    state, and command dispatch touched by this epic.
  - Run app tests or Playwright coverage for visible route, profile, keyboard,
    touch, empty/loading/error, and player-safe behavior touched by this epic.
  - Run axe and manual accessibility checks when the epic touches focus,
    landmarks, dialogs, menus, tabs, drag alternatives, live regions, or
    screen-reader output.
demoNotesTemplate:
  - Describe the user-visible path demonstrated on Desktop, Tablet, and Mobile
    where applicable.
  - List the UX requirement IDs and acceptance criteria exercised by the demo.
  - Record actor roles used in the demo, especially DM/player/observer safety
    cases.
  - Record remaining polish, research, or product-decision gaps explicitly.
stopConditions:
  - Stop if the epic needs a product decision that the architecture
    reconciliation epic has not resolved.
  - Stop if a UX requirement conflicts with a functional requirement and the
    conflict has not been raised in docs.
  - Stop if a player-visible route, ARIA label, command result, search result,
    preview, skeleton, or error can reveal hidden DM-only content.
  - Stop if a Must-have action is pointer-only, gesture-only, desktop-only, or
    depends on an optional network/cloud/AI feature.
  - Stop if generated UX workpack validation fails and the cause is not
    understood.
completionEvidence:
  - Targeted tests and profile checks pass.
  - Requirement IDs are traced to implementation, tests, and demo notes.
  - Desktop, Tablet, and Mobile behavior is covered or explicitly scoped with a
    reason.
  - Accessibility, actor-safety, no-leak, reduced-motion, touch-target, and
    keyboard parity evidence is recorded where applicable.
  - Completion file records demo path, tests run, changed files, requirement
    coverage, known gaps, git branch/commit or PR, and final `git status
    --short` output.
  - The UX workpack status is updated with the programmatic complete command
    after completion evidence exists.
completionEvidenceFile: docs/planning/v2/ux/epics/UX-MCP-settings-policy-provenance-staged-writes-and-fallback.completion.md

parallelSafety:
  fileOwnership:
    - docs/planning/v2/ux/
    - apps/gm/src/lib/gui/ux-audio/
    - apps/gm/src/routes/
  notes: Parallel execution is safe only with non-overlapping component, route,
    and generated UX workpack ownership; shared shell/component contracts must
    be agreed before implementation.
stories:
  - id: UX-AUDIO-001-S01
    title: "Now-playing card: persistent, glanceable track identity"
    requirementIds:
      - UX-AUDIO-001
    acceptanceCriteria:
      - Given audio is playing, when the DM views the Command Center from any
        layout position, then the now-playing card shows the track name and
        channel without any click or scroll.
      - Given the track is confirmed delivered to at least one player, when the
        DM reads the now-playing card, then a "Players" badge with green
        indicator is visible.
      - Given no track is playing, when a screen reader user navigates to the
        card, then it announces "No track playing."
      - Given `prefers-reduced-motion` is active, when the track icon's pulse
        animation would fire, then it does not animate.
    tasks:
      - id: UX-AUDIO-001-S01-T01
        title: Confirm UI contract, responsive profile behavior, and actor-safety
          implications for UX-AUDIO-001
        kind: design
      - id: UX-AUDIO-001-S01-T02
        title: Implement the shared or surface-specific UI behavior for UX-AUDIO-001
        kind: implementation
      - id: UX-AUDIO-001-S01-T03
        title: Add automated and manual coverage for UX-AUDIO-001 acceptance criteria
        kind: test
      - id: UX-AUDIO-001-S01-T04
        title: Record demo notes and traceability evidence for UX-AUDIO-001
        kind: demo
  - id: UX-AUDIO-002-S01
    title: "Transport controls: play, pause, stop with safe volume defaults"
    requirementIds:
      - UX-AUDIO-002
    acceptanceCriteria:
      - Given the audio widget is displayed for the first time, when the DM
        opens the volume slider, then the value reads 50%.
      - Given audio is playing and the DM presses Space (keyboard), then audio
        pauses and the Play/Pause button shows ▶ within 100 ms.
      - Given a player's browser has blocked autoplay, when the session syncs an
        audio start event, then the Play/Pause button on the player's client
        shows "Enable audio ▶" in amber, not a normal play state, and no audio
        plays silently.
      - Given the DM changes their master volume to 80%, when they refresh the
        page, then the master volume slider restores to 80% from device-local
        storage without contacting the server.
    tasks:
      - id: UX-AUDIO-002-S01-T01
        title: Confirm UI contract, responsive profile behavior, and actor-safety
          implications for UX-AUDIO-002
        kind: design
      - id: UX-AUDIO-002-S01-T02
        title: Implement the shared or surface-specific UI behavior for UX-AUDIO-002
        kind: implementation
      - id: UX-AUDIO-002-S01-T03
        title: Add automated and manual coverage for UX-AUDIO-002 acceptance criteria
        kind: test
      - id: UX-AUDIO-002-S01-T04
        title: Record demo notes and traceability evidence for UX-AUDIO-002
        kind: demo
  - id: UX-AUDIO-003-S01
    title: "Channel mixer: ambience, music, and SFX with per-channel volume"
    requirementIds:
      - UX-AUDIO-003
    acceptanceCriteria:
      - Given a session with a player connected, when the DM moves the Ambience
        fader to 40%, then the player's Ambience channel volume updates to 40%
        within 1 second.
      - Given the DM mutes the SFX channel, when a player's client receives the
        sync event, then SFX audio is silenced on the player device and the
        player sees the SFX channel as muted.
      - Given a keyboard-only user, when they tab to the Music fader and press
        Shift+↑, then the volume increases by 10%.
      - Given `prefers-reduced-motion` is active, when audio is playing on the
        Ambience channel, then the VU meter shows a static bar at the current
        level and does not animate.
    tasks:
      - id: UX-AUDIO-003-S01-T01
        title: Confirm UI contract, responsive profile behavior, and actor-safety
          implications for UX-AUDIO-003
        kind: design
      - id: UX-AUDIO-003-S01-T02
        title: Implement the shared or surface-specific UI behavior for UX-AUDIO-003
        kind: implementation
      - id: UX-AUDIO-003-S01-T03
        title: Add automated and manual coverage for UX-AUDIO-003 acceptance criteria
        kind: test
      - id: UX-AUDIO-003-S01-T04
        title: Record demo notes and traceability evidence for UX-AUDIO-003
        kind: demo
  - id: UX-AUDIO-008-S01
    title: Session-state sync and "what players hear" indicator
    requirementIds:
      - UX-AUDIO-008
    acceptanceCriteria:
      - Given a player's browser has blocked autoplay, when the DM views the
        now-playing card's Players row, then that player's indicator shows an
        amber dot with "Tap required" text within 2 seconds of the block being
        detected.
      - Given the DM sets a track to "DM monitor only", when a player views
        their session toolbar, then they see no audio playing and the "Players"
        row on the DM side shows all grey dots.
      - Given the DM clicks "Nudge" for a blocked player, then a prompt appears
        on that player's device within 3 seconds; the DM's audio session state
        is unchanged.
      - Given a player taps "Enable audio" on their device, then their dot in
        the DM's Players row updates to green within 2 seconds.
      - Given a screen reader user is a player with autoplay blocked, when the
        "Tap to enable audio" banner appears, then it is announced via
        `role="alert"` and focus moves to the "Enable audio" button.
    tasks:
      - id: UX-AUDIO-008-S01-T01
        title: Confirm UI contract, responsive profile behavior, and actor-safety
          implications for UX-AUDIO-008
        kind: design
      - id: UX-AUDIO-008-S01-T02
        title: Implement the shared or surface-specific UI behavior for UX-AUDIO-008
        kind: implementation
      - id: UX-AUDIO-008-S01-T03
        title: Add automated and manual coverage for UX-AUDIO-008 acceptance criteria
        kind: test
      - id: UX-AUDIO-008-S01-T04
        title: Record demo notes and traceability evidence for UX-AUDIO-008
        kind: demo
  - id: UX-AUDIO-009-S01
    title: "Autoplay policy handling: no silent failure"
    requirementIds:
      - UX-AUDIO-009
    acceptanceCriteria:
      - Given the DM opens the app and the audio context is suspended, when the
        audio widget is visible, then the Play/Pause button shows "Enable audio
        ▶" in amber — not a normal play button or silent state.
      - Given a player receives an audio session event with a suspended audio
        context, then a full-width amber banner appears at the top of their view
        within 1 second, with "Enable ▶" as the first focusable element.
      - Given a player dismisses the banner without enabling, then the DM's
        Players row shows "Audio off" (grey dot) for that player, not "blocked"
        (amber dot).
      - Given the audio context resumes successfully after a user gesture, then
        the "Enable audio" button and banner both disappear and normal transport
        state is shown — no further prompts.
    tasks:
      - id: UX-AUDIO-009-S01-T01
        title: Confirm UI contract, responsive profile behavior, and actor-safety
          implications for UX-AUDIO-009
        kind: design
      - id: UX-AUDIO-009-S01-T02
        title: Implement the shared or surface-specific UI behavior for UX-AUDIO-009
        kind: implementation
      - id: UX-AUDIO-009-S01-T03
        title: Add automated and manual coverage for UX-AUDIO-009 acceptance criteria
        kind: test
      - id: UX-AUDIO-009-S01-T04
        title: Record demo notes and traceability evidence for UX-AUDIO-009
        kind: demo
  - id: UX-AUDIO-012-S01
    title: "Player device-local controls: consent, mute, and volume independence"
    requirementIds:
      - UX-AUDIO-012
    acceptanceCriteria:
      - Given a player reduces their local volume to 30%, when the DM inspects
        session audio state, then the session volume is unchanged and the
        player's channel volume reflects the DM's setting.
      - Given a player clicks "Turn audio off for session", when the DM views
        the Players row, then that player's dot shows "Audio off" (grey), not
        "blocked" (amber).
      - Given a player is muted locally and the DM changes the session track,
        then no audio plays on the player's device, but the "Session is playing"
        read-only field updates to reflect the new track.
      - Given a keyboard user opens the player audio controls popover and
        presses `M`, then the mute state toggles and the `aria-checked`
        attribute on the mute button updates accordingly.
    tasks:
      - id: UX-AUDIO-012-S01-T01
        title: Confirm UI contract, responsive profile behavior, and actor-safety
          implications for UX-AUDIO-012
        kind: design
      - id: UX-AUDIO-012-S01-T02
        title: Implement the shared or surface-specific UI behavior for UX-AUDIO-012
        kind: implementation
      - id: UX-AUDIO-012-S01-T03
        title: Add automated and manual coverage for UX-AUDIO-012 acceptance criteria
        kind: test
      - id: UX-AUDIO-012-S01-T04
        title: Record demo notes and traceability evidence for UX-AUDIO-012
        kind: demo
  - id: UX-AUDIO-014-S01
    title: "Performance safety: audio degradation must not block session commands"
    requirementIds:
      - UX-AUDIO-014
    acceptanceCriteria:
      - Given the Ambience channel has failed repeatedly and the safety limit
        triggers, when the DM views the audio widget, then a non-blocking
        diagnostic strip appears — no modal or blocking dialog is shown.
      - Given audio has been degraded and the DM advances a combat turn, then
        the combat turn advancement completes within its configured
        responsiveness budget (≤100 ms acknowledgment).
      - Given a keyboard user navigates to the diagnostic strip and presses
        Enter on [Retry], then a single retry attempt is made — no loop.
    tasks:
      - id: UX-AUDIO-014-S01-T01
        title: Confirm UI contract, responsive profile behavior, and actor-safety
          implications for UX-AUDIO-014
        kind: design
      - id: UX-AUDIO-014-S01-T02
        title: Implement the shared or surface-specific UI behavior for UX-AUDIO-014
        kind: implementation
      - id: UX-AUDIO-014-S01-T03
        title: Add automated and manual coverage for UX-AUDIO-014 acceptance criteria
        kind: test
      - id: UX-AUDIO-014-S01-T04
        title: Record demo notes and traceability evidence for UX-AUDIO-014
        kind: demo
qualityBar:
  - "Product fit: the delivered UI follows the canvas-first command platform
    model and never regresses to a document-list home."
  - "Traceability: every mapped UX requirement is tied to implementation, tests,
    and demo evidence."
  - "Foundations first: design tokens, shared components, platform profiles, and
    accessibility primitives are reused rather than reimplemented per surface."
  - "Actor safety: player and observer routes, search, ARIA, errors, skeletons,
    previews, and command results never leak DM-only content."
  - "Platform parity: Desktop, Tablet, and Mobile expose the same Must-have
    commands through profile-appropriate surfaces and the same processing-core
    commands."
  - "Live-play readiness: hot paths acknowledge within 100 ms, support
    undo/retry where appropriate, and stay glanceable under table pressure."
  - "Accessibility: WCAG 2.2 AA, keyboard parity, reduced motion, touch targets,
    non-color state, and screen-reader QA are part of the acceptance bar."
  - "Production polish: empty/loading/error states, responsive constraints,
    visual hierarchy, motion, and help affordances are complete enough to
    share."
gitWorkflow:
  - Start from `git status --short` and work around unrelated local edits unless
    they block the epic.
  - Use one branch per UX epic and keep commits scoped to that epic plus its
    generated UX workpack evidence.
  - Do not hand-edit generated files under `docs/planning/v2/ux` for status
    changes; use the UX workpack commands.
  - Do not reset, overwrite, or reformat unrelated user changes.
  - Before handoff, run targeted tests plus `pnpm ux-workpack:validate` and
    leave no stale generated UX planning diffs.
statusAutomation:
  - Do not hand-edit generated UX epic packets, `status.yaml`,
    `requirements-index.yaml`, `initiative-map.yaml`, or `parallel-batches.yaml`
    for status changes.
  - Use `pnpm ux-workpack:set-status -- --epic
    UX-AUDIO-live-controls-player-delivery-and-degradation --status active` when
    implementation starts.
  - Create
    `docs/planning/v2/ux/epics/UX-AUDIO-live-controls-player-delivery-and-degradation.completion.md`
    with demo, tests, traceability, gaps, and git evidence before marking
    complete.
  - Use `pnpm ux-workpack:complete -- --epic
    UX-AUDIO-live-controls-player-delivery-and-degradation` to update
    `docs/planning/v2/ux/workpack-state.yaml` and regenerate all derived UX
    planning files together.
  - Run `pnpm ux-workpack:validate` after any status or generation command.
testPlan:
  - Run `pnpm ux-workpack:validate` before handoff.
  - Run targeted unit tests for stores, query shaping, route metadata, component
    state, and command dispatch touched by this epic.
  - Run app tests or Playwright coverage for visible route, profile, keyboard,
    touch, empty/loading/error, and player-safe behavior touched by this epic.
  - Run axe and manual accessibility checks when the epic touches focus,
    landmarks, dialogs, menus, tabs, drag alternatives, live regions, or
    screen-reader output.
demoNotesTemplate:
  - Describe the user-visible path demonstrated on Desktop, Tablet, and Mobile
    where applicable.
  - List the UX requirement IDs and acceptance criteria exercised by the demo.
  - Record actor roles used in the demo, especially DM/player/observer safety
    cases.
  - Record remaining polish, research, or product-decision gaps explicitly.
stopConditions:
  - Stop if the epic needs a product decision that the architecture
    reconciliation epic has not resolved.
  - Stop if a UX requirement conflicts with a functional requirement and the
    conflict has not been raised in docs.
  - Stop if a player-visible route, ARIA label, command result, search result,
    preview, skeleton, or error can reveal hidden DM-only content.
  - Stop if a Must-have action is pointer-only, gesture-only, desktop-only, or
    depends on an optional network/cloud/AI feature.
  - Stop if generated UX workpack validation fails and the cause is not
    understood.
completionEvidence:
  - Targeted tests and profile checks pass.
  - Requirement IDs are traced to implementation, tests, and demo notes.
  - Desktop, Tablet, and Mobile behavior is covered or explicitly scoped with a
    reason.
  - Accessibility, actor-safety, no-leak, reduced-motion, touch-target, and
    keyboard parity evidence is recorded where applicable.
  - Completion file records demo path, tests run, changed files, requirement
    coverage, known gaps, git branch/commit or PR, and final `git status
    --short` output.
  - The UX workpack status is updated with the programmatic complete command
    after completion evidence exists.

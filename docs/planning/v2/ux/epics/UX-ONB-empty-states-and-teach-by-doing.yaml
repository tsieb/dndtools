id: UX-ONB-empty-states-and-teach-by-doing
title: Empty States and Teach-by-Doing Examples
status: approved
approved: true
phase: 10 Onboarding and Production Polish
productPriority: P1
domain: UX-ONB
objective: Replace blank slices with canonical empty states for Command Center,
  Canvas, Maps, Characters, Knowledge, Graph, and Sessions, including
  interactive teach-by-doing examples.
requirementIds:
  - UX-ONB-009
  - UX-ONB-010

parallelSafety:
  fileOwnership:
    - docs/planning/v2/ux/
    - apps/gm/src/lib/gui/ux-onb/
    - apps/gm/src/routes/
  notes: Parallel execution is safe only with non-overlapping component, route,
    and generated UX workpack ownership; shared shell/component contracts must
    be agreed before implementation.
stories:
  - id: UX-ONB-009-S01
    title: Empty state anatomy (canonical)
    requirementIds:
      - UX-ONB-009
    acceptanceCriteria:
      - Given a surface has zero content, when a user navigates to that surface,
        then the three-part empty-state anatomy is shown.
      - Given the empty state primary CTA is activated, when the action
        completes, then the empty state is replaced by real content.
      - Given demo content exists and has been loaded, when the user navigates
        to the surface, then the secondary "Load demo content" CTA is no longer
        shown.
    tasks:
      - id: UX-ONB-009-S01-T01
        title: Confirm UI contract, responsive profile behavior, and actor-safety
          implications for UX-ONB-009
        kind: design
      - id: UX-ONB-009-S01-T02
        title: Implement the shared or surface-specific UI behavior for UX-ONB-009
        kind: implementation
      - id: UX-ONB-009-S01-T03
        title: Add automated and manual coverage for UX-ONB-009 acceptance criteria
        kind: test
      - id: UX-ONB-009-S01-T04
        title: Record demo notes and traceability evidence for UX-ONB-009
        kind: demo
  - id: UX-ONB-010-S01
    title: Command Center empty state
    requirementIds:
      - UX-ONB-010
    acceptanceCriteria:
      - Given "Blank" preset selected, when Command Center first renders, then
        the empty-state anatomy is shown in the canvas area.
      - Given "Add your first widget" is activated, when the widget library
        opens, then the empty state recedes but remains visible in the
        background canvas.
      - Given one widget is placed, when the widget placement confirms, then the
        empty state is permanently replaced by the canvas content.
    tasks:
      - id: UX-ONB-010-S01-T01
        title: Confirm UI contract, responsive profile behavior, and actor-safety
          implications for UX-ONB-010
        kind: design
      - id: UX-ONB-010-S01-T02
        title: Implement the shared or surface-specific UI behavior for UX-ONB-010
        kind: implementation
      - id: UX-ONB-010-S01-T03
        title: Add automated and manual coverage for UX-ONB-010 acceptance criteria
        kind: test
      - id: UX-ONB-010-S01-T04
        title: Record demo notes and traceability evidence for UX-ONB-010
        kind: demo
  - id: UX-ONB-011-S01
    title: Canvas/Scene empty state
    requirementIds:
      - UX-ONB-011
    acceptanceCriteria:
      - Given a new scene is created, when it first renders, then the
        empty-state anatomy is shown centered on the canvas.
      - Given "Load demo scene" is activated, then a demo scene with three
        sample widgets loads and the empty state is replaced.
    tasks:
      - id: UX-ONB-011-S01-T01
        title: Confirm UI contract, responsive profile behavior, and actor-safety
          implications for UX-ONB-011
        kind: design
      - id: UX-ONB-011-S01-T02
        title: Implement the shared or surface-specific UI behavior for UX-ONB-011
        kind: implementation
      - id: UX-ONB-011-S01-T03
        title: Add automated and manual coverage for UX-ONB-011 acceptance criteria
        kind: test
      - id: UX-ONB-011-S01-T04
        title: Record demo notes and traceability evidence for UX-ONB-011
        kind: demo
  - id: UX-ONB-012-S01
    title: Maps, Characters, Knowledge, Graph, Sessions empty states
    requirementIds:
      - UX-ONB-012
    acceptanceCriteria:
      - Given any listed surface has zero content, when a user navigates to it,
        then the surface-specific empty-state anatomy is shown.
      - Given "Create a map" is activated from the Maps empty state, when the
        map creation flow opens, then the Maps empty state recedes but remains
        in the background.
      - Given the Graph surface is empty, when no "demo content" secondary CTA
        is present, then a user can reach Knowledge via the primary CTA without
        leaving the surface.
    tasks:
      - id: UX-ONB-012-S01-T01
        title: Confirm UI contract, responsive profile behavior, and actor-safety
          implications for UX-ONB-012
        kind: design
      - id: UX-ONB-012-S01-T02
        title: Implement the shared or surface-specific UI behavior for UX-ONB-012
        kind: implementation
      - id: UX-ONB-012-S01-T03
        title: Add automated and manual coverage for UX-ONB-012 acceptance criteria
        kind: test
      - id: UX-ONB-012-S01-T04
        title: Record demo notes and traceability evidence for UX-ONB-012
        kind: demo
  - id: UX-ONB-021-S01
    title: "Teach-by-doing: interactive empty-state examples"
    requirementIds:
      - UX-ONB-021
    acceptanceCriteria:
      - Given the Canvas empty state is shown, when "Try it out" is activated,
        then an example widget appears and the empty-state anatomy is replaced
        by the canvas with the example widget.
      - Given the Maps empty state is shown, when "Try it out" is activated,
        then the map creation flow opens pre-seeded.
      - Given the example widget is visible, when the user dismisses it, then
        the canvas empty state does not reappear (the user has now "used" the
        surface).
    tasks:
      - id: UX-ONB-021-S01-T01
        title: Confirm UI contract, responsive profile behavior, and actor-safety
          implications for UX-ONB-021
        kind: design
      - id: UX-ONB-021-S01-T02
        title: Implement the shared or surface-specific UI behavior for UX-ONB-021
        kind: implementation
      - id: UX-ONB-021-S01-T03
        title: Add automated and manual coverage for UX-ONB-021 acceptance criteria
        kind: test
      - id: UX-ONB-021-S01-T04
        title: Record demo notes and traceability evidence for UX-ONB-021
        kind: demo
qualityBar:
  - "Product fit: the delivered UI follows the canvas-first command platform
    model and never regresses to a document-list home."
  - "Traceability: every mapped UX requirement is tied to implementation, tests,
    and demo evidence."
  - "Foundations first: design tokens, shared components, platform profiles, and
    accessibility primitives are reused rather than reimplemented per surface."
  - "Actor safety: player and observer routes, search, ARIA, errors, skeletons,
    previews, and command results never leak DM-only content."
  - "Platform parity: Desktop, Tablet, and Mobile expose the same Must-have
    commands through profile-appropriate surfaces and the same processing-core
    commands."
  - "Live-play readiness: hot paths acknowledge within 100 ms, support
    undo/retry where appropriate, and stay glanceable under table pressure."
  - "Accessibility: WCAG 2.2 AA, keyboard parity, reduced motion, touch targets,
    non-color state, and screen-reader QA are part of the acceptance bar."
  - "Production polish: empty/loading/error states, responsive constraints,
    visual hierarchy, motion, and help affordances are complete enough to
    share."
gitWorkflow:
  - Start from `git status --short` and work around unrelated local edits unless
    they block the epic.
  - Use one branch per UX epic and keep commits scoped to that epic plus its
    generated UX workpack evidence.
  - Do not hand-edit generated files under `docs/planning/v2/ux` for status
    changes; use the UX workpack commands.
  - Do not reset, overwrite, or reformat unrelated user changes.
  - Before handoff, run targeted tests plus `pnpm ux-workpack:validate` and
    leave no stale generated UX planning diffs.
statusAutomation:
  - Do not hand-edit generated UX epic packets, `status.yaml`,
    `requirements-index.yaml`, `initiative-map.yaml`, or `parallel-batches.yaml`
    for status changes.
  - Use `pnpm ux-workpack:set-status -- --epic
    UX-ONB-empty-states-and-teach-by-doing --status active` when implementation
    starts.
  - Create
    `docs/planning/v2/ux/epics/UX-ONB-empty-states-and-teach-by-doing.completion.md`
    with demo, tests, traceability, gaps, and git evidence before marking
    complete.
  - Use `pnpm ux-workpack:complete -- --epic
    UX-ONB-empty-states-and-teach-by-doing` to update
    `docs/planning/v2/ux/workpack-state.yaml` and regenerate all derived UX
    planning files together.
  - Run `pnpm ux-workpack:validate` after any status or generation command.
testPlan:
  - Run `pnpm ux-workpack:validate` before handoff.
  - Run targeted unit tests for stores, query shaping, route metadata, component
    state, and command dispatch touched by this epic.
  - Run app tests or Playwright coverage for visible route, profile, keyboard,
    touch, empty/loading/error, and player-safe behavior touched by this epic.
  - Run axe and manual accessibility checks when the epic touches focus,
    landmarks, dialogs, menus, tabs, drag alternatives, live regions, or
    screen-reader output.
demoNotesTemplate:
  - Describe the user-visible path demonstrated on Desktop, Tablet, and Mobile
    where applicable.
  - List the UX requirement IDs and acceptance criteria exercised by the demo.
  - Record actor roles used in the demo, especially DM/player/observer safety
    cases.
  - Record remaining polish, research, or product-decision gaps explicitly.
stopConditions:
  - Stop if the epic needs a product decision that the architecture
    reconciliation epic has not resolved.
  - Stop if a UX requirement conflicts with a functional requirement and the
    conflict has not been raised in docs.
  - Stop if a player-visible route, ARIA label, command result, search result,
    preview, skeleton, or error can reveal hidden DM-only content.
  - Stop if a Must-have action is pointer-only, gesture-only, desktop-only, or
    depends on an optional network/cloud/AI feature.
  - Stop if generated UX workpack validation fails and the cause is not
    understood.
completionEvidence:
  - Targeted tests and profile checks pass.
  - Requirement IDs are traced to implementation, tests, and demo notes.
  - Desktop, Tablet, and Mobile behavior is covered or explicitly scoped with a
    reason.
  - Accessibility, actor-safety, no-leak, reduced-motion, touch-target, and
    keyboard parity evidence is recorded where applicable.
  - Completion file records demo path, tests run, changed files, requirement
    coverage, known gaps, git branch/commit or PR, and final `git status
    --short` output.
  - The UX workpack status is updated with the programmatic complete command
    after completion evidence exists.

stories:
  - id: UX-CONTENT-006-S01
    title: Wikilink autocomplete and unresolved-link states
    requirementIds:
      - UX-CONTENT-006
    acceptanceCriteria:
      - Given the user types `[[Drag` in the editor, then within 80 ms a popover
        appears with notes whose titles/aliases fuzzy-match "Drag" from all
        three sources.
      - Given a wikilink target does not exist in the graph, when the note
        renders in the editor, then the link shows an amber dotted underline and
        the "Create" ghost button.
      - Given a previously resolved wikilink target is renamed, when the editor
        re-renders, then the link shows the red broken-link treatment.
    tasks:
      - id: UX-CONTENT-006-S01-T01
        title: Confirm UI contract, responsive profile behavior, and actor-safety
          implications for UX-CONTENT-006
        kind: design
      - id: UX-CONTENT-006-S01-T02
        title: Implement the shared or surface-specific UI behavior for UX-CONTENT-006
        kind: implementation
      - id: UX-CONTENT-006-S01-T03
        title: Add automated and manual coverage for UX-CONTENT-006 acceptance criteria
        kind: test
      - id: UX-CONTENT-006-S01-T04
        title: Record demo notes and traceability evidence for UX-CONTENT-006
        kind: demo
  - id: UX-CONTENT-008-S01
    title: Frontmatter / Vault Object structured form
    requirementIds:
      - UX-CONTENT-008
    acceptanceCriteria:
      - Given a Vault Object with a required `title` field left empty, when the
        user attempts to save, then the `title` field shows an error border and
        message, and the save is blocked.
      - Given the Raw YAML toggle is active and the user edits a property, when
        the user switches back to the form view, then the form reflects the YAML
        change.
      - Given a DND Tools reserved key (`dndtools.visibility`) exists in
        frontmatter, when the Raw YAML view is open, then that key is displayed
        in the read-only "DND Tools metadata" section, not the editable area.
    tasks:
      - id: UX-CONTENT-008-S01-T01
        title: Confirm UI contract, responsive profile behavior, and actor-safety
          implications for UX-CONTENT-008
        kind: design
      - id: UX-CONTENT-008-S01-T02
        title: Implement the shared or surface-specific UI behavior for UX-CONTENT-008
        kind: implementation
      - id: UX-CONTENT-008-S01-T03
        title: Add automated and manual coverage for UX-CONTENT-008 acceptance criteria
        kind: test
      - id: UX-CONTENT-008-S01-T04
        title: Record demo notes and traceability evidence for UX-CONTENT-008
        kind: demo
  - id: UX-CONTENT-009-S01
    title: Wikilink rename propagation workflow
    requirementIds:
      - UX-CONTENT-009
    acceptanceCriteria:
      - Given a note titled "Highmoor" is referenced by `[[Highmoor]]` in 5
        other notes, when the DM renames the note to "Highmoor Keep", then a
        confirmation dialog appears showing "5 link(s) across N note(s)" before
        any write.
      - Given the user clicks "Rename only", then the title changes and
        wikilinks in other notes are not updated (they will show as broken).
      - Given the rename propagates successfully, then a success toast appears
        confirming the count.
    tasks:
      - id: UX-CONTENT-009-S01-T01
        title: Confirm UI contract, responsive profile behavior, and actor-safety
          implications for UX-CONTENT-009
        kind: design
      - id: UX-CONTENT-009-S01-T02
        title: Implement the shared or surface-specific UI behavior for UX-CONTENT-009
        kind: implementation
      - id: UX-CONTENT-009-S01-T03
        title: Add automated and manual coverage for UX-CONTENT-009 acceptance criteria
        kind: test
      - id: UX-CONTENT-009-S01-T04
        title: Record demo notes and traceability evidence for UX-CONTENT-009
        kind: demo
  - id: UX-CONTENT-010-S01
    title: Wikilink disambiguation and backlinks panel
    requirementIds:
      - UX-CONTENT-010
    acceptanceCriteria:
      - Given two notes from different sources both titled "Highmoor", when
        `[[Hig` is typed, then both appear in the autocomplete list with
        distinct source badges and paths.
      - Given a note is referenced by 3 other notes, when the backlinks panel
        opens, then all 3 appear with the source badge and the link-in-context
        excerpt.
      - Given the actor is a player who cannot see one of the 3 backlinking
        notes, when the backlinks panel opens, then only 2 backlinks are shown.
    tasks:
      - id: UX-CONTENT-010-S01-T01
        title: Confirm UI contract, responsive profile behavior, and actor-safety
          implications for UX-CONTENT-010
        kind: design
      - id: UX-CONTENT-010-S01-T02
        title: Implement the shared or surface-specific UI behavior for UX-CONTENT-010
        kind: implementation
      - id: UX-CONTENT-010-S01-T03
        title: Add automated and manual coverage for UX-CONTENT-010 acceptance criteria
        kind: test
      - id: UX-CONTENT-010-S01-T04
        title: Record demo notes and traceability evidence for UX-CONTENT-010
        kind: demo
  - id: UX-CONTENT-019-S01
    title: Calendar-date field picker in content authoring
    requirementIds:
      - UX-CONTENT-019
    acceptanceCriteria:
      - Given a campaign calendar with months Hammer (30 days) and Alturiak (28
        days) is defined, when the DM opens the date picker on a new note, then
        the picker shows the campaign months and days (not Gregorian months).
      - Given no campaign calendar is defined, when the DM opens the date field,
        then an ISO text input appears with an explanatory placeholder.
      - Given a selected campaign date, when the note is rendered in multiple
        surfaces (editor, search result, timeline), then the formatted date
        string is identical across all.
    tasks:
      - id: UX-CONTENT-019-S01-T01
        title: Confirm UI contract, responsive profile behavior, and actor-safety
          implications for UX-CONTENT-019
        kind: design
      - id: UX-CONTENT-019-S01-T02
        title: Implement the shared or surface-specific UI behavior for UX-CONTENT-019
        kind: implementation
      - id: UX-CONTENT-019-S01-T03
        title: Add automated and manual coverage for UX-CONTENT-019 acceptance criteria
        kind: test
      - id: UX-CONTENT-019-S01-T04
        title: Record demo notes and traceability evidence for UX-CONTENT-019
        kind: demo
qualityBar:
  - "Product fit: the delivered UI follows the canvas-first command platform
    model and never regresses to a document-list home."
  - "Traceability: every mapped UX requirement is tied to implementation, tests,
    and demo evidence."
  - "Foundations first: design tokens, shared components, platform profiles, and
    accessibility primitives are reused rather than reimplemented per surface."
  - "Actor safety: player and observer routes, search, ARIA, errors, skeletons,
    previews, and command results never leak DM-only content."
  - "Platform parity: Desktop, Tablet, and Mobile expose the same Must-have
    commands through profile-appropriate surfaces and the same processing-core
    commands."
  - "Live-play readiness: hot paths acknowledge within 100 ms, support
    undo/retry where appropriate, and stay glanceable under table pressure."
  - "Accessibility: WCAG 2.2 AA, keyboard parity, reduced motion, touch targets,
    non-color state, and screen-reader QA are part of the acceptance bar."
  - "Production polish: empty/loading/error states, responsive constraints,
    visual hierarchy, motion, and help affordances are complete enough to
    share."
gitWorkflow:
  - Start from `git status --short` and work around unrelated local edits unless
    they block the epic.
  - Use one branch per UX epic and keep commits scoped to that epic plus its
    generated UX workpack evidence.
  - Do not hand-edit generated files under `docs/planning/v2/ux` for status
    changes; use the UX workpack commands.
  - Do not reset, overwrite, or reformat unrelated user changes.
  - Before handoff, run targeted tests plus `pnpm v2:ux-workpack:validate` and
    leave no stale generated UX planning diffs.
statusAutomation:
  - Do not hand-edit generated UX epic packets, `status.yaml`,
    `requirements-index.yaml`, `initiative-map.yaml`, or `parallel-batches.yaml`
    for status changes.
  - Use `pnpm v2:ux-workpack:set-status -- --epic
    UX-CONTENT-wikilinks-objects-backlinks-and-calendar-fields --status active`
    when implementation starts.
  - Create
    `docs/planning/v2/ux/epics/UX-CONTENT-wikilinks-objects-backlinks-and-calendar-fields.completion.md`
    with demo, tests, traceability, gaps, and git evidence before marking
    complete.
  - Use `pnpm v2:ux-workpack:complete -- --epic
    UX-CONTENT-wikilinks-objects-backlinks-and-calendar-fields` to update
    `docs/planning/v2/ux/workpack-state.yaml` and regenerate all derived UX
    planning files together.
  - Run `pnpm v2:ux-workpack:validate` after any status or generation command.
testPlan:
  - Run `pnpm v2:ux-workpack:validate` before handoff.
  - Run targeted unit tests for stores, query shaping, route metadata, component
    state, and command dispatch touched by this epic.
  - Run app tests or Playwright coverage for visible route, profile, keyboard,
    touch, empty/loading/error, and player-safe behavior touched by this epic.
  - Run axe and manual accessibility checks when the epic touches focus,
    landmarks, dialogs, menus, tabs, drag alternatives, live regions, or
    screen-reader output.
demoNotesTemplate:
  - Describe the user-visible path demonstrated on Desktop, Tablet, and Mobile
    where applicable.
  - List the UX requirement IDs and acceptance criteria exercised by the demo.
  - Record actor roles used in the demo, especially DM/player/observer safety
    cases.
  - Record remaining polish, research, or product-decision gaps explicitly.
stopConditions:
  - Stop if the epic needs a product decision that the architecture
    reconciliation epic has not resolved.
  - Stop if a UX requirement conflicts with a functional requirement and the
    conflict has not been raised in docs.
  - Stop if a player-visible route, ARIA label, command result, search result,
    preview, skeleton, or error can reveal hidden DM-only content.
  - Stop if a Must-have action is pointer-only, gesture-only, desktop-only, or
    depends on an optional network/cloud/AI feature.
  - Stop if generated UX workpack validation fails and the cause is not
    understood.
completionEvidence:
  - Targeted tests and profile checks pass.
  - Requirement IDs are traced to implementation, tests, and demo notes.
  - Desktop, Tablet, and Mobile behavior is covered or explicitly scoped with a
    reason.
  - Accessibility, actor-safety, no-leak, reduced-motion, touch-target, and
    keyboard parity evidence is recorded where applicable.
  - Completion file records demo path, tests run, changed files, requirement
    coverage, known gaps, git branch/commit or PR, and final `git status
    --short` output.
  - The UX workpack status is updated with the programmatic complete command
    after completion evidence exists.

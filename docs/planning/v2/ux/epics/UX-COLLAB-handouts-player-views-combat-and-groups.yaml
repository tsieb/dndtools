parallelSafety:
  fileOwnership:
    - docs/planning/v2/ux/
    - apps/v2/app/src/lib/gui/ux-collab/
    - apps/v2/app/src/routes/
  notes: Parallel execution is safe only with non-overlapping component, route,
    and generated UX workpack ownership; shared shell/component contracts must
    be agreed before implementation.
stories:
  - id: UX-COLLAB-004-S01
    title: "Handout delivery panel: push, track, revoke"
    requirementIds:
      - UX-COLLAB-004
    acceptanceCriteria:
      - Given the DM pushes a handout to Player A, when Player A's device
        receives it, then the DM's tracking view shows "Delivered" for Player A.
      - Given the DM revokes the handout for Player A who is online, when revoke
        is confirmed, then Player A's canvas removes the handout widget.
      - Given the "Grant persistent access" checkbox is unchecked and the
        session ends, when the player reconnects later, then the handout is no
        longer accessible.
      - Given delivery and revocation are both queued while the player is
        offline, when the player reconnects, then replay order determines final
        visibility per COLLAB-013.
    tasks:
      - id: UX-COLLAB-004-S01-T01
        title: Confirm UI contract, responsive profile behavior, and actor-safety
          implications for UX-COLLAB-004
        kind: design
      - id: UX-COLLAB-004-S01-T02
        title: Implement the shared or surface-specific UI behavior for UX-COLLAB-004
        kind: implementation
      - id: UX-COLLAB-004-S01-T03
        title: Add automated and manual coverage for UX-COLLAB-004 acceptance criteria
        kind: test
      - id: UX-COLLAB-004-S01-T04
        title: Record demo notes and traceability evidence for UX-COLLAB-004
        kind: demo
  - id: UX-COLLAB-005-S01
    title: "Shared combat state: filtered visibility overlay"
    requirementIds:
      - UX-COLLAB-005
    acceptanceCriteria:
      - Given Player A has `combat-participant` on their character, when combat
        state updates, then their character's HP stepper is enabled and updates
        in ≤200 ms.
      - Given a hidden enemy is in initiative, when Player A views combat, then
        the hidden combatant is absent from Player A's data stream (not merely
        hidden in UI).
      - Given a player has no grant on an NPC, when they view the NPC row, then
        HP stepper is visible but `aria-disabled="true"` and non-interactive.
    tasks:
      - id: UX-COLLAB-005-S01-T01
        title: Confirm UI contract, responsive profile behavior, and actor-safety
          implications for UX-COLLAB-005
        kind: design
      - id: UX-COLLAB-005-S01-T02
        title: Implement the shared or surface-specific UI behavior for UX-COLLAB-005
        kind: implementation
      - id: UX-COLLAB-005-S01-T03
        title: Add automated and manual coverage for UX-COLLAB-005 acceptance criteria
        kind: test
      - id: UX-COLLAB-005-S01-T04
        title: Record demo notes and traceability evidence for UX-COLLAB-005
        kind: demo
  - id: UX-COLLAB-007-S01
    title: "Player View controller: per-player canvas assignment"
    requirementIds:
      - UX-COLLAB-007
    acceptanceCriteria:
      - Given Player A is connected, when the DM assigns Scene B via the roster,
        then Player A's canvas updates to Scene B within 500 ms.
      - Given a Scene is deleted while assigned to Player A, when the system
        detects the deletion, then the DM sees "Scene unavailable" in the Player
        View row and Player A sees the "Waiting for DM" placeholder.
      - Given a drag-and-drop Scene assignment, when performed on Tablet, then a
        discrete "Assign scene" button alternative achieves the same result.
    tasks:
      - id: UX-COLLAB-007-S01-T01
        title: Confirm UI contract, responsive profile behavior, and actor-safety
          implications for UX-COLLAB-007
        kind: design
      - id: UX-COLLAB-007-S01-T02
        title: Implement the shared or surface-specific UI behavior for UX-COLLAB-007
        kind: implementation
      - id: UX-COLLAB-007-S01-T03
        title: Add automated and manual coverage for UX-COLLAB-007 acceptance criteria
        kind: test
      - id: UX-COLLAB-007-S01-T04
        title: Record demo notes and traceability evidence for UX-COLLAB-007
        kind: demo
  - id: UX-COLLAB-008-S01
    title: "Player Group management: delivery and projection targets"
    requirementIds:
      - UX-COLLAB-008
    acceptanceCriteria:
      - Given the DM creates Group A with Players 1 and 2, when a handout is
        pushed to Group A, then only Players 1 and 2 receive the delivery
        operation.
      - Given Player 3 is added to Group A after a prior handout, when no
        persistent access grant exists, then the prior handout is not delivered
        to Player 3.
      - Given the DM opens the create-group dialog, when the dialog renders,
        then the warning banner about membership-not-permission is visible
        before any other interactive element.
    tasks:
      - id: UX-COLLAB-008-S01-T01
        title: Confirm UI contract, responsive profile behavior, and actor-safety
          implications for UX-COLLAB-008
        kind: design
      - id: UX-COLLAB-008-S01-T02
        title: Implement the shared or surface-specific UI behavior for UX-COLLAB-008
        kind: implementation
      - id: UX-COLLAB-008-S01-T03
        title: Add automated and manual coverage for UX-COLLAB-008 acceptance criteria
        kind: test
      - id: UX-COLLAB-008-S01-T04
        title: Record demo notes and traceability evidence for UX-COLLAB-008
        kind: demo
qualityBar:
  - "Product fit: the delivered UI follows the canvas-first command platform
    model and never regresses to a document-list home."
  - "Traceability: every mapped UX requirement is tied to implementation, tests,
    and demo evidence."
  - "Foundations first: design tokens, shared components, platform profiles, and
    accessibility primitives are reused rather than reimplemented per surface."
  - "Actor safety: player and observer routes, search, ARIA, errors, skeletons,
    previews, and command results never leak DM-only content."
  - "Platform parity: Desktop, Tablet, and Mobile expose the same Must-have
    commands through profile-appropriate surfaces and the same processing-core
    commands."
  - "Live-play readiness: hot paths acknowledge within 100 ms, support
    undo/retry where appropriate, and stay glanceable under table pressure."
  - "Accessibility: WCAG 2.2 AA, keyboard parity, reduced motion, touch targets,
    non-color state, and screen-reader QA are part of the acceptance bar."
  - "Production polish: empty/loading/error states, responsive constraints,
    visual hierarchy, motion, and help affordances are complete enough to
    share."
gitWorkflow:
  - Start from `git status --short` and work around unrelated local edits unless
    they block the epic.
  - Use one branch per UX epic and keep commits scoped to that epic plus its
    generated UX workpack evidence.
  - Do not hand-edit generated files under `docs/planning/v2/ux` for status
    changes; use the UX workpack commands.
  - Do not reset, overwrite, or reformat unrelated user changes.
  - Before handoff, run targeted tests plus `pnpm v2:ux-workpack:validate` and
    leave no stale generated UX planning diffs.
statusAutomation:
  - Do not hand-edit generated UX epic packets, `status.yaml`,
    `requirements-index.yaml`, `initiative-map.yaml`, or `parallel-batches.yaml`
    for status changes.
  - Use `pnpm v2:ux-workpack:set-status -- --epic
    UX-COLLAB-handouts-player-views-combat-and-groups --status active` when
    implementation starts.
  - Create
    `docs/planning/v2/ux/epics/UX-COLLAB-handouts-player-views-combat-and-groups.completion.md`
    with demo, tests, traceability, gaps, and git evidence before marking
    complete.
  - Use `pnpm v2:ux-workpack:complete -- --epic
    UX-COLLAB-handouts-player-views-combat-and-groups` to update
    `docs/planning/v2/ux/workpack-state.yaml` and regenerate all derived UX
    planning files together.
  - Run `pnpm v2:ux-workpack:validate` after any status or generation command.
testPlan:
  - Run `pnpm v2:ux-workpack:validate` before handoff.
  - Run targeted unit tests for stores, query shaping, route metadata, component
    state, and command dispatch touched by this epic.
  - Run app tests or Playwright coverage for visible route, profile, keyboard,
    touch, empty/loading/error, and player-safe behavior touched by this epic.
  - Run axe and manual accessibility checks when the epic touches focus,
    landmarks, dialogs, menus, tabs, drag alternatives, live regions, or
    screen-reader output.
  - Run DM/player/observer no-leak fixtures across DOM, ARIA, command palette,
    search, and previews touched by this epic.
demoNotesTemplate:
  - Describe the user-visible path demonstrated on Desktop, Tablet, and Mobile
    where applicable.
  - List the UX requirement IDs and acceptance criteria exercised by the demo.
  - Record actor roles used in the demo, especially DM/player/observer safety
    cases.
  - Record remaining polish, research, or product-decision gaps explicitly.
stopConditions:
  - Stop if the epic needs a product decision that the architecture
    reconciliation epic has not resolved.
  - Stop if a UX requirement conflicts with a functional requirement and the
    conflict has not been raised in docs.
  - Stop if a player-visible route, ARIA label, command result, search result,
    preview, skeleton, or error can reveal hidden DM-only content.
  - Stop if a Must-have action is pointer-only, gesture-only, desktop-only, or
    depends on an optional network/cloud/AI feature.
  - Stop if generated UX workpack validation fails and the cause is not
    understood.
completionEvidence:
  - Targeted tests and profile checks pass.
  - Requirement IDs are traced to implementation, tests, and demo notes.
  - Desktop, Tablet, and Mobile behavior is covered or explicitly scoped with a
    reason.
  - Accessibility, actor-safety, no-leak, reduced-motion, touch-target, and
    keyboard parity evidence is recorded where applicable.
  - Completion file records demo path, tests run, changed files, requirement
    coverage, known gaps, git branch/commit or PR, and final `git status
    --short` output.
  - The UX workpack status is updated with the programmatic complete command
    after completion evidence exists.

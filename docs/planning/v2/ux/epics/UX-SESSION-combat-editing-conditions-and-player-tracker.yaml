productPriority: P1
domain: UX-SES
objective: Complete combat editing hot paths with HP steppers, conditions,
  concentration, death saves, combatant management, mass/secret combatants, and
  a safe player-visible tracker.
requirementIds:
  - UX-SES-005
  - UX-SES-007
  - UX-SES-008
  - UX-SES-016

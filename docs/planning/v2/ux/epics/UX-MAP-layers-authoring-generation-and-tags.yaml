stories:
  - id: UX-MAP-004-S01
    title: Layer panel layout and row anatomy
    requirementIds:
      - UX-MAP-004
    acceptanceCriteria:
      - Given three layers, when the DM drags layer C above layer A, then the
        layer list reorders immediately and an aria announcement confirms the
        new position.
      - Given `Alt+ArrowUp` is pressed on a focused layer row, when the row is
        not already at position 1, then the row moves up one position and focus
        remains on the row.
      - Given a player opens the layer panel, when the panel renders, then no
        add/delete/reorder controls are visible and only player-visible layers
        appear.
      - Given a filter chip for "fog" is active, when the layer list renders,
        then only fog-type layers are at full opacity; others are dimmed.
    tasks:
      - id: UX-MAP-004-S01-T01
        title: Confirm UI contract, responsive profile behavior, and actor-safety
          implications for UX-MAP-004
        kind: design
      - id: UX-MAP-004-S01-T02
        title: Implement the shared or surface-specific UI behavior for UX-MAP-004
        kind: implementation
      - id: UX-MAP-004-S01-T03
        title: Add automated and manual coverage for UX-MAP-004 acceptance criteria
        kind: test
      - id: UX-MAP-004-S01-T04
        title: Record demo notes and traceability evidence for UX-MAP-004
        kind: demo
  - id: UX-MAP-005-S01
    title: Layer type system and visibility badge matrix
    requirementIds:
      - UX-MAP-005
    acceptanceCriteria:
      - Given a fog-of-war layer, when the layer panel renders, then the row
        shows a charcoal "FOG" badge and a cloud-fog icon within 100 ms.
      - Given a DM-annotations layer, when the panel renders in grayscale
        simulation, then the hatching border is still visible and distinguishes
        the row from other layer types.
    tasks:
      - id: UX-MAP-005-S01-T01
        title: Confirm UI contract, responsive profile behavior, and actor-safety
          implications for UX-MAP-005
        kind: design
      - id: UX-MAP-005-S01-T02
        title: Implement the shared or surface-specific UI behavior for UX-MAP-005
        kind: implementation
      - id: UX-MAP-005-S01-T03
        title: Add automated and manual coverage for UX-MAP-005 acceptance criteria
        kind: test
      - id: UX-MAP-005-S01-T04
        title: Record demo notes and traceability evidence for UX-MAP-005
        kind: demo
  - id: UX-MAP-007-S01
    title: Map drawing and painting tool palette (MAP-003)
    requirementIds:
      - UX-MAP-007
    acceptanceCriteria:
      - Given the brush tool is active, when the options strip renders, then a
        brush-size slider and terrain type picker are visible and no other
        tool's options are shown.
      - Given the DM paints a stroke, when the stroke commits, then `Ctrl+Z` is
        enabled and pressing it removes the stroke exactly (MAP-003 undo
        contract).
      - Given a stroke command fails, when the failure returns, then the stroke
        is rolled back visually and a toast error appears within 500 ms.
      - Given mobile profile, when the map editor opens, then only brush,
        eraser, and undo tools are visible in the bottom strip without
        scrolling.
    tasks:
      - id: UX-MAP-007-S01-T01
        title: Confirm UI contract, responsive profile behavior, and actor-safety
          implications for UX-MAP-007
        kind: design
      - id: UX-MAP-007-S01-T02
        title: Implement the shared or surface-specific UI behavior for UX-MAP-007
        kind: implementation
      - id: UX-MAP-007-S01-T03
        title: Add automated and manual coverage for UX-MAP-007 acceptance criteria
        kind: test
      - id: UX-MAP-007-S01-T04
        title: Record demo notes and traceability evidence for UX-MAP-007
        kind: demo
  - id: UX-MAP-008-S01
    title: Procedural generation UI (MAP-004)
    requirementIds:
      - UX-MAP-008
    acceptanceCriteria:
      - Given seed "crypt-1" and type Dungeon, when the DM generates twice with
        the same parameters, then the resulting layer set is identical (MAP-004
        determinism).
      - Given the DM clicks the dice button, when the seed changes, when the
        preview refreshes within 400 ms debounce, then the preview thumbnail
        updates.
      - Given generation is running, when the progress bar is visible, then the
        phase label updates as each generation phase starts.
      - Given the DM clicks Discard, when the sheet closes, then no layers are
        added to the map.
    tasks:
      - id: UX-MAP-008-S01-T01
        title: Confirm UI contract, responsive profile behavior, and actor-safety
          implications for UX-MAP-008
        kind: design
      - id: UX-MAP-008-S01-T02
        title: Implement the shared or surface-specific UI behavior for UX-MAP-008
        kind: implementation
      - id: UX-MAP-008-S01-T03
        title: Add automated and manual coverage for UX-MAP-008 acceptance criteria
        kind: test
      - id: UX-MAP-008-S01-T04
        title: Record demo notes and traceability evidence for UX-MAP-008
        kind: demo
  - id: UX-MAP-014-S01
    title: Layer tag query UI (MAP-007)
    requirementIds:
      - UX-MAP-014
    acceptanceCriteria:
      - Given layers tagged `region:northern-coast`, when the DM clicks that tag
        chip, then only matching layers appear at full opacity in the layer
        list.
      - Given a player opens the map, when the same query runs, then hidden
        layers with matching tags are absent from the result.
    tasks:
      - id: UX-MAP-014-S01-T01
        title: Confirm UI contract, responsive profile behavior, and actor-safety
          implications for UX-MAP-014
        kind: design
      - id: UX-MAP-014-S01-T02
        title: Implement the shared or surface-specific UI behavior for UX-MAP-014
        kind: implementation
      - id: UX-MAP-014-S01-T03
        title: Add automated and manual coverage for UX-MAP-014 acceptance criteria
        kind: test
      - id: UX-MAP-014-S01-T04
        title: Record demo notes and traceability evidence for UX-MAP-014
        kind: demo
qualityBar:
  - "Product fit: the delivered UI follows the canvas-first command platform
    model and never regresses to a document-list home."
  - "Traceability: every mapped UX requirement is tied to implementation, tests,
    and demo evidence."
  - "Foundations first: design tokens, shared components, platform profiles, and
    accessibility primitives are reused rather than reimplemented per surface."
  - "Actor safety: player and observer routes, search, ARIA, errors, skeletons,
    previews, and command results never leak DM-only content."
  - "Platform parity: Desktop, Tablet, and Mobile expose the same Must-have
    commands through profile-appropriate surfaces and the same processing-core
    commands."
  - "Live-play readiness: hot paths acknowledge within 100 ms, support
    undo/retry where appropriate, and stay glanceable under table pressure."
  - "Accessibility: WCAG 2.2 AA, keyboard parity, reduced motion, touch targets,
    non-color state, and screen-reader QA are part of the acceptance bar."
  - "Production polish: empty/loading/error states, responsive constraints,
    visual hierarchy, motion, and help affordances are complete enough to
    share."
gitWorkflow:
  - Start from `git status --short` and work around unrelated local edits unless
    they block the epic.
  - Use one branch per UX epic and keep commits scoped to that epic plus its
    generated UX workpack evidence.
  - Do not hand-edit generated files under `docs/planning/v2/ux` for status
    changes; use the UX workpack commands.
  - Do not reset, overwrite, or reformat unrelated user changes.
  - Before handoff, run targeted tests plus `pnpm ux-workpack:validate` and
    leave no stale generated UX planning diffs.
statusAutomation:
  - Do not hand-edit generated UX epic packets, `status.yaml`,
    `requirements-index.yaml`, `initiative-map.yaml`, or `parallel-batches.yaml`
    for status changes.
  - Use `pnpm ux-workpack:set-status -- --epic
    UX-MAP-layers-authoring-generation-and-tags --status active` when
    implementation starts.
  - Create
    `docs/planning/v2/ux/epics/UX-MAP-layers-authoring-generation-and-tags.completion.md`
    with demo, tests, traceability, gaps, and git evidence before marking
    complete.
  - Use `pnpm ux-workpack:complete -- --epic
    UX-MAP-layers-authoring-generation-and-tags` to update
    `docs/planning/v2/ux/workpack-state.yaml` and regenerate all derived UX
    planning files together.
  - Run `pnpm ux-workpack:validate` after any status or generation command.
testPlan:
  - Run `pnpm ux-workpack:validate` before handoff.
  - Run targeted unit tests for stores, query shaping, route metadata, component
    state, and command dispatch touched by this epic.
  - Run app tests or Playwright coverage for visible route, profile, keyboard,
    touch, empty/loading/error, and player-safe behavior touched by this epic.
  - Run axe and manual accessibility checks when the epic touches focus,
    landmarks, dialogs, menus, tabs, drag alternatives, live regions, or
    screen-reader output.
demoNotesTemplate:
  - Describe the user-visible path demonstrated on Desktop, Tablet, and Mobile
    where applicable.
  - List the UX requirement IDs and acceptance criteria exercised by the demo.
  - Record actor roles used in the demo, especially DM/player/observer safety
    cases.
  - Record remaining polish, research, or product-decision gaps explicitly.
stopConditions:
  - Stop if the epic needs a product decision that the architecture
    reconciliation epic has not resolved.
  - Stop if a UX requirement conflicts with a functional requirement and the
    conflict has not been raised in docs.
  - Stop if a player-visible route, ARIA label, command result, search result,
    preview, skeleton, or error can reveal hidden DM-only content.
  - Stop if a Must-have action is pointer-only, gesture-only, desktop-only, or
    depends on an optional network/cloud/AI feature.
  - Stop if generated UX workpack validation fails and the cause is not
    understood.
completionEvidence:
  - Targeted tests and profile checks pass.
  - Requirement IDs are traced to implementation, tests, and demo notes.
  - Desktop, Tablet, and Mobile behavior is covered or explicitly scoped with a
    reason.
  - Accessibility, actor-safety, no-leak, reduced-motion, touch-target, and
    keyboard parity evidence is recorded where applicable.
  - Completion file records demo path, tests run, changed files, requirement
    coverage, known gaps, git branch/commit or PR, and final `git status
    --short` output.
  - The UX workpack status is updated with the programmatic complete command
    after completion evidence exists.
completionEvidenceFile: docs/planning/v2/ux/epics/UX-MAP-layers-authoring-generation-and-tags.completion.md

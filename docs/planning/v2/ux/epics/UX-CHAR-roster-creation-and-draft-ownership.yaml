parallelSafety:
  fileOwnership:
    - docs/planning/v2/ux/
    - apps/gm/src/lib/gui/ux-char/
    - apps/gm/src/routes/
  notes: Parallel execution is safe only with non-overlapping component, route,
    and generated UX workpack ownership; shared shell/component contracts must
    be agreed before implementation.
stories:
  - id: UX-CHAR-001-S01
    title: "Quick-create form: minimal, submit-in-30-seconds"
    requirementIds:
      - UX-CHAR-001
    acceptanceCriteria:
      - Given the DM opens quick-create, when the form loads, then Name is
        focused and Kind = NPC, HP = 10, AC = 12, Visibility = "DM only".
      - Given the DM fills Name and tabs through HP/AC with defaults, when they
        press Enter, then the character is created and a success toast appears
        within 500 ms.
      - Given Name is empty, when the DM presses the submit button, then an
        inline error appears and focus moves to Name.
      - Given the DM chooses Kind = "Monster", when they read the submit button,
        then it reads "Create Monster".
    tasks:
      - id: UX-CHAR-001-S01-T01
        title: Confirm UI contract, responsive profile behavior, and actor-safety
          implications for UX-CHAR-001
        kind: design
      - id: UX-CHAR-001-S01-T02
        title: Implement the shared or surface-specific UI behavior for UX-CHAR-001
        kind: implementation
      - id: UX-CHAR-001-S01-T03
        title: Add automated and manual coverage for UX-CHAR-001 acceptance criteria
        kind: test
      - id: UX-CHAR-001-S01-T04
        title: Record demo notes and traceability evidence for UX-CHAR-001
        kind: demo
  - id: UX-CHAR-002-S01
    title: "Creation wizard: step rail, one decision per step"
    requirementIds:
      - UX-CHAR-002
    acceptanceCriteria:
      - Given a player opens their draft, when the wizard loads, then focus
        lands on the first incomplete step's primary input, and the step rail
        shows correct completion state for all prior steps.
      - Given the player completes step 2 (species) and clicks "Continue", then
        step 2 shows a checkmark in the rail, step 3 becomes active, and "Saved
        just now" appears for 3 seconds.
      - Given the player closes the browser mid-wizard, when they reopen, then
        the same step is active with saved values pre-populated.
      - Given the Finalize button is disabled, when the player focuses it, then
        a tooltip reads the list of remaining issues.
      - Given all steps are valid, when the player clicks "Create character",
        then the draft is finalized and the player is redirected to the
        character sheet.
    tasks:
      - id: UX-CHAR-002-S01-T01
        title: Confirm UI contract, responsive profile behavior, and actor-safety
          implications for UX-CHAR-002
        kind: design
      - id: UX-CHAR-002-S01-T02
        title: Implement the shared or surface-specific UI behavior for UX-CHAR-002
        kind: implementation
      - id: UX-CHAR-002-S01-T03
        title: Add automated and manual coverage for UX-CHAR-002 acceptance criteria
        kind: test
      - id: UX-CHAR-002-S01-T04
        title: Record demo notes and traceability evidence for UX-CHAR-002
        kind: demo
  - id: UX-CHAR-011-S01
    title: Party / roster overview
    requirementIds:
      - UX-CHAR-011
    acceptanceCriteria:
      - Given the party has 3 visible members, when the overview renders, then 3
        member cards appear with HP bars.
      - Given a member is at 20% HP, then their HP bar is red and their card has
        a red accent border.
      - Given a DM clicks "Move up" on member 2, then member 2 swaps position
        with member 1.
      - Given an observer views the party overview, then they see "No party
        information available."
      - Given the DM has 3 hidden characters, then the DM sees "3 characters
        hidden from players" and no one else sees this.
    tasks:
      - id: UX-CHAR-011-S01-T01
        title: Confirm UI contract, responsive profile behavior, and actor-safety
          implications for UX-CHAR-011
        kind: design
      - id: UX-CHAR-011-S01-T02
        title: Implement the shared or surface-specific UI behavior for UX-CHAR-011
        kind: implementation
      - id: UX-CHAR-011-S01-T03
        title: Add automated and manual coverage for UX-CHAR-011 acceptance criteria
        kind: test
      - id: UX-CHAR-011-S01-T04
        title: Record demo notes and traceability evidence for UX-CHAR-011
        kind: demo
  - id: UX-CHAR-013-S01
    title: Draft ownership management (DM surface)
    requirementIds:
      - UX-CHAR-013
    acceptanceCriteria:
      - Given an unfinalized draft has Player A as owner, when the DM transfers
        it to Player B and confirms, then Player B can open the draft and Player
        A sees "Draft unavailable."
      - Given the DM clicks Transfer, then a confirmation dialog appears before
        the action is dispatched.
    tasks:
      - id: UX-CHAR-013-S01-T01
        title: Confirm UI contract, responsive profile behavior, and actor-safety
          implications for UX-CHAR-013
        kind: design
      - id: UX-CHAR-013-S01-T02
        title: Implement the shared or surface-specific UI behavior for UX-CHAR-013
        kind: implementation
      - id: UX-CHAR-013-S01-T03
        title: Add automated and manual coverage for UX-CHAR-013 acceptance criteria
        kind: test
      - id: UX-CHAR-013-S01-T04
        title: Record demo notes and traceability evidence for UX-CHAR-013
        kind: demo
qualityBar:
  - "Product fit: the delivered UI follows the canvas-first command platform
    model and never regresses to a document-list home."
  - "Traceability: every mapped UX requirement is tied to implementation, tests,
    and demo evidence."
  - "Foundations first: design tokens, shared components, platform profiles, and
    accessibility primitives are reused rather than reimplemented per surface."
  - "Actor safety: player and observer routes, search, ARIA, errors, skeletons,
    previews, and command results never leak DM-only content."
  - "Platform parity: Desktop, Tablet, and Mobile expose the same Must-have
    commands through profile-appropriate surfaces and the same processing-core
    commands."
  - "Live-play readiness: hot paths acknowledge within 100 ms, support
    undo/retry where appropriate, and stay glanceable under table pressure."
  - "Accessibility: WCAG 2.2 AA, keyboard parity, reduced motion, touch targets,
    non-color state, and screen-reader QA are part of the acceptance bar."
  - "Production polish: empty/loading/error states, responsive constraints,
    visual hierarchy, motion, and help affordances are complete enough to
    share."
gitWorkflow:
  - Start from `git status --short` and work around unrelated local edits unless
    they block the epic.
  - Use one branch per UX epic and keep commits scoped to that epic plus its
    generated UX workpack evidence.
  - Do not hand-edit generated files under `docs/planning/v2/ux` for status
    changes; use the UX workpack commands.
  - Do not reset, overwrite, or reformat unrelated user changes.
  - Before handoff, run targeted tests plus `pnpm ux-workpack:validate` and
    leave no stale generated UX planning diffs.
statusAutomation:
  - Do not hand-edit generated UX epic packets, `status.yaml`,
    `requirements-index.yaml`, `initiative-map.yaml`, or `parallel-batches.yaml`
    for status changes.
  - Use `pnpm ux-workpack:set-status -- --epic
    UX-CHAR-roster-creation-and-draft-ownership --status active` when
    implementation starts.
  - Create
    `docs/planning/v2/ux/epics/UX-CHAR-roster-creation-and-draft-ownership.completion.md`
    with demo, tests, traceability, gaps, and git evidence before marking
    complete.
  - Use `pnpm ux-workpack:complete -- --epic
    UX-CHAR-roster-creation-and-draft-ownership` to update
    `docs/planning/v2/ux/workpack-state.yaml` and regenerate all derived UX
    planning files together.
  - Run `pnpm ux-workpack:validate` after any status or generation command.
testPlan:
  - Run `pnpm ux-workpack:validate` before handoff.
  - Run targeted unit tests for stores, query shaping, route metadata, component
    state, and command dispatch touched by this epic.
  - Run app tests or Playwright coverage for visible route, profile, keyboard,
    touch, empty/loading/error, and player-safe behavior touched by this epic.
  - Run axe and manual accessibility checks when the epic touches focus,
    landmarks, dialogs, menus, tabs, drag alternatives, live regions, or
    screen-reader output.
demoNotesTemplate:
  - Describe the user-visible path demonstrated on Desktop, Tablet, and Mobile
    where applicable.
  - List the UX requirement IDs and acceptance criteria exercised by the demo.
  - Record actor roles used in the demo, especially DM/player/observer safety
    cases.
  - Record remaining polish, research, or product-decision gaps explicitly.
stopConditions:
  - Stop if the epic needs a product decision that the architecture
    reconciliation epic has not resolved.
  - Stop if a UX requirement conflicts with a functional requirement and the
    conflict has not been raised in docs.
  - Stop if a player-visible route, ARIA label, command result, search result,
    preview, skeleton, or error can reveal hidden DM-only content.
  - Stop if a Must-have action is pointer-only, gesture-only, desktop-only, or
    depends on an optional network/cloud/AI feature.
  - Stop if generated UX workpack validation fails and the cause is not
    understood.
completionEvidence:
  - Targeted tests and profile checks pass.
  - Requirement IDs are traced to implementation, tests, and demo notes.
  - Desktop, Tablet, and Mobile behavior is covered or explicitly scoped with a
    reason.
  - Accessibility, actor-safety, no-leak, reduced-motion, touch-target, and
    keyboard parity evidence is recorded where applicable.
  - Completion file records demo path, tests run, changed files, requirement
    coverage, known gaps, git branch/commit or PR, and final `git status
    --short` output.
  - The UX workpack status is updated with the programmatic complete command
    after completion evidence exists.
completionEvidenceFile: docs/planning/v2/ux/epics/UX-CHAR-roster-creation-and-draft-ownership.completion.md

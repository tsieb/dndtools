id: UX-CHAR-roster-creation-and-draft-ownership
title: Character Roster, Creation, and Draft Ownership
status: complete
approved: true
phase: 06 Core Library Workspaces
productPriority: P1
domain: UX-CHAR
objective: Make Characters a primary suite with roster overview, fast DM

parallelSafety:
  fileOwnership:
    - docs/planning/v2/ux/
    - apps/v2/app/src/lib/gui/ux-shell/
    - apps/v2/app/src/routes/
  notes: Parallel execution is safe only with non-overlapping component, route,
    and generated UX workpack ownership; shared shell/component contracts must
    be agreed before implementation.
stories:
  - id: UX-NAV-007-S01
    title: "Breadcrumbs: location-style, second-level and deeper only"
    requirementIds:
      - UX-NAV-007
    acceptanceCriteria:
      - Given the user is at a section root, when the breadcrumb renders, then
        it is absent.
      - Given the user is three levels deep in Knowledge, when the breadcrumb
        renders, then it shows `Knowledge › <parent> › <current>` with
        `aria-current="page"` on the current item.
      - Given Mobile profile and a five-level-deep path, when the breadcrumb
        renders, then it shows only `‹ <immediate parent>` and tapping it opens
        a sheet with the full path.
    tasks:
      - id: UX-NAV-007-S01-T01
        title: Confirm UI contract, responsive profile behavior, and actor-safety
          implications for UX-NAV-007
        kind: design
      - id: UX-NAV-007-S01-T02
        title: Implement the shared or surface-specific UI behavior for UX-NAV-007
        kind: implementation
      - id: UX-NAV-007-S01-T03
        title: Add automated and manual coverage for UX-NAV-007 acceptance criteria
        kind: test
      - id: UX-NAV-007-S01-T04
        title: Record demo notes and traceability evidence for UX-NAV-007
        kind: demo
  - id: UX-NAV-008-S01
    title: Backlinks as navigation
    requirementIds:
      - UX-NAV-008
    acceptanceCriteria:
      - Given a note has 3 backlinks, when the Desktop backlinks panel renders,
        then 3 rows are shown with entity title and excerpt, and each row
        navigates correctly on activation.
      - Given a player session, when backlinks render, then only backlinks from
        player-accessible entities are shown, with the count matching the
        visible set.
      - Given `Alt+B` is pressed on Desktop, when the panel is collapsed, then
        it expands and focus moves to the first backlink row.
    tasks:
      - id: UX-NAV-008-S01-T01
        title: Confirm UI contract, responsive profile behavior, and actor-safety
          implications for UX-NAV-008
        kind: design
      - id: UX-NAV-008-S01-T02
        title: Implement the shared or surface-specific UI behavior for UX-NAV-008
        kind: implementation
      - id: UX-NAV-008-S01-T03
        title: Add automated and manual coverage for UX-NAV-008 acceptance criteria
        kind: test
      - id: UX-NAV-008-S01-T04
        title: Record demo notes and traceability evidence for UX-NAV-008
        kind: demo
  - id: UX-NAV-012-S01
    title: Hash-anchor focus and scroll restoration
    requirementIds:
      - UX-NAV-012
    acceptanceCriteria:
      - Given a URL with `#section-heading`, when navigated to, then the heading
        with that `id` is focused and scrolled into view without the route
        announcer firing.
      - Given the user navigates forward to an article, scrolls down, then
        presses the browser back button, when the previous route renders, then
        scroll position is restored to the saved position.
      - "Given `prefers-reduced-motion: reduce` is active, when hash navigation
        occurs, then the scroll is instant (no smooth animation)."
    tasks:
      - id: UX-NAV-012-S01-T01
        title: Confirm UI contract, responsive profile behavior, and actor-safety
          implications for UX-NAV-012
        kind: design
      - id: UX-NAV-012-S01-T02
        title: Implement the shared or surface-specific UI behavior for UX-NAV-012
        kind: implementation
      - id: UX-NAV-012-S01-T03
        title: Add automated and manual coverage for UX-NAV-012 acceptance criteria
        kind: test
      - id: UX-NAV-012-S01-T04
        title: Record demo notes and traceability evidence for UX-NAV-012
        kind: demo
  - id: UX-NAV-016-S01
    title: Deep-link resolution and player-safe unavailable state
    requirementIds:
      - UX-NAV-016
    acceptanceCriteria:
      - Given a deep link targeting a map with `?x=100&y=200&zoom=1.5`, when
        resolved by an authorized user, then the map view opens at the specified
        viewport coordinates and zoom level.
      - Given a deep link targeting a DM-only note, when resolved by a player,
        then a "Not available" page renders with no reference to the note's
        title or existence.
      - Given a legacy alias URL, when navigated to, then the app redirects to
        the canonical URL with all query params and hash intact, transparently.
    tasks:
      - id: UX-NAV-016-S01-T01
        title: Confirm UI contract, responsive profile behavior, and actor-safety
          implications for UX-NAV-016
        kind: design
      - id: UX-NAV-016-S01-T02
        title: Implement the shared or surface-specific UI behavior for UX-NAV-016
        kind: implementation
      - id: UX-NAV-016-S01-T03
        title: Add automated and manual coverage for UX-NAV-016 acceptance criteria
        kind: test
      - id: UX-NAV-016-S01-T04
        title: Record demo notes and traceability evidence for UX-NAV-016
        kind: demo
  - id: UX-NAV-017-S01
    title: Back/forward navigation and browser history contract
    requirementIds:
      - UX-NAV-017
    acceptanceCriteria:
      - Given the user navigates Section A → Entity X → Section B, when they
        press browser back twice, then they are at Section A (not Entity X
        again, not a blank page).
      - Given the router performs an alias redirect, when the user presses back
        from the canonical page, then they return to the page before the alias
        link (the alias does not appear in history).
      - Given a user types in a search field that updates the URL query string,
        when they press back, then they return to the pre-search state, not step
        through each query string change.
    tasks:
      - id: UX-NAV-017-S01-T01
        title: Confirm UI contract, responsive profile behavior, and actor-safety
          implications for UX-NAV-017
        kind: design
      - id: UX-NAV-017-S01-T02
        title: Implement the shared or surface-specific UI behavior for UX-NAV-017
        kind: implementation
      - id: UX-NAV-017-S01-T03
        title: Add automated and manual coverage for UX-NAV-017 acceptance criteria
        kind: test
      - id: UX-NAV-017-S01-T04
        title: Record demo notes and traceability evidence for UX-NAV-017
        kind: demo
  - id: UX-NAV-020-S01
    title: Legacy route alias management and redirect transparency
    requirementIds:
      - UX-NAV-020
    acceptanceCriteria:
      - Given a legacy URL `/<old-section>/map?poi=abc&x=1&y=2#region-north`,
        when navigated to, then the canonical map URL receives
        `?poi=abc&x=1&y=2` and the `#region-north` hash, and the user sees the
        canonical URL in the address bar without a visible redirect step.
      - Given the route audit gate runs, when any alias is implemented as a full
        component rather than a redirect stub, then the gate fails.
    tasks:
      - id: UX-NAV-020-S01-T01
        title: Confirm UI contract, responsive profile behavior, and actor-safety
          implications for UX-NAV-020
        kind: design
      - id: UX-NAV-020-S01-T02
        title: Implement the shared or surface-specific UI behavior for UX-NAV-020
        kind: implementation
      - id: UX-NAV-020-S01-T03
        title: Add automated and manual coverage for UX-NAV-020 acceptance criteria
        kind: test
      - id: UX-NAV-020-S01-T04
        title: Record demo notes and traceability evidence for UX-NAV-020
        kind: demo
qualityBar:
  - "Product fit: the delivered UI follows the canvas-first command platform
    model and never regresses to a document-list home."
  - "Traceability: every mapped UX requirement is tied to implementation, tests,
    and demo evidence."
  - "Foundations first: design tokens, shared components, platform profiles, and
    accessibility primitives are reused rather than reimplemented per surface."
  - "Actor safety: player and observer routes, search, ARIA, errors, skeletons,
    previews, and command results never leak DM-only content."
  - "Platform parity: Desktop, Tablet, and Mobile expose the same Must-have
    commands through profile-appropriate surfaces and the same processing-core
    commands."
  - "Live-play readiness: hot paths acknowledge within 100 ms, support
    undo/retry where appropriate, and stay glanceable under table pressure."
  - "Accessibility: WCAG 2.2 AA, keyboard parity, reduced motion, touch targets,
    non-color state, and screen-reader QA are part of the acceptance bar."
  - "Production polish: empty/loading/error states, responsive constraints,
    visual hierarchy, motion, and help affordances are complete enough to
    share."
gitWorkflow:
  - Start from `git status --short` and work around unrelated local edits unless
    they block the epic.
  - Use one branch per UX epic and keep commits scoped to that epic plus its
    generated UX workpack evidence.
  - Do not hand-edit generated files under `docs/planning/v2/ux` for status
    changes; use the UX workpack commands.
  - Do not reset, overwrite, or reformat unrelated user changes.
  - Before handoff, run targeted tests plus `pnpm v2:ux-workpack:validate` and
    leave no stale generated UX planning diffs.
statusAutomation:
  - Do not hand-edit generated UX epic packets, `status.yaml`,
    `requirements-index.yaml`, `initiative-map.yaml`, or `parallel-batches.yaml`
    for status changes.
  - Use `pnpm v2:ux-workpack:set-status -- --epic
    UX-SHELL-contextual-navigation-history-and-deep-links --status active` when
    implementation starts.
  - Create
    `docs/planning/v2/ux/epics/UX-SHELL-contextual-navigation-history-and-deep-links.completion.md`
    with demo, tests, traceability, gaps, and git evidence before marking
    complete.
  - Use `pnpm v2:ux-workpack:complete -- --epic
    UX-SHELL-contextual-navigation-history-and-deep-links` to update
    `docs/planning/v2/ux/workpack-state.yaml` and regenerate all derived UX
    planning files together.
  - Run `pnpm v2:ux-workpack:validate` after any status or generation command.
testPlan:
  - Run `pnpm v2:ux-workpack:validate` before handoff.
  - Run targeted unit tests for stores, query shaping, route metadata, component
    state, and command dispatch touched by this epic.
  - Run app tests or Playwright coverage for visible route, profile, keyboard,
    touch, empty/loading/error, and player-safe behavior touched by this epic.
  - Run axe and manual accessibility checks when the epic touches focus,
    landmarks, dialogs, menus, tabs, drag alternatives, live regions, or
    screen-reader output.
demoNotesTemplate:
  - Describe the user-visible path demonstrated on Desktop, Tablet, and Mobile
    where applicable.
  - List the UX requirement IDs and acceptance criteria exercised by the demo.
  - Record actor roles used in the demo, especially DM/player/observer safety
    cases.
  - Record remaining polish, research, or product-decision gaps explicitly.
stopConditions:
  - Stop if the epic needs a product decision that the architecture
    reconciliation epic has not resolved.
  - Stop if a UX requirement conflicts with a functional requirement and the
    conflict has not been raised in docs.
  - Stop if a player-visible route, ARIA label, command result, search result,
    preview, skeleton, or error can reveal hidden DM-only content.
  - Stop if a Must-have action is pointer-only, gesture-only, desktop-only, or
    depends on an optional network/cloud/AI feature.
  - Stop if generated UX workpack validation fails and the cause is not
    understood.
completionEvidence:
  - Targeted tests and profile checks pass.
  - Requirement IDs are traced to implementation, tests, and demo notes.
  - Desktop, Tablet, and Mobile behavior is covered or explicitly scoped with a
    reason.
  - Accessibility, actor-safety, no-leak, reduced-motion, touch-target, and
    keyboard parity evidence is recorded where applicable.
  - Completion file records demo path, tests run, changed files, requirement
    coverage, known gaps, git branch/commit or PR, and final `git status
    --short` output.
  - The UX workpack status is updated with the programmatic complete command
    after completion evidence exists.
completionEvidenceFile: docs/planning/v2/ux/epics/UX-SHELL-contextual-navigation-history-and-deep-links.completion.md

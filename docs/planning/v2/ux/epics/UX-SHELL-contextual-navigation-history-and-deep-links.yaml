phase: 02 Shell and Navigation
productPriority: P0
domain: UX-SHELL
objective: Make breadcrumbs, backlinks, hash focus, scroll restoration, browser
  history, player-safe deep-link fallbacks, and legacy alias transparency
  production-grade.

parallelSafety:
  fileOwnership:
    - docs/planning/v2/ux/
    - apps/gm/src/lib/gui/ux-onb/
    - apps/gm/src/routes/
  notes: Parallel execution is safe only with non-overlapping component, route,
    and generated UX workpack ownership; shared shell/component contracts must
    be agreed before implementation.
stories:
  - id: UX-ONB-001-S01
    title: "First-run wizard: minimal, skippable, resumable"
    requirementIds:
      - UX-ONB-001
    acceptanceCriteria:
      - Given a fresh vault, when the app first opens, then the first-run wizard
        appears with step 1 active and steps 2–5 accessible.
      - Given the user clicks "Skip" on any step after step 1, then the wizard
        advances and the step is marked skipped without blocking further
        progress.
      - Given the user dismisses the wizard mid-flow, then the Command Center
        shows the "Finish setup" banner with remaining steps, and the wizard
        reopens at the first incomplete step when triggered.
      - Given all steps are done or skipped and the user dismisses the banner,
        then the banner no longer appears.
      - Given a player opens the app, then no setup wizard or affordances are
        shown; only the read-only notice is rendered.
    tasks:
      - id: UX-ONB-001-S01-T01
        title: Confirm UI contract, responsive profile behavior, and actor-safety
          implications for UX-ONB-001
        kind: design
      - id: UX-ONB-001-S01-T02
        title: Implement the shared or surface-specific UI behavior for UX-ONB-001
        kind: implementation
      - id: UX-ONB-001-S01-T03
        title: Add automated and manual coverage for UX-ONB-001 acceptance criteria
        kind: test
      - id: UX-ONB-001-S01-T04
        title: Record demo notes and traceability evidence for UX-ONB-001
        kind: demo
  - id: UX-ONB-002-S01
    title: "First-run step model: vault naming"
    requirementIds:
      - UX-ONB-002
    acceptanceCriteria:
      - Given an empty vault-name field, when the user clicks "Create vault,"
        then an inline error appears and the CTA remains disabled.
      - Given a valid vault name, when the user clicks "Create vault," then the
        vault is created, the wizard advances to step 2, and the step 1 dot
        becomes a checkmark.
      - Given special characters in the name, when the user blurs the field,
        then an inline error lists the offending characters.
    tasks:
      - id: UX-ONB-002-S01-T01
        title: Confirm UI contract, responsive profile behavior, and actor-safety
          implications for UX-ONB-002
        kind: design
      - id: UX-ONB-002-S01-T02
        title: Implement the shared or surface-specific UI behavior for UX-ONB-002
        kind: implementation
      - id: UX-ONB-002-S01-T03
        title: Add automated and manual coverage for UX-ONB-002 acceptance criteria
        kind: test
      - id: UX-ONB-002-S01-T04
        title: Record demo notes and traceability evidence for UX-ONB-002
        kind: demo
  - id: UX-ONB-003-S01
    title: "First-run step model: content-source selection"
    requirementIds:
      - UX-ONB-003
    acceptanceCriteria:
      - Given step 2 is shown, when the user clicks "Local files," then only the
        Local card expands; the other two cards remain collapsed.
      - Given Obsidian selected and a directory chosen, when the directory
        picker confirms, then the card shows a success state and the "Next" CTA
        becomes enabled.
      - Given Google Docs selected and OAuth fails, when the error is returned,
        then an inline retry appears within the card without closing the wizard.
      - Given "Skip" is clicked, when step 3 appears, then Local vault is
        configured as the default source with no user action required.
    tasks:
      - id: UX-ONB-003-S01-T01
        title: Confirm UI contract, responsive profile behavior, and actor-safety
          implications for UX-ONB-003
        kind: design
      - id: UX-ONB-003-S01-T02
        title: Implement the shared or surface-specific UI behavior for UX-ONB-003
        kind: implementation
      - id: UX-ONB-003-S01-T03
        title: Add automated and manual coverage for UX-ONB-003 acceptance criteria
        kind: test
      - id: UX-ONB-003-S01-T04
        title: Record demo notes and traceability evidence for UX-ONB-003
        kind: demo
  - id: UX-ONB-004-S01
    title: "First-run step model: starter preset"
    requirementIds:
      - UX-ONB-004
    acceptanceCriteria:
      - Given step 3 is shown, when the user selects "Party of 4" and completes
        the wizard, then the Command Center opens with an initiative tracker, 4
        player-view slots, a note widget, and a map placeholder widget.
      - Given "Skip" is clicked on step 3, when the Command Center opens, then
        it shows the "Blank" layout (no pre-populated widgets).
      - Given "Preview" is clicked on a preset card, when the preview opens,
        then Escape closes it and focus returns to the card.
    tasks:
      - id: UX-ONB-004-S01-T01
        title: Confirm UI contract, responsive profile behavior, and actor-safety
          implications for UX-ONB-004
        kind: design
      - id: UX-ONB-004-S01-T02
        title: Implement the shared or surface-specific UI behavior for UX-ONB-004
        kind: implementation
      - id: UX-ONB-004-S01-T03
        title: Add automated and manual coverage for UX-ONB-004 acceptance criteria
        kind: test
      - id: UX-ONB-004-S01-T04
        title: Record demo notes and traceability evidence for UX-ONB-004
        kind: demo
  - id: UX-ONB-005-S01
    title: "First-run step model: role declaration"
    requirementIds:
      - UX-ONB-005
    acceptanceCriteria:
      - Given the user selects "Player" and completes the wizard, when the app
        opens, then DM-only navigation sections are absent.
      - Given "Skip" is clicked, when the wizard completes, then the DM role is
        applied.
    tasks:
      - id: UX-ONB-005-S01-T01
        title: Confirm UI contract, responsive profile behavior, and actor-safety
          implications for UX-ONB-005
        kind: design
      - id: UX-ONB-005-S01-T02
        title: Implement the shared or surface-specific UI behavior for UX-ONB-005
        kind: implementation
      - id: UX-ONB-005-S01-T03
        title: Add automated and manual coverage for UX-ONB-005 acceptance criteria
        kind: test
      - id: UX-ONB-005-S01-T04
        title: Record demo notes and traceability evidence for UX-ONB-005
        kind: demo
  - id: UX-ONB-006-S01
    title: "First-run step model: invite players"
    requirementIds:
      - UX-ONB-006
    acceptanceCriteria:
      - Given step 5 is shown and the user clicks "Copy," then the URL is in the
        clipboard and the "Link copied!" toast appears.
      - Given "Skip" is clicked, when the Command Center opens, then no
        invitations have been sent.
    tasks:
      - id: UX-ONB-006-S01-T01
        title: Confirm UI contract, responsive profile behavior, and actor-safety
          implications for UX-ONB-006
        kind: design
      - id: UX-ONB-006-S01-T02
        title: Implement the shared or surface-specific UI behavior for UX-ONB-006
        kind: implementation
      - id: UX-ONB-006-S01-T03
        title: Add automated and manual coverage for UX-ONB-006 acceptance criteria
        kind: test
      - id: UX-ONB-006-S01-T04
        title: Record demo notes and traceability evidence for UX-ONB-006
        kind: demo
  - id: UX-ONB-007-S01
    title: DM first-value event definition and shortest path
    requirementIds:
      - UX-ONB-007
    acceptanceCriteria:
      - Given a fresh vault with "Blank" preset, when a user follows the
        shortest path (skip all non-required steps), then the Command Center
        with at least one widget is visible in ≤5 minutes.
      - Given any non-Blank preset is selected, when the wizard completes, then
        the Command Center shows at least one widget without additional user
        action.
      - Given the first-value event occurs, when analytics are enabled, then the
        `onb:dm_first_value` event is emitted with vault ID and elapsed seconds.
    tasks:
      - id: UX-ONB-007-S01-T01
        title: Confirm UI contract, responsive profile behavior, and actor-safety
          implications for UX-ONB-007
        kind: design
      - id: UX-ONB-007-S01-T02
        title: Implement the shared or surface-specific UI behavior for UX-ONB-007
        kind: implementation
      - id: UX-ONB-007-S01-T03
        title: Add automated and manual coverage for UX-ONB-007 acceptance criteria
        kind: test
      - id: UX-ONB-007-S01-T04
        title: Record demo notes and traceability evidence for UX-ONB-007
        kind: demo
  - id: UX-ONB-008-S01
    title: Player join / invite onboarding
    requirementIds:
      - UX-ONB-008
    acceptanceCriteria:
      - Given a player with an existing account clicks an invite link, when they
        are already signed in, then they are taken directly to the joining
        screen without seeing any auth form.
      - Given a new player clicks an invite link, when they complete the 3-field
        create-account form, then they reach the player canvas within 90 seconds
        of clicking the link (excluding intentional reading time).
      - Given no scene is assigned by the DM, when the player joins, then the
        "Waiting for DM" empty state is shown without error.
      - Given the player canvas loads, when it first renders, then the first
        player canvas coach mark fires once.
    tasks:
      - id: UX-ONB-008-S01-T01
        title: Confirm UI contract, responsive profile behavior, and actor-safety
          implications for UX-ONB-008
        kind: design
      - id: UX-ONB-008-S01-T02
        title: Implement the shared or surface-specific UI behavior for UX-ONB-008
        kind: implementation
      - id: UX-ONB-008-S01-T03
        title: Add automated and manual coverage for UX-ONB-008 acceptance criteria
        kind: test
      - id: UX-ONB-008-S01-T04
        title: Record demo notes and traceability evidence for UX-ONB-008
        kind: demo
qualityBar:
  - "Product fit: the delivered UI follows the canvas-first command platform
    model and never regresses to a document-list home."
  - "Traceability: every mapped UX requirement is tied to implementation, tests,
    and demo evidence."
  - "Foundations first: design tokens, shared components, platform profiles, and
    accessibility primitives are reused rather than reimplemented per surface."
  - "Actor safety: player and observer routes, search, ARIA, errors, skeletons,
    previews, and command results never leak DM-only content."
  - "Platform parity: Desktop, Tablet, and Mobile expose the same Must-have
    commands through profile-appropriate surfaces and the same processing-core
    commands."
  - "Live-play readiness: hot paths acknowledge within 100 ms, support
    undo/retry where appropriate, and stay glanceable under table pressure."
  - "Accessibility: WCAG 2.2 AA, keyboard parity, reduced motion, touch targets,
    non-color state, and screen-reader QA are part of the acceptance bar."
  - "Production polish: empty/loading/error states, responsive constraints,
    visual hierarchy, motion, and help affordances are complete enough to
    share."
gitWorkflow:
  - Start from `git status --short` and work around unrelated local edits unless
    they block the epic.
  - Use one branch per UX epic and keep commits scoped to that epic plus its
    generated UX workpack evidence.
  - Do not hand-edit generated files under `docs/planning/v2/ux` for status
    changes; use the UX workpack commands.
  - Do not reset, overwrite, or reformat unrelated user changes.
  - Before handoff, run targeted tests plus `pnpm ux-workpack:validate` and
    leave no stale generated UX planning diffs.
statusAutomation:
  - Do not hand-edit generated UX epic packets, `status.yaml`,
    `requirements-index.yaml`, `initiative-map.yaml`, or `parallel-batches.yaml`
    for status changes.
  - Use `pnpm ux-workpack:set-status -- --epic
    UX-ONB-first-run-role-and-player-join-paths --status active` when
    implementation starts.
  - Create
    `docs/planning/v2/ux/epics/UX-ONB-first-run-role-and-player-join-paths.completion.md`
    with demo, tests, traceability, gaps, and git evidence before marking
    complete.
  - Use `pnpm ux-workpack:complete -- --epic
    UX-ONB-first-run-role-and-player-join-paths` to update
    `docs/planning/v2/ux/workpack-state.yaml` and regenerate all derived UX
    planning files together.
  - Run `pnpm ux-workpack:validate` after any status or generation command.
testPlan:
  - Run `pnpm ux-workpack:validate` before handoff.
  - Run targeted unit tests for stores, query shaping, route metadata, component
    state, and command dispatch touched by this epic.
  - Run app tests or Playwright coverage for visible route, profile, keyboard,
    touch, empty/loading/error, and player-safe behavior touched by this epic.
  - Run axe and manual accessibility checks when the epic touches focus,
    landmarks, dialogs, menus, tabs, drag alternatives, live regions, or
    screen-reader output.
demoNotesTemplate:
  - Describe the user-visible path demonstrated on Desktop, Tablet, and Mobile
    where applicable.
  - List the UX requirement IDs and acceptance criteria exercised by the demo.
  - Record actor roles used in the demo, especially DM/player/observer safety
    cases.
  - Record remaining polish, research, or product-decision gaps explicitly.
stopConditions:
  - Stop if the epic needs a product decision that the architecture
    reconciliation epic has not resolved.
  - Stop if a UX requirement conflicts with a functional requirement and the
    conflict has not been raised in docs.
  - Stop if a player-visible route, ARIA label, command result, search result,
    preview, skeleton, or error can reveal hidden DM-only content.
  - Stop if a Must-have action is pointer-only, gesture-only, desktop-only, or
    depends on an optional network/cloud/AI feature.
  - Stop if generated UX workpack validation fails and the cause is not
    understood.
completionEvidence:
  - Targeted tests and profile checks pass.
  - Requirement IDs are traced to implementation, tests, and demo notes.
  - Desktop, Tablet, and Mobile behavior is covered or explicitly scoped with a
    reason.
  - Accessibility, actor-safety, no-leak, reduced-motion, touch-target, and
    keyboard parity evidence is recorded where applicable.
  - Completion file records demo path, tests run, changed files, requirement
    coverage, known gaps, git branch/commit or PR, and final `git status
    --short` output.
  - The UX workpack status is updated with the programmatic complete command
    after completion evidence exists.

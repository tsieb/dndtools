schemaVersion: 1
kind: ux-ui-remake-epic
id: UX-SRCH-result-layout-filters-freshness-and-saved-searches
title: Search Results, Filters, Freshness, and Saved Searches
status: approved
approved: true
phase: 08 Campaign and Discovery
productPriority: P1
domain: UX-SRCH
objective: "Complete search beyond shell invocation: result row anatomy, type
  grouping, filters, relevance transparency, recent/suggested content,
  zero/error states, freshness, and saved searches."
requirementIds:
  - UX-SRCH-002
  - UX-SRCH-003
  - UX-SRCH-004
  - UX-SRCH-006
  - UX-SRCH-007
  - UX-SRCH-008
  - UX-SRCH-009
  - UX-SRCH-010
sourceDocs:
  - docs/remake-review/ux-requirements/00-overview-and-principles.md
  - docs/remake-review/ux-requirements/10-graph-search-discovery.md
  - docs/remake-review/ux-requirements/16-ideal-gui-architecture.md
  - docs/remake-review/ux-requirements/README.md
expectedAffectedAreas:
  - search result rows
  - filter panel
  - relevance labels
  - index freshness indicators
  - saved searches
dependencies:
  - UX-SHELL-command-surface-and-shortcuts
  - UX-CONTENT-wikilinks-objects-backlinks-and-calendar-fields
  - UX-SHELL-actor-filtered-nav-recents
parallelSafety:
  fileOwnership:
    - docs/planning/v2/ux/
    - apps/v2/app/src/lib/gui/ux-srch/
    - apps/v2/app/src/routes/
  notes: Parallel execution is safe only with non-overlapping component, route,
    and generated UX workpack ownership; shared shell/component contracts must
    be agreed before implementation.
stories:
  - id: UX-SRCH-002-S01
    title: "Result row anatomy: three-line format with match highlighting"
    requirementIds:
      - UX-SRCH-002
    acceptanceCriteria:
      - "Given search returns a result with a body match, when the row renders,
        then all three lines are present: breadcrumb path, title with highlight,
        snippet with highlight."
      - Given the user tabs to a result row, when it receives keyboard focus,
        then the "↵ Open" hint is visible and trailing action buttons are
        focusable with a subsequent Tab.
      - Given a snippet would expose a hidden-content section boundary, when
        returned to a player, then the snippet is truncated before the hidden
        section begins.
    tasks:
      - id: UX-SRCH-002-S01-T01
        title: Confirm UI contract, responsive profile behavior, and actor-safety
          implications for UX-SRCH-002
        kind: design
      - id: UX-SRCH-002-S01-T02
        title: Implement the shared or surface-specific UI behavior for UX-SRCH-002
        kind: implementation
      - id: UX-SRCH-002-S01-T03
        title: Add automated and manual coverage for UX-SRCH-002 acceptance criteria
        kind: test
      - id: UX-SRCH-002-S01-T04
        title: Record demo notes and traceability evidence for UX-SRCH-002
        kind: demo
  - id: UX-SRCH-003-S01
    title: Result grouping by type with collapsible group headers
    requirementIds:
      - UX-SRCH-003
    acceptanceCriteria:
      - Given search returns results across three content types, when the
        overlay renders, then each type has a labeled group header with its
        count.
      - Given a group header is focused and the user presses `←`, when the key
        fires, then the group collapses and the header remains focused.
      - Given a player searches for a term with hidden-content matches, when
        groups render, then the count badge reflects only visible results
        (hidden matches do not inflate the count).
    tasks:
      - id: UX-SRCH-003-S01-T01
        title: Confirm UI contract, responsive profile behavior, and actor-safety
          implications for UX-SRCH-003
        kind: design
      - id: UX-SRCH-003-S01-T02
        title: Implement the shared or surface-specific UI behavior for UX-SRCH-003
        kind: implementation
      - id: UX-SRCH-003-S01-T03
        title: Add automated and manual coverage for UX-SRCH-003 acceptance criteria
        kind: test
      - id: UX-SRCH-003-S01-T04
        title: Record demo notes and traceability evidence for UX-SRCH-003
        kind: demo
  - id: UX-SRCH-004-S01
    title: "Filter controls: chips, operators, and the filter panel"
    requirementIds:
      - UX-SRCH-004
    acceptanceCriteria:
      - 'Given the user selects "Source: Obsidian" in the filter panel, when the
        panel closes, then an "Obsidian ×" chip appears in the scope row and
        results update to Obsidian-only.'
      - 'Given the user types "tag:dragon" in the search field, when input
        processes, then a "Tag: dragon ×" chip appears in the scope row and a
        `tag:dragon` filter is active.'
      - Given a relationship filter would match hidden related content, when a
        player applies it, then hidden relationships do not appear in result
        rows, chips, or result counts.
    tasks:
      - id: UX-SRCH-004-S01-T01
        title: Confirm UI contract, responsive profile behavior, and actor-safety
          implications for UX-SRCH-004
        kind: design
      - id: UX-SRCH-004-S01-T02
        title: Implement the shared or surface-specific UI behavior for UX-SRCH-004
        kind: implementation
      - id: UX-SRCH-004-S01-T03
        title: Add automated and manual coverage for UX-SRCH-004 acceptance criteria
        kind: test
      - id: UX-SRCH-004-S01-T04
        title: Record demo notes and traceability evidence for UX-SRCH-004
        kind: demo
  - id: UX-SRCH-006-S01
    title: Relevance transparency and ranking signals
    requirementIds:
      - UX-SRCH-006
    acceptanceCriteria:
      - Given AI ranking is disabled, when the user searches, then results rank
        in deterministic order and no AI chip appears.
      - Given AI ranking is enabled and produces a different order, when results
        render, then the "AI- ranked ✦" chip is visible in the scope row.
      - Given the user clicks "Use deterministic ranking", when the query
        re-fires, then results return to deterministic order and the AI chip is
        removed.
    tasks:
      - id: UX-SRCH-006-S01-T01
        title: Confirm UI contract, responsive profile behavior, and actor-safety
          implications for UX-SRCH-006
        kind: design
      - id: UX-SRCH-006-S01-T02
        title: Implement the shared or surface-specific UI behavior for UX-SRCH-006
        kind: implementation
      - id: UX-SRCH-006-S01-T03
        title: Add automated and manual coverage for UX-SRCH-006 acceptance criteria
        kind: test
      - id: UX-SRCH-006-S01-T04
        title: Record demo notes and traceability evidence for UX-SRCH-006
        kind: demo
  - id: UX-SRCH-007-S01
    title: Recent items and suggested content pre-query
    requirementIds:
      - UX-SRCH-007
    acceptanceCriteria:
      - Given the user opens global search with an empty query, when the overlay
        renders, then "Recent" and "Suggested" sections are visible with up to 5
        and 3 rows respectively.
      - Given the user types one character, when the input updates, then
        recent/suggested sections disappear and a "Keep typing…" hint appears.
      - Given a player opens global search, when the suggested section renders,
        then all suggested entities are visible to the player (no hidden entity
        appears as a suggestion).
    tasks:
      - id: UX-SRCH-007-S01-T01
        title: Confirm UI contract, responsive profile behavior, and actor-safety
          implications for UX-SRCH-007
        kind: design
      - id: UX-SRCH-007-S01-T02
        title: Implement the shared or surface-specific UI behavior for UX-SRCH-007
        kind: implementation
      - id: UX-SRCH-007-S01-T03
        title: Add automated and manual coverage for UX-SRCH-007 acceptance criteria
        kind: test
      - id: UX-SRCH-007-S01-T04
        title: Record demo notes and traceability evidence for UX-SRCH-007
        kind: demo
  - id: UX-SRCH-008-S01
    title: Zero-result and error states
    requirementIds:
      - UX-SRCH-008
    acceptanceCriteria:
      - Given a query returns no results, when the result area renders, then the
        zero-result state shows the query text in the heading, and a "Clear
        filters" link if filters are active.
      - Given a player queries a term matching only hidden content, when the
        state renders, then it is visually and textually identical to the
        no-matches state (no count differential).
      - Given the search engine errors, when the error state renders, then a
        "Retry" button is present and keyboard-focusable.
    tasks:
      - id: UX-SRCH-008-S01-T01
        title: Confirm UI contract, responsive profile behavior, and actor-safety
          implications for UX-SRCH-008
        kind: design
      - id: UX-SRCH-008-S01-T02
        title: Implement the shared or surface-specific UI behavior for UX-SRCH-008
        kind: implementation
      - id: UX-SRCH-008-S01-T03
        title: Add automated and manual coverage for UX-SRCH-008 acceptance criteria
        kind: test
      - id: UX-SRCH-008-S01-T04
        title: Record demo notes and traceability evidence for UX-SRCH-008
        kind: demo
  - id: UX-SRCH-009-S01
    title: Index freshness and stale-result indicators
    requirementIds:
      - UX-SRCH-009
    acceptanceCriteria:
      - Given a search index source is more than 5 minutes stale, when the user
        opens global search, then the amber stale bar shows that source name and
        elapsed time.
      - Given the user clicks "Refresh now", when reindex completes, then the
        amber bar disappears and results update without closing the overlay.
      - Given a result is from a stale source, when the row renders, then the
        "⟳" stale badge is visible on that row only.
    tasks:
      - id: UX-SRCH-009-S01-T01
        title: Confirm UI contract, responsive profile behavior, and actor-safety
          implications for UX-SRCH-009
        kind: design
      - id: UX-SRCH-009-S01-T02
        title: Implement the shared or surface-specific UI behavior for UX-SRCH-009
        kind: implementation
      - id: UX-SRCH-009-S01-T03
        title: Add automated and manual coverage for UX-SRCH-009 acceptance criteria
        kind: test
      - id: UX-SRCH-009-S01-T04
        title: Record demo notes and traceability evidence for UX-SRCH-009
        kind: demo
  - id: UX-SRCH-010-S01
    title: "Saved searches: creation, pinning, and player-safe display"
    requirementIds:
      - UX-SRCH-010
    acceptanceCriteria:
      - Given the DM saves a search and pins it to Command Center, when Command
        Center loads, then the widget appears with the saved search name and
        result count.
      - Given a player loads the app, when the Command Center renders, then
        DM-saved-search widgets are absent from the DOM.
      - Given the DM deletes a saved search that was pinned, when deletion
        completes, then the widget is removed from Command Center within one
        navigation cycle.
    tasks:
      - id: UX-SRCH-010-S01-T01
        title: Confirm UI contract, responsive profile behavior, and actor-safety
          implications for UX-SRCH-010
        kind: design
      - id: UX-SRCH-010-S01-T02
        title: Implement the shared or surface-specific UI behavior for UX-SRCH-010
        kind: implementation
      - id: UX-SRCH-010-S01-T03
        title: Add automated and manual coverage for UX-SRCH-010 acceptance criteria
        kind: test
      - id: UX-SRCH-010-S01-T04
        title: Record demo notes and traceability evidence for UX-SRCH-010
        kind: demo
qualityBar:
  - "Product fit: the delivered UI follows the canvas-first command platform
    model and never regresses to a document-list home."
  - "Traceability: every mapped UX requirement is tied to implementation, tests,
    and demo evidence."
  - "Foundations first: design tokens, shared components, platform profiles, and
    accessibility primitives are reused rather than reimplemented per surface."
  - "Actor safety: player and observer routes, search, ARIA, errors, skeletons,
    previews, and command results never leak DM-only content."
  - "Platform parity: Desktop, Tablet, and Mobile expose the same Must-have
    commands through profile-appropriate surfaces and the same processing-core
    commands."
  - "Live-play readiness: hot paths acknowledge within 100 ms, support
    undo/retry where appropriate, and stay glanceable under table pressure."
  - "Accessibility: WCAG 2.2 AA, keyboard parity, reduced motion, touch targets,
    non-color state, and screen-reader QA are part of the acceptance bar."
  - "Production polish: empty/loading/error states, responsive constraints,
    visual hierarchy, motion, and help affordances are complete enough to
    share."
gitWorkflow:
  - Start from `git status --short` and work around unrelated local edits unless
    they block the epic.
  - Use one branch per UX epic and keep commits scoped to that epic plus its
    generated UX workpack evidence.
  - Do not hand-edit generated files under `docs/planning/v2/ux` for status
    changes; use the UX workpack commands.
  - Do not reset, overwrite, or reformat unrelated user changes.
  - Before handoff, run targeted tests plus `pnpm v2:ux-workpack:validate` and
    leave no stale generated UX planning diffs.
statusAutomation:
  - Do not hand-edit generated UX epic packets, `status.yaml`,
    `requirements-index.yaml`, `initiative-map.yaml`, or `parallel-batches.yaml`
    for status changes.
  - Use `pnpm v2:ux-workpack:set-status -- --epic
    UX-SRCH-result-layout-filters-freshness-and-saved-searches --status active`
    when implementation starts.
  - Create
    `docs/planning/v2/ux/epics/UX-SRCH-result-layout-filters-freshness-and-saved-searches.completion.md`
    with demo, tests, traceability, gaps, and git evidence before marking
    complete.
  - Use `pnpm v2:ux-workpack:complete -- --epic
    UX-SRCH-result-layout-filters-freshness-and-saved-searches` to update
    `docs/planning/v2/ux/workpack-state.yaml` and regenerate all derived UX
    planning files together.
  - Run `pnpm v2:ux-workpack:validate` after any status or generation command.
testPlan:
  - Run `pnpm v2:ux-workpack:validate` before handoff.
  - Run targeted unit tests for stores, query shaping, route metadata, component
    state, and command dispatch touched by this epic.
  - Run app tests or Playwright coverage for visible route, profile, keyboard,
    touch, empty/loading/error, and player-safe behavior touched by this epic.
  - Run axe and manual accessibility checks when the epic touches focus,
    landmarks, dialogs, menus, tabs, drag alternatives, live regions, or
    screen-reader output.
demoNotesTemplate:
  - Describe the user-visible path demonstrated on Desktop, Tablet, and Mobile
    where applicable.
  - List the UX requirement IDs and acceptance criteria exercised by the demo.
  - Record actor roles used in the demo, especially DM/player/observer safety
    cases.
  - Record remaining polish, research, or product-decision gaps explicitly.
stopConditions:
  - Stop if the epic needs a product decision that the architecture
    reconciliation epic has not resolved.
  - Stop if a UX requirement conflicts with a functional requirement and the
    conflict has not been raised in docs.
  - Stop if a player-visible route, ARIA label, command result, search result,
    preview, skeleton, or error can reveal hidden DM-only content.
  - Stop if a Must-have action is pointer-only, gesture-only, desktop-only, or
    depends on an optional network/cloud/AI feature.
  - Stop if generated UX workpack validation fails and the cause is not
    understood.
completionEvidence:
  - Targeted tests and profile checks pass.
  - Requirement IDs are traced to implementation, tests, and demo notes.
  - Desktop, Tablet, and Mobile behavior is covered or explicitly scoped with a
    reason.
  - Accessibility, actor-safety, no-leak, reduced-motion, touch-target, and
    keyboard parity evidence is recorded where applicable.
  - Completion file records demo path, tests run, changed files, requirement
    coverage, known gaps, git branch/commit or PR, and final `git status
    --short` output.
  - The UX workpack status is updated with the programmatic complete command
    after completion evidence exists.

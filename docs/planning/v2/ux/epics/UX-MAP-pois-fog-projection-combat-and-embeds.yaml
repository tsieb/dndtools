parallelSafety:
  fileOwnership:
    - docs/planning/v2/ux/
    - apps/v2/app/src/lib/gui/ux-map/
    - apps/v2/app/src/routes/
  notes: Parallel execution is safe only with non-overlapping component, route,
    and generated UX workpack ownership; shared shell/component contracts must
    be agreed before implementation.
stories:
  - id: UX-MAP-010-S01
    title: POI placement, editing, and deep-linking (MAP-010, MAP-011, MAP-015)
    requirementIds:
      - UX-MAP-010
    acceptanceCriteria:
      - Given a POI popover is open, when the pointer moves from the marker into
        the popover, then the popover remains open.
      - Given the DM changes a POI from dm-only to player-visible, when the
        command commits, then the player view shows the POI without a map
        reload.
      - Given a player opens a deep link targeting a dm-only POI, when the link
        resolves, then no POI name, coordinates, or category are visible in the
        UI or URL.
      - Given a player-visible POI is on a hidden layer, when the DM views the
        POI detail, then a warning chip is visible below the visibility toggle.
    tasks:
      - id: UX-MAP-010-S01-T01
        title: Confirm UI contract, responsive profile behavior, and actor-safety
          implications for UX-MAP-010
        kind: design
      - id: UX-MAP-010-S01-T02
        title: Implement the shared or surface-specific UI behavior for UX-MAP-010
        kind: implementation
      - id: UX-MAP-010-S01-T03
        title: Add automated and manual coverage for UX-MAP-010 acceptance criteria
        kind: test
      - id: UX-MAP-010-S01-T04
        title: Record demo notes and traceability evidence for UX-MAP-010
        kind: demo
  - id: UX-MAP-011-S01
    title: Fog-of-war controls (MAP-012)
    requirementIds:
      - UX-MAP-011
    acceptanceCriteria:
      - Given the DM is in Reveal mode and drags the rectangle tool, when the
        pointer is released, then the region is revealed on the DM view within
        100 ms and player views update within 1 s.
      - Given the DM clicks "Reveal All," when the confirmation is shown and
        confirmed, then the entire map reveals and the player view updates.
      - Given the DM is offline, when a reveal operation commits locally, then
        the sync status shows "Queued offline" with a count, and the operation
        appears in the player view when reconnected.
      - Given a fog reveal commits, when a screen reader is active, then the
        live region announces the outcome within 500 ms.
    tasks:
      - id: UX-MAP-011-S01-T01
        title: Confirm UI contract, responsive profile behavior, and actor-safety
          implications for UX-MAP-011
        kind: design
      - id: UX-MAP-011-S01-T02
        title: Implement the shared or surface-specific UI behavior for UX-MAP-011
        kind: implementation
      - id: UX-MAP-011-S01-T03
        title: Add automated and manual coverage for UX-MAP-011 acceptance criteria
        kind: test
      - id: UX-MAP-011-S01-T04
        title: Record demo notes and traceability evidence for UX-MAP-011
        kind: demo
  - id: UX-MAP-012-S01
    title: DM-only annotations vs. player-visible overlays (MAP-003, MAP-006, MAP-011)
    requirementIds:
      - UX-MAP-012
    acceptanceCriteria:
      - Given a DM-only annotation layer, when features are drawn on it and
        viewed in grayscale, then the dashed stroke and purple tint are
        distinguishable from player-visible features.
      - Given the DM has "DM annotation" selected in the segmented control, when
        they draw, then the feature is placed on a `dm-only` layer.
      - Given a player opens the same map, when the map renders, then DM-only
        annotation features are absent from the canvas and from the feature
        list.
    tasks:
      - id: UX-MAP-012-S01-T01
        title: Confirm UI contract, responsive profile behavior, and actor-safety
          implications for UX-MAP-012
        kind: design
      - id: UX-MAP-012-S01-T02
        title: Implement the shared or surface-specific UI behavior for UX-MAP-012
        kind: implementation
      - id: UX-MAP-012-S01-T03
        title: Add automated and manual coverage for UX-MAP-012 acceptance criteria
        kind: test
      - id: UX-MAP-012-S01-T04
        title: Record demo notes and traceability evidence for UX-MAP-012
        kind: demo
  - id: UX-MAP-013-S01
    title: Pre-projection consistency check UI (MAP-016)
    requirementIds:
      - UX-MAP-013
    acceptanceCriteria:
      - Given a player-visible POI on a hidden layer, when the consistency check
        runs, then the badge shows "blocked" and the Project button is disabled.
      - Given the DM clicks the conflict badge, when the conflict list opens,
        then each conflict has a "Go to" link and a "Fix" dropdown.
      - Given all conflicts are resolved, when the badge updates, then the
        Project button becomes enabled.
    tasks:
      - id: UX-MAP-013-S01-T01
        title: Confirm UI contract, responsive profile behavior, and actor-safety
          implications for UX-MAP-013
        kind: design
      - id: UX-MAP-013-S01-T02
        title: Implement the shared or surface-specific UI behavior for UX-MAP-013
        kind: implementation
      - id: UX-MAP-013-S01-T03
        title: Add automated and manual coverage for UX-MAP-013 acceptance criteria
        kind: test
      - id: UX-MAP-013-S01-T04
        title: Record demo notes and traceability evidence for UX-MAP-013
        kind: demo
  - id: UX-MAP-015-S01
    title: Combat overlay controls (MAP-014, MAP-019)
    requirementIds:
      - UX-MAP-015
    acceptanceCriteria:
      - Given Grid mode is selected but the grid is not visible, when the DM
        clicks the Grid segment, then an amber tooltip shows "Enable grid?" and
        Grid mode is not applied until confirmed.
      - Given a player is authorized for only their own token, when they attempt
        to drag another token, then the move is rejected and a toast appears.
      - Given an AoE template is placed with a hidden origin token, when the map
        is projected to players, then the hidden origin token's data is absent
        from the player payload.
    tasks:
      - id: UX-MAP-015-S01-T01
        title: Confirm UI contract, responsive profile behavior, and actor-safety
          implications for UX-MAP-015
        kind: design
      - id: UX-MAP-015-S01-T02
        title: Implement the shared or surface-specific UI behavior for UX-MAP-015
        kind: implementation
      - id: UX-MAP-015-S01-T03
        title: Add automated and manual coverage for UX-MAP-015 acceptance criteria
        kind: test
      - id: UX-MAP-015-S01-T04
        title: Record demo notes and traceability evidence for UX-MAP-015
        kind: demo
  - id: UX-MAP-016-S01
    title: Map widget embed on canvas (MAP-008, MAP-018)
    requirementIds:
      - UX-MAP-016
    acceptanceCriteria:
      - Given a player canvas has a map widget configured for a map with DM-only
        layers, when the player views the widget, then DM-only layers, POIs, and
        annotations are absent.
      - Given the map widget asset is unavailable on the current device, when
        the widget renders, then a degraded state shows with the base-layer
        thumbnail and "Asset syncing…" label.
    tasks:
      - id: UX-MAP-016-S01-T01
        title: Confirm UI contract, responsive profile behavior, and actor-safety
          implications for UX-MAP-016
        kind: design
      - id: UX-MAP-016-S01-T02
        title: Implement the shared or surface-specific UI behavior for UX-MAP-016
        kind: implementation
      - id: UX-MAP-016-S01-T03
        title: Add automated and manual coverage for UX-MAP-016 acceptance criteria
        kind: test
      - id: UX-MAP-016-S01-T04
        title: Record demo notes and traceability evidence for UX-MAP-016
        kind: demo
  - id: UX-MAP-017-S01
    title: Route drawing and measurement UI (MAP-013)
    requirementIds:
      - UX-MAP-017
    acceptanceCriteria:
      - Given a route with a waypoint, when the pointer is over the waypoint
        delete button and pointerdown fires, then the waypoint is deleted and no
        new waypoint is placed at that position.
      - Given a route with map scale set, when a waypoint is added, then
        distance and travel time update within 200 ms.
    tasks:
      - id: UX-MAP-017-S01-T01
        title: Confirm UI contract, responsive profile behavior, and actor-safety
          implications for UX-MAP-017
        kind: design
      - id: UX-MAP-017-S01-T02
        title: Implement the shared or surface-specific UI behavior for UX-MAP-017
        kind: implementation
      - id: UX-MAP-017-S01-T03
        title: Add automated and manual coverage for UX-MAP-017 acceptance criteria
        kind: test
      - id: UX-MAP-017-S01-T04
        title: Record demo notes and traceability evidence for UX-MAP-017
        kind: demo
qualityBar:
  - "Product fit: the delivered UI follows the canvas-first command platform
    model and never regresses to a document-list home."
  - "Traceability: every mapped UX requirement is tied to implementation, tests,
    and demo evidence."
  - "Foundations first: design tokens, shared components, platform profiles, and
    accessibility primitives are reused rather than reimplemented per surface."
  - "Actor safety: player and observer routes, search, ARIA, errors, skeletons,
    previews, and command results never leak DM-only content."
  - "Platform parity: Desktop, Tablet, and Mobile expose the same Must-have
    commands through profile-appropriate surfaces and the same processing-core
    commands."
  - "Live-play readiness: hot paths acknowledge within 100 ms, support
    undo/retry where appropriate, and stay glanceable under table pressure."
  - "Accessibility: WCAG 2.2 AA, keyboard parity, reduced motion, touch targets,
    non-color state, and screen-reader QA are part of the acceptance bar."
  - "Production polish: empty/loading/error states, responsive constraints,
    visual hierarchy, motion, and help affordances are complete enough to
    share."
gitWorkflow:
  - Start from `git status --short` and work around unrelated local edits unless
    they block the epic.
  - Use one branch per UX epic and keep commits scoped to that epic plus its
    generated UX workpack evidence.
  - Do not hand-edit generated files under `docs/planning/v2/ux` for status
    changes; use the UX workpack commands.
  - Do not reset, overwrite, or reformat unrelated user changes.
  - Before handoff, run targeted tests plus `pnpm v2:ux-workpack:validate` and
    leave no stale generated UX planning diffs.
statusAutomation:
  - Do not hand-edit generated UX epic packets, `status.yaml`,
    `requirements-index.yaml`, `initiative-map.yaml`, or `parallel-batches.yaml`
    for status changes.
  - Use `pnpm v2:ux-workpack:set-status -- --epic
    UX-MAP-pois-fog-projection-combat-and-embeds --status active` when
    implementation starts.
  - Create
    `docs/planning/v2/ux/epics/UX-MAP-pois-fog-projection-combat-and-embeds.completion.md`
    with demo, tests, traceability, gaps, and git evidence before marking
    complete.
  - Use `pnpm v2:ux-workpack:complete -- --epic
    UX-MAP-pois-fog-projection-combat-and-embeds` to update
    `docs/planning/v2/ux/workpack-state.yaml` and regenerate all derived UX
    planning files together.
  - Run `pnpm v2:ux-workpack:validate` after any status or generation command.
testPlan:
  - Run `pnpm v2:ux-workpack:validate` before handoff.
  - Run targeted unit tests for stores, query shaping, route metadata, component
    state, and command dispatch touched by this epic.
  - Run app tests or Playwright coverage for visible route, profile, keyboard,
    touch, empty/loading/error, and player-safe behavior touched by this epic.
  - Run axe and manual accessibility checks when the epic touches focus,
    landmarks, dialogs, menus, tabs, drag alternatives, live regions, or
    screen-reader output.
demoNotesTemplate:
  - Describe the user-visible path demonstrated on Desktop, Tablet, and Mobile
    where applicable.
  - List the UX requirement IDs and acceptance criteria exercised by the demo.
  - Record actor roles used in the demo, especially DM/player/observer safety
    cases.
  - Record remaining polish, research, or product-decision gaps explicitly.
stopConditions:
  - Stop if the epic needs a product decision that the architecture
    reconciliation epic has not resolved.
  - Stop if a UX requirement conflicts with a functional requirement and the
    conflict has not been raised in docs.
  - Stop if a player-visible route, ARIA label, command result, search result,
    preview, skeleton, or error can reveal hidden DM-only content.
  - Stop if a Must-have action is pointer-only, gesture-only, desktop-only, or
    depends on an optional network/cloud/AI feature.
  - Stop if generated UX workpack validation fails and the cause is not
    understood.
completionEvidence:
  - Targeted tests and profile checks pass.
  - Requirement IDs are traced to implementation, tests, and demo notes.
  - Desktop, Tablet, and Mobile behavior is covered or explicitly scoped with a
    reason.
  - Accessibility, actor-safety, no-leak, reduced-motion, touch-target, and
    keyboard parity evidence is recorded where applicable.
  - Completion file records demo path, tests run, changed files, requirement
    coverage, known gaps, git branch/commit or PR, and final `git status
    --short` output.
  - The UX workpack status is updated with the programmatic complete command
    after completion evidence exists.

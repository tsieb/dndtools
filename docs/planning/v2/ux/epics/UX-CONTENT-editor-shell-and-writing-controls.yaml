parallelSafety:
  fileOwnership:
    - docs/planning/v2/ux/
    - apps/gm/src/lib/gui/ux-content/
    - apps/gm/src/routes/
  notes: Parallel execution is safe only with non-overlapping component, route,
    and generated UX workpack ownership; shared shell/component contracts must
    be agreed before implementation.
stories:
  - id: UX-CONTENT-001-S01
    title: Note editor writing area layout
    requirementIds:
      - UX-CONTENT-001
    acceptanceCriteria:
      - Given a desktop window wider than 1400 px, when a note is open, then the
        prose column is no wider than 720 px and is horizontally centered.
      - Given the user changes browser base font to 20 px, when the editor
        renders, then the column remains in em/rem units and reflows without
        horizontal scroll.
      - Given Mobile profile (<600 px), when a note is open, then horizontal
        padding is ≥16 px and no content is clipped.
    tasks:
      - id: UX-CONTENT-001-S01-T01
        title: Confirm UI contract, responsive profile behavior, and actor-safety
          implications for UX-CONTENT-001
        kind: design
      - id: UX-CONTENT-001-S01-T02
        title: Implement the shared or surface-specific UI behavior for UX-CONTENT-001
        kind: implementation
      - id: UX-CONTENT-001-S01-T03
        title: Add automated and manual coverage for UX-CONTENT-001 acceptance criteria
        kind: test
      - id: UX-CONTENT-001-S01-T04
        title: Record demo notes and traceability evidence for UX-CONTENT-001
        kind: demo
  - id: UX-CONTENT-002-S01
    title: Markdown toolbar (primary six + overflow)
    requirementIds:
      - UX-CONTENT-002
    acceptanceCriteria:
      - Given the editor has a text selection, when the user presses Ctrl+B,
        then the selected text is bolded and the Bold button shows
        `aria-pressed="true"`.
      - Given the toolbar is focused, when the user presses Right arrow
        repeatedly, then focus moves through each button and wraps; pressing
        Enter on a focused button applies the format.
      - Given Mobile profile with the virtual keyboard open, when the editor is
        active, then the toolbar is visible above the keyboard without any
        button being clipped.
    tasks:
      - id: UX-CONTENT-002-S01-T01
        title: Confirm UI contract, responsive profile behavior, and actor-safety
          implications for UX-CONTENT-002
        kind: design
      - id: UX-CONTENT-002-S01-T02
        title: Implement the shared or surface-specific UI behavior for UX-CONTENT-002
        kind: implementation
      - id: UX-CONTENT-002-S01-T03
        title: Add automated and manual coverage for UX-CONTENT-002 acceptance criteria
        kind: test
      - id: UX-CONTENT-002-S01-T04
        title: Record demo notes and traceability evidence for UX-CONTENT-002
        kind: demo
  - id: UX-CONTENT-003-S01
    title: Slash-command insert menu
    requirementIds:
      - UX-CONTENT-003
    acceptanceCriteria:
      - Given an empty line in the editor, when the user types `/`, then the
        insert menu opens within 80 ms showing all block-type groups.
      - Given the insert menu is open and the user types "wikil", then only
        wikilink-related items remain and the first is highlighted.
      - Given Mobile profile, when the user taps the `+` floating button, then
        the insert menu opens as a bottom sheet with the same item set.
    tasks:
      - id: UX-CONTENT-003-S01-T01
        title: Confirm UI contract, responsive profile behavior, and actor-safety
          implications for UX-CONTENT-003
        kind: design
      - id: UX-CONTENT-003-S01-T02
        title: Implement the shared or surface-specific UI behavior for UX-CONTENT-003
        kind: implementation
      - id: UX-CONTENT-003-S01-T03
        title: Add automated and manual coverage for UX-CONTENT-003 acceptance criteria
        kind: test
      - id: UX-CONTENT-003-S01-T04
        title: Record demo notes and traceability evidence for UX-CONTENT-003
        kind: demo
  - id: UX-CONTENT-004-S01
    title: Autosave status chip and failure recovery
    requirementIds:
      - UX-CONTENT-004
    acceptanceCriteria:
      - Given the user types content and stops for 2 s, when autosave runs, then
        the chip transitions from `Saved` to `Saving…` and back to `Saved`
        within the save round-trip.
      - Given the network is offline, when the user types content, then the chip
        shows "Autosave paused — offline" and the note body is preserved
        locally.
      - Given autosave fails with an error, when the chip shows `Save failed`,
        then clicking/tapping the chip triggers an immediate retry and announces
        the new state via `aria-live`.
    tasks:
      - id: UX-CONTENT-004-S01-T01
        title: Confirm UI contract, responsive profile behavior, and actor-safety
          implications for UX-CONTENT-004
        kind: design
      - id: UX-CONTENT-004-S01-T02
        title: Implement the shared or surface-specific UI behavior for UX-CONTENT-004
        kind: implementation
      - id: UX-CONTENT-004-S01-T03
        title: Add automated and manual coverage for UX-CONTENT-004 acceptance criteria
        kind: test
      - id: UX-CONTENT-004-S01-T04
        title: Record demo notes and traceability evidence for UX-CONTENT-004
        kind: demo
  - id: UX-CONTENT-005-S01
    title: Split-pane preview with synced scroll
    requirementIds:
      - UX-CONTENT-005
    acceptanceCriteria:
      - Given split-pane mode is active, when the user scrolls the editor to an
        H2 heading, then the preview pane scrolls to the same heading within 80
        ms of scroll end.
      - Given Mobile profile, when the user taps "Preview", then a full-screen
        rendered preview opens; pressing the back affordance returns to the
        editor.
      - Given the preview pane is visible, when a hidden section exists in the
        note, then the preview pane does not render that section's content.
    tasks:
      - id: UX-CONTENT-005-S01-T01
        title: Confirm UI contract, responsive profile behavior, and actor-safety
          implications for UX-CONTENT-005
        kind: design
      - id: UX-CONTENT-005-S01-T02
        title: Implement the shared or surface-specific UI behavior for UX-CONTENT-005
        kind: implementation
      - id: UX-CONTENT-005-S01-T03
        title: Add automated and manual coverage for UX-CONTENT-005 acceptance criteria
        kind: test
      - id: UX-CONTENT-005-S01-T04
        title: Record demo notes and traceability evidence for UX-CONTENT-005
        kind: demo
  - id: UX-CONTENT-007-S01
    title: Focus / distraction-free writing mode
    requirementIds:
      - UX-CONTENT-007
    acceptanceCriteria:
      - Given focus mode is active, when the user presses Escape, then all
        chrome is restored within 200 ms (or instantly with
        `prefers-reduced-motion`).
      - Given focus mode is active, then the save-status chip remains visible.
      - Given the toolbar is at reduced opacity in focus mode, when a toolbar
        button receives keyboard focus, then the toolbar fades to full opacity
        and the focus ring is visible.
    tasks:
      - id: UX-CONTENT-007-S01-T01
        title: Confirm UI contract, responsive profile behavior, and actor-safety
          implications for UX-CONTENT-007
        kind: design
      - id: UX-CONTENT-007-S01-T02
        title: Implement the shared or surface-specific UI behavior for UX-CONTENT-007
        kind: implementation
      - id: UX-CONTENT-007-S01-T03
        title: Add automated and manual coverage for UX-CONTENT-007 acceptance criteria
        kind: test
      - id: UX-CONTENT-007-S01-T04
        title: Record demo notes and traceability evidence for UX-CONTENT-007
        kind: demo
qualityBar:
  - "Product fit: the delivered UI follows the canvas-first command platform
    model and never regresses to a document-list home."
  - "Traceability: every mapped UX requirement is tied to implementation, tests,
    and demo evidence."
  - "Foundations first: design tokens, shared components, platform profiles, and
    accessibility primitives are reused rather than reimplemented per surface."
  - "Actor safety: player and observer routes, search, ARIA, errors, skeletons,
    previews, and command results never leak DM-only content."
  - "Platform parity: Desktop, Tablet, and Mobile expose the same Must-have
    commands through profile-appropriate surfaces and the same processing-core
    commands."
  - "Live-play readiness: hot paths acknowledge within 100 ms, support
    undo/retry where appropriate, and stay glanceable under table pressure."
  - "Accessibility: WCAG 2.2 AA, keyboard parity, reduced motion, touch targets,
    non-color state, and screen-reader QA are part of the acceptance bar."
  - "Production polish: empty/loading/error states, responsive constraints,
    visual hierarchy, motion, and help affordances are complete enough to
    share."
gitWorkflow:
  - Start from `git status --short` and work around unrelated local edits unless
    they block the epic.
  - Use one branch per UX epic and keep commits scoped to that epic plus its
    generated UX workpack evidence.
  - Do not hand-edit generated files under `docs/planning/v2/ux` for status
    changes; use the UX workpack commands.
  - Do not reset, overwrite, or reformat unrelated user changes.
  - Before handoff, run targeted tests plus `pnpm ux-workpack:validate` and
    leave no stale generated UX planning diffs.
statusAutomation:
  - Do not hand-edit generated UX epic packets, `status.yaml`,
    `requirements-index.yaml`, `initiative-map.yaml`, or `parallel-batches.yaml`
    for status changes.
  - Use `pnpm ux-workpack:set-status -- --epic
    UX-CONTENT-editor-shell-and-writing-controls --status active` when
    implementation starts.
  - Create
    `docs/planning/v2/ux/epics/UX-CONTENT-editor-shell-and-writing-controls.completion.md`
    with demo, tests, traceability, gaps, and git evidence before marking
    complete.
  - Use `pnpm ux-workpack:complete -- --epic
    UX-CONTENT-editor-shell-and-writing-controls` to update
    `docs/planning/v2/ux/workpack-state.yaml` and regenerate all derived UX
    planning files together.
  - Run `pnpm ux-workpack:validate` after any status or generation command.
testPlan:
  - Run `pnpm ux-workpack:validate` before handoff.
  - Run targeted unit tests for stores, query shaping, route metadata, component
    state, and command dispatch touched by this epic.
  - Run app tests or Playwright coverage for visible route, profile, keyboard,
    touch, empty/loading/error, and player-safe behavior touched by this epic.
  - Run axe and manual accessibility checks when the epic touches focus,
    landmarks, dialogs, menus, tabs, drag alternatives, live regions, or
    screen-reader output.
demoNotesTemplate:
  - Describe the user-visible path demonstrated on Desktop, Tablet, and Mobile
    where applicable.
  - List the UX requirement IDs and acceptance criteria exercised by the demo.
  - Record actor roles used in the demo, especially DM/player/observer safety
    cases.
  - Record remaining polish, research, or product-decision gaps explicitly.
stopConditions:
  - Stop if the epic needs a product decision that the architecture
    reconciliation epic has not resolved.
  - Stop if a UX requirement conflicts with a functional requirement and the
    conflict has not been raised in docs.
  - Stop if a player-visible route, ARIA label, command result, search result,
    preview, skeleton, or error can reveal hidden DM-only content.
  - Stop if a Must-have action is pointer-only, gesture-only, desktop-only, or
    depends on an optional network/cloud/AI feature.
  - Stop if generated UX workpack validation fails and the cause is not
    understood.
completionEvidence:
  - Targeted tests and profile checks pass.
  - Requirement IDs are traced to implementation, tests, and demo notes.
  - Desktop, Tablet, and Mobile behavior is covered or explicitly scoped with a
    reason.
  - Accessibility, actor-safety, no-leak, reduced-motion, touch-target, and
    keyboard parity evidence is recorded where applicable.
  - Completion file records demo path, tests run, changed files, requirement
    coverage, known gaps, git branch/commit or PR, and final `git status
    --short` output.
  - The UX workpack status is updated with the programmatic complete command
    after completion evidence exists.
completionEvidenceFile: docs/planning/v2/ux/epics/UX-CONTENT-editor-shell-and-writing-controls.completion.md

parallelSafety:
  fileOwnership:
    - docs/planning/v2/ux/
    - apps/gm/src/routes/styles.css
    - apps/gm/src/lib/gui/
  notes: Parallel execution is safe only with non-overlapping component, route,
    and generated UX workpack ownership; shared shell/component contracts must
    be agreed before implementation.
stories:
  - id: UX-VIS-001-S01
    title: Dark-first, warm-toned default theme
    requirementIds:
      - UX-VIS-001
    acceptanceCriteria:
      - Given a new install with OS set to dark, when the app first opens, then
        the tavern (dark warm) theme is active with no flash of light
        background.
      - Given a user changes theme in settings, when the change commits, then
        all CSS custom property values update within one frame (≤ 16 ms) and an
        accessible announcement is emitted.
      - Given forced-colors (Windows High Contrast) is active, when the app
        renders, then the high-contrast theme CSS custom properties map to
        system color keywords (Canvas, CanvasText, Highlight, etc.) with no
        hard-coded colors surviving.
    tasks:
      - id: UX-VIS-001-S01-T01
        title: Confirm UI contract, responsive profile behavior, and actor-safety
          implications for UX-VIS-001
        kind: design
      - id: UX-VIS-001-S01-T02
        title: Implement the shared or surface-specific UI behavior for UX-VIS-001
        kind: implementation
      - id: UX-VIS-001-S01-T03
        title: Add automated and manual coverage for UX-VIS-001 acceptance criteria
        kind: test
      - id: UX-VIS-001-S01-T04
        title: Record demo notes and traceability evidence for UX-VIS-001
        kind: demo
  - id: UX-VIS-002-S01
    title: Semantic color token set (complete definition)
    requirementIds:
      - UX-VIS-002
    acceptanceCriteria:
      - Given any component CSS file, when grep searches for bare hex color
        values or `rgb()` / `hsl()` literals not inside a CSS custom property
        definition, then zero results are found.
      - Given the `tavern` theme is active, when the contrast of
        `--color-text-primary` on `--color-bg` is measured, then ratio ≥ 7:1
        (AAA).
      - Given a theme is switched at runtime, when computed styles are sampled
        one frame later, then all token values resolve to the new theme's
        values.
    tasks:
      - id: UX-VIS-002-S01-T01
        title: Confirm UI contract, responsive profile behavior, and actor-safety
          implications for UX-VIS-002
        kind: design
      - id: UX-VIS-002-S01-T02
        title: Implement the shared or surface-specific UI behavior for UX-VIS-002
        kind: implementation
      - id: UX-VIS-002-S01-T03
        title: Add automated and manual coverage for UX-VIS-002 acceptance criteria
        kind: test
      - id: UX-VIS-002-S01-T04
        title: Record demo notes and traceability evidence for UX-VIS-002
        kind: demo
  - id: UX-VIS-003-S01
    title: Full theme color matrix (all five themes)
    requirementIds:
      - UX-VIS-003
    acceptanceCriteria:
      - Given the design-token validation script runs, when all theme classes
        are loaded, then every token in UX-VIS-002 resolves to a non-empty value
        in each theme.
      - Given high-contrast theme and forced-colors active simultaneously, when
        rendered, then hard-coded hex values are overridden by system color
        keywords with zero regression.
    tasks:
      - id: UX-VIS-003-S01-T01
        title: Confirm UI contract, responsive profile behavior, and actor-safety
          implications for UX-VIS-003
        kind: design
      - id: UX-VIS-003-S01-T02
        title: Implement the shared or surface-specific UI behavior for UX-VIS-003
        kind: implementation
      - id: UX-VIS-003-S01-T03
        title: Add automated and manual coverage for UX-VIS-003 acceptance criteria
        kind: test
      - id: UX-VIS-003-S01-T04
        title: Record demo notes and traceability evidence for UX-VIS-003
        kind: demo
  - id: UX-VIS-004-S01
    title: Typography scale and font stack
    requirementIds:
      - UX-VIS-004
    acceptanceCriteria:
      - Given Inter fails to load, when the app renders, then body text falls
        back to system-ui with no layout overflow.
      - Given `--text-xs` (12 px) text renders, when contrast is measured, then
        ratio ≥ 7:1 (AAA) — the extra margin compensates for the small size.
      - Given any element uses the display font, when font-size is inspected,
        then it resolves to ≥ 24 px (`--text-xl`).
    tasks:
      - id: UX-VIS-004-S01-T01
        title: Confirm UI contract, responsive profile behavior, and actor-safety
          implications for UX-VIS-004
        kind: design
      - id: UX-VIS-004-S01-T02
        title: Implement the shared or surface-specific UI behavior for UX-VIS-004
        kind: implementation
      - id: UX-VIS-004-S01-T03
        title: Add automated and manual coverage for UX-VIS-004 acceptance criteria
        kind: test
      - id: UX-VIS-004-S01-T04
        title: Record demo notes and traceability evidence for UX-VIS-004
        kind: demo
  - id: UX-VIS-005-S01
    title: Spacing scale (4/8 px grid)
    requirementIds:
      - UX-VIS-005
    acceptanceCriteria:
      - Given any component stylesheet, when scanned for numeric `px` values
        outside token definitions, then zero non-token spacing values are found
        in component rules.
      - Given a component uses `--space-0-5` (2 px), when code-reviewed, then it
        is for a documented micro-adjustment (icon offset, badge nudge) — not a
        layout gap.
    tasks:
      - id: UX-VIS-005-S01-T01
        title: Confirm UI contract, responsive profile behavior, and actor-safety
          implications for UX-VIS-005
        kind: design
      - id: UX-VIS-005-S01-T02
        title: Implement the shared or surface-specific UI behavior for UX-VIS-005
        kind: implementation
      - id: UX-VIS-005-S01-T03
        title: Add automated and manual coverage for UX-VIS-005 acceptance criteria
        kind: test
      - id: UX-VIS-005-S01-T04
        title: Record demo notes and traceability evidence for UX-VIS-005
        kind: demo
  - id: UX-VIS-006-S01
    title: Border radius tokens
    requirementIds:
      - UX-VIS-006
    acceptanceCriteria:
      - Given any component CSS, when scanned for `border-radius` values not
        referencing a `--radius-*` token, then zero exceptions are found.
    tasks:
      - id: UX-VIS-006-S01-T01
        title: Confirm UI contract, responsive profile behavior, and actor-safety
          implications for UX-VIS-006
        kind: design
      - id: UX-VIS-006-S01-T02
        title: Implement the shared or surface-specific UI behavior for UX-VIS-006
        kind: implementation
      - id: UX-VIS-006-S01-T03
        title: Add automated and manual coverage for UX-VIS-006 acceptance criteria
        kind: test
      - id: UX-VIS-006-S01-T04
        title: Record demo notes and traceability evidence for UX-VIS-006
        kind: demo
  - id: UX-VIS-007-S01
    title: Elevation and shadow tokens
    requirementIds:
      - UX-VIS-007
    acceptanceCriteria:
      - Given a dropdown menu opens, when inspected, then its background
        resolves to `--color-surface-raised` and shadow resolves to
        `--shadow-sm`.
      - Given a modal dialog opens, when inspected, then its background resolves
        to `--color-surface-overlay` and shadow resolves to `--shadow-md`.
    tasks:
      - id: UX-VIS-007-S01-T01
        title: Confirm UI contract, responsive profile behavior, and actor-safety
          implications for UX-VIS-007
        kind: design
      - id: UX-VIS-007-S01-T02
        title: Implement the shared or surface-specific UI behavior for UX-VIS-007
        kind: implementation
      - id: UX-VIS-007-S01-T03
        title: Add automated and manual coverage for UX-VIS-007 acceptance criteria
        kind: test
      - id: UX-VIS-007-S01-T04
        title: Record demo notes and traceability evidence for UX-VIS-007
        kind: demo
  - id: UX-VIS-008-S01
    title: Z-index layering system
    requirementIds:
      - UX-VIS-008
    acceptanceCriteria:
      - Given a tooltip renders while a modal is open, when z-index is
        inspected, then the tooltip z-index resolves to a value ≥ `--z-tooltip`
        (700) and > the modal's `--z-modal` (400).
      - Given a DM-only badge renders on a hidden widget, when z-index is
        inspected, then it resolves to `--z-dm-boundary` (1000) — above all
        interactive layers.
    tasks:
      - id: UX-VIS-008-S01-T01
        title: Confirm UI contract, responsive profile behavior, and actor-safety
          implications for UX-VIS-008
        kind: design
      - id: UX-VIS-008-S01-T02
        title: Implement the shared or surface-specific UI behavior for UX-VIS-008
        kind: implementation
      - id: UX-VIS-008-S01-T03
        title: Add automated and manual coverage for UX-VIS-008 acceptance criteria
        kind: test
      - id: UX-VIS-008-S01-T04
        title: Record demo notes and traceability evidence for UX-VIS-008
        kind: demo
  - id: UX-VIS-012-S01
    title: Contrast guarantees per theme
    requirementIds:
      - UX-VIS-012
    acceptanceCriteria:
      - Given the contrast validation script runs for all five themes, when
        complete, then zero foreground/background pairs fail their assigned WCAG
        level.
      - Given the high-contrast theme is active, when `--color-text-primary` on
        `--color-bg` is measured, then the ratio ≥ 21:1 (black on white).
      - Given `--color-text-tertiary` is used, when the font-size of the element
        is inspected, then it is ≥ 20 px or ≥ 17 px bold — never 15 px body.
    tasks:
      - id: UX-VIS-012-S01-T01
        title: Confirm UI contract, responsive profile behavior, and actor-safety
          implications for UX-VIS-012
        kind: design
      - id: UX-VIS-012-S01-T02
        title: Implement the shared or surface-specific UI behavior for UX-VIS-012
        kind: implementation
      - id: UX-VIS-012-S01-T03
        title: Add automated and manual coverage for UX-VIS-012 acceptance criteria
        kind: test
      - id: UX-VIS-012-S01-T04
        title: Record demo notes and traceability evidence for UX-VIS-012
        kind: demo
  - id: UX-VIS-013-S01
    title: Visual language and brand mood
    requirementIds:
      - UX-VIS-013
    acceptanceCriteria:
      - Given the design is reviewed by the product owner, when evaluated
        against the brand mood spec, then no surface uses a texture on a
        component with a WCAG contrast requirement.
      - Given the font audit runs, when non-system, non-Inter, non-Cinzel,
        non-JetBrains-Mono fonts are found applied to UI elements (not content),
        then a documented exception exists.
    tasks:
      - id: UX-VIS-013-S01-T01
        title: Confirm UI contract, responsive profile behavior, and actor-safety
          implications for UX-VIS-013
        kind: design
      - id: UX-VIS-013-S01-T02
        title: Implement the shared or surface-specific UI behavior for UX-VIS-013
        kind: implementation
      - id: UX-VIS-013-S01-T03
        title: Add automated and manual coverage for UX-VIS-013 acceptance criteria
        kind: test
      - id: UX-VIS-013-S01-T04
        title: Record demo notes and traceability evidence for UX-VIS-013
        kind: demo
qualityBar:
  - "Product fit: the delivered UI follows the canvas-first command platform
    model and never regresses to a document-list home."
  - "Traceability: every mapped UX requirement is tied to implementation, tests,
    and demo evidence."
  - "Foundations first: design tokens, shared components, platform profiles, and
    accessibility primitives are reused rather than reimplemented per surface."
  - "Actor safety: player and observer routes, search, ARIA, errors, skeletons,
    previews, and command results never leak DM-only content."
  - "Platform parity: Desktop, Tablet, and Mobile expose the same Must-have
    commands through profile-appropriate surfaces and the same processing-core
    commands."
  - "Live-play readiness: hot paths acknowledge within 100 ms, support
    undo/retry where appropriate, and stay glanceable under table pressure."
  - "Accessibility: WCAG 2.2 AA, keyboard parity, reduced motion, touch targets,
    non-color state, and screen-reader QA are part of the acceptance bar."
  - "Production polish: empty/loading/error states, responsive constraints,
    visual hierarchy, motion, and help affordances are complete enough to
    share."
gitWorkflow:
  - Start from `git status --short` and work around unrelated local edits unless
    they block the epic.
  - Use one branch per UX epic and keep commits scoped to that epic plus its
    generated UX workpack evidence.
  - Do not hand-edit generated files under `docs/planning/v2/ux` for status
    changes; use the UX workpack commands.
  - Do not reset, overwrite, or reformat unrelated user changes.
  - Before handoff, run targeted tests plus `pnpm ux-workpack:validate` and
    leave no stale generated UX planning diffs.
statusAutomation:
  - Do not hand-edit generated UX epic packets, `status.yaml`,
    `requirements-index.yaml`, `initiative-map.yaml`, or `parallel-batches.yaml`
    for status changes.
  - Use `pnpm ux-workpack:set-status -- --epic
    UX-VIS-design-tokens-themes-and-brand --status active` when implementation
    starts.
  - Create
    `docs/planning/v2/ux/epics/UX-VIS-design-tokens-themes-and-brand.completion.md`
    with demo, tests, traceability, gaps, and git evidence before marking
    complete.
  - Use `pnpm ux-workpack:complete -- --epic
    UX-VIS-design-tokens-themes-and-brand` to update
    `docs/planning/v2/ux/workpack-state.yaml` and regenerate all derived UX
    planning files together.
  - Run `pnpm ux-workpack:validate` after any status or generation command.
testPlan:
  - Run `pnpm ux-workpack:validate` before handoff.
  - Run targeted unit tests for stores, query shaping, route metadata, component
    state, and command dispatch touched by this epic.
  - Run app tests or Playwright coverage for visible route, profile, keyboard,
    touch, empty/loading/error, and player-safe behavior touched by this epic.
  - Run axe and manual accessibility checks when the epic touches focus,
    landmarks, dialogs, menus, tabs, drag alternatives, live regions, or
    screen-reader output.
  - Run token lint and theme contrast checks for every named theme.
demoNotesTemplate:
  - Describe the user-visible path demonstrated on Desktop, Tablet, and Mobile
    where applicable.
  - List the UX requirement IDs and acceptance criteria exercised by the demo.
  - Record actor roles used in the demo, especially DM/player/observer safety
    cases.
  - Record remaining polish, research, or product-decision gaps explicitly.
stopConditions:
  - Stop if the epic needs a product decision that the architecture
    reconciliation epic has not resolved.
  - Stop if a UX requirement conflicts with a functional requirement and the
    conflict has not been raised in docs.
  - Stop if a player-visible route, ARIA label, command result, search result,
    preview, skeleton, or error can reveal hidden DM-only content.
  - Stop if a Must-have action is pointer-only, gesture-only, desktop-only, or
    depends on an optional network/cloud/AI feature.
  - Stop if generated UX workpack validation fails and the cause is not
    understood.
completionEvidence:
  - Targeted tests and profile checks pass.
  - Requirement IDs are traced to implementation, tests, and demo notes.
  - Desktop, Tablet, and Mobile behavior is covered or explicitly scoped with a
    reason.
  - Accessibility, actor-safety, no-leak, reduced-motion, touch-target, and
    keyboard parity evidence is recorded where applicable.
  - Completion file records demo path, tests run, changed files, requirement
    coverage, known gaps, git branch/commit or PR, and final `git status
    --short` output.
  - The UX workpack status is updated with the programmatic complete command
    after completion evidence exists.
completionEvidenceFile: docs/planning/v2/ux/epics/UX-VIS-design-tokens-themes-and-brand.completion.md

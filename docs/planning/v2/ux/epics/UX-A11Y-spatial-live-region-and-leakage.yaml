parallelSafety:
  fileOwnership:
    - docs/planning/v2/ux/
    - apps/v2/app/src/routes/styles.css
    - apps/v2/app/src/lib/gui/
  notes: Parallel execution is safe only with non-overlapping component, route,
    and generated UX workpack ownership; shared shell/component contracts must
    be agreed before implementation.
stories:
  - id: UX-A11Y-003-S01
    title: "Canvas keyboard model: selection, move, resize, link"
    requirementIds:
      - UX-A11Y-003
    acceptanceCriteria:
      - Given a keyboard-only user on the canvas, when Tab is pressed from the
        toolbar, then focus enters the canvas and the first widget receives a
        visible focus ring.
      - Given a widget is focused in spatial mode, when Enter is pressed, then
        action mode is entered and Tab cycles through internal handles.
      - Given a widget is in action mode, when Escape is pressed, then action
        mode exits and the widget retains focus in spatial mode.
      - Given a widget is focused in spatial mode, when Ctrl+Arrow is pressed,
        then the widget moves by the grid snap increment and a polite
        announcement confirms the new position.
      - Given the Scene Outline is open and a widget is activated from it, when
        Enter/Space is pressed, then the canvas scrolls to and focuses the
        widget.
      - Given the canvas is empty, when focus enters the canvas, then a polite
        announcement says "Canvas empty — use the toolbar to add a widget."
    tasks:
      - id: UX-A11Y-003-S01-T01
        title: Confirm UI contract, responsive profile behavior, and actor-safety
          implications for UX-A11Y-003
        kind: design
      - id: UX-A11Y-003-S01-T02
        title: Implement the shared or surface-specific UI behavior for UX-A11Y-003
        kind: implementation
      - id: UX-A11Y-003-S01-T03
        title: Add automated and manual coverage for UX-A11Y-003 acceptance criteria
        kind: test
      - id: UX-A11Y-003-S01-T04
        title: Record demo notes and traceability evidence for UX-A11Y-003
        kind: demo
  - id: UX-A11Y-004-S01
    title: "Scene Outline: structural access to spatial surface"
    requirementIds:
      - UX-A11Y-004
    acceptanceCriteria:
      - Given the Scene Outline is open, when a screen-reader user presses Down,
        then each widget item is announced by name and type in layer order.
      - Given a widget item is activated from the Scene Outline, when Enter is
        pressed, then the canvas scrolls to and visually focuses the widget, and
        focus returns to the canvas element.
      - Given the current user is a Player, when the Scene Outline lists
        widgets, then no DM-only widget names, labels, or descriptions appear in
        the list.
    tasks:
      - id: UX-A11Y-004-S01-T01
        title: Confirm UI contract, responsive profile behavior, and actor-safety
          implications for UX-A11Y-004
        kind: design
      - id: UX-A11Y-004-S01-T02
        title: Implement the shared or surface-specific UI behavior for UX-A11Y-004
        kind: implementation
      - id: UX-A11Y-004-S01-T03
        title: Add automated and manual coverage for UX-A11Y-004 acceptance criteria
        kind: test
      - id: UX-A11Y-004-S01-T04
        title: Record demo notes and traceability evidence for UX-A11Y-004
        kind: demo
  - id: UX-A11Y-005-S01
    title: "Maps: non-visual access and fog-of-war safety"
    requirementIds:
      - UX-A11Y-005
    acceptanceCriteria:
      - Given a map with five visible POIs and two DM-only POIs, when a Player
        user opens the map summary, then exactly five POIs appear and zero
        DM-only POIs appear.
      - Given fog-of-war reveals an area, when a Player screen reader user is
        present, then a polite announcement names the revealed area without
        mentioning any still-hidden area.
      - Given a DM activates fog-of-war hide on a visible area, when a Player is
        using the map, then neither the summary nor any announcement reveals the
        hidden area's name or existence to the player.
      - Given a POI is activated from the map summary, when Enter is pressed,
        then the map viewport centers on the POI and the POI name is announced.
    tasks:
      - id: UX-A11Y-005-S01-T01
        title: Confirm UI contract, responsive profile behavior, and actor-safety
          implications for UX-A11Y-005
        kind: design
      - id: UX-A11Y-005-S01-T02
        title: Implement the shared or surface-specific UI behavior for UX-A11Y-005
        kind: implementation
      - id: UX-A11Y-005-S01-T03
        title: Add automated and manual coverage for UX-A11Y-005 acceptance criteria
        kind: test
      - id: UX-A11Y-005-S01-T04
        title: Record demo notes and traceability evidence for UX-A11Y-005
        kind: demo
  - id: UX-A11Y-006-S01
    title: "Live combat: graduated announcements without data leakage"
    requirementIds:
      - UX-A11Y-006
    acceptanceCriteria:
      - Given a Player screen reader user in combat with a hidden DM-only
        combatant, when that combatant takes damage, then no announcement is
        emitted to the player.
      - Given a Player screen reader user, when initiative advances to a
        combatant whose HP is not visible to the player, then the turn
        announcement states the combatant name but not HP.
      - Given a Player character's HP drops to 0, when the incapacitation event
        fires, then an assertive announcement "[Character Name] is
        incapacitated" is emitted to all users who can see that character.
      - Given 5 combatants are affected by an area effect within 200 ms, when
        the announcements would fire, then a single batched announcement is
        emitted after 300 ms instead of 5 individual announcements.
      - Given the combat surface is inspected by axe, when the test runs, then
        zero violations are found on the `aria-live` regions (no duplicate live
        regions, correct roles).
    tasks:
      - id: UX-A11Y-006-S01-T01
        title: Confirm UI contract, responsive profile behavior, and actor-safety
          implications for UX-A11Y-006
        kind: design
      - id: UX-A11Y-006-S01-T02
        title: Implement the shared or surface-specific UI behavior for UX-A11Y-006
        kind: implementation
      - id: UX-A11Y-006-S01-T03
        title: Add automated and manual coverage for UX-A11Y-006 acceptance criteria
        kind: test
      - id: UX-A11Y-006-S01-T04
        title: Record demo notes and traceability evidence for UX-A11Y-006
        kind: demo
  - id: UX-A11Y-008-S01
    title: "Visibility boundary in ARIA: no leakage via accessible names or live
      regions"
    requirementIds:
      - UX-A11Y-008
    acceptanceCriteria:
      - Given a Player is using a screen reader, when a DM-only map POI exists
        on the current map, then no accessible name, live-region text, or alt
        text mentioning the POI name appears in the player's browsing context.
      - Given a Player is using a screen reader, when a DM-only canvas widget
        exists on the Scene, then the widget does not appear in Tab order, Scene
        Outline, or any live announcement.
      - Given a Player session is tested with axe and a DOM inspection tool,
        when DM-only objects exist, then zero references to DM-only names/data
        appear in the ARIA tree for the player context.
    tasks:
      - id: UX-A11Y-008-S01-T01
        title: Confirm UI contract, responsive profile behavior, and actor-safety
          implications for UX-A11Y-008
        kind: design
      - id: UX-A11Y-008-S01-T02
        title: Implement the shared or surface-specific UI behavior for UX-A11Y-008
        kind: implementation
      - id: UX-A11Y-008-S01-T03
        title: Add automated and manual coverage for UX-A11Y-008 acceptance criteria
        kind: test
      - id: UX-A11Y-008-S01-T04
        title: Record demo notes and traceability evidence for UX-A11Y-008
        kind: demo
qualityBar:
  - "Product fit: the delivered UI follows the canvas-first command platform
    model and never regresses to a document-list home."
  - "Traceability: every mapped UX requirement is tied to implementation, tests,
    and demo evidence."
  - "Foundations first: design tokens, shared components, platform profiles, and
    accessibility primitives are reused rather than reimplemented per surface."
  - "Actor safety: player and observer routes, search, ARIA, errors, skeletons,
    previews, and command results never leak DM-only content."
  - "Platform parity: Desktop, Tablet, and Mobile expose the same Must-have
    commands through profile-appropriate surfaces and the same processing-core
    commands."
  - "Live-play readiness: hot paths acknowledge within 100 ms, support
    undo/retry where appropriate, and stay glanceable under table pressure."
  - "Accessibility: WCAG 2.2 AA, keyboard parity, reduced motion, touch targets,
    non-color state, and screen-reader QA are part of the acceptance bar."
  - "Production polish: empty/loading/error states, responsive constraints,
    visual hierarchy, motion, and help affordances are complete enough to
    share."
gitWorkflow:
  - Start from `git status --short` and work around unrelated local edits unless
    they block the epic.
  - Use one branch per UX epic and keep commits scoped to that epic plus its
    generated UX workpack evidence.
  - Do not hand-edit generated files under `docs/planning/v2/ux` for status
    changes; use the UX workpack commands.
  - Do not reset, overwrite, or reformat unrelated user changes.
  - Before handoff, run targeted tests plus `pnpm v2:ux-workpack:validate` and
    leave no stale generated UX planning diffs.
statusAutomation:
  - Do not hand-edit generated UX epic packets, `status.yaml`,
    `requirements-index.yaml`, `initiative-map.yaml`, or `parallel-batches.yaml`
    for status changes.
  - Use `pnpm v2:ux-workpack:set-status -- --epic
    UX-A11Y-spatial-live-region-and-leakage --status active` when implementation
    starts.
  - Create
    `docs/planning/v2/ux/epics/UX-A11Y-spatial-live-region-and-leakage.completion.md`
    with demo, tests, traceability, gaps, and git evidence before marking
    complete.
  - Use `pnpm v2:ux-workpack:complete -- --epic
    UX-A11Y-spatial-live-region-and-leakage` to update
    `docs/planning/v2/ux/workpack-state.yaml` and regenerate all derived UX
    planning files together.
  - Run `pnpm v2:ux-workpack:validate` after any status or generation command.
testPlan:
  - Run `pnpm v2:ux-workpack:validate` before handoff.
  - Run targeted unit tests for stores, query shaping, route metadata, component
    state, and command dispatch touched by this epic.
  - Run app tests or Playwright coverage for visible route, profile, keyboard,
    touch, empty/loading/error, and player-safe behavior touched by this epic.
  - Run axe and manual accessibility checks when the epic touches focus,
    landmarks, dialogs, menus, tabs, drag alternatives, live regions, or
    screen-reader output.
demoNotesTemplate:
  - Describe the user-visible path demonstrated on Desktop, Tablet, and Mobile
    where applicable.
  - List the UX requirement IDs and acceptance criteria exercised by the demo.
  - Record actor roles used in the demo, especially DM/player/observer safety
    cases.
  - Record remaining polish, research, or product-decision gaps explicitly.
stopConditions:
  - Stop if the epic needs a product decision that the architecture
    reconciliation epic has not resolved.
  - Stop if a UX requirement conflicts with a functional requirement and the
    conflict has not been raised in docs.
  - Stop if a player-visible route, ARIA label, command result, search result,
    preview, skeleton, or error can reveal hidden DM-only content.
  - Stop if a Must-have action is pointer-only, gesture-only, desktop-only, or
    depends on an optional network/cloud/AI feature.
  - Stop if generated UX workpack validation fails and the cause is not
    understood.
completionEvidence:
  - Targeted tests and profile checks pass.
  - Requirement IDs are traced to implementation, tests, and demo notes.
  - Desktop, Tablet, and Mobile behavior is covered or explicitly scoped with a
    reason.
  - Accessibility, actor-safety, no-leak, reduced-motion, touch-target, and
    keyboard parity evidence is recorded where applicable.
  - Completion file records demo path, tests run, changed files, requirement
    coverage, known gaps, git branch/commit or PR, and final `git status
    --short` output.
  - The UX workpack status is updated with the programmatic complete command
    after completion evidence exists.

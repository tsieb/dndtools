schemaVersion: 1
kind: ux-ui-remake-epic
id: UX-A11Y-spatial-live-region-and-leakage
title: Spatial Access, Live Regions, and No-Leak Boundaries
status: approved
approved: true
phase: 01 Foundations
productPriority: P0
domain: UX-A11Y
objective: Establish the Scene Outline, map summary, combat announcement, and
  ARIA visibility-boundary model before canvas, maps, and live-play surfaces
  deepen.

  - encounter builder
  - dice tools
  - roll history
  - timer widget
  - quick reference
  - prep/recap digest
  - calendar continuity
dependencies:
  - UX-SESSION-lifecycle-recovery-and-hotpath-combat-shell
parallelSafety:
  fileOwnership:
    - docs/planning/v2/ux/
    - apps/v2/app/src/lib/gui/ux-ses/
    - apps/v2/app/src/routes/
  notes: Parallel execution is safe only with non-overlapping component, route,
    and generated UX workpack ownership; shared shell/component contracts must
    be agreed before implementation.
stories:
  - id: UX-SES-009-S01
    title: "Encounter Builder: pre-fight assembly with live challenge guidance"
    requirementIds:
      - UX-SES-009
    acceptanceCriteria:
      - Given the DM adds a Deadly-level set of combatants, when the last
        combatant is added, then the challenge banner updates to "Deadly" within
        100 ms without pressing any button.
      - Given a saved encounter with five combatants, when the DM clicks "Start
        combat", then the initiative tracker opens with all five combatants
        added and ready for initiative rolls.
      - Given the DM leaves the encounter title blank and clicks "Build
        encounter", then the Build button is inactive and an inline error
        message explains the requirement.
    tasks:
      - id: UX-SES-009-S01-T01
        title: Confirm UI contract, responsive profile behavior, and actor-safety
          implications for UX-SES-009
        kind: design
      - id: UX-SES-009-S01-T02
        title: Implement the shared or surface-specific UI behavior for UX-SES-009
        kind: implementation
      - id: UX-SES-009-S01-T03
        title: Add automated and manual coverage for UX-SES-009 acceptance criteria
        kind: test
      - id: UX-SES-009-S01-T04
        title: Record demo notes and traceability evidence for UX-SES-009
        kind: demo
  - id: UX-SES-010-S01
    title: "Dice Tools: expression input, advantage/disadvantage, modifiers, history"
    requirementIds:
      - UX-SES-010
    acceptanceCriteria:
      - Given the Dice Tools panel is open, when the DM presses Tab once, then
        focus is on the expression input.
      - Given the DM selects "Advantage" and types "d20+5" and presses Enter,
        then the roll is made with 2d20kh1+5 semantics and the history entry
        shows both dice values.
      - Given a roll is marked DM-only, when a player client's dice history is
        queried, then that roll is not present in any player-rendered history
        entry.
      - Given 50 prior rolls, when the DM opens the history, then rolls are
        shown newest-first and older rolls are accessible by scrolling.
    tasks:
      - id: UX-SES-010-S01-T01
        title: Confirm UI contract, responsive profile behavior, and actor-safety
          implications for UX-SES-010
        kind: design
      - id: UX-SES-010-S01-T02
        title: Implement the shared or surface-specific UI behavior for UX-SES-010
        kind: implementation
      - id: UX-SES-010-S01-T03
        title: Add automated and manual coverage for UX-SES-010 acceptance criteria
        kind: test
      - id: UX-SES-010-S01-T04
        title: Record demo notes and traceability evidence for UX-SES-010
        kind: demo
  - id: UX-SES-011-S01
    title: Roll history entry anatomy and private/shared indicators
    requirementIds:
      - UX-SES-011
    acceptanceCriteria:
      - Given a DM-only roll, when the DM views the dice panel, then the entry
        shows a "DM only" badge.
      - Given a DM-only roll, when the player client renders roll history, then
        no entry for that roll appears in any DOM node.
      - Given a table draw, when the result entry appears in history, then the
        drawn row text is visible in the entry without requiring hover.
    tasks:
      - id: UX-SES-011-S01-T01
        title: Confirm UI contract, responsive profile behavior, and actor-safety
          implications for UX-SES-011
        kind: design
      - id: UX-SES-011-S01-T02
        title: Implement the shared or surface-specific UI behavior for UX-SES-011
        kind: implementation
      - id: UX-SES-011-S01-T03
        title: Add automated and manual coverage for UX-SES-011 acceptance criteria
        kind: test
      - id: UX-SES-011-S01-T04
        title: Record demo notes and traceability evidence for UX-SES-011
        kind: demo
  - id: UX-SES-012-S01
    title: "Timer widget: countdown display, urgency transition, operator controls"
    requirementIds:
      - UX-SES-012
    acceptanceCriteria:
      - Given a running timer with 8 seconds remaining, when the display
        renders, then the numerals are red and the bar is red on all profiles.
      - Given a player has the `operator` capability set on the timer widget,
        when they open the timer, then Start/Pause/Resume/Reset controls are
        visible and functional, but "Set duration" is not visible.
      - Given the timer expires, when it hits 0:00, then a "Time's up!" banner
        appears and the `role="alert"` live region fires.
    tasks:
      - id: UX-SES-012-S01-T01
        title: Confirm UI contract, responsive profile behavior, and actor-safety
          implications for UX-SES-012
        kind: design
      - id: UX-SES-012-S01-T02
        title: Implement the shared or surface-specific UI behavior for UX-SES-012
        kind: implementation
      - id: UX-SES-012-S01-T03
        title: Add automated and manual coverage for UX-SES-012 acceptance criteria
        kind: test
      - id: UX-SES-012-S01-T04
        title: Record demo notes and traceability evidence for UX-SES-012
        kind: demo
  - id: UX-SES-013-S01
    title: "Quick Reference panel: pinned notes, stat blocks, open threads"
    requirementIds:
      - UX-SES-013
    acceptanceCriteria:
      - Given the DM pins a note and navigates to the character sheet, when they
        return to the Command Center, then the pinned panel is still present in
        the Quick Reference panel.
      - Given a pinned note is subsequently hidden (DM-only), when the Quick
        Reference panel renders, then the panel shows "Reference unavailable"
        and no note content — not a blank entry or a crash.
      - Given an open-thread pin on a note, when the DM opens the Prep/Recap
        panel in prep mode, then that thread appears in the "Unresolved threads"
        section of the digest.
    tasks:
      - id: UX-SES-013-S01-T01
        title: Confirm UI contract, responsive profile behavior, and actor-safety
          implications for UX-SES-013
        kind: design
      - id: UX-SES-013-S01-T02
        title: Implement the shared or surface-specific UI behavior for UX-SES-013
        kind: implementation
      - id: UX-SES-013-S01-T03
        title: Add automated and manual coverage for UX-SES-013 acceptance criteria
        kind: test
      - id: UX-SES-013-S01-T04
        title: Record demo notes and traceability evidence for UX-SES-013
        kind: demo
  - id: UX-SES-014-S01
    title: "Prep & Recap digest: structured pre/post-session workflow"
    requirementIds:
      - UX-SES-014
    acceptanceCriteria:
      - Given the session is in recap state and the DM opens the Prep/Recap
        panel, then the mode is automatically set to "Recap" and the combat
        summary section shows the session's combat log entry count.
      - Given a player actor opens the Prep/Recap panel, then only the guard
        message "The prep/recap digest is available to the DM only." is visible
        — no section headings, no empty lists.
      - Given the DM clicks "Create recap notes", then a note draft opens
        pre-populated with the recap digest content and the DM can edit it
        without any further configuration.
    tasks:
      - id: UX-SES-014-S01-T01
        title: Confirm UI contract, responsive profile behavior, and actor-safety
          implications for UX-SES-014
        kind: design
      - id: UX-SES-014-S01-T02
        title: Implement the shared or surface-specific UI behavior for UX-SES-014
        kind: implementation
      - id: UX-SES-014-S01-T03
        title: Add automated and manual coverage for UX-SES-014 acceptance criteria
        kind: test
      - id: UX-SES-014-S01-T04
        title: Record demo notes and traceability evidence for UX-SES-014
        kind: demo
  - id: UX-SES-015-S01
    title: "Campaign calendar: current date display and date-linked entries"
    requirementIds:
      - UX-SES-015
    acceptanceCriteria:
      - Given the DM sets the campaign date to "Ches 15, 1372 DR", when a player
        client renders the current date widget, then the identical date string
        is shown — not a different format.
      - Given a linked note becomes DM-only (hidden), when the calendar links
        list renders, then the entry shows "target unavailable" without any note
        content or title in the displayed text.
      - Given the DM enters an invalid day (e.g., day 31 in a 30-day month),
        when they submit, then an inline error appears and the date is not set.
    tasks:
      - id: UX-SES-015-S01-T01
        title: Confirm UI contract, responsive profile behavior, and actor-safety
          implications for UX-SES-015
        kind: design
      - id: UX-SES-015-S01-T02
        title: Implement the shared or surface-specific UI behavior for UX-SES-015
        kind: implementation
      - id: UX-SES-015-S01-T03
        title: Add automated and manual coverage for UX-SES-015 acceptance criteria
        kind: test
      - id: UX-SES-015-S01-T04
        title: Record demo notes and traceability evidence for UX-SES-015
        kind: demo
qualityBar:
  - "Product fit: the delivered UI follows the canvas-first command platform
    model and never regresses to a document-list home."
  - "Traceability: every mapped UX requirement is tied to implementation, tests,
    and demo evidence."
  - "Foundations first: design tokens, shared components, platform profiles, and
    accessibility primitives are reused rather than reimplemented per surface."
  - "Actor safety: player and observer routes, search, ARIA, errors, skeletons,
    previews, and command results never leak DM-only content."
  - "Platform parity: Desktop, Tablet, and Mobile expose the same Must-have
    commands through profile-appropriate surfaces and the same processing-core
    commands."
  - "Live-play readiness: hot paths acknowledge within 100 ms, support
    undo/retry where appropriate, and stay glanceable under table pressure."
  - "Accessibility: WCAG 2.2 AA, keyboard parity, reduced motion, touch targets,
    non-color state, and screen-reader QA are part of the acceptance bar."
  - "Production polish: empty/loading/error states, responsive constraints,
    visual hierarchy, motion, and help affordances are complete enough to
    share."
gitWorkflow:
  - Start from `git status --short` and work around unrelated local edits unless
    they block the epic.
  - Use one branch per UX epic and keep commits scoped to that epic plus its
    generated UX workpack evidence.
  - Do not hand-edit generated files under `docs/planning/v2/ux` for status
    changes; use the UX workpack commands.
  - Do not reset, overwrite, or reformat unrelated user changes.
  - Before handoff, run targeted tests plus `pnpm v2:ux-workpack:validate` and
    leave no stale generated UX planning diffs.
statusAutomation:
  - Do not hand-edit generated UX epic packets, `status.yaml`,
    `requirements-index.yaml`, `initiative-map.yaml`, or `parallel-batches.yaml`
    for status changes.
  - Use `pnpm v2:ux-workpack:set-status -- --epic
    UX-SESSION-tools-encounters-dice-timers-prep-calendar --status active` when
    implementation starts.
  - Create
    `docs/planning/v2/ux/epics/UX-SESSION-tools-encounters-dice-timers-prep-calendar.completion.md`
    with demo, tests, traceability, gaps, and git evidence before marking
    complete.
  - Use `pnpm v2:ux-workpack:complete -- --epic
    UX-SESSION-tools-encounters-dice-timers-prep-calendar` to update
    `docs/planning/v2/ux/workpack-state.yaml` and regenerate all derived UX
    planning files together.
  - Run `pnpm v2:ux-workpack:validate` after any status or generation command.
testPlan:
  - Run `pnpm v2:ux-workpack:validate` before handoff.
  - Run targeted unit tests for stores, query shaping, route metadata, component
    state, and command dispatch touched by this epic.
  - Run app tests or Playwright coverage for visible route, profile, keyboard,
    touch, empty/loading/error, and player-safe behavior touched by this epic.
  - Run axe and manual accessibility checks when the epic touches focus,
    landmarks, dialogs, menus, tabs, drag alternatives, live regions, or
    screen-reader output.
demoNotesTemplate:
  - Describe the user-visible path demonstrated on Desktop, Tablet, and Mobile
    where applicable.
  - List the UX requirement IDs and acceptance criteria exercised by the demo.
  - Record actor roles used in the demo, especially DM/player/observer safety
    cases.
  - Record remaining polish, research, or product-decision gaps explicitly.
stopConditions:
  - Stop if the epic needs a product decision that the architecture
    reconciliation epic has not resolved.
  - Stop if a UX requirement conflicts with a functional requirement and the
    conflict has not been raised in docs.
  - Stop if a player-visible route, ARIA label, command result, search result,
    preview, skeleton, or error can reveal hidden DM-only content.
  - Stop if a Must-have action is pointer-only, gesture-only, desktop-only, or
    depends on an optional network/cloud/AI feature.
  - Stop if generated UX workpack validation fails and the cause is not
    understood.
completionEvidence:
  - Targeted tests and profile checks pass.
  - Requirement IDs are traced to implementation, tests, and demo notes.
  - Desktop, Tablet, and Mobile behavior is covered or explicitly scoped with a
    reason.
  - Accessibility, actor-safety, no-leak, reduced-motion, touch-target, and
    keyboard parity evidence is recorded where applicable.
  - Completion file records demo path, tests run, changed files, requirement
    coverage, known gaps, git branch/commit or PR, and final `git status
    --short` output.
  - The UX workpack status is updated with the programmatic complete command
    after completion evidence exists.

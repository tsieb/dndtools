schemaVersion: 1
kind: ux-ui-remake-epic
id: UX-SESSION-tools-encounters-dice-timers-prep-calendar
title: Session Tools, Encounters, Dice, Timers, Prep, and Calendar
status: approved
approved: true
phase: 05 Live-Play Workspaces
productPriority: P1
domain: UX-SES
objective: "Add the supporting live-play tools that make the Session route
  complete: encounter building, dice, roll history, timers, quick reference,
  prep/recap, and campaign calendar continuity."
requirementIds:
  - UX-SES-009
  - UX-SES-010
  - UX-SES-011
  - UX-SES-012
  - UX-SES-013
  - UX-SES-014
  - UX-SES-015

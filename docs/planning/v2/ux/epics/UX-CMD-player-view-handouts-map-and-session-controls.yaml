id: UX-CMD-player-view-handouts-map-and-session-controls
title: Command Center Player Views, Handouts, Map, and Session Controls
status: approved
approved: true
phase: 04 Trust and Safety
productPriority: P0
domain: UX-CMD
objective: "Finish the Command Center live-control surface: player-view
  controller and preview, handout push, active map projection controls, widget
  drawer, phase transitions, and command parity."

parallelSafety:
  fileOwnership:
    - docs/planning/v2/ux/
    - apps/v2/app/src/lib/gui/ux-cmd/
    - apps/v2/app/src/routes/
  notes: Parallel execution is safe only with non-overlapping component, route,
    and generated UX workpack ownership; shared shell/component contracts must
    be agreed before implementation.
stories:
  - id: UX-CMD-004-S01
    title: Player-View Controller panel
    requirementIds:
      - UX-CMD-004
    acceptanceCriteria:
      - Given three connected players, when the DM opens the Command Center,
        then all three players are listed in the Player-View Controller panel
        without opening any drawer or settings.
      - Given a player row, when the DM clicks the Scene dropdown and selects a
        different Scene, then the change is applied within 500 ms and the
        player's view updates (or queues for reconnect if offline).
      - Given the preview button for a player, when the DM clicks it, then a
        DM-only preview modal opens showing that player's current view with no
        DM-only hidden content visible.
    tasks:
      - id: UX-CMD-004-S01-T01
        title: Confirm UI contract, responsive profile behavior, and actor-safety
          implications for UX-CMD-004
        kind: design
      - id: UX-CMD-004-S01-T02
        title: Implement the shared or surface-specific UI behavior for UX-CMD-004
        kind: implementation
      - id: UX-CMD-004-S01-T03
        title: Add automated and manual coverage for UX-CMD-004 acceptance criteria
        kind: test
      - id: UX-CMD-004-S01-T04
        title: Record demo notes and traceability evidence for UX-CMD-004
        kind: demo
  - id: UX-CMD-005-S01
    title: Player-view preview modal (DM-only)
    requirementIds:
      - UX-CMD-005
    acceptanceCriteria:
      - Given a player assigned to a Scene containing a hidden map layer, when
        the DM opens that player's preview, then the hidden layer is not visible
        in the preview.
      - Given the DM opens the preview modal, when they press Escape, then the
        modal closes and focus returns to the preview button that opened it.
      - Given the player has no assigned Scene, when the preview opens, then the
        modal displays "No scene assigned" rather than a blank frame.
    tasks:
      - id: UX-CMD-005-S01-T01
        title: Confirm UI contract, responsive profile behavior, and actor-safety
          implications for UX-CMD-005
        kind: design
      - id: UX-CMD-005-S01-T02
        title: Implement the shared or surface-specific UI behavior for UX-CMD-005
        kind: implementation
      - id: UX-CMD-005-S01-T03
        title: Add automated and manual coverage for UX-CMD-005 acceptance criteria
        kind: test
      - id: UX-CMD-005-S01-T04
        title: Record demo notes and traceability evidence for UX-CMD-005
        kind: demo
  - id: UX-CMD-006-S01
    title: Push handout / content to player canvases
    requirementIds:
      - UX-CMD-006
    acceptanceCriteria:
      - Given an image in the vault, when the DM right-clicks it and selects
        "Push to players", then the recipient selector opens within 200 ms.
      - Given the confirmation dialog is open showing two players, when the DM
        clicks "Push now", then the handout appears on both players' canvases
        and the DM sees a success toast within 1 second.
      - Given the DM cancels at the confirmation step, then no content is
        delivered to any player canvas.
      - Given a hidden note (DM-only), when the DM opens the content selector,
        then the hidden note is not listed among pushable content options.
    tasks:
      - id: UX-CMD-006-S01-T01
        title: Confirm UI contract, responsive profile behavior, and actor-safety
          implications for UX-CMD-006
        kind: design
      - id: UX-CMD-006-S01-T02
        title: Implement the shared or surface-specific UI behavior for UX-CMD-006
        kind: implementation
      - id: UX-CMD-006-S01-T03
        title: Add automated and manual coverage for UX-CMD-006 acceptance criteria
        kind: test
      - id: UX-CMD-006-S01-T04
        title: Record demo notes and traceability evidence for UX-CMD-006
        kind: demo
  - id: UX-CMD-007-S01
    title: Active map embed with DM / player-projection controls
    requirementIds:
      - UX-CMD-007
    acceptanceCriteria:
      - Given the Command Center is visible, when the DM clicks "Project to
        players", then the map layers are streamed to player canvases within 2
        seconds and the toggle shows "Projecting".
      - Given the map contains a DM-only annotation layer, when the DM projects
        the map, then the DM-only layer is excluded from the player-facing
        projection.
      - Given the DM uses "Change map" and selects a different map, then the
        center embed updates and the session's active-map record changes without
        navigating away from the Command Center.
    tasks:
      - id: UX-CMD-007-S01-T01
        title: Confirm UI contract, responsive profile behavior, and actor-safety
          implications for UX-CMD-007
        kind: design
      - id: UX-CMD-007-S01-T02
        title: Implement the shared or surface-specific UI behavior for UX-CMD-007
        kind: implementation
      - id: UX-CMD-007-S01-T03
        title: Add automated and manual coverage for UX-CMD-007 acceptance criteria
        kind: test
      - id: UX-CMD-007-S01-T04
        title: Record demo notes and traceability evidence for UX-CMD-007
        kind: demo
  - id: UX-CMD-009-S01
    title: Widget library quick-access drawer
    requirementIds:
      - UX-CMD-009
    acceptanceCriteria:
      - Given the widget library drawer is open, when the DM types "dice" in the
        search field, then only widgets matching "dice" in name or description
        are shown.
      - Given a widget is unsupported on the current profile, when listed, then
        it is visually distinct and cannot be added (clicking it shows the
        unavailability reason, not an error).
      - Given the DM clicks "Add to canvas", then the widget appears on the
        canvas and the drawer closes within 300 ms.
    tasks:
      - id: UX-CMD-009-S01-T01
        title: Confirm UI contract, responsive profile behavior, and actor-safety
          implications for UX-CMD-009
        kind: design
      - id: UX-CMD-009-S01-T02
        title: Implement the shared or surface-specific UI behavior for UX-CMD-009
        kind: implementation
      - id: UX-CMD-009-S01-T03
        title: Add automated and manual coverage for UX-CMD-009 acceptance criteria
        kind: test
      - id: UX-CMD-009-S01-T04
        title: Record demo notes and traceability evidence for UX-CMD-009
        kind: demo
  - id: UX-CMD-010-S01
    title: Session phase transition controls
    requirementIds:
      - UX-CMD-010
    acceptanceCriteria:
      - Given an active session, when the DM clicks the Phase badge and selects
        "Pause session", then the session pauses within 500 ms and the badge
        shows "Paused" without a confirmation dialog.
      - Given the DM selects "End session", then two confirmation dialogs are
        required before the session ends.
      - Given the session is paused, when remote participants check their
        client, then they see a paused/waiting state and no live game commands
        execute.
    tasks:
      - id: UX-CMD-010-S01-T01
        title: Confirm UI contract, responsive profile behavior, and actor-safety
          implications for UX-CMD-010
        kind: design
      - id: UX-CMD-010-S01-T02
        title: Implement the shared or surface-specific UI behavior for UX-CMD-010
        kind: implementation
      - id: UX-CMD-010-S01-T03
        title: Add automated and manual coverage for UX-CMD-010 acceptance criteria
        kind: test
      - id: UX-CMD-010-S01-T04
        title: Record demo notes and traceability evidence for UX-CMD-010
        kind: demo
  - id: UX-CMD-011-S01
    title: Command palette parity for all Command Center actions
    requirementIds:
      - UX-CMD-011
    acceptanceCriteria:
      - Given the command palette is open and the DM types "Push", then "Push to
        players" commands appear.
      - Given the DM executes "Pause session" from the palette, then the session
        pauses identically to clicking the Phase badge popover.
      - Given a Player (non-DM) user opens the command palette, then DM-only
        commands (e.g., "End session") are not present in results or disabled
        states.
    tasks:
      - id: UX-CMD-011-S01-T01
        title: Confirm UI contract, responsive profile behavior, and actor-safety
          implications for UX-CMD-011
        kind: design
      - id: UX-CMD-011-S01-T02
        title: Implement the shared or surface-specific UI behavior for UX-CMD-011
        kind: implementation
      - id: UX-CMD-011-S01-T03
        title: Add automated and manual coverage for UX-CMD-011 acceptance criteria
        kind: test
      - id: UX-CMD-011-S01-T04
        title: Record demo notes and traceability evidence for UX-CMD-011
        kind: demo
qualityBar:
  - "Product fit: the delivered UI follows the canvas-first command platform
    model and never regresses to a document-list home."
  - "Traceability: every mapped UX requirement is tied to implementation, tests,
    and demo evidence."
  - "Foundations first: design tokens, shared components, platform profiles, and
    accessibility primitives are reused rather than reimplemented per surface."
  - "Actor safety: player and observer routes, search, ARIA, errors, skeletons,
    previews, and command results never leak DM-only content."
  - "Platform parity: Desktop, Tablet, and Mobile expose the same Must-have
    commands through profile-appropriate surfaces and the same processing-core
    commands."
  - "Live-play readiness: hot paths acknowledge within 100 ms, support
    undo/retry where appropriate, and stay glanceable under table pressure."
  - "Accessibility: WCAG 2.2 AA, keyboard parity, reduced motion, touch targets,
    non-color state, and screen-reader QA are part of the acceptance bar."
  - "Production polish: empty/loading/error states, responsive constraints,
    visual hierarchy, motion, and help affordances are complete enough to
    share."
gitWorkflow:
  - Start from `git status --short` and work around unrelated local edits unless
    they block the epic.
  - Use one branch per UX epic and keep commits scoped to that epic plus its
    generated UX workpack evidence.
  - Do not hand-edit generated files under `docs/planning/v2/ux` for status
    changes; use the UX workpack commands.
  - Do not reset, overwrite, or reformat unrelated user changes.
  - Before handoff, run targeted tests plus `pnpm v2:ux-workpack:validate` and
    leave no stale generated UX planning diffs.
statusAutomation:
  - Do not hand-edit generated UX epic packets, `status.yaml`,
    `requirements-index.yaml`, `initiative-map.yaml`, or `parallel-batches.yaml`
    for status changes.
  - Use `pnpm v2:ux-workpack:set-status -- --epic
    UX-CMD-player-view-handouts-map-and-session-controls --status active` when
    implementation starts.
  - Create
    `docs/planning/v2/ux/epics/UX-CMD-player-view-handouts-map-and-session-controls.completion.md`
    with demo, tests, traceability, gaps, and git evidence before marking
    complete.
  - Use `pnpm v2:ux-workpack:complete -- --epic
    UX-CMD-player-view-handouts-map-and-session-controls` to update
    `docs/planning/v2/ux/workpack-state.yaml` and regenerate all derived UX
    planning files together.
  - Run `pnpm v2:ux-workpack:validate` after any status or generation command.
testPlan:
  - Run `pnpm v2:ux-workpack:validate` before handoff.
  - Run targeted unit tests for stores, query shaping, route metadata, component
    state, and command dispatch touched by this epic.
  - Run app tests or Playwright coverage for visible route, profile, keyboard,
    touch, empty/loading/error, and player-safe behavior touched by this epic.
  - Run axe and manual accessibility checks when the epic touches focus,
    landmarks, dialogs, menus, tabs, drag alternatives, live regions, or
    screen-reader output.
demoNotesTemplate:
  - Describe the user-visible path demonstrated on Desktop, Tablet, and Mobile
    where applicable.
  - List the UX requirement IDs and acceptance criteria exercised by the demo.
  - Record actor roles used in the demo, especially DM/player/observer safety
    cases.
  - Record remaining polish, research, or product-decision gaps explicitly.
stopConditions:
  - Stop if the epic needs a product decision that the architecture
    reconciliation epic has not resolved.
  - Stop if a UX requirement conflicts with a functional requirement and the
    conflict has not been raised in docs.
  - Stop if a player-visible route, ARIA label, command result, search result,
    preview, skeleton, or error can reveal hidden DM-only content.
  - Stop if a Must-have action is pointer-only, gesture-only, desktop-only, or
    depends on an optional network/cloud/AI feature.
  - Stop if generated UX workpack validation fails and the cause is not
    understood.
completionEvidence:
  - Targeted tests and profile checks pass.
  - Requirement IDs are traced to implementation, tests, and demo notes.
  - Desktop, Tablet, and Mobile behavior is covered or explicitly scoped with a
    reason.
  - Accessibility, actor-safety, no-leak, reduced-motion, touch-target, and
    keyboard parity evidence is recorded where applicable.
  - Completion file records demo path, tests run, changed files, requirement
    coverage, known gaps, git branch/commit or PR, and final `git status
    --short` output.
  - The UX workpack status is updated with the programmatic complete command
    after completion evidence exists.

parallelSafety:
  fileOwnership:
    - docs/planning/v2/ux/
    - apps/v2/app/src/routes/styles.css
    - apps/v2/app/src/lib/gui/
  notes: Parallel execution is safe only with non-overlapping component, route,
    and generated UX workpack ownership; shared shell/component contracts must
    be agreed before implementation.
stories:
  - id: UX-A11Y-002-S01
    title: Keyboard parity for all Must-have actions
    requirementIds:
      - UX-A11Y-002
    acceptanceCriteria:
      - Given keyboard-only input, when a tester completes session start, global
        search, initiative advance, and note create/edit/save flows, then no
        pointer-only step is encountered.
      - Given a drag operation (widget move, widget resize, map pin drag, canvas
        pan), when the keyboard alternative is used, then the processing core
        receives the same command as the drag gesture.
      - Given a touch-only device (no hardware keyboard), when every Must-have
        action is exercised, then each action is reachable via a touch target
        with no pointer-drag requirement.
    tasks:
      - id: UX-A11Y-002-S01-T01
        title: Confirm UI contract, responsive profile behavior, and actor-safety
          implications for UX-A11Y-002
        kind: design
      - id: UX-A11Y-002-S01-T02
        title: Implement the shared or surface-specific UI behavior for UX-A11Y-002
        kind: implementation
      - id: UX-A11Y-002-S01-T03
        title: Add automated and manual coverage for UX-A11Y-002 acceptance criteria
        kind: test
      - id: UX-A11Y-002-S01-T04
        title: Record demo notes and traceability evidence for UX-A11Y-002
        kind: demo
  - id: UX-A11Y-007-S01
    title: "Color independence: state never color-only"
    requirementIds:
      - UX-A11Y-007
    acceptanceCriteria:
      - Given high-contrast mode is active, when any status badge, HP bar, fog
        overlay, role badge, or sync state is rendered, then a shape/icon/text
        indicator is present and visible independently of color.
      - Given a screen reader user focuses a bloodied combatant row, when
        inspected, then the accessible name or description includes "bloodied"
        in text, not only a color token.
      - Given a form field has an error, when inspected by a screen reader, then
        the error message is associated via `aria-describedby` and the field has
        `aria-invalid="true"`.
      - Given the grayscale test is applied to the combat tracker and map, when
        viewed, then every meaningful state distinction remains distinguishable.
    tasks:
      - id: UX-A11Y-007-S01-T01
        title: Confirm UI contract, responsive profile behavior, and actor-safety
          implications for UX-A11Y-007
        kind: design
      - id: UX-A11Y-007-S01-T02
        title: Implement the shared or surface-specific UI behavior for UX-A11Y-007
        kind: implementation
      - id: UX-A11Y-007-S01-T03
        title: Add automated and manual coverage for UX-A11Y-007 acceptance criteria
        kind: test
      - id: UX-A11Y-007-S01-T04
        title: Record demo notes and traceability evidence for UX-A11Y-007
        kind: demo
  - id: UX-A11Y-009-S01
    title: "Focus management: order, trapping, restoration, visible ring"
    requirementIds:
      - UX-A11Y-009
    acceptanceCriteria:
      - Given a modal dialog is open, when Tab is pressed repeatedly, then focus
        never leaves the dialog until Escape is pressed.
      - Given Escape closes a dialog, when it closes, then focus returns to the
        element that triggered the dialog, confirmed by
        `document.activeElement`.
      - Given any interactive element receives keyboard focus, when inspected
        visually, then a focus ring meeting 2.4.13 contrast and area criteria is
        visible.
      - Given the canvas toolbar is fixed to the top of the viewport, when a
        widget in the canvas receives keyboard focus, then the widget is
        scrolled into view such that the focus ring is not fully hidden behind
        the toolbar.
      - Given Tab order is traced on any route, when logged, then no positive
        `tabindex` values above 0 are found in the DOM.
    tasks:
      - id: UX-A11Y-009-S01-T01
        title: Confirm UI contract, responsive profile behavior, and actor-safety
          implications for UX-A11Y-009
        kind: design
      - id: UX-A11Y-009-S01-T02
        title: Implement the shared or surface-specific UI behavior for UX-A11Y-009
        kind: implementation
      - id: UX-A11Y-009-S01-T03
        title: Add automated and manual coverage for UX-A11Y-009 acceptance criteria
        kind: test
      - id: UX-A11Y-009-S01-T04
        title: Record demo notes and traceability evidence for UX-A11Y-009
        kind: demo
  - id: UX-A11Y-010-S01
    title: "Touch and pointer targets: size minimums by profile"
    requirementIds:
      - UX-A11Y-010
    acceptanceCriteria:
      - Given a Tablet or Mobile profile route, when the touch-target CI scan
        runs, then every interactive control reports a bounding rect ≥ 44×44 CSS
        px.
      - Given the Desktop profile, when the target-size scan runs, then zero
        controls fall below 24×24 CSS px.
      - Given a widget resize handle on the canvas in Mobile profile, when
        measured, then its touch hit area is ≥ 44×44 CSS px even if the visual
        handle is 8×8 CSS px.
      - Given a drag operation is in progress and Escape is pressed, when Escape
        fires, then the drag is cancelled and the element returns to its
        original position.
    tasks:
      - id: UX-A11Y-010-S01-T01
        title: Confirm UI contract, responsive profile behavior, and actor-safety
          implications for UX-A11Y-010
        kind: design
      - id: UX-A11Y-010-S01-T02
        title: Implement the shared or surface-specific UI behavior for UX-A11Y-010
        kind: implementation
      - id: UX-A11Y-010-S01-T03
        title: Add automated and manual coverage for UX-A11Y-010 acceptance criteria
        kind: test
      - id: UX-A11Y-010-S01-T04
        title: Record demo notes and traceability evidence for UX-A11Y-010
        kind: demo
  - id: UX-A11Y-011-S01
    title: "Reduced motion: single resolved preference, all surfaces"
    requirementIds:
      - UX-A11Y-011
    acceptanceCriteria:
      - Given OS reduced motion is enabled, when any animated element
        transitions, then no sliding, scaling, or rotating animation plays (only
        instant or ≤ 100 ms opacity change).
      - Given OS reduced motion is enabled and the user has not set an override,
        when motion resolution is checked, then the app emits
        `data-motion="reduced"` on the html element.
      - Given the user sets in-app motion preference to "full" while OS reduced
        motion is enabled, when motion resolution is checked, then the app emits
        `data-motion="full"` (user override wins).
      - Given reduced motion is active, when a dice roll is triggered, then the
        result is displayed immediately with no roll animation.
    tasks:
      - id: UX-A11Y-011-S01-T01
        title: Confirm UI contract, responsive profile behavior, and actor-safety
          implications for UX-A11Y-011
        kind: design
      - id: UX-A11Y-011-S01-T02
        title: Implement the shared or surface-specific UI behavior for UX-A11Y-011
        kind: implementation
      - id: UX-A11Y-011-S01-T03
        title: Add automated and manual coverage for UX-A11Y-011 acceptance criteria
        kind: test
      - id: UX-A11Y-011-S01-T04
        title: Record demo notes and traceability evidence for UX-A11Y-011
        kind: demo
  - id: UX-A11Y-012-S01
    title: "Screen-reader patterns: dialog, menu, tabs, tree, disclosure, grid"
    requirementIds:
      - UX-A11Y-012
    acceptanceCriteria:
      - Given a modal dialog, when a screen reader user is inside, then Tab key
        never reaches elements behind the dialog.
      - Given a tabs component, when Arrow Left is pressed on the first tab,
        then focus wraps to the last tab and the panel content updates.
      - Given a tree component with collapsed nodes, when Arrow Right is pressed
        on a collapsed node, then the node expands and `aria-expanded` changes
        to `true`.
      - Given a disclosure button, when inspected, then `aria-expanded` value
        accurately reflects whether the controlled content is visible.
      - Given a grid in the combat tracker, when Arrow Down is pressed from a
        cell, then focus moves to the same column in the next row and the cell
        is announced.
    tasks:
      - id: UX-A11Y-012-S01-T01
        title: Confirm UI contract, responsive profile behavior, and actor-safety
          implications for UX-A11Y-012
        kind: design
      - id: UX-A11Y-012-S01-T02
        title: Implement the shared or surface-specific UI behavior for UX-A11Y-012
        kind: implementation
      - id: UX-A11Y-012-S01-T03
        title: Add automated and manual coverage for UX-A11Y-012 acceptance criteria
        kind: test
      - id: UX-A11Y-012-S01-T04
        title: Record demo notes and traceability evidence for UX-A11Y-012
        kind: demo
  - id: UX-A11Y-013-S01
    title: Drag alternatives (WCAG 2.5.7) for all drag operations
    requirementIds:
      - UX-A11Y-013
    acceptanceCriteria:
      - Given a keyboard-only user, when they attempt to reorder initiative,
        then Ctrl+Up/Down or a "Set initiative" number input achieves the
        reorder without drag.
      - Given a keyboard-only user, when they attempt to move a canvas widget,
        then Ctrl+Arrow or a coordinate input achieves the move without drag.
      - Given a user cannot use a drag gesture (motor accessibility), when they
        need to import a file, then a file picker button alternative is
        immediately visible.
    tasks:
      - id: UX-A11Y-013-S01-T01
        title: Confirm UI contract, responsive profile behavior, and actor-safety
          implications for UX-A11Y-013
        kind: design
      - id: UX-A11Y-013-S01-T02
        title: Implement the shared or surface-specific UI behavior for UX-A11Y-013
        kind: implementation
      - id: UX-A11Y-013-S01-T03
        title: Add automated and manual coverage for UX-A11Y-013 acceptance criteria
        kind: test
      - id: UX-A11Y-013-S01-T04
        title: Record demo notes and traceability evidence for UX-A11Y-013
        kind: demo
  - id: UX-A11Y-014-S01
    title: Consistent help (WCAG 3.2.6)
    requirementIds:
      - UX-A11Y-014
    acceptanceCriteria:
      - Given the help trigger is visible on two different routes, when position
        is compared, then both appear in the same relative position in the top
        bar.
      - Given a user presses `?` on any route that supports shortcuts, when the
        keyboard shortcut reference opens, then it opens consistently across all
        routes tested.
    tasks:
      - id: UX-A11Y-014-S01-T01
        title: Confirm UI contract, responsive profile behavior, and actor-safety
          implications for UX-A11Y-014
        kind: design
      - id: UX-A11Y-014-S01-T02
        title: Implement the shared or surface-specific UI behavior for UX-A11Y-014
        kind: implementation
      - id: UX-A11Y-014-S01-T03
        title: Add automated and manual coverage for UX-A11Y-014 acceptance criteria
        kind: test
      - id: UX-A11Y-014-S01-T04
        title: Record demo notes and traceability evidence for UX-A11Y-014
        kind: demo
  - id: UX-A11Y-015-S01
    title: Redundant entry (WCAG 3.3.7) and accessible authentication (WCAG 3.3.8)
    requirementIds:
      - UX-A11Y-015
    acceptanceCriteria:
      - Given a user enters their display name in the session join flow, when a
        subsequent form in the same flow requests a display name, then the field
        is pre-filled with the previously entered value.
      - Given any authentication step exists, when inspected, then no CAPTCHA or
        visual puzzle is the sole option to proceed.
    tasks:
      - id: UX-A11Y-015-S01-T01
        title: Confirm UI contract, responsive profile behavior, and actor-safety
          implications for UX-A11Y-015
        kind: design
      - id: UX-A11Y-015-S01-T02
        title: Implement the shared or surface-specific UI behavior for UX-A11Y-015
        kind: implementation
      - id: UX-A11Y-015-S01-T03
        title: Add automated and manual coverage for UX-A11Y-015 acceptance criteria
        kind: test
      - id: UX-A11Y-015-S01-T04
        title: Record demo notes and traceability evidence for UX-A11Y-015
        kind: demo
qualityBar:
  - "Product fit: the delivered UI follows the canvas-first command platform
    model and never regresses to a document-list home."
  - "Traceability: every mapped UX requirement is tied to implementation, tests,
    and demo evidence."
  - "Foundations first: design tokens, shared components, platform profiles, and
    accessibility primitives are reused rather than reimplemented per surface."
  - "Actor safety: player and observer routes, search, ARIA, errors, skeletons,
    previews, and command results never leak DM-only content."
  - "Platform parity: Desktop, Tablet, and Mobile expose the same Must-have
    commands through profile-appropriate surfaces and the same processing-core
    commands."
  - "Live-play readiness: hot paths acknowledge within 100 ms, support
    undo/retry where appropriate, and stay glanceable under table pressure."
  - "Accessibility: WCAG 2.2 AA, keyboard parity, reduced motion, touch targets,
    non-color state, and screen-reader QA are part of the acceptance bar."
  - "Production polish: empty/loading/error states, responsive constraints,
    visual hierarchy, motion, and help affordances are complete enough to
    share."
gitWorkflow:
  - Start from `git status --short` and work around unrelated local edits unless
    they block the epic.
  - Use one branch per UX epic and keep commits scoped to that epic plus its
    generated UX workpack evidence.
  - Do not hand-edit generated files under `docs/planning/v2/ux` for status
    changes; use the UX workpack commands.
  - Do not reset, overwrite, or reformat unrelated user changes.
  - Before handoff, run targeted tests plus `pnpm v2:ux-workpack:validate` and
    leave no stale generated UX planning diffs.
statusAutomation:
  - Do not hand-edit generated UX epic packets, `status.yaml`,
    `requirements-index.yaml`, `initiative-map.yaml`, or `parallel-batches.yaml`
    for status changes.
  - Use `pnpm v2:ux-workpack:set-status -- --epic
    UX-A11Y-interaction-primitives-and-help-compliance --status active` when
    implementation starts.
  - Create
    `docs/planning/v2/ux/epics/UX-A11Y-interaction-primitives-and-help-compliance.completion.md`
    with demo, tests, traceability, gaps, and git evidence before marking
    complete.
  - Use `pnpm v2:ux-workpack:complete -- --epic
    UX-A11Y-interaction-primitives-and-help-compliance` to update
    `docs/planning/v2/ux/workpack-state.yaml` and regenerate all derived UX
    planning files together.
  - Run `pnpm v2:ux-workpack:validate` after any status or generation command.
testPlan:
  - Run `pnpm v2:ux-workpack:validate` before handoff.
  - Run targeted unit tests for stores, query shaping, route metadata, component
    state, and command dispatch touched by this epic.
  - Run app tests or Playwright coverage for visible route, profile, keyboard,
    touch, empty/loading/error, and player-safe behavior touched by this epic.
  - Run axe and manual accessibility checks when the epic touches focus,
    landmarks, dialogs, menus, tabs, drag alternatives, live regions, or
    screen-reader output.
demoNotesTemplate:
  - Describe the user-visible path demonstrated on Desktop, Tablet, and Mobile
    where applicable.
  - List the UX requirement IDs and acceptance criteria exercised by the demo.
  - Record actor roles used in the demo, especially DM/player/observer safety
    cases.
  - Record remaining polish, research, or product-decision gaps explicitly.
stopConditions:
  - Stop if the epic needs a product decision that the architecture
    reconciliation epic has not resolved.
  - Stop if a UX requirement conflicts with a functional requirement and the
    conflict has not been raised in docs.
  - Stop if a player-visible route, ARIA label, command result, search result,
    preview, skeleton, or error can reveal hidden DM-only content.
  - Stop if a Must-have action is pointer-only, gesture-only, desktop-only, or
    depends on an optional network/cloud/AI feature.
  - Stop if generated UX workpack validation fails and the cause is not
    understood.
completionEvidence:
  - Targeted tests and profile checks pass.
  - Requirement IDs are traced to implementation, tests, and demo notes.
  - Desktop, Tablet, and Mobile behavior is covered or explicitly scoped with a
    reason.
  - Accessibility, actor-safety, no-leak, reduced-motion, touch-target, and
    keyboard parity evidence is recorded where applicable.
  - Completion file records demo path, tests run, changed files, requirement
    coverage, known gaps, git branch/commit or PR, and final `git status
    --short` output.
  - The UX workpack status is updated with the programmatic complete command
    after completion evidence exists.

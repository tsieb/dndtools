stories:
  - id: UX-NAV-001-S01
    title: Command Center is the application home
    requirementIds:
      - UX-NAV-001
    acceptanceCriteria:
      - Given the app launches with a configured vault, when routing completes,
        then `location.pathname` is `/` and the Command Center canvas renders.
      - Given the user is on any other route, when they
        click/tap/keyboard-activate the Command Center nav item, then the route
        transitions to `/` and the active indicator moves to the Command Center
        item within 100 ms.
      - Given a player or observer launches the app, when routing completes,
        then the Command Center item is present and no DM-only section items are
        in the DOM.
    tasks:
      - id: UX-NAV-001-S01-T01
        title: Confirm UI contract, responsive profile behavior, and actor-safety
          implications for UX-NAV-001
        kind: design
      - id: UX-NAV-001-S01-T02
        title: Implement the shared or surface-specific UI behavior for UX-NAV-001
        kind: implementation
      - id: UX-NAV-001-S01-T03
        title: Add automated and manual coverage for UX-NAV-001 acceptance criteria
        kind: test
      - id: UX-NAV-001-S01-T04
        title: Record demo notes and traceability evidence for UX-NAV-001
        kind: demo
  - id: UX-NAV-003-S01
    title: Three-tier navigation hierarchy
    requirementIds:
      - UX-NAV-003
    acceptanceCriteria:
      - Given the user is viewing an entity on Desktop, when all three tiers are
        rendered, then no two tiers overlap and each has a distinct
        `aria-label`.
      - Given the user is on Mobile with a note open, when they tap the
        breadcrumb, then a sheet expands showing the full location path with
        tappable crumbs.
      - Given a keyboard user presses `F6`, when on Tier 1, then focus moves to
        Tier 2; pressing `F6` again moves to Tier 3; pressing `F6` again moves
        to the main content area.
    tasks:
      - id: UX-NAV-003-S01-T01
        title: Confirm UI contract, responsive profile behavior, and actor-safety
          implications for UX-NAV-003
        kind: design
      - id: UX-NAV-003-S01-T02
        title: Implement the shared or surface-specific UI behavior for UX-NAV-003
        kind: implementation
      - id: UX-NAV-003-S01-T03
        title: Add automated and manual coverage for UX-NAV-003 acceptance criteria
        kind: test
      - id: UX-NAV-003-S01-T04
        title: Record demo notes and traceability evidence for UX-NAV-003
        kind: demo
  - id: UX-NAV-004-S01
    title: Persistent sidebar on Desktop; icon-rail collapse mode
    requirementIds:
      - UX-NAV-004
    acceptanceCriteria:
      - Given Desktop, when the user clicks the collapse toggle, then the
        sidebar animates to 56 px and section labels are hidden but tooltips
        appear on focus.
      - Given icon-rail mode, when the user focuses a nav item via keyboard,
        then the tooltip appears within 300 ms with the section label.
      - Given the user refreshes the page, when the app loads, then the sidebar
        width is restored to the last saved state.
      - "Given `prefers-reduced-motion: reduce`, when the sidebar is toggled,
        then width changes instantly without animation."
    tasks:
      - id: UX-NAV-004-S01-T01
        title: Confirm UI contract, responsive profile behavior, and actor-safety
          implications for UX-NAV-004
        kind: design
      - id: UX-NAV-004-S01-T02
        title: Implement the shared or surface-specific UI behavior for UX-NAV-004
        kind: implementation
      - id: UX-NAV-004-S01-T03
        title: Add automated and manual coverage for UX-NAV-004 acceptance criteria
        kind: test
      - id: UX-NAV-004-S01-T04
        title: Record demo notes and traceability evidence for UX-NAV-004
        kind: demo
  - id: UX-NAV-005-S01
    title: "Tablet navigation: rail (landscape) and tab bar (portrait)"
    requirementIds:
      - UX-NAV-005
    acceptanceCriteria:
      - Given Tablet in landscape, when rendered, then a vertical rail of
        icon+label items is present and no hamburger menu exists.
      - Given Tablet in portrait, when rendered, then a bottom tab bar with ≤ 5
        items is present and the "More" button reveals remaining sections in a
        sheet.
      - Given a keyboard user on Tablet (external keyboard), when they press
        `Alt+3`, then the app navigates to Characters.
    tasks:
      - id: UX-NAV-005-S01-T01
        title: Confirm UI contract, responsive profile behavior, and actor-safety
          implications for UX-NAV-005
        kind: design
      - id: UX-NAV-005-S01-T02
        title: Implement the shared or surface-specific UI behavior for UX-NAV-005
        kind: implementation
      - id: UX-NAV-005-S01-T03
        title: Add automated and manual coverage for UX-NAV-005 acceptance criteria
        kind: test
      - id: UX-NAV-005-S01-T04
        title: Record demo notes and traceability evidence for UX-NAV-005
        kind: demo
  - id: UX-NAV-006-S01
    title: "Mobile navigation: bottom tab bar and section sheets"
    requirementIds:
      - UX-NAV-006
    acceptanceCriteria:
      - Given Mobile profile, when the app renders, then a bottom tab bar with
        exactly 5 items (or fewer if the actor role hides sections) is visible.
      - Given the user taps "More", when the sheet opens, then remaining
        sections are listed, focus moves to the sheet, and `Escape` closes it.
      - Given a full-screen map is active, when the user enters focus mode, then
        the tab bar is hidden and a floating "Exit focus mode" button (≥ 44 × 44
        px) is present.
    tasks:
      - id: UX-NAV-006-S01-T01
        title: Confirm UI contract, responsive profile behavior, and actor-safety
          implications for UX-NAV-006
        kind: design
      - id: UX-NAV-006-S01-T02
        title: Implement the shared or surface-specific UI behavior for UX-NAV-006
        kind: implementation
      - id: UX-NAV-006-S01-T03
        title: Add automated and manual coverage for UX-NAV-006 acceptance criteria
        kind: test
      - id: UX-NAV-006-S01-T04
        title: Record demo notes and traceability evidence for UX-NAV-006
        kind: demo
  - id: UX-NAV-009-S01
    title: Skip-to-content and landmark structure
    requirementIds:
      - UX-NAV-009
    acceptanceCriteria:
      - Given any route, when the page renders and the user presses `Tab` once,
        then the skip link is visible and focusable.
      - Given the user activates the skip link, when focus moves, then
        `document.activeElement` is `#main-content` or the first focusable child
        within it.
      - Given `axe-core` runs on any route, when landmark audit completes, then
        0 landmark violations are reported.
    tasks:
      - id: UX-NAV-009-S01-T01
        title: Confirm UI contract, responsive profile behavior, and actor-safety
          implications for UX-NAV-009
        kind: design
      - id: UX-NAV-009-S01-T02
        title: Implement the shared or surface-specific UI behavior for UX-NAV-009
        kind: implementation
      - id: UX-NAV-009-S01-T03
        title: Add automated and manual coverage for UX-NAV-009 acceptance criteria
        kind: test
      - id: UX-NAV-009-S01-T04
        title: Record demo notes and traceability evidence for UX-NAV-009
        kind: demo
  - id: UX-NAV-010-S01
    title: Single `h1` and stable page title per route
    requirementIds:
      - UX-NAV-010
    acceptanceCriteria:
      - Given any primary route, when the page renders, then exactly one `<h1>`
        element exists in the DOM and `document.title` matches the `<Entity or
        Section> — DND Tools` format.
      - Given the user navigates from Session to Knowledge, when the route
        transition completes, then `document.title` updates to `"Knowledge — DND
        Tools"` before the live region fires.
    tasks:
      - id: UX-NAV-010-S01-T01
        title: Confirm UI contract, responsive profile behavior, and actor-safety
          implications for UX-NAV-010
        kind: design
      - id: UX-NAV-010-S01-T02
        title: Implement the shared or surface-specific UI behavior for UX-NAV-010
        kind: implementation
      - id: UX-NAV-010-S01-T03
        title: Add automated and manual coverage for UX-NAV-010 acceptance criteria
        kind: test
      - id: UX-NAV-010-S01-T04
        title: Record demo notes and traceability evidence for UX-NAV-010
        kind: demo
  - id: UX-NAV-011-S01
    title: Live route announcement
    requirementIds:
      - UX-NAV-011
    acceptanceCriteria:
      - Given a screen reader is active and the user navigates from Command
        Center to Atlas, when the route transition completes, then the screen
        reader announces "Atlas — DND Tools".
      - Given a hash-anchor navigation fires, when the anchor target is focused,
        then the route announcer does not fire (no duplicate announcement).
      - Given a route transition begins and content is not yet loaded, when the
        announcer fires, then it says "Loading Atlas…" followed by "Atlas — DND
        Tools" when content is ready.
    tasks:
      - id: UX-NAV-011-S01-T01
        title: Confirm UI contract, responsive profile behavior, and actor-safety
          implications for UX-NAV-011
        kind: design
      - id: UX-NAV-011-S01-T02
        title: Implement the shared or surface-specific UI behavior for UX-NAV-011
        kind: implementation
      - id: UX-NAV-011-S01-T03
        title: Add automated and manual coverage for UX-NAV-011 acceptance criteria
        kind: test
      - id: UX-NAV-011-S01-T04
        title: Record demo notes and traceability evidence for UX-NAV-011
        kind: demo
  - id: UX-NAV-018-S01
    title: Input modality detection and focus-ring policy
    requirementIds:
      - UX-NAV-018
    acceptanceCriteria:
      - Given the user navigates with Tab key, when a nav item receives focus,
        then a visible focus ring (2 px, `--color-focus-ring`) appears around
        it.
      - Given the user clicks a nav item with a mouse, when focus moves to that
        item, then no focus ring is visible (only the active/selected state
        indicator).
      - Given a touch user on Mobile taps a tab bar item, when it is activated,
        then no focus ring appears, and the touch target area is ≥ 44 × 44 CSS
        px.
      - Given `data-input-modality` is `"touch"`, when a hover tooltip would
        normally appear on pointer modality, then the tooltip does not appear.
    tasks:
      - id: UX-NAV-018-S01-T01
        title: Confirm UI contract, responsive profile behavior, and actor-safety
          implications for UX-NAV-018
        kind: design
      - id: UX-NAV-018-S01-T02
        title: Implement the shared or surface-specific UI behavior for UX-NAV-018
        kind: implementation
      - id: UX-NAV-018-S01-T03
        title: Add automated and manual coverage for UX-NAV-018 acceptance criteria
        kind: test
      - id: UX-NAV-018-S01-T04
        title: Record demo notes and traceability evidence for UX-NAV-018
        kind: demo
qualityBar:
  - "Product fit: the delivered UI follows the canvas-first command platform
    model and never regresses to a document-list home."
  - "Traceability: every mapped UX requirement is tied to implementation, tests,
    and demo evidence."
  - "Foundations first: design tokens, shared components, platform profiles, and
    accessibility primitives are reused rather than reimplemented per surface."
  - "Actor safety: player and observer routes, search, ARIA, errors, skeletons,
    previews, and command results never leak DM-only content."
  - "Platform parity: Desktop, Tablet, and Mobile expose the same Must-have
    commands through profile-appropriate surfaces and the same processing-core
    commands."
  - "Live-play readiness: hot paths acknowledge within 100 ms, support
    undo/retry where appropriate, and stay glanceable under table pressure."
  - "Accessibility: WCAG 2.2 AA, keyboard parity, reduced motion, touch targets,
    non-color state, and screen-reader QA are part of the acceptance bar."
  - "Production polish: empty/loading/error states, responsive constraints,
    visual hierarchy, motion, and help affordances are complete enough to
    share."
gitWorkflow:
  - Start from `git status --short` and work around unrelated local edits unless
    they block the epic.
  - Use one branch per UX epic and keep commits scoped to that epic plus its
    generated UX workpack evidence.
  - Do not hand-edit generated files under `docs/planning/v2/ux` for status
    changes; use the UX workpack commands.
  - Do not reset, overwrite, or reformat unrelated user changes.
  - Before handoff, run targeted tests plus `pnpm v2:ux-workpack:validate` and
    leave no stale generated UX planning diffs.
statusAutomation:
  - Do not hand-edit generated UX epic packets, `status.yaml`,
    `requirements-index.yaml`, `initiative-map.yaml`, or `parallel-batches.yaml`
    for status changes.
  - Use `pnpm v2:ux-workpack:set-status -- --epic
    UX-SHELL-route-layout-and-platform-profiles --status active` when
    implementation starts.
  - Create
    `docs/planning/v2/ux/epics/UX-SHELL-route-layout-and-platform-profiles.completion.md`
    with demo, tests, traceability, gaps, and git evidence before marking
    complete.
  - Use `pnpm v2:ux-workpack:complete -- --epic
    UX-SHELL-route-layout-and-platform-profiles` to update
    `docs/planning/v2/ux/workpack-state.yaml` and regenerate all derived UX
    planning files together.
  - Run `pnpm v2:ux-workpack:validate` after any status or generation command.
testPlan:
  - Run `pnpm v2:ux-workpack:validate` before handoff.
  - Run targeted unit tests for stores, query shaping, route metadata, component
    state, and command dispatch touched by this epic.
  - Run app tests or Playwright coverage for visible route, profile, keyboard,
    touch, empty/loading/error, and player-safe behavior touched by this epic.
  - Run axe and manual accessibility checks when the epic touches focus,
    landmarks, dialogs, menus, tabs, drag alternatives, live regions, or
    screen-reader output.
demoNotesTemplate:
  - Describe the user-visible path demonstrated on Desktop, Tablet, and Mobile
    where applicable.
  - List the UX requirement IDs and acceptance criteria exercised by the demo.
  - Record actor roles used in the demo, especially DM/player/observer safety
    cases.
  - Record remaining polish, research, or product-decision gaps explicitly.
stopConditions:
  - Stop if the epic needs a product decision that the architecture
    reconciliation epic has not resolved.
  - Stop if a UX requirement conflicts with a functional requirement and the
    conflict has not been raised in docs.
  - Stop if a player-visible route, ARIA label, command result, search result,
    preview, skeleton, or error can reveal hidden DM-only content.
  - Stop if a Must-have action is pointer-only, gesture-only, desktop-only, or
    depends on an optional network/cloud/AI feature.
  - Stop if generated UX workpack validation fails and the cause is not
    understood.
completionEvidence:
  - Targeted tests and profile checks pass.
  - Requirement IDs are traced to implementation, tests, and demo notes.
  - Desktop, Tablet, and Mobile behavior is covered or explicitly scoped with a
    reason.
  - Accessibility, actor-safety, no-leak, reduced-motion, touch-target, and
    keyboard parity evidence is recorded where applicable.
  - Completion file records demo path, tests run, changed files, requirement
    coverage, known gaps, git branch/commit or PR, and final `git status
    --short` output.
  - The UX workpack status is updated with the programmatic complete command
    after completion evidence exists.
completionEvidenceFile: docs/planning/v2/ux/epics/UX-SHELL-route-layout-and-platform-profiles.completion.md

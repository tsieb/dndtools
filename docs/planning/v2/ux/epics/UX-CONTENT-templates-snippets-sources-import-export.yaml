schemaVersion: 1
kind: ux-ui-remake-epic
id: UX-CONTENT-templates-snippets-sources-import-export
title: Templates, Snippets, Sources, Import, and Export
status: approved
approved: true
phase: 06 Core Library Workspaces
productPriority: P1
domain: UX-CONTENT
objective: Add the production content-management flows for templates, snippets,
  source-of-truth indicators, pre-write diagnostics, import previews, and export
  validation reports.
requirementIds:
  - UX-CONTENT-011
  - UX-CONTENT-012
  - UX-CONTENT-013
  - UX-CONTENT-014
  - UX-CONTENT-015
  - UX-CONTENT-018
sourceDocs:
  - docs/remake-review/ux-requirements/00-overview-and-principles.md
  - docs/remake-review/ux-requirements/09-content-authoring-and-sources.md
  - docs/remake-review/ux-requirements/16-ideal-gui-architecture.md
  - docs/remake-review/ux-requirements/README.md
expectedAffectedAreas:
  - template library
  - snippet library
  - source badges
  - source constraint panel
  - import wizard
  - export wizard
dependencies:
  - UX-CONTENT-editor-shell-and-writing-controls
parallelSafety:
  fileOwnership:
    - docs/planning/v2/ux/
    - apps/v2/app/src/lib/gui/ux-content/
    - apps/v2/app/src/routes/
  notes: Parallel execution is safe only with non-overlapping component, route,
    and generated UX workpack ownership; shared shell/component contracts must
    be agreed before implementation.
stories:
  - id: UX-CONTENT-011-S01
    title: Template library and create-from-template flow
    requirementIds:
      - UX-CONTENT-011
    acceptanceCriteria:
      - Given a template preset has two required variables and one is left
        empty, when the form is displayed, then the "Create from template"
        button is disabled.
      - Given all required variables are filled, when the user clicks "Create
        from template", then the note is created with `dm-only` visibility (or
        the preset default) and the editor opens.
      - Given the Session Recap preset, when Session number and Date variables
        are filled, then the live preview shows the generated recap structure
        before commit.
    tasks:
      - id: UX-CONTENT-011-S01-T01
        title: Confirm UI contract, responsive profile behavior, and actor-safety
          implications for UX-CONTENT-011
        kind: design
      - id: UX-CONTENT-011-S01-T02
        title: Implement the shared or surface-specific UI behavior for UX-CONTENT-011
        kind: implementation
      - id: UX-CONTENT-011-S01-T03
        title: Add automated and manual coverage for UX-CONTENT-011 acceptance criteria
        kind: test
      - id: UX-CONTENT-011-S01-T04
        title: Record demo notes and traceability evidence for UX-CONTENT-011
        kind: demo
  - id: UX-CONTENT-012-S01
    title: Snippet library and insert flow
    requirementIds:
      - UX-CONTENT-012
    acceptanceCriteria:
      - Given a snippet is inserted into a `player-visible` note, when the
        insert completes, then the snippet content is subject to the same
        visibility as the note and is not independently `dm-only`.
      - Given a snippet with a `<script>` tag in its body, when insertion is
        attempted, then an error toast appears and the note body is unchanged.
      - Given position "At caret" is selected, when the snippet is inserted,
        then the snippet content appears at the current caret position.
    tasks:
      - id: UX-CONTENT-012-S01-T01
        title: Confirm UI contract, responsive profile behavior, and actor-safety
          implications for UX-CONTENT-012
        kind: design
      - id: UX-CONTENT-012-S01-T02
        title: Implement the shared or surface-specific UI behavior for UX-CONTENT-012
        kind: implementation
      - id: UX-CONTENT-012-S01-T03
        title: Add automated and manual coverage for UX-CONTENT-012 acceptance criteria
        kind: test
      - id: UX-CONTENT-012-S01-T04
        title: Record demo notes and traceability evidence for UX-CONTENT-012
        kind: demo
  - id: UX-CONTENT-013-S01
    title: Source-of-truth badge and indicator
    requirementIds:
      - UX-CONTENT-013
    acceptanceCriteria:
      - Given an Obsidian-sourced note is open in the editor, when the Obsidian
        vault directory is unreachable, then the badge shows an `unavailable`
        (grey) status dot within 5 s of the connection loss.
      - Given the user taps/clicks the badge, then a popover opens with the
        source name, sync status, and last-synced time.
      - Given Mobile profile, when the note list loads, then each row shows only
        the source icon + status dot (no label text).
    tasks:
      - id: UX-CONTENT-013-S01-T01
        title: Confirm UI contract, responsive profile behavior, and actor-safety
          implications for UX-CONTENT-013
        kind: design
      - id: UX-CONTENT-013-S01-T02
        title: Implement the shared or surface-specific UI behavior for UX-CONTENT-013
        kind: implementation
      - id: UX-CONTENT-013-S01-T03
        title: Add automated and manual coverage for UX-CONTENT-013 acceptance criteria
        kind: test
      - id: UX-CONTENT-013-S01-T04
        title: Record demo notes and traceability evidence for UX-CONTENT-013
        kind: demo
  - id: UX-CONTENT-014-S01
    title: Pre-write source-constraint diagnostic panel
    requirementIds:
      - UX-CONTENT-014
    acceptanceCriteria:
      - Given a note with wikilinks is being written back to Google Docs, when
        the user triggers save, then the constraint panel appears listing
        "[[wikilinks]] — Unsupported — Will be dropped".
      - Given the constraint panel is shown and the user edits the note body,
        then the acknowledgment checkbox is unchecked and the write button is
        re-disabled.
      - Given the user checks the acknowledgment and clicks "Write to Google
        Docs", then the write proceeds and a success chip appears; if the write
        fails, an error state is shown in the chip.
    tasks:
      - id: UX-CONTENT-014-S01-T01
        title: Confirm UI contract, responsive profile behavior, and actor-safety
          implications for UX-CONTENT-014
        kind: design
      - id: UX-CONTENT-014-S01-T02
        title: Implement the shared or surface-specific UI behavior for UX-CONTENT-014
        kind: implementation
      - id: UX-CONTENT-014-S01-T03
        title: Add automated and manual coverage for UX-CONTENT-014 acceptance criteria
        kind: test
      - id: UX-CONTENT-014-S01-T04
        title: Record demo notes and traceability evidence for UX-CONTENT-014
        kind: demo
  - id: UX-CONTENT-015-S01
    title: Import wizard (conflict preview, policy selection, progress)
    requirementIds:
      - UX-CONTENT-015
    acceptanceCriteria:
      - Given the user reaches Step 2 with 3 collisions, then the
        conflict-preview table shows exactly 3 rows, each with the resolved
        action.
      - Given a row's global action is "Skip", when the user overrides it to
        "Overwrite" via the per-item dropdown, then that row's action changes
        and the summary bar updates.
      - Given the import is interrupted at 40 %, when the wizard is reopened,
        then a "Resume previous import" banner appears with the checkpoint
        state.
    tasks:
      - id: UX-CONTENT-015-S01-T01
        title: Confirm UI contract, responsive profile behavior, and actor-safety
          implications for UX-CONTENT-015
        kind: design
      - id: UX-CONTENT-015-S01-T02
        title: Implement the shared or surface-specific UI behavior for UX-CONTENT-015
        kind: implementation
      - id: UX-CONTENT-015-S01-T03
        title: Add automated and manual coverage for UX-CONTENT-015 acceptance criteria
        kind: test
      - id: UX-CONTENT-015-S01-T04
        title: Record demo notes and traceability evidence for UX-CONTENT-015
        kind: demo
  - id: UX-CONTENT-018-S01
    title: Export wizard (portable vs. DM backup, validation report)
    requirementIds:
      - UX-CONTENT-018
    acceptanceCriteria:
      - Given portable export is run, when the package is generated, then no
        note with `dm-only` visibility appears in the exported files.
      - "Given DM backup export is run, when the package is generated, then all
        selected notes including `dm-only` appear, and the validation report is
        present and marked `clean: true` if no leaks are detected."
      - Given a note contains a device-local absolute path, when any export
        runs, then the path is scrubbed and the validation report logs the
        redaction.
    tasks:
      - id: UX-CONTENT-018-S01-T01
        title: Confirm UI contract, responsive profile behavior, and actor-safety
          implications for UX-CONTENT-018
        kind: design
      - id: UX-CONTENT-018-S01-T02
        title: Implement the shared or surface-specific UI behavior for UX-CONTENT-018
        kind: implementation
      - id: UX-CONTENT-018-S01-T03
        title: Add automated and manual coverage for UX-CONTENT-018 acceptance criteria
        kind: test
      - id: UX-CONTENT-018-S01-T04
        title: Record demo notes and traceability evidence for UX-CONTENT-018
        kind: demo
qualityBar:
  - "Product fit: the delivered UI follows the canvas-first command platform
    model and never regresses to a document-list home."
  - "Traceability: every mapped UX requirement is tied to implementation, tests,
    and demo evidence."
  - "Foundations first: design tokens, shared components, platform profiles, and
    accessibility primitives are reused rather than reimplemented per surface."
  - "Actor safety: player and observer routes, search, ARIA, errors, skeletons,
    previews, and command results never leak DM-only content."
  - "Platform parity: Desktop, Tablet, and Mobile expose the same Must-have
    commands through profile-appropriate surfaces and the same processing-core
    commands."
  - "Live-play readiness: hot paths acknowledge within 100 ms, support
    undo/retry where appropriate, and stay glanceable under table pressure."
  - "Accessibility: WCAG 2.2 AA, keyboard parity, reduced motion, touch targets,
    non-color state, and screen-reader QA are part of the acceptance bar."
  - "Production polish: empty/loading/error states, responsive constraints,
    visual hierarchy, motion, and help affordances are complete enough to
    share."
gitWorkflow:
  - Start from `git status --short` and work around unrelated local edits unless
    they block the epic.
  - Use one branch per UX epic and keep commits scoped to that epic plus its
    generated UX workpack evidence.
  - Do not hand-edit generated files under `docs/planning/v2/ux` for status
    changes; use the UX workpack commands.
  - Do not reset, overwrite, or reformat unrelated user changes.
  - Before handoff, run targeted tests plus `pnpm v2:ux-workpack:validate` and
    leave no stale generated UX planning diffs.
statusAutomation:
  - Do not hand-edit generated UX epic packets, `status.yaml`,
    `requirements-index.yaml`, `initiative-map.yaml`, or `parallel-batches.yaml`
    for status changes.
  - Use `pnpm v2:ux-workpack:set-status -- --epic
    UX-CONTENT-templates-snippets-sources-import-export --status active` when
    implementation starts.
  - Create
    `docs/planning/v2/ux/epics/UX-CONTENT-templates-snippets-sources-import-export.completion.md`
    with demo, tests, traceability, gaps, and git evidence before marking
    complete.
  - Use `pnpm v2:ux-workpack:complete -- --epic
    UX-CONTENT-templates-snippets-sources-import-export` to update
    `docs/planning/v2/ux/workpack-state.yaml` and regenerate all derived UX
    planning files together.
  - Run `pnpm v2:ux-workpack:validate` after any status or generation command.
testPlan:
  - Run `pnpm v2:ux-workpack:validate` before handoff.
  - Run targeted unit tests for stores, query shaping, route metadata, component
    state, and command dispatch touched by this epic.
  - Run app tests or Playwright coverage for visible route, profile, keyboard,
    touch, empty/loading/error, and player-safe behavior touched by this epic.
  - Run axe and manual accessibility checks when the epic touches focus,
    landmarks, dialogs, menus, tabs, drag alternatives, live regions, or
    screen-reader output.
demoNotesTemplate:
  - Describe the user-visible path demonstrated on Desktop, Tablet, and Mobile
    where applicable.
  - List the UX requirement IDs and acceptance criteria exercised by the demo.
  - Record actor roles used in the demo, especially DM/player/observer safety
    cases.
  - Record remaining polish, research, or product-decision gaps explicitly.
stopConditions:
  - Stop if the epic needs a product decision that the architecture
    reconciliation epic has not resolved.
  - Stop if a UX requirement conflicts with a functional requirement and the
    conflict has not been raised in docs.
  - Stop if a player-visible route, ARIA label, command result, search result,
    preview, skeleton, or error can reveal hidden DM-only content.
  - Stop if a Must-have action is pointer-only, gesture-only, desktop-only, or
    depends on an optional network/cloud/AI feature.
  - Stop if generated UX workpack validation fails and the cause is not
    understood.
completionEvidence:
  - Targeted tests and profile checks pass.
  - Requirement IDs are traced to implementation, tests, and demo notes.
  - Desktop, Tablet, and Mobile behavior is covered or explicitly scoped with a
    reason.
  - Accessibility, actor-safety, no-leak, reduced-motion, touch-target, and
    keyboard parity evidence is recorded where applicable.
  - Completion file records demo path, tests run, changed files, requirement
    coverage, known gaps, git branch/commit or PR, and final `git status
    --short` output.
  - The UX workpack status is updated with the programmatic complete command
    after completion evidence exists.

stories:
  - id: UX-PERM-002-S01
    title: "Capability-set grant dialog: person → entity → set → preview → grant"
    requirementIds:
      - UX-PERM-002
    acceptanceCriteria:
      - Given the DM selects "Combat Participant" for a character, when the
        preview renders, then writable combat fields and excluded non-combat
        fields are listed accurately.
      - Given the DM submits a grant for "Owner" when another player already
        holds it, when validation runs, then an inline conflict error is shown
        and the grant is not submitted.
      - Given a capability set is invalid for the selected entity type, when the
        DM selects it, then it is shown with strikethrough and the Grant button
        is disabled.
      - Given the DM opens "Manage Access" from a character's context menu, when
        the dialog opens, then that character is pre-populated in the Entity
        field.
    tasks:
      - id: UX-PERM-002-S01-T01
        title: Confirm UI contract, responsive profile behavior, and actor-safety
          implications for UX-PERM-002
        kind: design
      - id: UX-PERM-002-S01-T02
        title: Implement the shared or surface-specific UI behavior for UX-PERM-002
        kind: implementation
      - id: UX-PERM-002-S01-T03
        title: Add automated and manual coverage for UX-PERM-002 acceptance criteria
        kind: test
      - id: UX-PERM-002-S01-T04
        title: Record demo notes and traceability evidence for UX-PERM-002
        kind: demo
  - id: UX-PERM-003-S01
    title: Active grant list and revocation
    requirementIds:
      - UX-PERM-003
    acceptanceCriteria:
      - Given an active grant is listed, when the DM taps "Revoke", then an
        inline confirmation appears (no modal) before the revoke command is
        dispatched.
      - Given revocation succeeds, when the animation completes, then the row is
        removed and a `aria-live` announcement is made.
      - Given a grant expires within 2 hours, when the list renders, then the
        row shows a "Expiring soon" warning chip.
    tasks:
      - id: UX-PERM-003-S01-T01
        title: Confirm UI contract, responsive profile behavior, and actor-safety
          implications for UX-PERM-003
        kind: design
      - id: UX-PERM-003-S01-T02
        title: Implement the shared or surface-specific UI behavior for UX-PERM-003
        kind: implementation
      - id: UX-PERM-003-S01-T03
        title: Add automated and manual coverage for UX-PERM-003 acceptance criteria
        kind: test
      - id: UX-PERM-003-S01-T04
        title: Record demo notes and traceability evidence for UX-PERM-003
        kind: demo
  - id: UX-PERM-004-S01
    title: 'Permission summary: player-facing "Your permissions" panel'
    requirementIds:
      - UX-PERM-004
    acceptanceCriteria:
      - Given a player opens "My permissions", when the panel renders, then
        their role, editing capability, and character data access are shown in
        plain language with no DM-internal details.
      - Given an observer opens "My permissions", when the panel renders, then
        no character data row is present.
      - Given a player's role was normalized, when the panel renders, then the
        normalized-role notice appears with a safe reason string.
    tasks:
      - id: UX-PERM-004-S01-T01
        title: Confirm UI contract, responsive profile behavior, and actor-safety
          implications for UX-PERM-004
        kind: design
      - id: UX-PERM-004-S01-T02
        title: Implement the shared or surface-specific UI behavior for UX-PERM-004
        kind: implementation
      - id: UX-PERM-004-S01-T03
        title: Add automated and manual coverage for UX-PERM-004 acceptance criteria
        kind: test
      - id: UX-PERM-004-S01-T04
        title: Record demo notes and traceability evidence for UX-PERM-004
        kind: demo
  - id: UX-PERM-005-S01
    title: DM permission consistency diagnostics panel
    requirementIds:
      - UX-PERM-005
    acceptanceCriteria:
      - Given a player has a write grant on a `dm-only` note, when the DM opens
        "Permission health", then the problem is listed with a "Fix this" link
        that opens the grant dialog for that grant.
      - Given the DM resolves all problems, when the panel updates, then the
        "All clear" state is shown.
      - Given a player's command is denied by a consistency check, when the
        denial message is shown to the player, then it contains no hidden entity
        title or permission detail.
    tasks:
      - id: UX-PERM-005-S01-T01
        title: Confirm UI contract, responsive profile behavior, and actor-safety
          implications for UX-PERM-005
        kind: design
      - id: UX-PERM-005-S01-T02
        title: Implement the shared or surface-specific UI behavior for UX-PERM-005
        kind: implementation
      - id: UX-PERM-005-S01-T03
        title: Add automated and manual coverage for UX-PERM-005 acceptance criteria
        kind: test
      - id: UX-PERM-005-S01-T04
        title: Record demo notes and traceability evidence for UX-PERM-005
        kind: demo
qualityBar:
  - "Product fit: the delivered UI follows the canvas-first command platform
    model and never regresses to a document-list home."
  - "Traceability: every mapped UX requirement is tied to implementation, tests,
    and demo evidence."
  - "Foundations first: design tokens, shared components, platform profiles, and
    accessibility primitives are reused rather than reimplemented per surface."
  - "Actor safety: player and observer routes, search, ARIA, errors, skeletons,
    previews, and command results never leak DM-only content."
  - "Platform parity: Desktop, Tablet, and Mobile expose the same Must-have
    commands through profile-appropriate surfaces and the same processing-core
    commands."
  - "Live-play readiness: hot paths acknowledge within 100 ms, support
    undo/retry where appropriate, and stay glanceable under table pressure."
  - "Accessibility: WCAG 2.2 AA, keyboard parity, reduced motion, touch targets,
    non-color state, and screen-reader QA are part of the acceptance bar."
  - "Production polish: empty/loading/error states, responsive constraints,
    visual hierarchy, motion, and help affordances are complete enough to
    share."
gitWorkflow:
  - Start from `git status --short` and work around unrelated local edits unless
    they block the epic.
  - Use one branch per UX epic and keep commits scoped to that epic plus its
    generated UX workpack evidence.
  - Do not hand-edit generated files under `docs/planning/v2/ux` for status
    changes; use the UX workpack commands.
  - Do not reset, overwrite, or reformat unrelated user changes.
  - Before handoff, run targeted tests plus `pnpm ux-workpack:validate` and
    leave no stale generated UX planning diffs.
statusAutomation:
  - Do not hand-edit generated UX epic packets, `status.yaml`,
    `requirements-index.yaml`, `initiative-map.yaml`, or `parallel-batches.yaml`
    for status changes.
  - Use `pnpm ux-workpack:set-status -- --epic
    UX-PERM-grant-dialog-active-grants-and-diagnostics --status active` when
    implementation starts.
  - Create
    `docs/planning/v2/ux/epics/UX-PERM-grant-dialog-active-grants-and-diagnostics.completion.md`
    with demo, tests, traceability, gaps, and git evidence before marking
    complete.
  - Use `pnpm ux-workpack:complete -- --epic
    UX-PERM-grant-dialog-active-grants-and-diagnostics` to update
    `docs/planning/v2/ux/workpack-state.yaml` and regenerate all derived UX
    planning files together.
  - Run `pnpm ux-workpack:validate` after any status or generation command.
testPlan:
  - Run `pnpm ux-workpack:validate` before handoff.
  - Run targeted unit tests for stores, query shaping, route metadata, component
    state, and command dispatch touched by this epic.
  - Run app tests or Playwright coverage for visible route, profile, keyboard,
    touch, empty/loading/error, and player-safe behavior touched by this epic.
  - Run axe and manual accessibility checks when the epic touches focus,
    landmarks, dialogs, menus, tabs, drag alternatives, live regions, or
    screen-reader output.
  - Run DM/player/observer no-leak fixtures across DOM, ARIA, command palette,
    search, and previews touched by this epic.
demoNotesTemplate:
  - Describe the user-visible path demonstrated on Desktop, Tablet, and Mobile
    where applicable.
  - List the UX requirement IDs and acceptance criteria exercised by the demo.
  - Record actor roles used in the demo, especially DM/player/observer safety
    cases.
  - Record remaining polish, research, or product-decision gaps explicitly.
stopConditions:
  - Stop if the epic needs a product decision that the architecture
    reconciliation epic has not resolved.
  - Stop if a UX requirement conflicts with a functional requirement and the
    conflict has not been raised in docs.
  - Stop if a player-visible route, ARIA label, command result, search result,
    preview, skeleton, or error can reveal hidden DM-only content.
  - Stop if a Must-have action is pointer-only, gesture-only, desktop-only, or
    depends on an optional network/cloud/AI feature.
  - Stop if generated UX workpack validation fails and the cause is not
    understood.
completionEvidence:
  - Targeted tests and profile checks pass.
  - Requirement IDs are traced to implementation, tests, and demo notes.
  - Desktop, Tablet, and Mobile behavior is covered or explicitly scoped with a
    reason.
  - Accessibility, actor-safety, no-leak, reduced-motion, touch-target, and
    keyboard parity evidence is recorded where applicable.
  - Completion file records demo path, tests run, changed files, requirement
    coverage, known gaps, git branch/commit or PR, and final `git status
    --short` output.
  - The UX workpack status is updated with the programmatic complete command
    after completion evidence exists.
completionEvidenceFile: docs/planning/v2/ux/epics/UX-PERM-grant-dialog-active-grants-and-diagnostics.completion.md

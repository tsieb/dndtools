parallelSafety:
  fileOwnership:
    - docs/planning/v2/ux/
    - apps/gm/src/lib/gui/ux-mcp/
    - apps/gm/src/routes/
  notes: Parallel execution is safe only with non-overlapping component, route,
    and generated UX workpack ownership; shared shell/component contracts must
    be agreed before implementation.
stories:
  - id: UX-MCP-002-S01
    title: Inline AI writing suggestion panel in the content editor
    requirementIds:
      - UX-MCP-002
    acceptanceCriteria:
      - Given the user opens the inline AI panel and generates a suggestion,
        when the suggestion arrives, then no change to the editor content has
        occurred until the user presses Accept.
      - Given the user presses Escape, when the suggestion is visible, then the
        card dismisses and editor focus returns to the caret position, with no
        change to content.
      - Given the user accepts a multi-line suggestion, when Accept all is
        clicked, then the undo stack contains an entry titled "Accept AI
        suggestion" that fully reverts the change.
      - Given the suggestion card is open, when the user presses Tab, then the
        ghost text or full suggestion is accepted and inserted, matching the
        keyboard model from reference [4].
      - Given AI is disabled, when the editor is open, then no sparkle icon,
        selection mini-toolbar, or keyboard shortcut triggers any AI action.
    tasks:
      - id: UX-MCP-002-S01-T01
        title: Confirm UI contract, responsive profile behavior, and actor-safety
          implications for UX-MCP-002
        kind: design
      - id: UX-MCP-002-S01-T02
        title: Implement the shared or surface-specific UI behavior for UX-MCP-002
        kind: implementation
      - id: UX-MCP-002-S01-T03
        title: Add automated and manual coverage for UX-MCP-002 acceptance criteria
        kind: test
      - id: UX-MCP-002-S01-T04
        title: Record demo notes and traceability evidence for UX-MCP-002
        kind: demo
  - id: UX-MCP-003-S01
    title: Named-entity extraction suggestion chips
    requirementIds:
      - UX-MCP-003
    acceptanceCriteria:
      - Given the user types a new character name in the editor and pauses for 2
        s, when entity extraction runs, then a chip for that name appears in the
        sidebar without any graph link or entity record being created.
      - Given the user clicks Dismiss on a chip, when the editor session
        continues, then the chip disappears and the same entity name does not
        re-appear as a chip in the same editor session.
      - Given AI is disabled, when the user authors content with named entities,
        then no extraction chips appear and the sidebar section is absent.
      - Given the user clicks [Create new] on a chip, when the quick-create
        panel is submitted, then an entity record is created and a graph link is
        established; the chip is then removed.
    tasks:
      - id: UX-MCP-003-S01-T01
        title: Confirm UI contract, responsive profile behavior, and actor-safety
          implications for UX-MCP-003
        kind: design
      - id: UX-MCP-003-S01-T02
        title: Implement the shared or surface-specific UI behavior for UX-MCP-003
        kind: implementation
      - id: UX-MCP-003-S01-T03
        title: Add automated and manual coverage for UX-MCP-003 acceptance criteria
        kind: test
      - id: UX-MCP-003-S01-T04
        title: Record demo notes and traceability evidence for UX-MCP-003
        kind: demo
  - id: UX-MCP-005-S01
    title: AI agent attachment flow
    requirementIds:
      - UX-MCP-005
    acceptanceCriteria:
      - Given the DM completes all 4 steps and clicks Connect, when the agent
        appears in the list, then its policy mode matches the selection made in
        step 3.
      - Given the DM cancels at step 3, when Settings renders, then no new agent
        record exists.
      - Given a web API key is invalid, when [Test connection] is clicked, then
        an inline error appears within 5 s identifying the problem (invalid key,
        network unreachable, etc.) and the DM cannot advance to step 3 until a
        valid connection is established.
    tasks:
      - id: UX-MCP-005-S01-T01
        title: Confirm UI contract, responsive profile behavior, and actor-safety
          implications for UX-MCP-005
        kind: design
      - id: UX-MCP-005-S01-T02
        title: Implement the shared or surface-specific UI behavior for UX-MCP-005
        kind: implementation
      - id: UX-MCP-005-S01-T03
        title: Add automated and manual coverage for UX-MCP-005 acceptance criteria
        kind: test
      - id: UX-MCP-005-S01-T04
        title: Record demo notes and traceability evidence for UX-MCP-005
        kind: demo
  - id: UX-MCP-008-S01
    title: AI output formatting and response envelope presentation
    requirementIds:
      - UX-MCP-008
    acceptanceCriteria:
      - Given an MCP tool returns a successful response with warnings, when the
        output card renders, then warnings appear in the warning section, not
        mixed into the summary text.
      - Given an MCP tool returns an error, when the error card renders, then it
        contains no hidden vault content, no raw stack traces, and at least one
        actionable button (Retry or Dismiss).
      - Given an MCP tool returns source citations, when the Sources section is
        expanded, then each source is a navigable link to the source content.
    tasks:
      - id: UX-MCP-008-S01-T01
        title: Confirm UI contract, responsive profile behavior, and actor-safety
          implications for UX-MCP-008
        kind: design
      - id: UX-MCP-008-S01-T02
        title: Implement the shared or surface-specific UI behavior for UX-MCP-008
        kind: implementation
      - id: UX-MCP-008-S01-T03
        title: Add automated and manual coverage for UX-MCP-008 acceptance criteria
        kind: test
      - id: UX-MCP-008-S01-T04
        title: Record demo notes and traceability evidence for UX-MCP-008
        kind: demo
qualityBar:
  - "Product fit: the delivered UI follows the canvas-first command platform
    model and never regresses to a document-list home."
  - "Traceability: every mapped UX requirement is tied to implementation, tests,
    and demo evidence."
  - "Foundations first: design tokens, shared components, platform profiles, and
    accessibility primitives are reused rather than reimplemented per surface."
  - "Actor safety: player and observer routes, search, ARIA, errors, skeletons,
    previews, and command results never leak DM-only content."
  - "Platform parity: Desktop, Tablet, and Mobile expose the same Must-have
    commands through profile-appropriate surfaces and the same processing-core
    commands."
  - "Live-play readiness: hot paths acknowledge within 100 ms, support
    undo/retry where appropriate, and stay glanceable under table pressure."
  - "Accessibility: WCAG 2.2 AA, keyboard parity, reduced motion, touch targets,
    non-color state, and screen-reader QA are part of the acceptance bar."
  - "Production polish: empty/loading/error states, responsive constraints,
    visual hierarchy, motion, and help affordances are complete enough to
    share."
gitWorkflow:
  - Start from `git status --short` and work around unrelated local edits unless
    they block the epic.
  - Use one branch per UX epic and keep commits scoped to that epic plus its
    generated UX workpack evidence.
  - Do not hand-edit generated files under `docs/planning/v2/ux` for status
    changes; use the UX workpack commands.
  - Do not reset, overwrite, or reformat unrelated user changes.
  - Before handoff, run targeted tests plus `pnpm ux-workpack:validate` and
    leave no stale generated UX planning diffs.
statusAutomation:
  - Do not hand-edit generated UX epic packets, `status.yaml`,
    `requirements-index.yaml`, `initiative-map.yaml`, or `parallel-batches.yaml`
    for status changes.
  - Use `pnpm ux-workpack:set-status -- --epic
    UX-MCP-inline-assist-suggestions-attachments-and-response-presentation
    --status active` when implementation starts.
  - Create
    `docs/planning/v2/ux/epics/UX-MCP-inline-assist-suggestions-attachments-and-response-presentation.completion.md`
    with demo, tests, traceability, gaps, and git evidence before marking
    complete.
  - Use `pnpm ux-workpack:complete -- --epic
    UX-MCP-inline-assist-suggestions-attachments-and-response-presentation` to
    update `docs/planning/v2/ux/workpack-state.yaml` and regenerate all derived
    UX planning files together.
  - Run `pnpm ux-workpack:validate` after any status or generation command.
testPlan:
  - Run `pnpm ux-workpack:validate` before handoff.
  - Run targeted unit tests for stores, query shaping, route metadata, component
    state, and command dispatch touched by this epic.
  - Run app tests or Playwright coverage for visible route, profile, keyboard,
    touch, empty/loading/error, and player-safe behavior touched by this epic.
  - Run axe and manual accessibility checks when the epic touches focus,
    landmarks, dialogs, menus, tabs, drag alternatives, live regions, or
    screen-reader output.
demoNotesTemplate:
  - Describe the user-visible path demonstrated on Desktop, Tablet, and Mobile
    where applicable.
  - List the UX requirement IDs and acceptance criteria exercised by the demo.
  - Record actor roles used in the demo, especially DM/player/observer safety
    cases.
  - Record remaining polish, research, or product-decision gaps explicitly.
stopConditions:
  - Stop if the epic needs a product decision that the architecture
    reconciliation epic has not resolved.
  - Stop if a UX requirement conflicts with a functional requirement and the
    conflict has not been raised in docs.
  - Stop if a player-visible route, ARIA label, command result, search result,
    preview, skeleton, or error can reveal hidden DM-only content.
  - Stop if a Must-have action is pointer-only, gesture-only, desktop-only, or
    depends on an optional network/cloud/AI feature.
  - Stop if generated UX workpack validation fails and the cause is not
    understood.
completionEvidence:
  - Targeted tests and profile checks pass.
  - Requirement IDs are traced to implementation, tests, and demo notes.
  - Desktop, Tablet, and Mobile behavior is covered or explicitly scoped with a
    reason.
  - Accessibility, actor-safety, no-leak, reduced-motion, touch-target, and
    keyboard parity evidence is recorded where applicable.
  - Completion file records demo path, tests run, changed files, requirement
    coverage, known gaps, git branch/commit or PR, and final `git status
    --short` output.
  - The UX workpack status is updated with the programmatic complete command
    after completion evidence exists.

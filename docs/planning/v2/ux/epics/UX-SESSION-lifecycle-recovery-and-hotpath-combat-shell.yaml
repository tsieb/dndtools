id: UX-SESSION-lifecycle-recovery-and-hotpath-combat-shell
title: Session Lifecycle, Recovery, and Hot-Path Combat Shell
status: approved
approved: true
phase: 05 Live-Play Workspaces
productPriority: P1
domain: UX-SES
objective: Build the focused Session route around lifecycle, recovery, combat
  row glanceability, current-turn emphasis, turn advance, and async undo/retry
  states.
requirementIds:
  - UX-SES-001
  - UX-SES-002
  - UX-SES-003
  - UX-SES-004
  - UX-SES-006
  - UX-SES-017

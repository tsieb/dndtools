parallelSafety:
  fileOwnership:
    - docs/planning/v2/ux/
    - apps/gm/src/lib/gui/ux-ses/
    - apps/gm/src/routes/
  notes: Parallel execution is safe only with non-overlapping component, route,
    and generated UX workpack ownership; shared shell/component contracts must
    be agreed before implementation.
stories:
  - id: UX-SES-001-S01
    title: "Session lifecycle controls: clear phase display and transition
      affordances"
    requirementIds:
      - UX-SES-001
    acceptanceCriteria:
      - Given an active session, when the DM views the combat tracker, then a
        "Pause session" control is visible in the tracker header without
        scrolling.
      - Given the session is not active, when the DM opens the Dice Tools panel,
        then an inline message explains the state and provides a link to start
        the session.
      - Given the session reaches the recap state, when the DM opens the
        Prep/Recap panel, then its mode is automatically set to recap and a
        "Create recap notes" CTA is primary-visible.
    tasks:
      - id: UX-SES-001-S01-T01
        title: Confirm UI contract, responsive profile behavior, and actor-safety
          implications for UX-SES-001
        kind: design
      - id: UX-SES-001-S01-T02
        title: Implement the shared or surface-specific UI behavior for UX-SES-001
        kind: implementation
      - id: UX-SES-001-S01-T03
        title: Add automated and manual coverage for UX-SES-001 acceptance criteria
        kind: test
      - id: UX-SES-001-S01-T04
        title: Record demo notes and traceability evidence for UX-SES-001
        kind: demo
  - id: UX-SES-002-S01
    title: Session state persistence and recovery prompt
    requirementIds:
      - UX-SES-002
    acceptanceCriteria:
      - Given an active session, when the app restarts, then within 3 seconds
        either the session is fully restored or a recovery prompt is displayed.
      - Given the recovery banner is displayed, when the DM attempts to click a
        dice tool before dismissing it, then the dice tool is not interactive.
      - Given a partial restore, when the DM views the recovery banner, then the
        specific item(s) that could not be restored are named.
    tasks:
      - id: UX-SES-002-S01-T01
        title: Confirm UI contract, responsive profile behavior, and actor-safety
          implications for UX-SES-002
        kind: design
      - id: UX-SES-002-S01-T02
        title: Implement the shared or surface-specific UI behavior for UX-SES-002
        kind: implementation
      - id: UX-SES-002-S01-T03
        title: Add automated and manual coverage for UX-SES-002 acceptance criteria
        kind: test
      - id: UX-SES-002-S01-T04
        title: Record demo notes and traceability evidence for UX-SES-002
        kind: demo
  - id: UX-SES-003-S01
    title: "Combat tracker: combatant row anatomy and glanceability"
    requirementIds:
      - UX-SES-003
    acceptanceCriteria:
      - Given seven combatants in the tracker, when the DM views it on a Tablet,
        then all row anatomy elements (name, HP, conditions) are visible without
        horizontal scrolling.
      - Given a hidden combatant exists, when a player client renders the
        initiative tracker, then that combatant's real name, HP, conditions, and
        portrait are not present in any rendered DOM node.
      - Given a combatant HP drops to 0, when the round advances, then that
        combatant's row is visually defeated (strikethrough, 50% opacity) and
        positioned below all non-defeated combatants.
    tasks:
      - id: UX-SES-003-S01-T01
        title: Confirm UI contract, responsive profile behavior, and actor-safety
          implications for UX-SES-003
        kind: design
      - id: UX-SES-003-S01-T02
        title: Implement the shared or surface-specific UI behavior for UX-SES-003
        kind: implementation
      - id: UX-SES-003-S01-T03
        title: Add automated and manual coverage for UX-SES-003 acceptance criteria
        kind: test
      - id: UX-SES-003-S01-T04
        title: Record demo notes and traceability evidence for UX-SES-003
        kind: demo
  - id: UX-SES-004-S01
    title: "Current-turn emphasis: unmistakable active combatant"
    requirementIds:
      - UX-SES-004
    acceptanceCriteria:
      - Given an active combat with 8 combatants, when the DM views the tracker,
        then the current-turn combatant row is visually distinct by at least 3
        dimensions (border, background, typography).
      - Given the current-turn row is scrolled below the visible tracker area,
        when the turn advances to a new combatant, then the tracker scrolls the
        new current-turn row into view within 300 ms.
      - Given a player client rendering the tracker, when a hidden combatant's
        turn becomes active, then the player's screen shows "Unknown creature"
        with the "▶ Active" indicator — not the real name.
    tasks:
      - id: UX-SES-004-S01-T01
        title: Confirm UI contract, responsive profile behavior, and actor-safety
          implications for UX-SES-004
        kind: design
      - id: UX-SES-004-S01-T02
        title: Implement the shared or surface-specific UI behavior for UX-SES-004
        kind: implementation
      - id: UX-SES-004-S01-T03
        title: Add automated and manual coverage for UX-SES-004 acceptance criteria
        kind: test
      - id: UX-SES-004-S01-T04
        title: Record demo notes and traceability evidence for UX-SES-004
        kind: demo
  - id: UX-SES-006-S01
    title: "Advance and previous turn: primary hot-path control"
    requirementIds:
      - UX-SES-006
    acceptanceCriteria:
      - Given an active combat, when the DM presses Space, then the turn
        advances to the next combatant within 300 ms and a live-region announces
        the new active combatant.
      - Given the DM is on a tablet with no keyboard, when they tap "Next turn"
        with one thumb, then the turn advances (the button is ≥44 px in height
        and ≥80 px wide — easily hittable).
      - Given the DM accidentally advances the turn, when they tap "Prev", then
        the previous combatant becomes active and the live region announces the
        revert.
      - Given the last combatant in the round takes their turn and the DM
        advances, then the round counter increments and a "Round N begins" toast
        appears.
    tasks:
      - id: UX-SES-006-S01-T01
        title: Confirm UI contract, responsive profile behavior, and actor-safety
          implications for UX-SES-006
        kind: design
      - id: UX-SES-006-S01-T02
        title: Implement the shared or surface-specific UI behavior for UX-SES-006
        kind: implementation
      - id: UX-SES-006-S01-T03
        title: Add automated and manual coverage for UX-SES-006 acceptance criteria
        kind: test
      - id: UX-SES-006-S01-T04
        title: Record demo notes and traceability evidence for UX-SES-006
        kind: demo
  - id: UX-SES-017-S01
    title: "Session tool async action model: undo toast, retry, and pending state"
    requirementIds:
      - UX-SES-017
    acceptanceCriteria:
      - "Given the DM changes a combatant's HP from 30 to 18, when the command
        succeeds, then an undo toast appears within 200 ms reading \"[Name] HP:
        30 → 18. Undo?\""
      - Given the DM clicks "Undo" within 8 seconds, when the inverse command
        completes, then the HP returns to 30 and the toast announces "HP change
        undone."
      - Given a roll command fails (e.g., offline), when the failure is
        detected, then an error toast with a "Retry" button appears within 1
        second of the failure response.
    tasks:
      - id: UX-SES-017-S01-T01
        title: Confirm UI contract, responsive profile behavior, and actor-safety
          implications for UX-SES-017
        kind: design
      - id: UX-SES-017-S01-T02
        title: Implement the shared or surface-specific UI behavior for UX-SES-017
        kind: implementation
      - id: UX-SES-017-S01-T03
        title: Add automated and manual coverage for UX-SES-017 acceptance criteria
        kind: test
      - id: UX-SES-017-S01-T04
        title: Record demo notes and traceability evidence for UX-SES-017
        kind: demo
qualityBar:
  - "Product fit: the delivered UI follows the canvas-first command platform
    model and never regresses to a document-list home."
  - "Traceability: every mapped UX requirement is tied to implementation, tests,
    and demo evidence."
  - "Foundations first: design tokens, shared components, platform profiles, and
    accessibility primitives are reused rather than reimplemented per surface."
  - "Actor safety: player and observer routes, search, ARIA, errors, skeletons,
    previews, and command results never leak DM-only content."
  - "Platform parity: Desktop, Tablet, and Mobile expose the same Must-have
    commands through profile-appropriate surfaces and the same processing-core
    commands."
  - "Live-play readiness: hot paths acknowledge within 100 ms, support
    undo/retry where appropriate, and stay glanceable under table pressure."
  - "Accessibility: WCAG 2.2 AA, keyboard parity, reduced motion, touch targets,
    non-color state, and screen-reader QA are part of the acceptance bar."
  - "Production polish: empty/loading/error states, responsive constraints,
    visual hierarchy, motion, and help affordances are complete enough to
    share."
gitWorkflow:
  - Start from `git status --short` and work around unrelated local edits unless
    they block the epic.
  - Use one branch per UX epic and keep commits scoped to that epic plus its
    generated UX workpack evidence.
  - Do not hand-edit generated files under `docs/planning/v2/ux` for status
    changes; use the UX workpack commands.
  - Do not reset, overwrite, or reformat unrelated user changes.
  - Before handoff, run targeted tests plus `pnpm ux-workpack:validate` and
    leave no stale generated UX planning diffs.
statusAutomation:
  - Do not hand-edit generated UX epic packets, `status.yaml`,
    `requirements-index.yaml`, `initiative-map.yaml`, or `parallel-batches.yaml`
    for status changes.
  - Use `pnpm ux-workpack:set-status -- --epic
    UX-SESSION-lifecycle-recovery-and-hotpath-combat-shell --status active` when
    implementation starts.
  - Create
    `docs/planning/v2/ux/epics/UX-SESSION-lifecycle-recovery-and-hotpath-combat-shell.completion.md`
    with demo, tests, traceability, gaps, and git evidence before marking
    complete.
  - Use `pnpm ux-workpack:complete -- --epic
    UX-SESSION-lifecycle-recovery-and-hotpath-combat-shell` to update
    `docs/planning/v2/ux/workpack-state.yaml` and regenerate all derived UX
    planning files together.
  - Run `pnpm ux-workpack:validate` after any status or generation command.
testPlan:
  - Run `pnpm ux-workpack:validate` before handoff.
  - Run targeted unit tests for stores, query shaping, route metadata, component
    state, and command dispatch touched by this epic.
  - Run app tests or Playwright coverage for visible route, profile, keyboard,
    touch, empty/loading/error, and player-safe behavior touched by this epic.
  - Run axe and manual accessibility checks when the epic touches focus,
    landmarks, dialogs, menus, tabs, drag alternatives, live regions, or
    screen-reader output.
demoNotesTemplate:
  - Describe the user-visible path demonstrated on Desktop, Tablet, and Mobile
    where applicable.
  - List the UX requirement IDs and acceptance criteria exercised by the demo.
  - Record actor roles used in the demo, especially DM/player/observer safety
    cases.
  - Record remaining polish, research, or product-decision gaps explicitly.
stopConditions:
  - Stop if the epic needs a product decision that the architecture
    reconciliation epic has not resolved.
  - Stop if a UX requirement conflicts with a functional requirement and the
    conflict has not been raised in docs.
  - Stop if a player-visible route, ARIA label, command result, search result,
    preview, skeleton, or error can reveal hidden DM-only content.
  - Stop if a Must-have action is pointer-only, gesture-only, desktop-only, or
    depends on an optional network/cloud/AI feature.
  - Stop if generated UX workpack validation fails and the cause is not
    understood.
completionEvidence:
  - Targeted tests and profile checks pass.
  - Requirement IDs are traced to implementation, tests, and demo notes.
  - Desktop, Tablet, and Mobile behavior is covered or explicitly scoped with a
    reason.
  - Accessibility, actor-safety, no-leak, reduced-motion, touch-target, and
    keyboard parity evidence is recorded where applicable.
  - Completion file records demo path, tests run, changed files, requirement
    coverage, known gaps, git branch/commit or PR, and final `git status
    --short` output.
  - The UX workpack status is updated with the programmatic complete command
    after completion evidence exists.

schemaVersion: 1
id: SRCH-ranking-and-result-context
title: "SRCH: Ranking and result context"
status: complete
approved: true
domain: SRCH
capabilityBranch: Ranking and result context
objective: Deliver the ranking and result context capability branch for SRCH,
  traced to the included v2 requirements.
requirementIds:
  - SRCH-005
  - SRCH-006
  - SRCH-011
excludedRequirementIds: []
architectureContracts:
  - "Contract 3: Role, Visibility & Permission Grant Model"
expectedAffectedAreas:
  - apps/gm
  - docs/planning/v2
  - search index
  - quick switcher
dependencies: []
parallelSafety:
  fileOwnership:
    - apps/gm/srch/
    - docs/planning/v2/
  requiresInterfaceContract: true
  notes: Parallel execution requires explicit interface contracts and
    non-overlapping generated file ownership.
stories:
  - id: SRCH-005-S01
    title: The Search Engine shall rank results using deterministic recency, title,
      tag, link, entity-type, and session-context signals before optional AI
      assistance is applied
    requirementIds:
      - SRCH-005
    acceptanceCriteria:
      - Given AI is disabled, when search runs, then ranking still uses
        deterministic scoring.
      - Given session context indicates an active map, when searching POIs, then
        visible POIs on that map rank higher than unrelated POIs.
      - Given two results have equivalent score inputs, when ranked, then
        deterministic tie-breakers produce stable order across repeated runs and
        fresh fixtures.
      - Given optional AI assistance is enabled, when results are shown, then AI
        explanation or reranking cannot expose hidden content or replace
        deterministic base ranking without a visible label.
    tasks:
      - id: SRCH-005-S01-T01
        title: Confirm architecture and interface shape for SRCH-005
        kind: design
      - id: SRCH-005-S01-T02
        title: Implement the smallest behavior that satisfies SRCH-005
        kind: implementation
      - id: SRCH-005-S01-T03
        title: Add automated coverage for SRCH-005 acceptance criteria
        kind: test
      - id: SRCH-005-S01-T04
        title: Record demo notes and traceability evidence for SRCH-005
        kind: demo
  - id: SRCH-006-S02
    title: The Search Engine shall expose enough context in results for fast
      disambiguation, including title, source, type, visible snippet, tags, and
      relationship hints
    requirementIds:
      - SRCH-006
    acceptanceCriteria:
      - Given two notes have similar names, when search returns both, then each
        result includes source/type context and visible snippet.
      - Given a snippet crosses a hidden section boundary, when returned to a
        player, then hidden text is omitted.
      - Given a result has visible backlinks, date references, folder path, or
        map/Scene context, when result context renders, then those relationship
        hints are included only if visible to the actor.
    tasks:
      - id: SRCH-006-S02-T01
        title: Confirm architecture and interface shape for SRCH-006
        kind: design
      - id: SRCH-006-S02-T02
        title: Implement the smallest behavior that satisfies SRCH-006
        kind: implementation
      - id: SRCH-006-S02-T03
        title: Add automated coverage for SRCH-006 acceptance criteria
        kind: test
      - id: SRCH-006-S02-T04
        title: Record demo notes and traceability evidence for SRCH-006
        kind: demo
  - id: SRCH-011-S03
    title: Semantic search and entity expansion shall remain optional,
      visibility-filtered, source-cited, and secondary to deterministic search
      until a search architecture decision promotes them
    requirementIds:
      - SRCH-011
    acceptanceCriteria:
      - Given semantic search is disabled or unavailable, when the user
        searches, then deterministic full-text, facet, title, tag, graph, and
        date search still works.
      - Given semantic/entity expansion is enabled, when it suggests related
        entities, then every suggestion has visible source citations and cannot
        introduce hidden titles, snippets, ids, or revealing counts.
      - Given a semantic model is unavailable offline, when search runs, then
        semantic expansion is marked unavailable and deterministic cached
        results are still returned.
      - Given semantic ranking changes result order, when displayed, then the UI
        labels the semantic contribution and preserves deterministic score
        diagnostics for debugging.
    tasks:
      - id: SRCH-011-S03-T01
        title: Confirm architecture and interface shape for SRCH-011
        kind: design
      - id: SRCH-011-S03-T02
        title: Implement the smallest behavior that satisfies SRCH-011
        kind: implementation
      - id: SRCH-011-S03-T03
        title: Add automated coverage for SRCH-011 acceptance criteria
        kind: test
      - id: SRCH-011-S03-T04
        title: Record demo notes and traceability evidence for SRCH-011
        kind: demo
qualityBar:
  - "Correctness: every mapped acceptance criterion is implemented or explicitly
    deferred with reviewer-visible evidence."
  - "Architecture integrity: changes obey ADR-014, the architecture contracts,
    package boundaries, and no-v1-runtime-import rules."
  - "Traceability: requirement IDs are tied to code, tests, demo notes, and any
    documentation changes."
  - "Test depth: unit, integration, e2e, boundary, accessibility, performance,
    security, permission, sync, and migration coverage are chosen according to
    risk."
  - "User experience: visible flows are complete, accessible, responsive,
    resilient to empty/error/loading states, and consistent with the design
    system."
  - "Data safety: persistence, offline behavior, sync assumptions, conflict
    handling, actor filtering, and privacy boundaries fail closed."
  - "Maintainability: modules remain cohesive, typed, readable, locally scoped,
    and free of speculative abstractions or unrelated refactors."
  - "Operational quality: diagnostics, metrics, docs, generated files, and
    handoff evidence are current before completion."
gitWorkflow:
  - Start from a clean working tree. Run `git status --short` before editing and
    stop if unrelated changes overlap this epic.
  - Use one branch per epic from the correct base branch, and keep all commits
    scoped to the assigned epic.
  - Never reset, overwrite, or reformat unrelated user changes. Work around
    existing dirty files unless they block the epic.
  - Commit the code, docs, tests, generated workpack updates, and completion
    evidence needed for the epic before handoff.
  - "Leave a clean slate when the epic is complete: no untracked files, no
    unstaged edits, and no stale generated planning diffs caused by the epic."
statusAutomation:
  - Do not hand-edit generated epic packets, `status.yaml`,
    `requirements-index.yaml`, `initiative-map.yaml`, or `parallel-batches.yaml`
    for status changes.
  - Use `pnpm workpack:set-status -- --epic SRCH-ranking-and-result-context
    --status active` when implementation starts.
  - Create
    `docs/planning/v2/epics/SRCH-ranking-and-result-context.completion.md` with
    demo, tests, traceability, gaps, and git evidence before marking complete.
  - Use `pnpm workpack:complete -- --epic SRCH-ranking-and-result-context` to
    update `workpack-state.yaml` and regenerate all derived planning files
    together.
  - Run `pnpm workpack:validate` after any status or generation command;
    validation fails if generated files drift from the source of truth.
testPlan:
  - Run unit tests for domain reducers, command validators, and data transforms
    touched by this epic.
  - Run UI or integration checks for any visible prototype behavior touched by
    this epic.
  - Run domain-specific quality gates for accessibility, performance, security,
    permissions, sync/offline behavior, migrations, and docs when those areas
    are touched.
  - Run `pnpm workpack:validate` before handoff.
demoNotesTemplate:
  - Describe the user-visible path demonstrated.
  - List the requirement IDs exercised by the demo.
  - Record any gaps intentionally deferred out of this epic.
stopConditions:
  - Stop if the v2 stack ADR is missing or contradicts the implementation
    approach.
  - Stop if implementing the epic requires runtime imports from v1 app code.
  - Stop if hidden visibility, permission, sync, or persistence behavior is
    ambiguous.
  - Stop if the generated workpack no longer validates.
  - Stop if `git status --short` shows unrelated changes that overlap the files
    this epic needs.
completionEvidence:
  - Targeted tests pass.
  - Traceability from requirement IDs to implementation and tests is documented.
  - Demo notes are filled in for visible behavior.
  - Quality review covers correctness, architecture, security, permissions,
    accessibility, performance, persistence, sync/offline assumptions,
    maintainability, UX polish, and documentation.
  - Completion evidence file records demo path, tests run, changed files,
    requirement coverage, known gaps, git branch, commit or PR, and final `git
    status --short` output.
  - Workpack status is updated with the programmatic complete command after
    completion evidence exists.
  - The epic leaves a clean git slate with no untracked or unstaged files caused
    by the work.
completionEvidenceFile: docs/planning/v2/epics/SRCH-ranking-and-result-context.completion.md

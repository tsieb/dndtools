schemaVersion: 1
id: SYNC-source-adapters
title: 'SYNC: Source adapters'
status: approved
approved: true
domain: SYNC
capabilityBranch: Source adapters
objective: Deliver the source adapters capability branch for SYNC, traced to the
  included v2 requirements.
requirementIds:
  - SYNC-003
  - SYNC-004
  - SYNC-005
  - SYNC-012
  - SYNC-015
  - SYNC-016
excludedRequirementIds: []
architectureContracts:
  - 'Contract 1: Processing / Display Decoupling'
  - 'Contract 2: Cloud Sync & Offline Model'
expectedAffectedAreas:
  - apps/v2
  - docs/planning/v2
  - sync engine
  - source adapters
dependencies: []
parallelSafety:
  fileOwnership:
    - apps/v2/sync/
    - docs/planning/v2/
  requiresInterfaceContract: true
  notes: Parallel execution requires explicit interface contracts and
    non-overlapping generated file ownership.
stories:
  - id: SYNC-003-S01
    title: The system shall support sync source adapters for local vault, Obsidian
      vault, Google Docs, and future sources without changing Processing Core
      command or reducer contracts
    requirementIds:
      - SYNC-003
    acceptanceCriteria:
      - Given a new source adapter implements the required interface, when
        registered, then the Processing Core can pull and push canonical
        operations through it.
      - Given an adapter lacks write capability, when a write is attempted, then
        the command returns unsupported/degraded status without changing the
        core contract.
      - Given a remote source requires first-time authorization, when the app is
        offline and no token exists, then the source reports auth-unavailable
        while local cached vault workflows continue.
    tasks:
      - id: SYNC-003-S01-T01
        title: Confirm architecture and interface shape for SYNC-003
        kind: design
      - id: SYNC-003-S01-T02
        title: Implement the smallest behavior that satisfies SYNC-003
        kind: implementation
      - id: SYNC-003-S01-T03
        title: Add automated coverage for SYNC-003 acceptance criteria
        kind: test
      - id: SYNC-003-S01-T04
        title: Record demo notes and traceability evidence for SYNC-003
        kind: demo
  - id: SYNC-004-S02
    title: The Obsidian sync adapter shall preserve YAML properties, tags, aliases,
      internal links, markdown links, headings, and user-authored frontmatter
      while namespacing DND Tools metadata
    requirementIds:
      - SYNC-004
    acceptanceCriteria:
      - Given an Obsidian note with aliases and tags, when imported and
        exported, then those properties remain intact.
      - Given DND Tools adds metadata, when written, then metadata is under the
        configured `dndtools` namespace and does not overwrite common
        properties.
      - Given an Obsidian local directory is not accessible on the current
        mobile profile, when sync status opens, then the source reports
        unavailable capability while cached content remains readable.
    tasks:
      - id: SYNC-004-S02-T01
        title: Confirm architecture and interface shape for SYNC-004
        kind: design
      - id: SYNC-004-S02-T02
        title: Implement the smallest behavior that satisfies SYNC-004
        kind: implementation
      - id: SYNC-004-S02-T03
        title: Add automated coverage for SYNC-004 acceptance criteria
        kind: test
      - id: SYNC-004-S02-T04
        title: Record demo notes and traceability evidence for SYNC-004
        kind: demo
  - id: SYNC-005-S03
    title: The Google Docs sync adapter shall track Drive file ids, change page
      tokens, revision metadata where available, export/import transforms, and
      unsupported formatting loss
    requirementIds:
      - SYNC-005
    acceptanceCriteria:
      - Given Google Drive returns a new change page token, when changes are
        pulled, then the adapter stores the new cursor for future incremental
        sync.
      - Given a Docs revision cannot map cleanly to markdown, when pulled, then
        a document-level conflict or formatting-loss diagnostic is recorded.
      - Given a local note edit maps to Google Docs, when push succeeds, then
        the Drive file id, revision metadata, and sync cursor are updated
        without losing unsupported-format diagnostics.
      - Given Google Docs has not been authorized on this device, when offline,
        then cached Docs content remains readable but first-time auth and push
        are reported unavailable.
    tasks:
      - id: SYNC-005-S03-T01
        title: Confirm architecture and interface shape for SYNC-005
        kind: design
      - id: SYNC-005-S03-T02
        title: Implement the smallest behavior that satisfies SYNC-005
        kind: implementation
      - id: SYNC-005-S03-T03
        title: Add automated coverage for SYNC-005 acceptance criteria
        kind: test
      - id: SYNC-005-S03-T04
        title: Record demo notes and traceability evidence for SYNC-005
        kind: demo
  - id: SYNC-012-S04
    title: Obsidian and Google Docs adapters shall prove both pull and push behavior
      for representative notes, properties, links, headings, revisions, and
      unsupported formatting
    requirementIds:
      - SYNC-012
    acceptanceCriteria:
      - Given an Obsidian-backed note is edited in DND Tools, when the adapter
        pushes changes, then Obsidian frontmatter, aliases, tags, headings, and
        wikilinks remain valid.
      - Given a Google Docs-backed note is edited in DND Tools, when push/pull
        round-trip completes, then supported content is preserved and
        unsupported formatting loss is reported.
      - Given a Google Docs-backed note is edited while offline, when network
        and auth return, then the queued edit is pushed idempotently or a
        conflict record is created with formatting-loss details.
    tasks:
      - id: SYNC-012-S04-T01
        title: Confirm architecture and interface shape for SYNC-012
        kind: design
      - id: SYNC-012-S04-T02
        title: Implement the smallest behavior that satisfies SYNC-012
        kind: implementation
      - id: SYNC-012-S04-T03
        title: Add automated coverage for SYNC-012 acceptance criteria
        kind: test
      - id: SYNC-012-S04-T04
        title: Record demo notes and traceability evidence for SYNC-012
        kind: demo
  - id: SYNC-015-S05
    title: Every source adapter shall declare Source Adapter Capability metadata and
      fail closed for unsupported schema versions, source versions, auth modes,
      entity types, or lossy transforms
    requirementIds:
      - SYNC-015
    acceptanceCriteria:
      - Given an adapter registers, when inspected, then it declares
        readable/writable domains, schema version range, auth requirements,
        rename/delete support, offline queue behavior, formatting fidelity, and
        platform profile support.
      - Given a source payload uses an unsupported schema or source version,
        when parsed, then the adapter rejects it with an upgrade-required
        diagnostic before mutation.
      - Given an adapter cannot preserve a structure, when push is requested,
        then the write is blocked or staged with explicit lossy-transform
        approval.
    tasks:
      - id: SYNC-015-S05-T01
        title: Confirm architecture and interface shape for SYNC-015
        kind: design
      - id: SYNC-015-S05-T02
        title: Implement the smallest behavior that satisfies SYNC-015
        kind: implementation
      - id: SYNC-015-S05-T03
        title: Add automated coverage for SYNC-015 acceptance criteria
        kind: test
      - id: SYNC-015-S05-T04
        title: Record demo notes and traceability evidence for SYNC-015
        kind: demo
  - id: SYNC-016-S06
    title: The Google Docs adapter shall handle authorization, rename, deletion,
      offline queued edits, unsupported formatting, and conflict cases as
      explicit sync states
    requirementIds:
      - SYNC-016
    acceptanceCriteria:
      - Given Google auth expires, when sync runs, then local work remains
        available and the source reports reauthorization-required without
        dropping queued operations.
      - Given a Google Docs document is renamed or deleted remotely, when
        changes are pulled, then the local entity records rename/delete intent
        or a conflict according to adapter policy.
      - Given a local offline edit conflicts with a remote formatting change,
        when sync resumes, then the conflict record includes local markdown,
        remote revision metadata, unsupported-format diagnostics, and safe
        resolution actions.
      - Given a delete operation and queued edit race, when replay orders
        operations, then the adapter either applies dependencies
        deterministically or records a durable conflict without resurrecting
        deleted content silently.
    tasks:
      - id: SYNC-016-S06-T01
        title: Confirm architecture and interface shape for SYNC-016
        kind: design
      - id: SYNC-016-S06-T02
        title: Implement the smallest behavior that satisfies SYNC-016
        kind: implementation
      - id: SYNC-016-S06-T03
        title: Add automated coverage for SYNC-016 acceptance criteria
        kind: test
      - id: SYNC-016-S06-T04
        title: Record demo notes and traceability evidence for SYNC-016
        kind: demo
testPlan:
  - Run unit tests for domain reducers, command validators, and data transforms
    touched by this epic.
  - Run UI or integration checks for any visible prototype behavior touched by
    this epic.
  - Run `pnpm v2:workpack:validate` before handoff.
demoNotesTemplate:
  - Describe the user-visible path demonstrated.
  - List the requirement IDs exercised by the demo.
  - Record any gaps intentionally deferred out of this epic.
stopConditions:
  - Stop if the v2 stack ADR is missing or contradicts the implementation
    approach.
  - Stop if implementing the epic requires runtime imports from v1 app code.
  - Stop if hidden visibility, permission, sync, or persistence behavior is
    ambiguous.
  - Stop if the generated workpack no longer validates.
completionEvidence:
  - Targeted tests pass.
  - Traceability from requirement IDs to implementation and tests is documented.
  - Demo notes are filled in for visible behavior.
  - Workpack status is updated after completion.

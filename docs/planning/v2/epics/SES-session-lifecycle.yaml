schemaVersion: 1
id: SES-session-lifecycle
title: 'SES: Session lifecycle'
status: approved
approved: true
domain: SES
capabilityBranch: Session lifecycle
objective: Deliver the session lifecycle capability branch for SES, traced to
  the included v2 requirements.
requirementIds:
  - SES-001
  - SES-010
  - SES-011
excludedRequirementIds: []
architectureContracts:
  - 'Contract 1: Processing / Display Decoupling'
  - 'Contract 2: Cloud Sync & Offline Model'
  - 'Contract 4: Scene and Widget Contract'
expectedAffectedAreas:
  - apps/v2
  - docs/planning/v2
  - session state
  - live tools
dependencies: []
parallelSafety:
  fileOwnership:
    - apps/v2/ses/
    - docs/planning/v2/
  requiresInterfaceContract: true
  notes: Parallel execution requires explicit interface contracts and
    non-overlapping generated file ownership.
stories:
  - id: SES-001-S01
    title: The DM shall be able to start, pause, resume, end, archive, and recover a
      Session with active scene, combat state, dice history, timers, party
      location, workflow state, and handout log persisted as application-level
      Session State
    requirementIds:
      - SES-001
    acceptanceCriteria:
      - Given no active session, when the DM starts one, then Session State
        enters `active` and records the active Scene.
      - Given the app restarts during an active session, when the vault opens,
        then session state is restored or an explicit recovery prompt appears.
      - Given the DM moves a session to `paused`, `ending`, or `recap`, when
        remote participants reconnect, then their available commands match the
        workflow state and no stale active-session commands are accepted.
    tasks:
      - id: SES-001-S01-T01
        title: Confirm architecture and interface shape for SES-001
        kind: design
      - id: SES-001-S01-T02
        title: Implement the smallest behavior that satisfies SES-001
        kind: implementation
      - id: SES-001-S01-T03
        title: Add automated coverage for SES-001 acceptance criteria
        kind: test
      - id: SES-001-S01-T04
        title: Record demo notes and traceability evidence for SES-001
        kind: demo
  - id: SES-010-S02
    title: Session tools shall expose pending, success, failure, retry, and undo
      states through a standard async action model for all user-visible durable
      commands
    requirementIds:
      - SES-010
    acceptanceCriteria:
      - Given a note append from a session tool fails, when the command returns,
        then the UI clears pending state and shows retry guidance.
      - Given a map/session command supports undo, when undo is invoked, then
        the command model applies a recorded inverse or restores the committed
        before state.
    tasks:
      - id: SES-010-S02-T01
        title: Confirm architecture and interface shape for SES-010
        kind: design
      - id: SES-010-S02-T02
        title: Implement the smallest behavior that satisfies SES-010
        kind: implementation
      - id: SES-010-S02-T03
        title: Add automated coverage for SES-010 acceptance criteria
        kind: test
      - id: SES-010-S02-T04
        title: Record demo notes and traceability evidence for SES-010
        kind: demo
  - id: SES-011-S03
    title: Session workflow states shall be defined as `idle`, `prep`, `active`,
      `paused`, `ending`, `recap`, and `archived`, with explicit allowed
      transitions and command availability for each state
    requirementIds:
      - SES-011
    acceptanceCriteria:
      - Given the session is `idle`, when a player submits an active-combat
        command from stale UI, then the command is rejected with a non-leaking
        invalid-state result.
      - Given the session is `recap`, when the DM creates recap notes, then
        archived combat, dice, handout, and calendar references are read-only
        inputs unless a separate edit command is accepted.
    tasks:
      - id: SES-011-S03-T01
        title: Confirm architecture and interface shape for SES-011
        kind: design
      - id: SES-011-S03-T02
        title: Implement the smallest behavior that satisfies SES-011
        kind: implementation
      - id: SES-011-S03-T03
        title: Add automated coverage for SES-011 acceptance criteria
        kind: test
      - id: SES-011-S03-T04
        title: Record demo notes and traceability evidence for SES-011
        kind: demo
testPlan:
  - Run unit tests for domain reducers, command validators, and data transforms
    touched by this epic.
  - Run UI or integration checks for any visible prototype behavior touched by
    this epic.
  - Run `pnpm v2:workpack:validate` before handoff.
demoNotesTemplate:
  - Describe the user-visible path demonstrated.
  - List the requirement IDs exercised by the demo.
  - Record any gaps intentionally deferred out of this epic.
stopConditions:
  - Stop if the v2 stack ADR is missing or contradicts the implementation
    approach.
  - Stop if implementing the epic requires runtime imports from v1 app code.
  - Stop if hidden visibility, permission, sync, or persistence behavior is
    ambiguous.
  - Stop if the generated workpack no longer validates.
completionEvidence:
  - Targeted tests pass.
  - Traceability from requirement IDs to implementation and tests is documented.
  - Demo notes are filled in for visible behavior.
  - Workpack status is updated after completion.

schemaVersion: 1
id: COLLAB-player-views-and-observer-access
title: 'COLLAB: Player views and observer access'
status: approved
approved: true
domain: COLLAB
capabilityBranch: Player views and observer access
objective: Deliver the player views and observer access capability branch for
  COLLAB, traced to the included v2 requirements.
requirementIds:
  - COLLAB-005
  - COLLAB-011
excludedRequirementIds: []
architectureContracts:
  - 'Contract 1: Processing / Display Decoupling'
  - 'Contract 3: Role, Visibility & Permission Grant Model'
  - 'Contract 4: Scene and Widget Contract'
expectedAffectedAreas:
  - apps/v2
  - docs/planning/v2
  - collaboration transport
  - participant state
dependencies: []
parallelSafety:
  fileOwnership:
    - apps/v2/collab/
    - docs/planning/v2/
  requiresInterfaceContract: true
  notes: Parallel execution requires explicit interface contracts and
    non-overlapping generated file ownership.
stories:
  - id: COLLAB-005-S01
    title: The DM shall be able to control different Player View assignments for
      different players during the same session
    requirementIds:
      - COLLAB-005
    acceptanceCriteria:
      - Given Player A and Player B are connected, when the DM projects
        different Scene subsets, then each player receives only their assigned
        subset.
      - Given a player attempts to add a widget to their Player View without
        `co-editor`, when submitted, then the command is rejected.
    tasks:
      - id: COLLAB-005-S01-T01
        title: Confirm architecture and interface shape for COLLAB-005
        kind: design
      - id: COLLAB-005-S01-T02
        title: Implement the smallest behavior that satisfies COLLAB-005
        kind: implementation
      - id: COLLAB-005-S01-T03
        title: Add automated coverage for COLLAB-005 acceptance criteria
        kind: test
      - id: COLLAB-005-S01-T04
        title: Record demo notes and traceability evidence for COLLAB-005
        kind: demo
  - id: COLLAB-011-S02
    title: Observers shall be able to join shared sessions as read-only participants
      with access only to explicitly shared Scenes, maps, and placeholders, and
      no character data or write-capable controls
    requirementIds:
      - COLLAB-011
    acceptanceCriteria:
      - Given an observer joins a session, when join succeeds, then their
        visible scene list excludes character sheets, private player views, and
        DM-only content.
      - Given an observer invokes any write-capable command, when the command is
        validated, then it is rejected before mutation.
    tasks:
      - id: COLLAB-011-S02-T01
        title: Confirm architecture and interface shape for COLLAB-011
        kind: design
      - id: COLLAB-011-S02-T02
        title: Implement the smallest behavior that satisfies COLLAB-011
        kind: implementation
      - id: COLLAB-011-S02-T03
        title: Add automated coverage for COLLAB-011 acceptance criteria
        kind: test
      - id: COLLAB-011-S02-T04
        title: Record demo notes and traceability evidence for COLLAB-011
        kind: demo
testPlan:
  - Run unit tests for domain reducers, command validators, and data transforms
    touched by this epic.
  - Run UI or integration checks for any visible prototype behavior touched by
    this epic.
  - Run `pnpm v2:workpack:validate` before handoff.
demoNotesTemplate:
  - Describe the user-visible path demonstrated.
  - List the requirement IDs exercised by the demo.
  - Record any gaps intentionally deferred out of this epic.
stopConditions:
  - Stop if the v2 stack ADR is missing or contradicts the implementation
    approach.
  - Stop if implementing the epic requires runtime imports from v1 app code.
  - Stop if hidden visibility, permission, sync, or persistence behavior is
    ambiguous.
  - Stop if the generated workpack no longer validates.
completionEvidence:
  - Targeted tests pass.
  - Traceability from requirement IDs to implementation and tests is documented.
  - Demo notes are filled in for visible behavior.
  - Workpack status is updated after completion.

schemaVersion: 1
id: MAP-map-editing-and-generation
title: 'MAP: Map editing and generation'
status: proposed
approved: false
domain: MAP
capabilityBranch: Map editing and generation
objective: Deliver the map editing and generation capability branch for MAP,
  traced to the included v2 requirements.
requirementIds:
  - MAP-003
  - MAP-004
excludedRequirementIds: []
architectureContracts:
  - 'Contract 2: Cloud Sync & Offline Model'
expectedAffectedAreas:
  - apps/v2
  - docs/planning/v2
  - map model
  - map renderer
dependencies: []
parallelSafety:
  fileOwnership:
    - apps/v2/map/
    - docs/planning/v2/
  requiresInterfaceContract: true
  notes: Parallel execution requires explicit interface contracts and
    non-overlapping generated file ownership.
stories:
  - id: MAP-003-S01
    title: The DM shall be able to draw or paint map content using map editing
      commands that capture before and after state after commit for undo and
      sync
    requirementIds:
      - MAP-003
    acceptanceCriteria:
      - Given the DM paints terrain, when the command commits, then undo
        restores the previous map state exactly.
      - Given an async save fails, when the command returns, then pending state
        clears and no identical before/after undo snapshot is recorded.
      - Given a player is viewing a projected map, when the DM commits a paint
        operation on a DM-only layer, then the player receives no layer payload
        or visual update for that operation.
    tasks:
      - id: MAP-003-S01-T01
        title: Confirm architecture and interface shape for MAP-003
        kind: design
      - id: MAP-003-S01-T02
        title: Implement the smallest behavior that satisfies MAP-003
        kind: implementation
      - id: MAP-003-S01-T03
        title: Add automated coverage for MAP-003 acceptance criteria
        kind: test
      - id: MAP-003-S01-T04
        title: Record demo notes and traceability evidence for MAP-003
        kind: demo
  - id: MAP-004-S02
    title: The DM shall be able to generate terrain, settlements, and dungeons
      procedurally from explicit parameters and save the result as editable map
      layers
    requirementIds:
      - MAP-004
    acceptanceCriteria:
      - Given generation parameters and a seed, when the DM generates a dungeon,
        then the same seed and parameters reproduce the same editable layer set.
      - Given generation fails validation, when the command returns, then no
        partial map layers are persisted.
    tasks:
      - id: MAP-004-S02-T01
        title: Confirm architecture and interface shape for MAP-004
        kind: design
      - id: MAP-004-S02-T02
        title: Implement the smallest behavior that satisfies MAP-004
        kind: implementation
      - id: MAP-004-S02-T03
        title: Add automated coverage for MAP-004 acceptance criteria
        kind: test
      - id: MAP-004-S02-T04
        title: Record demo notes and traceability evidence for MAP-004
        kind: demo
testPlan:
  - Run unit tests for domain reducers, command validators, and data transforms
    touched by this epic.
  - Run UI or integration checks for any visible prototype behavior touched by
    this epic.
  - Run `pnpm v2:workpack:validate` before handoff.
demoNotesTemplate:
  - Describe the user-visible path demonstrated.
  - List the requirement IDs exercised by the demo.
  - Record any gaps intentionally deferred out of this epic.
stopConditions:
  - Stop if the v2 stack ADR is missing or contradicts the implementation
    approach.
  - Stop if implementing the epic requires runtime imports from v1 app code.
  - Stop if hidden visibility, permission, sync, or persistence behavior is
    ambiguous.
  - Stop if the generated workpack no longer validates.
completionEvidence:
  - Targeted tests pass.
  - Traceability from requirement IDs to implementation and tests is documented.
  - Demo notes are filled in for visible behavior.
  - Workpack status is updated after completion.

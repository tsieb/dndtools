schemaVersion: 1
id: SRCH-local-indexes-and-freshness
title: 'SRCH: Local indexes and freshness'
status: approved
approved: true
domain: SRCH
capabilityBranch: Local indexes and freshness
objective: Deliver the local indexes and freshness capability branch for SRCH,
  traced to the included v2 requirements.
requirementIds:
  - SRCH-001
  - SRCH-009
excludedRequirementIds: []
architectureContracts:
  - 'Contract 4: Scene and Widget Contract'
expectedAffectedAreas:
  - apps/v2
  - docs/planning/v2
  - search index
  - quick switcher
dependencies: []
parallelSafety:
  fileOwnership:
    - apps/v2/srch/
    - docs/planning/v2/
  requiresInterfaceContract: true
  notes: Parallel execution requires explicit interface contracts and
    non-overlapping generated file ownership.
stories:
  - id: SRCH-001-S01
    title: A user shall be able to perform full-text search over visible notes,
      objects, maps, POIs, handouts, and session artifacts from cached local
      indexes
    requirementIds:
      - SRCH-001
    acceptanceCriteria:
      - Given the app is offline, when the user searches cached content, then
        visible results return from local indexes.
      - Given a player searches for a term present only in DM-only content, when
        results are returned, then no hidden result or snippet appears.
      - Given a note, object, map artifact, or session record changes, when the
        mutation is accepted, then affected search indexes update incrementally
        or mark stale status before returning results.
    tasks:
      - id: SRCH-001-S01-T01
        title: Confirm architecture and interface shape for SRCH-001
        kind: design
      - id: SRCH-001-S01-T02
        title: Implement the smallest behavior that satisfies SRCH-001
        kind: implementation
      - id: SRCH-001-S01-T03
        title: Add automated coverage for SRCH-001 acceptance criteria
        kind: test
      - id: SRCH-001-S01-T04
        title: Record demo notes and traceability evidence for SRCH-001
        kind: demo
  - id: SRCH-009-S02
    title: The Search Engine shall publish index freshness, source cursor, and
      partial-result status for each searchable domain without blocking visible
      cached results
    requirementIds:
      - SRCH-009
    acceptanceCriteria:
      - Given background indexing is incomplete, when search returns cached
        visible results, then stale or partial status is exposed with affected
        sources.
      - Given a source cursor advances after sync, when indexing completes, then
        freshness metadata reflects the new cursor.
    tasks:
      - id: SRCH-009-S02-T01
        title: Confirm architecture and interface shape for SRCH-009
        kind: design
      - id: SRCH-009-S02-T02
        title: Implement the smallest behavior that satisfies SRCH-009
        kind: implementation
      - id: SRCH-009-S02-T03
        title: Add automated coverage for SRCH-009 acceptance criteria
        kind: test
      - id: SRCH-009-S02-T04
        title: Record demo notes and traceability evidence for SRCH-009
        kind: demo
testPlan:
  - Run unit tests for domain reducers, command validators, and data transforms
    touched by this epic.
  - Run UI or integration checks for any visible prototype behavior touched by
    this epic.
  - Run `pnpm v2:workpack:validate` before handoff.
demoNotesTemplate:
  - Describe the user-visible path demonstrated.
  - List the requirement IDs exercised by the demo.
  - Record any gaps intentionally deferred out of this epic.
stopConditions:
  - Stop if the v2 stack ADR is missing or contradicts the implementation
    approach.
  - Stop if implementing the epic requires runtime imports from v1 app code.
  - Stop if hidden visibility, permission, sync, or persistence behavior is
    ambiguous.
  - Stop if the generated workpack no longer validates.
completionEvidence:
  - Targeted tests pass.
  - Traceability from requirement IDs to implementation and tests is documented.
  - Demo notes are filled in for visible behavior.
  - Workpack status is updated after completion.

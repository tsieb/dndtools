schemaVersion: 1
id: MCP-response-contracts
title: 'MCP: Response contracts'
status: approved
approved: true
domain: MCP
capabilityBranch: Response contracts
objective: Deliver the response contracts capability branch for MCP, traced to
  the included v2 requirements.
requirementIds:
  - MCP-010
excludedRequirementIds: []
architectureContracts: []
expectedAffectedAreas:
  - apps/v2
  - docs/planning/v2
  - agent tool interface
  - policy layer
dependencies: []
parallelSafety:
  fileOwnership:
    - apps/v2/mcp/
    - docs/planning/v2/
  requiresInterfaceContract: true
  notes: Parallel execution requires explicit interface contracts and
    non-overlapping generated file ownership.
stories:
  - id: MCP-010-S01
    title: MCP and AI outputs shall use stable, concise, structured response
      envelopes with ids, status, summary, data, warnings, citations, and
      remediation actions where applicable
    requirementIds:
      - MCP-010
    acceptanceCriteria:
      - Given an MCP tool succeeds with warnings, when output is returned, then
        warnings and data are separated in the response envelope.
      - Given an MCP tool fails, when output is returned, then the error is
        structured, actionable, and does not include hidden data.
    tasks:
      - id: MCP-010-S01-T01
        title: Confirm architecture and interface shape for MCP-010
        kind: design
      - id: MCP-010-S01-T02
        title: Implement the smallest behavior that satisfies MCP-010
        kind: implementation
      - id: MCP-010-S01-T03
        title: Add automated coverage for MCP-010 acceptance criteria
        kind: test
      - id: MCP-010-S01-T04
        title: Record demo notes and traceability evidence for MCP-010
        kind: demo
testPlan:
  - Run unit tests for domain reducers, command validators, and data transforms
    touched by this epic.
  - Run UI or integration checks for any visible prototype behavior touched by
    this epic.
  - Run `pnpm v2:workpack:validate` before handoff.
demoNotesTemplate:
  - Describe the user-visible path demonstrated.
  - List the requirement IDs exercised by the demo.
  - Record any gaps intentionally deferred out of this epic.
stopConditions:
  - Stop if the v2 stack ADR is missing or contradicts the implementation
    approach.
  - Stop if implementing the epic requires runtime imports from v1 app code.
  - Stop if hidden visibility, permission, sync, or persistence behavior is
    ambiguous.
  - Stop if the generated workpack no longer validates.
completionEvidence:
  - Targeted tests pass.
  - Traceability from requirement IDs to implementation and tests is documented.
  - Demo notes are filled in for visible behavior.
  - Workpack status is updated after completion.

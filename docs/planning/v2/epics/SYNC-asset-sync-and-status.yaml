schemaVersion: 1
id: SYNC-asset-sync-and-status
title: 'SYNC: Asset sync and status'
status: proposed
approved: false
domain: SYNC
capabilityBranch: Asset sync and status
objective: Deliver the asset sync and status capability branch for SYNC, traced
  to the included v2 requirements.
requirementIds:
  - SYNC-009
  - SYNC-010
  - SYNC-014
excludedRequirementIds: []
architectureContracts:
  - 'Contract 2: Cloud Sync & Offline Model'
expectedAffectedAreas:
  - apps/v2
  - docs/planning/v2
  - sync engine
  - source adapters
dependencies: []
parallelSafety:
  fileOwnership:
    - apps/v2/sync/
    - docs/planning/v2/
  requiresInterfaceContract: true
  notes: Parallel execution requires explicit interface contracts and
    non-overlapping generated file ownership.
stories:
  - id: SYNC-009-S01
    title: The system shall sync large binary assets using content-addressed asset
      records plus metadata operations rather than embedding binary payloads in
      the operation log
    requirementIds:
      - SYNC-009
    acceptanceCriteria:
      - Given a large map image is added, when sync operations are generated,
        then the operation references asset metadata and content hash rather
        than embedding the image bytes.
      - Given the asset blob is unavailable on a device, when the map opens,
        then the UI shows an asset-missing/degraded state.
    tasks:
      - id: SYNC-009-S01-T01
        title: Confirm architecture and interface shape for SYNC-009
        kind: design
      - id: SYNC-009-S01-T02
        title: Implement the smallest behavior that satisfies SYNC-009
        kind: implementation
      - id: SYNC-009-S01-T03
        title: Add automated coverage for SYNC-009 acceptance criteria
        kind: test
      - id: SYNC-009-S01-T04
        title: Record demo notes and traceability evidence for SYNC-009
        kind: demo
  - id: SYNC-010-S02
    title: The user shall be able to inspect sync status, pending outbound
      operations, inbound revisions, conflicts, source health, and retry actions
      without needing raw storage knowledge
    requirementIds:
      - SYNC-010
    acceptanceCriteria:
      - Given operations are queued offline, when sync status opens, then
        pending operations and affected sources are visible.
      - Given a source auth failure occurs, when status is displayed, then the
        user sees reauthorization guidance and local work remains available.
    tasks:
      - id: SYNC-010-S02-T01
        title: Confirm architecture and interface shape for SYNC-010
        kind: design
      - id: SYNC-010-S02-T02
        title: Implement the smallest behavior that satisfies SYNC-010
        kind: implementation
      - id: SYNC-010-S02-T03
        title: Add automated coverage for SYNC-010 acceptance criteria
        kind: test
      - id: SYNC-010-S02-T04
        title: Record demo notes and traceability evidence for SYNC-010
        kind: demo
  - id: SYNC-014-S03
    title: Sync status shall expose source version history, compacted snapshot
      lineage, and recovery checkpoints needed to diagnose lost updates without
      exposing hidden content to unauthorized actors
    requirementIds:
      - SYNC-014
    acceptanceCriteria:
      - Given an entity has compacted operation history, when diagnostics open,
        then snapshot lineage and retained operation range are visible to an
        authorized DM.
      - Given a player opens sync status, when hidden source revisions exist,
        then the player sees only non-leaking freshness or unavailable status.
    tasks:
      - id: SYNC-014-S03-T01
        title: Confirm architecture and interface shape for SYNC-014
        kind: design
      - id: SYNC-014-S03-T02
        title: Implement the smallest behavior that satisfies SYNC-014
        kind: implementation
      - id: SYNC-014-S03-T03
        title: Add automated coverage for SYNC-014 acceptance criteria
        kind: test
      - id: SYNC-014-S03-T04
        title: Record demo notes and traceability evidence for SYNC-014
        kind: demo
testPlan:
  - Run unit tests for domain reducers, command validators, and data transforms
    touched by this epic.
  - Run UI or integration checks for any visible prototype behavior touched by
    this epic.
  - Run `pnpm v2:workpack:validate` before handoff.
demoNotesTemplate:
  - Describe the user-visible path demonstrated.
  - List the requirement IDs exercised by the demo.
  - Record any gaps intentionally deferred out of this epic.
stopConditions:
  - Stop if the v2 stack ADR is missing or contradicts the implementation
    approach.
  - Stop if implementing the epic requires runtime imports from v1 app code.
  - Stop if hidden visibility, permission, sync, or persistence behavior is
    ambiguous.
  - Stop if the generated workpack no longer validates.
completionEvidence:
  - Targeted tests pass.
  - Traceability from requirement IDs to implementation and tests is documented.
  - Demo notes are filled in for visible behavior.
  - Workpack status is updated after completion.

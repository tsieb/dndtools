schemaVersion: 1
id: CANVAS-scene-state
title: 'CANVAS: Scene state'
status: proposed
approved: false
domain: CANVAS
capabilityBranch: Scene state
objective: Deliver the scene state capability branch for CANVAS, traced to the
  included v2 requirements.
requirementIds:
  - CANVAS-001
  - CANVAS-003
  - CANVAS-004
  - CANVAS-013
  - CANVAS-018
excludedRequirementIds: []
architectureContracts:
  - 'Contract 1: Processing / Display Decoupling'
  - 'Contract 3: Role, Visibility & Permission Grant Model'
  - 'Contract 4: Scene and Widget Contract'
expectedAffectedAreas:
  - apps/v2
  - docs/planning/v2
  - scene core
  - widget host
  - scene UI
dependencies: []
parallelSafety:
  fileOwnership:
    - apps/v2/canvas/
    - docs/planning/v2/
  requiresInterfaceContract: true
  notes: Parallel execution requires explicit interface contracts and
    non-overlapping generated file ownership.
stories:
  - id: CANVAS-001-S01
    title: The DM shall be able to create a named Scene containing zero or more
      widgets from any supported platform profile, with the Scene persisted as a
      durable `SceneState` document
    requirementIds:
      - CANVAS-001
    acceptanceCriteria:
      - Given a local vault with no network, when the DM creates a Scene with a
        name, description, tags, background setting, ownership metadata,
        scene-level visibility, and player-view metadata, then the complete
        Scene state is saved locally and appears in Scene selection after
        restart.
      - Given an authenticated player session, when a DM-only Scene is created,
        then the player receives no Scene data until the DM explicitly projects
        or shares it.
      - Given scene metadata is missing required schema fields, when the create
        command is submitted, then no partial `SceneState` document is
        committed.
    tasks:
      - id: CANVAS-001-S01-T01
        title: Confirm architecture and interface shape for CANVAS-001
        kind: design
      - id: CANVAS-001-S01-T02
        title: Implement the smallest behavior that satisfies CANVAS-001
        kind: implementation
      - id: CANVAS-001-S01-T03
        title: Add automated coverage for CANVAS-001 acceptance criteria
        kind: test
      - id: CANVAS-001-S01-T04
        title: Record demo notes and traceability evidence for CANVAS-001
        kind: demo
  - id: CANVAS-003-S02
    title: The DM shall be able to move, resize, layer, group, dock, and pin widgets
      on a Scene, with layout stored on the Scene and not on the bound entity
    requirementIds:
      - CANVAS-003
    acceptanceCriteria:
      - Given a character widget bound to a character entity, when the DM
        resizes the widget, then only the Scene widget layout changes and the
        character entity revision is unchanged.
      - Given two users edit different widget positions on the same Scene, when
        sync reconciles the operations, then both independent layout changes are
        preserved or a field-specific conflict is recorded.
      - Given a grouped widget set is moved, when the command is accepted, then
        the group transform, individual widget positions, z-order, and focus
        traversal metadata remain consistent.
      - Given a slim profile opens the same Scene, when the user docks or pins a
        widget through focused controls, then the Scene layout state changes
        through the same command as desktop.
    tasks:
      - id: CANVAS-003-S02-T01
        title: Confirm architecture and interface shape for CANVAS-003
        kind: design
      - id: CANVAS-003-S02-T02
        title: Implement the smallest behavior that satisfies CANVAS-003
        kind: implementation
      - id: CANVAS-003-S02-T03
        title: Add automated coverage for CANVAS-003 acceptance criteria
        kind: test
      - id: CANVAS-003-S02-T04
        title: Record demo notes and traceability evidence for CANVAS-003
        kind: demo
  - id: CANVAS-004-S03
    title: The DM shall be able to save any Scene as a template and instantiate that
      template later without cloning canonical note, map, character, or handout
      entity data
    requirementIds:
      - CANVAS-004
    acceptanceCriteria:
      - Given a Scene with widgets bound to existing entities, when the DM saves
        and instantiates a template, then the new Scene contains new widget
        instances and bindings to the original entities.
      - Given a template contains a deleted binding target, when it is
        instantiated, then affected widgets render an explicit `missing` state
        without leaking cached content.
    tasks:
      - id: CANVAS-004-S03-T01
        title: Confirm architecture and interface shape for CANVAS-004
        kind: design
      - id: CANVAS-004-S03-T02
        title: Implement the smallest behavior that satisfies CANVAS-004
        kind: implementation
      - id: CANVAS-004-S03-T03
        title: Add automated coverage for CANVAS-004 acceptance criteria
        kind: test
      - id: CANVAS-004-S03-T04
        title: Record demo notes and traceability evidence for CANVAS-004
        kind: demo
  - id: CANVAS-013-S04
    title: The DM shall be able to author Scene-level visibility, sharing targets,
      tags, ownership metadata, and visual settings independently from widget
      layout and bound entity data
    requirementIds:
      - CANVAS-013
    acceptanceCriteria:
      - Given a Scene has `shared` visibility and a player-view assignment, when
        the player opens the assigned Scene, then the Scene shell is visible but
        every widget binding is still actor-filtered.
      - Given the DM changes Scene tags or background settings, when the command
        is accepted, then no widget binding or canonical entity revision
        changes.
    tasks:
      - id: CANVAS-013-S04-T01
        title: Confirm architecture and interface shape for CANVAS-013
        kind: design
      - id: CANVAS-013-S04-T02
        title: Implement the smallest behavior that satisfies CANVAS-013
        kind: implementation
      - id: CANVAS-013-S04-T03
        title: Add automated coverage for CANVAS-013 acceptance criteria
        kind: test
      - id: CANVAS-013-S04-T04
        title: Record demo notes and traceability evidence for CANVAS-013
        kind: demo
  - id: CANVAS-018-S05
    title: Scene sections shall be defined as layout regions within a Scene, not
      independent durable containers, unless a future architecture decision
      creates a separate Scene container type
    requirementIds:
      - CANVAS-018
    acceptanceCriteria:
      - Given a Scene contains sections, when the Scene is saved, then sections
        persist as layout metadata on `SceneState` and do not create separate
        widget ownership boundaries.
      - Given a section is projected to a Player View, when payload generation
        runs, then section membership narrows widget delivery but every binding
        is still actor-filtered.
      - Given a future proposal treats sections as independent containers, when
        architecture review runs, then it requires an explicit contract update
        before implementation.
    tasks:
      - id: CANVAS-018-S05-T01
        title: Confirm architecture and interface shape for CANVAS-018
        kind: design
      - id: CANVAS-018-S05-T02
        title: Implement the smallest behavior that satisfies CANVAS-018
        kind: implementation
      - id: CANVAS-018-S05-T03
        title: Add automated coverage for CANVAS-018 acceptance criteria
        kind: test
      - id: CANVAS-018-S05-T04
        title: Record demo notes and traceability evidence for CANVAS-018
        kind: demo
testPlan:
  - Run unit tests for domain reducers, command validators, and data transforms
    touched by this epic.
  - Run UI or integration checks for any visible prototype behavior touched by
    this epic.
  - Run `pnpm v2:workpack:validate` before handoff.
demoNotesTemplate:
  - Describe the user-visible path demonstrated.
  - List the requirement IDs exercised by the demo.
  - Record any gaps intentionally deferred out of this epic.
stopConditions:
  - Stop if the v2 stack ADR is missing or contradicts the implementation
    approach.
  - Stop if implementing the epic requires runtime imports from v1 app code.
  - Stop if hidden visibility, permission, sync, or persistence behavior is
    ambiguous.
  - Stop if the generated workpack no longer validates.
completionEvidence:
  - Targeted tests pass.
  - Traceability from requirement IDs to implementation and tests is documented.
  - Demo notes are filled in for visible behavior.
  - Workpack status is updated after completion.

schemaVersion: 1
id: CANVAS-widget-lifecycle
title: "CANVAS: Widget lifecycle"
status: complete
approved: true
domain: CANVAS
capabilityBranch: Widget lifecycle
objective: Deliver the widget lifecycle capability branch for CANVAS, traced to
  the included v2 requirements.
requirementIds:
  - CANVAS-002
  - CANVAS-008
  - CANVAS-010
  - CANVAS-011
  - CANVAS-014
  - CANVAS-017
excludedRequirementIds: []
architectureContracts:
  - "Contract 1: Processing / Display Decoupling"
  - "Contract 2: Cloud Sync & Offline Model"
  - "Contract 3: Role, Visibility & Permission Grant Model"
  - "Contract 4: Scene and Widget Contract"
expectedAffectedAreas:
  - apps/gm
  - docs/planning/v2
  - scene core
  - widget host
  - scene UI
dependencies: []
parallelSafety:
  fileOwnership:
    - apps/gm/canvas/
    - docs/planning/v2/
  requiresInterfaceContract: true
  notes: Parallel execution requires explicit interface contracts and
    non-overlapping generated file ownership.
stories:
  - id: CANVAS-002-S01
    title: The DM shall be able to add a widget to a Scene by selecting a widget
      type and initial placement, with widget creation accepted only through a
      Processing Core command
    requirementIds:
      - CANVAS-002
    acceptanceCriteria:
      - Given an editable Scene, when the DM adds a map widget, then
        `SceneState` records a widget instance, layout, configuration, and
        binding placeholder.
      - Given a custom widget attempts to write its own widget instance directly
        to storage, when the write bypasses the command API, then the operation
        is rejected.
    tasks:
      - id: CANVAS-002-S01-T01
        title: Confirm architecture and interface shape for CANVAS-002
        kind: design
      - id: CANVAS-002-S01-T02
        title: Implement the smallest behavior that satisfies CANVAS-002
        kind: implementation
      - id: CANVAS-002-S01-T03
        title: Add automated coverage for CANVAS-002 acceptance criteria
        kind: test
      - id: CANVAS-002-S01-T04
        title: Record demo notes and traceability evidence for CANVAS-002
        kind: demo
  - id: CANVAS-008-S02
    title: A widget author shall be able to define a versioned widget package with
      declared bindings, configuration schema, runtime state schema, commands,
      events, capability sets, and host permissions
    requirementIds:
      - CANVAS-008
    acceptanceCriteria:
      - Given a widget package missing a configuration schema, when it is
        installed, then installation fails with a schema diagnostic.
      - Given a widget package declares network access but the host permission
        is denied, when the widget runs, then the network API is unavailable and
        the widget enters a degraded state.
      - Given a widget package is imported from a vault backup, when portability
        validation runs, then package id, version, schemas, assets, and
        requested host permissions are checked before the widget can be enabled.
    tasks:
      - id: CANVAS-008-S02-T01
        title: Confirm architecture and interface shape for CANVAS-008
        kind: design
      - id: CANVAS-008-S02-T02
        title: Implement the smallest behavior that satisfies CANVAS-008
        kind: implementation
      - id: CANVAS-008-S02-T03
        title: Add automated coverage for CANVAS-008 acceptance criteria
        kind: test
      - id: CANVAS-008-S02-T04
        title: Record demo notes and traceability evidence for CANVAS-008
        kind: demo
  - id: CANVAS-010-S03
    title: A widget shall be able to dispatch declared commands for durable changes,
      and the Processing Core shall validate actor, visibility, permission,
      schema, revision, and sync constraints before accepting them
    requirementIds:
      - CANVAS-010
    acceptanceCriteria:
      - Given a timer widget with an `operator` command, when an authorized
        player starts the timer, then the command is accepted and session timer
        state changes.
      - Given a custom widget submits a command for a hidden entity path, when
        the core validates it, then the command is rejected before mutation.
    tasks:
      - id: CANVAS-010-S03-T01
        title: Confirm architecture and interface shape for CANVAS-010
        kind: design
      - id: CANVAS-010-S03-T02
        title: Implement the smallest behavior that satisfies CANVAS-010
        kind: implementation
      - id: CANVAS-010-S03-T03
        title: Add automated coverage for CANVAS-010 acceptance criteria
        kind: test
      - id: CANVAS-010-S03-T04
        title: Record demo notes and traceability evidence for CANVAS-010
        kind: demo
  - id: CANVAS-011-S04
    title: A widget manager shall be able to upgrade a widget definition version
      with migration logic or leave the previous version recoverably disabled
      when migration fails
    requirementIds:
      - CANVAS-011
    acceptanceCriteria:
      - Given a widget package update includes migration logic, when the manager
        upgrades it, then existing widget configuration is migrated and a new
        version is recorded.
      - Given migration fails validation, when the upgrade completes, then the
        previous widget state is preserved or the instance is disabled with a
        recoverable diagnostic.
    tasks:
      - id: CANVAS-011-S04-T01
        title: Confirm architecture and interface shape for CANVAS-011
        kind: design
      - id: CANVAS-011-S04-T02
        title: Implement the smallest behavior that satisfies CANVAS-011
        kind: implementation
      - id: CANVAS-011-S04-T03
        title: Add automated coverage for CANVAS-011 acceptance criteria
        kind: test
      - id: CANVAS-011-S04-T04
        title: Record demo notes and traceability evidence for CANVAS-011
        kind: demo
  - id: CANVAS-014-S05
    title: A widget manager shall be able to destroy a widget instance without
      deleting or mutating its bound note, character, map, handout, timer
      history, or object
    requirementIds:
      - CANVAS-014
    acceptanceCriteria:
      - Given a map widget is removed from a Scene, when the destroy command is
        accepted, then the widget instance and declared widget-local state are
        removed and the map entity remains unchanged.
      - Given a custom widget attempts to delete its bound entity as part of
        widget destroy, when validation runs, then the entity deletion is
        rejected unless a separate explicit entity-delete command is authorized.
    tasks:
      - id: CANVAS-014-S05-T01
        title: Confirm architecture and interface shape for CANVAS-014
        kind: design
      - id: CANVAS-014-S05-T02
        title: Implement the smallest behavior that satisfies CANVAS-014
        kind: implementation
      - id: CANVAS-014-S05-T03
        title: Add automated coverage for CANVAS-014 acceptance criteria
        kind: test
      - id: CANVAS-014-S05-T04
        title: Record demo notes and traceability evidence for CANVAS-014
        kind: demo
  - id: CANVAS-017-S06
    title: A widget manager shall be able to install, review, enable, disable,
      remove, and export Widget Packages with trust state, host-permission
      approval, migration status, and portability diagnostics
    requirementIds:
      - CANVAS-017
    acceptanceCriteria:
      - Given a Widget Package requests filesystem, clipboard, network, or
        source-adapter access, when trust review opens, then each host
        permission is shown and denied by default.
      - Given a package is disabled, when a Scene containing its widget opens,
        then the widget instance renders a recoverable disabled state and no
        package code executes.
      - Given a package is removed, when existing Scenes reference it, then
        widget instances remain as disabled placeholders until explicitly
        destroyed or migrated.
      - Given a package export runs, when validated, then schemas, migrations,
        assets, version, trust metadata, and portability warnings are included
        without secrets or device-local paths.
    tasks:
      - id: CANVAS-017-S06-T01
        title: Confirm architecture and interface shape for CANVAS-017
        kind: design
      - id: CANVAS-017-S06-T02
        title: Implement the smallest behavior that satisfies CANVAS-017
        kind: implementation
      - id: CANVAS-017-S06-T03
        title: Add automated coverage for CANVAS-017 acceptance criteria
        kind: test
      - id: CANVAS-017-S06-T04
        title: Record demo notes and traceability evidence for CANVAS-017
        kind: demo
qualityBar:
  - "Correctness: every mapped acceptance criterion is implemented or explicitly
    deferred with reviewer-visible evidence."
  - "Architecture integrity: changes obey ADR-014, the architecture contracts,
    package boundaries, and no-v1-runtime-import rules."
  - "Traceability: requirement IDs are tied to code, tests, demo notes, and any
    documentation changes."
  - "Test depth: unit, integration, e2e, boundary, accessibility, performance,
    security, permission, sync, and migration coverage are chosen according to
    risk."
  - "User experience: visible flows are complete, accessible, responsive,
    resilient to empty/error/loading states, and consistent with the design
    system."
  - "Data safety: persistence, offline behavior, sync assumptions, conflict
    handling, actor filtering, and privacy boundaries fail closed."
  - "Maintainability: modules remain cohesive, typed, readable, locally scoped,
    and free of speculative abstractions or unrelated refactors."
  - "Operational quality: diagnostics, metrics, docs, generated files, and
    handoff evidence are current before completion."
gitWorkflow:
  - Start from a clean working tree. Run `git status --short` before editing and
    stop if unrelated changes overlap this epic.
  - Use one branch per epic from the correct base branch, and keep all commits
    scoped to the assigned epic.
  - Never reset, overwrite, or reformat unrelated user changes. Work around
    existing dirty files unless they block the epic.
  - Commit the code, docs, tests, generated workpack updates, and completion
    evidence needed for the epic before handoff.
  - "Leave a clean slate when the epic is complete: no untracked files, no
    unstaged edits, and no stale generated planning diffs caused by the epic."
statusAutomation:
  - Do not hand-edit generated epic packets, `status.yaml`,
    `requirements-index.yaml`, `initiative-map.yaml`, or `parallel-batches.yaml`
    for status changes.
  - Use `pnpm workpack:set-status -- --epic CANVAS-widget-lifecycle --status
    active` when implementation starts.
  - Create `docs/planning/v2/epics/CANVAS-widget-lifecycle.completion.md` with
    demo, tests, traceability, gaps, and git evidence before marking complete.
  - Use `pnpm workpack:complete -- --epic CANVAS-widget-lifecycle` to update
    `workpack-state.yaml` and regenerate all derived planning files together.
  - Run `pnpm workpack:validate` after any status or generation command;
    validation fails if generated files drift from the source of truth.
testPlan:
  - Run unit tests for domain reducers, command validators, and data transforms
    touched by this epic.
  - Run UI or integration checks for any visible prototype behavior touched by
    this epic.
  - Run domain-specific quality gates for accessibility, performance, security,
    permissions, sync/offline behavior, migrations, and docs when those areas
    are touched.
  - Run `pnpm workpack:validate` before handoff.
demoNotesTemplate:
  - Describe the user-visible path demonstrated.
  - List the requirement IDs exercised by the demo.
  - Record any gaps intentionally deferred out of this epic.
stopConditions:
  - Stop if the v2 stack ADR is missing or contradicts the implementation
    approach.
  - Stop if implementing the epic requires runtime imports from v1 app code.
  - Stop if hidden visibility, permission, sync, or persistence behavior is
    ambiguous.
  - Stop if the generated workpack no longer validates.
  - Stop if `git status --short` shows unrelated changes that overlap the files
    this epic needs.
completionEvidence:
  - Targeted tests pass.
  - Traceability from requirement IDs to implementation and tests is documented.
  - Demo notes are filled in for visible behavior.
  - Quality review covers correctness, architecture, security, permissions,
    accessibility, performance, persistence, sync/offline assumptions,
    maintainability, UX polish, and documentation.
  - Completion evidence file records demo path, tests run, changed files,
    requirement coverage, known gaps, git branch, commit or PR, and final `git
    status --short` output.
  - Workpack status is updated with the programmatic complete command after
    completion evidence exists.
  - The epic leaves a clean git slate with no untracked or unstaged files caused
    by the work.
completionEvidenceFile: docs/planning/v2/epics/CANVAS-widget-lifecycle.completion.md

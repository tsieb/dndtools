schemaVersion: 1
id: CANVAS-layout-accessibility
title: "CANVAS: Layout accessibility"
status: complete
approved: true
domain: CANVAS
capabilityBranch: Layout accessibility
objective: Deliver the layout accessibility capability branch for CANVAS, traced
  to the included v2 requirements.
requirementIds:
  - CANVAS-012
  - CANVAS-016
excludedRequirementIds: []
architectureContracts:
  - "Contract 1: Processing / Display Decoupling"
  - "Contract 4: Scene and Widget Contract"
expectedAffectedAreas:
  - apps/gm
  - docs/planning/v2
  - scene core
  - widget host
  - scene UI
dependencies: []
parallelSafety:
  fileOwnership:
    - apps/gm/canvas/
    - docs/planning/v2/
  requiresInterfaceContract: true
  notes: Parallel execution requires explicit interface contracts and
    non-overlapping generated file ownership.
stories:
  - id: CANVAS-012-S01
    title: A keyboard or touch user shall be able to perform every Must-have Scene
      and widget layout operation without relying on drag-only or hover-only
      controls
    requirementIds:
      - CANVAS-012
    acceptanceCriteria:
      - Given keyboard-only input, when the user selects a widget, then they can
        move and resize it through focusable controls or command menus.
      - Given a touch device, when the user opens widget actions, then all
        commands remain reachable without hover.
    tasks:
      - id: CANVAS-012-S01-T01
        title: Confirm architecture and interface shape for CANVAS-012
        kind: design
      - id: CANVAS-012-S01-T02
        title: Implement the smallest behavior that satisfies CANVAS-012
        kind: implementation
      - id: CANVAS-012-S01-T03
        title: Add automated coverage for CANVAS-012 acceptance criteria
        kind: test
      - id: CANVAS-012-S01-T04
        title: Record demo notes and traceability evidence for CANVAS-012
        kind: demo
  - id: CANVAS-016-S02
    title: Scene focus order shall follow z-order, grouping, dock/pin state, and
      explicit widget focus metadata rather than DOM insertion order
    requirementIds:
      - CANVAS-016
    acceptanceCriteria:
      - Given a Scene contains grouped and layered widgets, when keyboard
        traversal starts, then focus follows the declared Scene focus order.
      - Given a widget is pinned or docked, when the layout changes, then focus
        order updates predictably and no widget control becomes unreachable.
    tasks:
      - id: CANVAS-016-S02-T01
        title: Confirm architecture and interface shape for CANVAS-016
        kind: design
      - id: CANVAS-016-S02-T02
        title: Implement the smallest behavior that satisfies CANVAS-016
        kind: implementation
      - id: CANVAS-016-S02-T03
        title: Add automated coverage for CANVAS-016 acceptance criteria
        kind: test
      - id: CANVAS-016-S02-T04
        title: Record demo notes and traceability evidence for CANVAS-016
        kind: demo
qualityBar:
  - "Correctness: every mapped acceptance criterion is implemented or explicitly
    deferred with reviewer-visible evidence."
  - "Architecture integrity: changes obey ADR-014, the architecture contracts,
    package boundaries, and no-v1-runtime-import rules."
  - "Traceability: requirement IDs are tied to code, tests, demo notes, and any
    documentation changes."
  - "Test depth: unit, integration, e2e, boundary, accessibility, performance,
    security, permission, sync, and migration coverage are chosen according to
    risk."
  - "User experience: visible flows are complete, accessible, responsive,
    resilient to empty/error/loading states, and consistent with the design
    system."
  - "Data safety: persistence, offline behavior, sync assumptions, conflict
    handling, actor filtering, and privacy boundaries fail closed."
  - "Maintainability: modules remain cohesive, typed, readable, locally scoped,
    and free of speculative abstractions or unrelated refactors."
  - "Operational quality: diagnostics, metrics, docs, generated files, and
    handoff evidence are current before completion."
gitWorkflow:
  - Start from a clean working tree. Run `git status --short` before editing and
    stop if unrelated changes overlap this epic.
  - Use one branch per epic from the correct base branch, and keep all commits
    scoped to the assigned epic.
  - Never reset, overwrite, or reformat unrelated user changes. Work around
    existing dirty files unless they block the epic.
  - Commit the code, docs, tests, generated workpack updates, and completion
    evidence needed for the epic before handoff.
  - "Leave a clean slate when the epic is complete: no untracked files, no
    unstaged edits, and no stale generated planning diffs caused by the epic."
statusAutomation:
  - Do not hand-edit generated epic packets, `status.yaml`,
    `requirements-index.yaml`, `initiative-map.yaml`, or `parallel-batches.yaml`
    for status changes.
  - Use `pnpm workpack:set-status -- --epic CANVAS-layout-accessibility --status
    active` when implementation starts.
  - Create `docs/planning/v2/epics/CANVAS-layout-accessibility.completion.md`
    with demo, tests, traceability, gaps, and git evidence before marking
    complete.
  - Use `pnpm workpack:complete -- --epic CANVAS-layout-accessibility` to update
    `workpack-state.yaml` and regenerate all derived planning files together.
  - Run `pnpm workpack:validate` after any status or generation command;
    validation fails if generated files drift from the source of truth.
testPlan:
  - Run unit tests for domain reducers, command validators, and data transforms
    touched by this epic.
  - Run UI or integration checks for any visible prototype behavior touched by
    this epic.
  - Run domain-specific quality gates for accessibility, performance, security,
    permissions, sync/offline behavior, migrations, and docs when those areas
    are touched.
  - Run `pnpm workpack:validate` before handoff.
demoNotesTemplate:
  - Describe the user-visible path demonstrated.
  - List the requirement IDs exercised by the demo.
  - Record any gaps intentionally deferred out of this epic.
stopConditions:
  - Stop if the v2 stack ADR is missing or contradicts the implementation
    approach.
  - Stop if implementing the epic requires runtime imports from v1 app code.
  - Stop if hidden visibility, permission, sync, or persistence behavior is
    ambiguous.
  - Stop if the generated workpack no longer validates.
  - Stop if `git status --short` shows unrelated changes that overlap the files
    this epic needs.
completionEvidence:
  - Targeted tests pass.
  - Traceability from requirement IDs to implementation and tests is documented.
  - Demo notes are filled in for visible behavior.
  - Quality review covers correctness, architecture, security, permissions,
    accessibility, performance, persistence, sync/offline assumptions,
    maintainability, UX polish, and documentation.
  - Completion evidence file records demo path, tests run, changed files,
    requirement coverage, known gaps, git branch, commit or PR, and final `git
    status --short` output.
  - Workpack status is updated with the programmatic complete command after
    completion evidence exists.
  - The epic leaves a clean git slate with no untracked or unstaged files caused
    by the work.
completionEvidenceFile: docs/planning/v2/epics/CANVAS-layout-accessibility.completion.md

stories:
  - id: SRCH-002-S01
    title: A user shall be able to use quick switcher search for title-first
      navigation across visible content and commands
    requirementIds:
      - SRCH-002
    acceptanceCriteria:
      - Given a note title matches the query, when the quick switcher opens,
        then title matches rank above body-only matches.
      - Given query changes, when Enter is pressed, then the current selection
        is executed and stale selection state is not used.
      - Given a player opens quick switcher search, when DM-only commands,
        hidden entity targets, or hidden command labels would match, then those
        commands, labels, ids, and revealing counts are absent.
    tasks:
      - id: SRCH-002-S01-T01
        title: Confirm architecture and interface shape for SRCH-002
        kind: design
      - id: SRCH-002-S01-T02
        title: Implement the smallest behavior that satisfies SRCH-002
        kind: implementation
      - id: SRCH-002-S01-T03
        title: Add automated coverage for SRCH-002 acceptance criteria
        kind: test
      - id: SRCH-002-S01-T04
        title: Record demo notes and traceability evidence for SRCH-002
        kind: demo
testPlan:
  - Run unit tests for domain reducers, command validators, and data transforms
    touched by this epic.
  - Run UI or integration checks for any visible prototype behavior touched by
    this epic.
  - Run `pnpm v2:workpack:validate` before handoff.
demoNotesTemplate:
  - Describe the user-visible path demonstrated.
  - List the requirement IDs exercised by the demo.
  - Record any gaps intentionally deferred out of this epic.
stopConditions:
  - Stop if the v2 stack ADR is missing or contradicts the implementation
    approach.
  - Stop if implementing the epic requires runtime imports from v1 app code.
  - Stop if hidden visibility, permission, sync, or persistence behavior is
    ambiguous.
  - Stop if the generated workpack no longer validates.
completionEvidence:
  - Targeted tests pass.
  - Traceability from requirement IDs to implementation and tests is documented.
  - Demo notes are filled in for visible behavior.
  - Workpack status is updated after completion.

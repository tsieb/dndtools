parallelSafety:
  fileOwnership:
    - apps/v2/sec/
    - docs/planning/v2/
  requiresInterfaceContract: true
  notes: Parallel execution requires explicit interface contracts and
    non-overlapping generated file ownership.
stories:
  - id: SEC-004-S01
    title: Auth tokens, refresh tokens, session secrets, cloud credentials, and MCP
      agent secrets shall be stored in OS or platform credential stores where
      available and never in vault markdown, exported packages, logs,
      diagnostics, or player streams by default
    requirementIds:
      - SEC-004
    acceptanceCriteria:
      - Given diagnostics are exported, when scanned, then token-like values are
        redacted.
      - Given vault export runs, when output is inspected, then auth secrets are
        absent.
    tasks:
      - id: SEC-004-S01-T01
        title: Confirm architecture and interface shape for SEC-004
        kind: design
      - id: SEC-004-S01-T02
        title: Implement the smallest behavior that satisfies SEC-004
        kind: implementation
      - id: SEC-004-S01-T03
        title: Add automated coverage for SEC-004 acceptance criteria
        kind: test
      - id: SEC-004-S01-T04
        title: Record demo notes and traceability evidence for SEC-004
        kind: demo
  - id: SEC-005-S02
    title: Cloud collaboration shall use authenticated protected channels,
      participant identity, revocation, rate-limited session joins,
      tenant/session isolation, replay protection, cloud-side stream filtering,
      and fail-closed parsing for unsupported payload versions
    requirementIds:
      - SEC-005
    acceptanceCriteria:
      - Given an unsupported future sync payload version arrives, when parsed,
        then it fails closed with upgrade-required diagnostic.
      - Given repeated invalid join attempts occur, when rate limiting applies,
        then further attempts are throttled without leaking session existence
        details.
      - Given a player attempts to access another vault, session, tenant, or
        player stream, when cloud authorization evaluates the request, then
        access is denied before payload generation.
      - Given an old valid-looking sync payload is replayed, when
        nonce/revision/session validation runs, then the replay is rejected or
        ignored idempotently.
      - Given a participant is revoked, when cloud collaboration state updates,
        then their stream is torn down, session credentials are invalidated, and
        queued operations from that participant are rejected unless explicitly
        accepted before revocation.
    tasks:
      - id: SEC-005-S02-T01
        title: Confirm architecture and interface shape for SEC-005
        kind: design
      - id: SEC-005-S02-T02
        title: Implement the smallest behavior that satisfies SEC-005
        kind: implementation
      - id: SEC-005-S02-T03
        title: Add automated coverage for SEC-005 acceptance criteria
        kind: test
      - id: SEC-005-S02-T04
        title: Record demo notes and traceability evidence for SEC-005
        kind: demo
  - id: SEC-009-S03
    title: The cloud security model shall declare encryption responsibilities, key
      custody, server trust boundaries, credential rotation, and recovery
      tradeoffs before cloud sync or collaboration release
    requirementIds:
      - SEC-009
    acceptanceCriteria:
      - Given cloud sync is enabled for a vault, when security review runs, then
        encryption at rest, encryption in transit, key ownership, and recovery
        behavior are documented and test-covered.
      - Given a credential or session key is rotated or revoked, when the
        participant reconnects, then stale credentials no longer authorize
        payload access.
      - Given no cloud encryption/key-custody decision record exists, when
        release gating runs for cloud sync or collaboration, then the release is
        blocked.
      - Given the approved model claims end-to-end encryption, when cloud
        payloads are inspected by server-side code paths, then hidden content is
        unavailable to the server except for metadata explicitly allowed by the
        decision record.
    tasks:
      - id: SEC-009-S03-T01
        title: Confirm architecture and interface shape for SEC-009
        kind: design
      - id: SEC-009-S03-T02
        title: Implement the smallest behavior that satisfies SEC-009
        kind: implementation
      - id: SEC-009-S03-T03
        title: Add automated coverage for SEC-009 acceptance criteria
        kind: test
      - id: SEC-009-S03-T04
        title: Record demo notes and traceability evidence for SEC-009
        kind: demo
  - id: SEC-012-S04
    title: Cloud key custody, rotation, participant revocation, and recovery
      behavior shall be enforced by tests before any cloud sync or collaboration
      release
    requirementIds:
      - SEC-012
    acceptanceCriteria:
      - Given a participant is removed from a session, when keys rotate, then
        newly synced or newly delivered content cannot be decrypted with the
        removed participant's credentials.
      - Given a recovery flow is configured, when tested, then it restores only
        the approved recovery scope and does not expose another vault, tenant,
        or participant stream.
      - Given cloud storage is compromised in the threat model, when the
        approved key-custody model is evaluated, then the exposed plaintext and
        metadata classes match the documented server trust boundary.
    tasks:
      - id: SEC-012-S04-T01
        title: Confirm architecture and interface shape for SEC-012
        kind: design
      - id: SEC-012-S04-T02
        title: Implement the smallest behavior that satisfies SEC-012
        kind: implementation
      - id: SEC-012-S04-T03
        title: Add automated coverage for SEC-012 acceptance criteria
        kind: test
      - id: SEC-012-S04-T04
        title: Record demo notes and traceability evidence for SEC-012
        kind: demo
qualityBar:
  - "Correctness: every mapped acceptance criterion is implemented or explicitly
    deferred with reviewer-visible evidence."
  - "Architecture integrity: changes obey ADR-014, the architecture contracts,
    package boundaries, and no-v1-runtime-import rules."
  - "Traceability: requirement IDs are tied to code, tests, demo notes, and any
    documentation changes."
  - "Test depth: unit, integration, e2e, boundary, accessibility, performance,
    security, permission, sync, and migration coverage are chosen according to
    risk."
  - "User experience: visible flows are complete, accessible, responsive,
    resilient to empty/error/loading states, and consistent with the design
    system."
  - "Data safety: persistence, offline behavior, sync assumptions, conflict
    handling, actor filtering, and privacy boundaries fail closed."
  - "Maintainability: modules remain cohesive, typed, readable, locally scoped,
    and free of speculative abstractions or unrelated refactors."
  - "Operational quality: diagnostics, metrics, docs, generated files, and
    handoff evidence are current before completion."
gitWorkflow:
  - Start from a clean working tree. Run `git status --short` before editing and
    stop if unrelated changes overlap this epic.
  - Use one branch per epic from the correct base branch, and keep all commits
    scoped to the assigned epic.
  - Never reset, overwrite, or reformat unrelated user changes. Work around
    existing dirty files unless they block the epic.
  - Commit the code, docs, tests, generated workpack updates, and completion
    evidence needed for the epic before handoff.
  - "Leave a clean slate when the epic is complete: no untracked files, no
    unstaged edits, and no stale generated planning diffs caused by the epic."
statusAutomation:
  - Do not hand-edit generated epic packets, `status.yaml`,
    `requirements-index.yaml`, `initiative-map.yaml`, or `parallel-batches.yaml`
    for status changes.
  - Use `pnpm v2:workpack:set-status -- --epic
    SEC-secrets-and-cloud-collaboration --status active` when implementation
    starts.
  - Create
    `docs/planning/v2/epics/SEC-secrets-and-cloud-collaboration.completion.md`
    with demo, tests, traceability, gaps, and git evidence before marking
    complete.
  - Use `pnpm v2:workpack:complete -- --epic
    SEC-secrets-and-cloud-collaboration` to update `workpack-state.yaml` and
    regenerate all derived planning files together.
  - Run `pnpm v2:workpack:validate` after any status or generation command;
    validation fails if generated files drift from the source of truth.
testPlan:
  - Run unit tests for domain reducers, command validators, and data transforms
    touched by this epic.
  - Run UI or integration checks for any visible prototype behavior touched by
    this epic.
  - Run domain-specific quality gates for accessibility, performance, security,
    permissions, sync/offline behavior, migrations, and docs when those areas
    are touched.
  - Run `pnpm v2:workpack:validate` before handoff.
demoNotesTemplate:
  - Describe the user-visible path demonstrated.
  - List the requirement IDs exercised by the demo.
  - Record any gaps intentionally deferred out of this epic.
stopConditions:
  - Stop if the v2 stack ADR is missing or contradicts the implementation
    approach.
  - Stop if implementing the epic requires runtime imports from v1 app code.
  - Stop if hidden visibility, permission, sync, or persistence behavior is
    ambiguous.
  - Stop if the generated workpack no longer validates.
  - Stop if `git status --short` shows unrelated changes that overlap the files
    this epic needs.
completionEvidence:
  - Targeted tests pass.
  - Traceability from requirement IDs to implementation and tests is documented.
  - Demo notes are filled in for visible behavior.
  - Quality review covers correctness, architecture, security, permissions,
    accessibility, performance, persistence, sync/offline assumptions,
    maintainability, UX polish, and documentation.
  - Completion evidence file records demo path, tests run, changed files,
    requirement coverage, known gaps, git branch, commit or PR, and final `git
    status --short` output.
  - Workpack status is updated with the programmatic complete command after
    completion evidence exists.
  - The epic leaves a clean git slate with no untracked or unstaged files caused
    by the work.

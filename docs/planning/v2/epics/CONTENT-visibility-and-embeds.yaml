stories:
  - id: CONTENT-009-S01
    title: The DM shall be able to author visibility at entity, section, and field
      granularity for notes and structured objects, with defaults set to
      `dm-only`
    requirementIds:
      - CONTENT-009
    acceptanceCriteria:
      - Given a note with a `player-visible` entity default and one `dm-only`
        section, when a player reads it, then the section is omitted.
      - Given no visibility metadata exists, when a non-DM queries the note,
        then it is treated as `dm-only`.
      - Given a note section is `shared` with Player A through a viewer-capable
        grant, when Player A and Player B query the note, then only Player A
        receives that section.
      - Given a player has a write grant on a hidden section, when consistency
        checks run, then the DM sees a visibility/permission consistency error
        and the player still cannot read or write that section.
    tasks:
      - id: CONTENT-009-S01-T01
        title: Confirm architecture and interface shape for CONTENT-009
        kind: design
      - id: CONTENT-009-S01-T02
        title: Implement the smallest behavior that satisfies CONTENT-009
        kind: implementation
      - id: CONTENT-009-S01-T03
        title: Add automated coverage for CONTENT-009 acceptance criteria
        kind: test
      - id: CONTENT-009-S01-T04
        title: Record demo notes and traceability evidence for CONTENT-009
        kind: demo
  - id: CONTENT-010-S02
    title: An authorized editor shall be able to embed object cards, note sections,
      and entity render blocks in note content, and add entity-backed widgets to
      Scenes, without cloning target entity data into the embedding source
    requirementIds:
      - CONTENT-010
    acceptanceCriteria:
      - Given a note embeds a character card, when the character changes, then
        the rendered embed reflects the current visible character data.
      - Given the target entity is hidden from the actor, when the embed
        renders, then it shows a non-leaking hidden or unavailable placeholder.
      - Given a note references a Scene widget instance, when validation runs,
        then the note stores only a link or embed reference and does not persist
        a widget instance outside a Scene.
    tasks:
      - id: CONTENT-010-S02-T01
        title: Confirm architecture and interface shape for CONTENT-010
        kind: design
      - id: CONTENT-010-S02-T02
        title: Implement the smallest behavior that satisfies CONTENT-010
        kind: implementation
      - id: CONTENT-010-S02-T03
        title: Add automated coverage for CONTENT-010 acceptance criteria
        kind: test
      - id: CONTENT-010-S02-T04
        title: Record demo notes and traceability evidence for CONTENT-010
        kind: demo
qualityBar:

schemaVersion: 1
id: CANVAS-player-view-and-projection
title: 'CANVAS: Player view and projection'
status: proposed
approved: false
domain: CANVAS
capabilityBranch: Player view and projection
objective: Deliver the player view and projection capability branch for CANVAS,
  traced to the included v2 requirements.
requirementIds:
  - CANVAS-005
  - CANVAS-006
  - CANVAS-007
  - CANVAS-015
excludedRequirementIds: []
architectureContracts:
  - 'Contract 1: Processing / Display Decoupling'
  - 'Contract 3: Role, Visibility & Permission Grant Model'
  - 'Contract 4: Scene and Widget Contract'
expectedAffectedAreas:
  - apps/v2
  - docs/planning/v2
  - scene core
  - widget host
  - scene UI
dependencies: []
parallelSafety:
  fileOwnership:
    - apps/v2/canvas/
    - docs/planning/v2/
  requiresInterfaceContract: true
  notes: Parallel execution requires explicit interface contracts and
    non-overlapping generated file ownership.
stories:
  - id: CANVAS-005-S01
    title: The DM shall be able to project a Scene, widget subset, handout, map
      region, or display state to one or more Player Views during an active
      session, with projection stored in session/player-view assignment state
    requirementIds:
      - CANVAS-005
    acceptanceCriteria:
      - Given a connected player, when the DM projects a handout widget to that
        player, then the player's Player View receives the widget only after
        visibility filtering.
      - Given the network is unavailable, when the DM attempts a live remote
        projection, then the projection queues for the next reconnect and the DM
        sees degraded delivery status.
      - Given a projected widget is revoked, when the player view assignment
        updates, then the player stream removes the widget without deleting the
        target entity or granting write permission.
      - Given a projected widget has one visible binding and one hidden binding,
        when the player payload is generated, then the visible binding is
        delivered and the hidden binding resolves to `hidden` before leaving the
        host.
    tasks:
      - id: CANVAS-005-S01-T01
        title: Confirm architecture and interface shape for CANVAS-005
        kind: design
      - id: CANVAS-005-S01-T02
        title: Implement the smallest behavior that satisfies CANVAS-005
        kind: implementation
      - id: CANVAS-005-S01-T03
        title: Add automated coverage for CANVAS-005 acceptance criteria
        kind: test
      - id: CANVAS-005-S01-T04
        title: Record demo notes and traceability evidence for CANVAS-005
        kind: demo
  - id: CANVAS-006-S02
    title: A player shall be able to view the Scene configuration assigned by the DM
      with hidden fields redacted before the player device receives data
    requirementIds:
      - CANVAS-006
    acceptanceCriteria:
      - Given a widget bound to a character with a `dm-only` field, when the
        player opens the assigned Scene, then the field is omitted from the
        query result and cannot be inspected in UI state.
      - Given a player has no Scene assignment, when they connect to a session,
        then they receive no default DM Scene layout.
      - Given assigned Scene content is not cached on a player device, when the
        player opens it offline, then the app reports unavailable content
        without substituting stale hidden data.
    tasks:
      - id: CANVAS-006-S02-T01
        title: Confirm architecture and interface shape for CANVAS-006
        kind: design
      - id: CANVAS-006-S02-T02
        title: Implement the smallest behavior that satisfies CANVAS-006
        kind: implementation
      - id: CANVAS-006-S02-T03
        title: Add automated coverage for CANVAS-006 acceptance criteria
        kind: test
      - id: CANVAS-006-S02-T04
        title: Record demo notes and traceability evidence for CANVAS-006
        kind: demo
  - id: CANVAS-007-S03
    title: A participant with a Scene `co-editor` grant shall be able to add, move,
      resize, remove, and configure widgets on the granted Scene subject to
      widget and entity permissions
    requirementIds:
      - CANVAS-007
    acceptanceCriteria:
      - Given a player has a `co-editor` grant on a shared Scene and `viewer`
        rights on a map, when they add a map widget, then the command is
        accepted and visible to authorized participants.
      - Given the same player lacks `manager` rights on an existing widget, when
        they attempt to rebind it, then the command is rejected with a
        permission result.
      - Given remote collaborators are unavailable, when an authorized co-editor
        changes local Scene layout, then the operation is queued and later sync
        either preserves independent layout edits or records a field-specific
        conflict.
    tasks:
      - id: CANVAS-007-S03-T01
        title: Confirm architecture and interface shape for CANVAS-007
        kind: design
      - id: CANVAS-007-S03-T02
        title: Implement the smallest behavior that satisfies CANVAS-007
        kind: implementation
      - id: CANVAS-007-S03-T03
        title: Add automated coverage for CANVAS-007 acceptance criteria
        kind: test
      - id: CANVAS-007-S03-T04
        title: Record demo notes and traceability evidence for CANVAS-007
        kind: demo
  - id: CANVAS-015-S04
    title: Projection shall never grant write permission, ownership, or persistent
      visibility beyond the delivered Player View assignment unless a separate
      Permission Grant or visibility command exists
    requirementIds:
      - CANVAS-015
    acceptanceCriteria:
      - Given a player receives a projected timer widget without an `operator`
        grant, when they attempt to operate it, then the command is rejected
        even though the widget is visible.
      - Given the DM ends a projection, when catch-up sync runs, then the player
        no longer receives the projected widget unless another active grant or
        assignment permits it.
    tasks:
      - id: CANVAS-015-S04-T01
        title: Confirm architecture and interface shape for CANVAS-015
        kind: design
      - id: CANVAS-015-S04-T02
        title: Implement the smallest behavior that satisfies CANVAS-015
        kind: implementation
      - id: CANVAS-015-S04-T03
        title: Add automated coverage for CANVAS-015 acceptance criteria
        kind: test
      - id: CANVAS-015-S04-T04
        title: Record demo notes and traceability evidence for CANVAS-015
        kind: demo
testPlan:
  - Run unit tests for domain reducers, command validators, and data transforms
    touched by this epic.
  - Run UI or integration checks for any visible prototype behavior touched by
    this epic.
  - Run `pnpm v2:workpack:validate` before handoff.
demoNotesTemplate:
  - Describe the user-visible path demonstrated.
  - List the requirement IDs exercised by the demo.
  - Record any gaps intentionally deferred out of this epic.
stopConditions:
  - Stop if the v2 stack ADR is missing or contradicts the implementation
    approach.
  - Stop if implementing the epic requires runtime imports from v1 app code.
  - Stop if hidden visibility, permission, sync, or persistence behavior is
    ambiguous.
  - Stop if the generated workpack no longer validates.
completionEvidence:
  - Targeted tests pass.
  - Traceability from requirement IDs to implementation and tests is documented.
  - Demo notes are filled in for visible behavior.
  - Workpack status is updated after completion.

schemaVersion: 1
id: MAP-pois-routes-fog-and-combat-overlays
title: "MAP: POIs, routes, fog, and combat overlays"
status: approved
approved: true
domain: MAP
capabilityBranch: POIs, routes, fog, and combat overlays
objective: Deliver the pois, routes, fog, and combat overlays capability branch
  for MAP, traced to the included v2 requirements.
requirementIds:
  - MAP-010
  - MAP-011
  - MAP-012
  - MAP-013
  - MAP-014
  - MAP-018
  - MAP-019
excludedRequirementIds: []
architectureContracts:
  - "Contract 1: Processing / Display Decoupling"
  - "Contract 2: Cloud Sync & Offline Model"
  - "Contract 3: Role, Visibility & Permission Grant Model"
  - "Contract 4: Scene and Widget Contract"
expectedAffectedAreas:
  - apps/v2
  - docs/planning/v2
  - map model
  - map renderer
dependencies: []
parallelSafety:
  fileOwnership:
    - apps/v2/map/
    - docs/planning/v2/
  requiresInterfaceContract: true
  notes: Parallel execution requires explicit interface contracts and
    non-overlapping generated file ownership.
stories:
  - id: MAP-010-S01
    title: The DM shall be able to create, move, categorize, and link POIs to notes
      or objects, with POI coordinates stored in normalized map space
    requirementIds:
      - MAP-010
    acceptanceCriteria:
      - Given a map, when the DM creates a POI linked to a location note, then
        the POI stores normalized coordinates, label, category, and target
        entity id.
      - Given the map image is resized or rendered at a different zoom, when the
        POI displays, then it remains anchored to the same map location.
    tasks:
      - id: MAP-010-S01-T01
        title: Confirm architecture and interface shape for MAP-010
        kind: design
      - id: MAP-010-S01-T02
        title: Implement the smallest behavior that satisfies MAP-010
        kind: implementation
      - id: MAP-010-S01-T03
        title: Add automated coverage for MAP-010 acceptance criteria
        kind: test
      - id: MAP-010-S01-T04
        title: Record demo notes and traceability evidence for MAP-010
        kind: demo
  - id: MAP-011-S02
    title: The DM shall be able to assign visibility to POIs independently of map
      and layer visibility so DM-only annotations do not leak through list,
      search, or widget views
    requirementIds:
      - MAP-011
    acceptanceCriteria:
      - Given a player-visible map contains a DM-only POI, when the player opens
        the POI list, then the POI is absent.
      - Given a DM changes the POI to `player-visible`, when player map data
        refreshes, then the POI appears without requiring map reload.
      - Given a hidden POI matches a search query, graph relationship, widget
        binding, or linked-note backlink, when a player requests those surfaces,
        then the POI id, label, snippet, and coordinates are absent.
      - Given a player-visible POI is placed on a hidden layer, when map
        validation runs, then the DM sees a consistency error before projection.
    tasks:
      - id: MAP-011-S02-T01
        title: Confirm architecture and interface shape for MAP-011
        kind: design
      - id: MAP-011-S02-T02
        title: Implement the smallest behavior that satisfies MAP-011
        kind: implementation
      - id: MAP-011-S02-T03
        title: Add automated coverage for MAP-011 acceptance criteria
        kind: test
      - id: MAP-011-S02-T04
        title: Record demo notes and traceability evidence for MAP-011
        kind: demo
  - id: MAP-012-S03
    title: The DM shall be able to author fog-of-war reveal and conceal operations
      as durable map commands that sync to player map views
    requirementIds:
      - MAP-012
    acceptanceCriteria:
      - Given a combat map with fog, when the DM reveals an area, then the
        reveal operation is persisted and projected players see the revealed
        area.
      - Given the DM is offline from remote players, when a reveal is made, then
        the operation queues and the DM sees undelivered sync status.
    tasks:
      - id: MAP-012-S03-T01
        title: Confirm architecture and interface shape for MAP-012
        kind: design
      - id: MAP-012-S03-T02
        title: Implement the smallest behavior that satisfies MAP-012
        kind: implementation
      - id: MAP-012-S03-T03
        title: Add automated coverage for MAP-012 acceptance criteria
        kind: test
      - id: MAP-012-S03-T04
        title: Record demo notes and traceability evidence for MAP-012
        kind: demo
  - id: MAP-013-S04
    title: The DM shall be able to draw routes, measure distance, calculate travel
      time, and link route waypoints to notes or POIs
    requirementIds:
      - MAP-013
    acceptanceCriteria:
      - Given a map scale, when the DM draws a route with waypoints, then total
        distance and estimated travel time are computed deterministically.
      - Given a waypoint delete control is used, when pointerdown occurs on the
        control, then no accidental waypoint placement occurs underneath it.
    tasks:
      - id: MAP-013-S04-T01
        title: Confirm architecture and interface shape for MAP-013
        kind: design
      - id: MAP-013-S04-T02
        title: Implement the smallest behavior that satisfies MAP-013
        kind: implementation
      - id: MAP-013-S04-T03
        title: Add automated coverage for MAP-013 acceptance criteria
        kind: test
      - id: MAP-013-S04-T04
        title: Record demo notes and traceability evidence for MAP-013
        kind: demo
  - id: MAP-014-S05
    title: The DM shall be able to configure grid, token, range, area-of-effect, and
      combat overlay settings through explicit map mode commands with declared
      prerequisite visual state
    requirementIds:
      - MAP-014
    acceptanceCriteria:
      - Given grid alignment mode requires visible grid, when the DM enters the
        mode, then grid visibility is enabled or the mode transition is blocked
        with a reason.
      - Given a mode is blocked by invalid state, when an internal command tries
        a forced transition, then validation still prevents the transition.
    tasks:
      - id: MAP-014-S05-T01
        title: Confirm architecture and interface shape for MAP-014
        kind: design
      - id: MAP-014-S05-T02
        title: Implement the smallest behavior that satisfies MAP-014
        kind: implementation
      - id: MAP-014-S05-T03
        title: Add automated coverage for MAP-014 acceptance criteria
        kind: test
      - id: MAP-014-S05-T04
        title: Record demo notes and traceability evidence for MAP-014
        kind: demo
  - id: MAP-018-S06
    title: Map search, graph, widget, MCP, and deep-link surfaces shall use the same
      actor-filtered map query model as the map renderer
    requirementIds:
      - MAP-018
    acceptanceCriteria:
      - Given a hidden layer contains a matching POI and route, when a player
        uses search, graph, MCP, or a widget query, then none of those hidden
        map artifacts are returned.
      - Given a deep link targets a hidden map artifact, when opened by a player
        or observer, then the app shows a generic unavailable state and
        preserves no hidden query parameters in visible UI.
    tasks:
      - id: MAP-018-S06-T01
        title: Confirm architecture and interface shape for MAP-018
        kind: design
      - id: MAP-018-S06-T02
        title: Implement the smallest behavior that satisfies MAP-018
        kind: implementation
      - id: MAP-018-S06-T03
        title: Add automated coverage for MAP-018 acceptance criteria
        kind: test
      - id: MAP-018-S06-T04
        title: Record demo notes and traceability evidence for MAP-018
        kind: demo
  - id: MAP-019-S07
    title: The DM shall be able to manage combat token lifecycle, movement, range
      measurement, area-of-effect templates, and actor-filtered token projection
      as durable map/session commands
    requirementIds:
      - MAP-019
    acceptanceCriteria:
      - Given the DM adds a token linked to a combatant, when the command is
        accepted, then token id, linked actor, map position, size, visibility,
        and session/map ownership are recorded.
      - Given a token moves, when movement is committed, then distance is
        computed from map scale and the movement operation appears in session
        history where visible.
      - Given the DM places a range or area-of-effect overlay, when projected to
        players, then hidden origin tokens, hidden targets, and hidden layer
        metadata are omitted from player payloads.
      - Given a player controls a visible character token, when they attempt to
        move a token outside their grant, then the command is rejected before
        mutation.
    tasks:
      - id: MAP-019-S07-T01
        title: Confirm architecture and interface shape for MAP-019
        kind: design
      - id: MAP-019-S07-T02
        title: Implement the smallest behavior that satisfies MAP-019
        kind: implementation
      - id: MAP-019-S07-T03
        title: Add automated coverage for MAP-019 acceptance criteria
        kind: test
      - id: MAP-019-S07-T04
        title: Record demo notes and traceability evidence for MAP-019
        kind: demo
qualityBar:
  - "Correctness: every mapped acceptance criterion is implemented or explicitly
    deferred with reviewer-visible evidence."
  - "Architecture integrity: changes obey ADR-014, the architecture contracts,
    package boundaries, and no-v1-runtime-import rules."
  - "Traceability: requirement IDs are tied to code, tests, demo notes, and any
    documentation changes."
  - "Test depth: unit, integration, e2e, boundary, accessibility, performance,
    security, permission, sync, and migration coverage are chosen according to
    risk."
  - "User experience: visible flows are complete, accessible, responsive,
    resilient to empty/error/loading states, and consistent with the design
    system."
  - "Data safety: persistence, offline behavior, sync assumptions, conflict
    handling, actor filtering, and privacy boundaries fail closed."
  - "Maintainability: modules remain cohesive, typed, readable, locally scoped,
    and free of speculative abstractions or unrelated refactors."
  - "Operational quality: diagnostics, metrics, docs, generated files, and
    handoff evidence are current before completion."
gitWorkflow:
  - Start from a clean working tree. Run `git status --short` before editing and
    stop if unrelated changes overlap this epic.
  - "Create a fresh branch for this epic off the main v2 branch
    `v2-clean-slate`: `git checkout v2-clean-slate && git pull && git checkout
    -b epic/MAP-pois-routes-fog-and-combat-overlays`. Keep all commits scoped to
    the assigned epic."
  - Never reset, overwrite, or reformat unrelated user changes. Work around
    existing dirty files unless they block the epic.
  - Commit the code, docs, tests, generated workpack updates, and completion
    evidence needed for the epic before handoff.
  - "On completion, merge the epic branch back into the main v2 branch and push
    the result: `git checkout v2-clean-slate && git pull && git merge --no-ff
    epic/MAP-pois-routes-fog-and-combat-overlays && git push origin
    v2-clean-slate`."
  - "Leave a clean slate when the epic is complete: no untracked files, no
    unstaged edits, and no stale generated planning diffs caused by the epic."
statusAutomation:
  - Do not hand-edit generated epic packets, `status.yaml`,
    `requirements-index.yaml`, `initiative-map.yaml`, or `parallel-batches.yaml`
    for status changes.
  - Use `pnpm v2:workpack:set-status -- --epic
    MAP-pois-routes-fog-and-combat-overlays --status active` when implementation
    starts.
  - Create
    `docs/planning/v2/epics/MAP-pois-routes-fog-and-combat-overlays.completion.md`
    with demo, tests, traceability, gaps, and git evidence before marking
    complete.
  - Use `pnpm v2:workpack:complete -- --epic
    MAP-pois-routes-fog-and-combat-overlays` to update `workpack-state.yaml` and
    regenerate all derived planning files together.
  - Run `pnpm v2:workpack:validate` after any status or generation command;
    validation fails if generated files drift from the source of truth.
testPlan:
  - Run unit tests for domain reducers, command validators, and data transforms
    touched by this epic.
  - Run UI or integration checks for any visible prototype behavior touched by
    this epic.
  - Run domain-specific quality gates for accessibility, performance, security,
    permissions, sync/offline behavior, migrations, and docs when those areas
    are touched.
  - Run `pnpm v2:workpack:validate` before handoff.
demoNotesTemplate:
  - Describe the user-visible path demonstrated.
  - List the requirement IDs exercised by the demo.
  - Record any gaps intentionally deferred out of this epic.
stopConditions:
  - Stop if the v2 stack ADR is missing or contradicts the implementation
    approach.
  - Stop if implementing the epic requires runtime imports from v1 app code.
  - Stop if hidden visibility, permission, sync, or persistence behavior is
    ambiguous.
  - Stop if the generated workpack no longer validates.
  - Stop if `git status --short` shows unrelated changes that overlap the files
    this epic needs.
completionEvidence:
  - Targeted tests pass.
  - Traceability from requirement IDs to implementation and tests is documented.
  - Demo notes are filled in for visible behavior.
  - Quality review covers correctness, architecture, security, permissions,
    accessibility, performance, persistence, sync/offline assumptions,
    maintainability, UX polish, and documentation.
  - Completion evidence file records demo path, tests run, changed files,
    requirement coverage, known gaps, git branch, commit or PR, and final `git
    status --short` output.
  - Workpack status is updated with the programmatic complete command after
    completion evidence exists.
  - The epic leaves a clean git slate with no untracked or unstaged files caused
    by the work.

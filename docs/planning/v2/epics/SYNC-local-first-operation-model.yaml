schemaVersion: 1
id: SYNC-local-first-operation-model
title: "SYNC: Local-first operation model"
status: approved
approved: true
domain: SYNC
capabilityBranch: Local-first operation model
objective: Deliver the local-first operation model capability branch for SYNC,
  traced to the included v2 requirements.
requirementIds:
  - SYNC-001
  - SYNC-002
  - SYNC-011
excludedRequirementIds: []
architectureContracts:
  - "Contract 2: Cloud Sync & Offline Model"
  - "Contract 3: Role, Visibility & Permission Grant Model"
expectedAffectedAreas:
  - apps/v2
  - docs/planning/v2
  - sync engine
  - source adapters
dependencies: []
parallelSafety:
  fileOwnership:
    - apps/v2/sync/
    - docs/planning/v2/
  requiresInterfaceContract: true
  notes: Parallel execution requires explicit interface contracts and
    non-overlapping generated file ownership.
stories:
  - id: SYNC-001-S01
    title: A user shall be able to open, read, search, edit, and run core
      vault/session workflows with zero network for any content already present
      on the device
    requirementIds:
      - SYNC-001
    acceptanceCriteria:
      - Given the device has a cached vault and no network, when the user opens
        the app, then local notes, maps, scenes, characters, dice, and combat
        remain usable.
      - Given content has never synced to the device, when offline, then the app
        reports unavailable content rather than blocking the whole vault.
      - Given remote collaborators are unreachable, when local work continues,
        then collaboration status is marked unavailable and queued operations
        remain local until sync resumes.
    tasks:
      - id: SYNC-001-S01-T01
        title: Confirm architecture and interface shape for SYNC-001
        kind: design
      - id: SYNC-001-S01-T02
        title: Implement the smallest behavior that satisfies SYNC-001
        kind: implementation
      - id: SYNC-001-S01-T03
        title: Add automated coverage for SYNC-001 acceptance criteria
        kind: test
      - id: SYNC-001-S01-T04
        title: Record demo notes and traceability evidence for SYNC-001
        kind: demo
  - id: SYNC-002-S02
    title: The system shall record every durable mutation as an entity-scoped,
      idempotent sync operation with actor, target, path, dependencies,
      revisions, and issue time
    requirementIds:
      - SYNC-002
    acceptanceCriteria:
      - Given a character HP change is accepted, when the operation log is
        inspected, then it includes actor id, entity id, path, before/after
        revisions, and idempotency data.
      - Given the same operation is replayed, when idempotency is checked, then
        no duplicate mutation is applied.
      - Given an operation depends on an earlier operation, when replay order is
        computed, then dependencies are applied before dependent operations or
        the dependent operation is deferred.
      - Given a remote operation no longer passes replay-time visibility or
        permission checks, when replay is attempted, then it is rejected rather
        than conflicted.
    tasks:
      - id: SYNC-002-S02-T01
        title: Confirm architecture and interface shape for SYNC-002
        kind: design
      - id: SYNC-002-S02-T02
        title: Implement the smallest behavior that satisfies SYNC-002
        kind: implementation
      - id: SYNC-002-S02-T03
        title: Add automated coverage for SYNC-002 acceptance criteria
        kind: test
      - id: SYNC-002-S02-T04
        title: Record demo notes and traceability evidence for SYNC-002
        kind: demo
  - id: SYNC-011-S03
    title: Sync replay shall validate operation dependencies, schema version, actor
      authority, visibility, permission, and target existence before applying
      remote or queued local operations
    requirementIds:
      - SYNC-011
    acceptanceCriteria:
      - Given a delete operation arrives before a dependent update, when replay
        validates dependencies, then the dependent update is rejected or
        deferred with a structured reason.
      - Given an operation targets a renamed or deleted entity, when replay
        runs, then it resolves through recorded identity metadata or creates a
        durable conflict/diagnostic rather than writing to the wrong entity.
    tasks:
      - id: SYNC-011-S03-T01
        title: Confirm architecture and interface shape for SYNC-011
        kind: design
      - id: SYNC-011-S03-T02
        title: Implement the smallest behavior that satisfies SYNC-011
        kind: implementation
      - id: SYNC-011-S03-T03
        title: Add automated coverage for SYNC-011 acceptance criteria
        kind: test
      - id: SYNC-011-S03-T04
        title: Record demo notes and traceability evidence for SYNC-011
        kind: demo
qualityBar:
  - "Correctness: every mapped acceptance criterion is implemented or explicitly
    deferred with reviewer-visible evidence."
  - "Architecture integrity: changes obey ADR-014, the architecture contracts,
    package boundaries, and no-v1-runtime-import rules."
  - "Traceability: requirement IDs are tied to code, tests, demo notes, and any
    documentation changes."
  - "Test depth: unit, integration, e2e, boundary, accessibility, performance,
    security, permission, sync, and migration coverage are chosen according to
    risk."
  - "User experience: visible flows are complete, accessible, responsive,
    resilient to empty/error/loading states, and consistent with the design
    system."
  - "Data safety: persistence, offline behavior, sync assumptions, conflict
    handling, actor filtering, and privacy boundaries fail closed."
  - "Maintainability: modules remain cohesive, typed, readable, locally scoped,
    and free of speculative abstractions or unrelated refactors."
  - "Operational quality: diagnostics, metrics, docs, generated files, and
    handoff evidence are current before completion."
gitWorkflow:
  - Start from a clean working tree. Run `git status --short` before editing and
    stop if unrelated changes overlap this epic.
  - "Create a fresh branch for this epic off the main v2 branch
    `v2-clean-slate`: `git checkout v2-clean-slate && git pull && git checkout
    -b epic/SYNC-local-first-operation-model`. Keep all commits scoped to the
    assigned epic."
  - Never reset, overwrite, or reformat unrelated user changes. Work around
    existing dirty files unless they block the epic.
  - Commit the code, docs, tests, generated workpack updates, and completion
    evidence needed for the epic before handoff.
  - "On completion, merge the epic branch back into the main v2 branch and push
    the result: `git checkout v2-clean-slate && git pull && git merge --no-ff
    epic/SYNC-local-first-operation-model && git push origin v2-clean-slate`."
  - "Leave a clean slate when the epic is complete: no untracked files, no
    unstaged edits, and no stale generated planning diffs caused by the epic."
statusAutomation:
  - Do not hand-edit generated epic packets, `status.yaml`,
    `requirements-index.yaml`, `initiative-map.yaml`, or `parallel-batches.yaml`
    for status changes.
  - Use `pnpm v2:workpack:set-status -- --epic SYNC-local-first-operation-model
    --status active` when implementation starts.
  - Create
    `docs/planning/v2/epics/SYNC-local-first-operation-model.completion.md` with
    demo, tests, traceability, gaps, and git evidence before marking complete.
  - Use `pnpm v2:workpack:complete -- --epic SYNC-local-first-operation-model`
    to update `workpack-state.yaml` and regenerate all derived planning files
    together.
  - Run `pnpm v2:workpack:validate` after any status or generation command;
    validation fails if generated files drift from the source of truth.
testPlan:
  - Run unit tests for domain reducers, command validators, and data transforms
    touched by this epic.
  - Run UI or integration checks for any visible prototype behavior touched by
    this epic.
  - Run domain-specific quality gates for accessibility, performance, security,
    permissions, sync/offline behavior, migrations, and docs when those areas
    are touched.
  - Run `pnpm v2:workpack:validate` before handoff.
demoNotesTemplate:
  - Describe the user-visible path demonstrated.
  - List the requirement IDs exercised by the demo.
  - Record any gaps intentionally deferred out of this epic.
stopConditions:
  - Stop if the v2 stack ADR is missing or contradicts the implementation
    approach.
  - Stop if implementing the epic requires runtime imports from v1 app code.
  - Stop if hidden visibility, permission, sync, or persistence behavior is
    ambiguous.
  - Stop if the generated workpack no longer validates.
  - Stop if `git status --short` shows unrelated changes that overlap the files
    this epic needs.
completionEvidence:
  - Targeted tests pass.
  - Traceability from requirement IDs to implementation and tests is documented.
  - Demo notes are filled in for visible behavior.
  - Quality review covers correctness, architecture, security, permissions,
    accessibility, performance, persistence, sync/offline assumptions,
    maintainability, UX polish, and documentation.
  - Completion evidence file records demo path, tests run, changed files,
    requirement coverage, known gaps, git branch, commit or PR, and final `git
    status --short` output.
  - Workpack status is updated with the programmatic complete command after
    completion evidence exists.
  - The epic leaves a clean git slate with no untracked or unstaged files caused
    by the work.

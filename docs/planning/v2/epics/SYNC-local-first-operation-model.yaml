schemaVersion: 1
id: SYNC-local-first-operation-model
title: 'SYNC: Local-first operation model'
status: proposed
approved: false
domain: SYNC
capabilityBranch: Local-first operation model
objective: Deliver the local-first operation model capability branch for SYNC,
  traced to the included v2 requirements.
requirementIds:
  - SYNC-001
  - SYNC-002
  - SYNC-011
excludedRequirementIds: []
architectureContracts:
  - 'Contract 2: Cloud Sync & Offline Model'
  - 'Contract 3: Role, Visibility & Permission Grant Model'
expectedAffectedAreas:
  - apps/v2
  - docs/planning/v2
  - sync engine
  - source adapters
dependencies: []
parallelSafety:
  fileOwnership:
    - apps/v2/sync/
    - docs/planning/v2/
  requiresInterfaceContract: true
  notes: Parallel execution requires explicit interface contracts and
    non-overlapping generated file ownership.
stories:
  - id: SYNC-001-S01
    title: A user shall be able to open, read, search, edit, and run core
      vault/session workflows with zero network for any content already present
      on the device
    requirementIds:
      - SYNC-001
    acceptanceCriteria:
      - Given the device has a cached vault and no network, when the user opens
        the app, then local notes, maps, scenes, characters, dice, and combat
        remain usable.
      - Given content has never synced to the device, when offline, then the app
        reports unavailable content rather than blocking the whole vault.
      - Given remote collaborators are unreachable, when local work continues,
        then collaboration status is marked unavailable and queued operations
        remain local until sync resumes.
    tasks:
      - id: SYNC-001-S01-T01
        title: Confirm architecture and interface shape for SYNC-001
        kind: design
      - id: SYNC-001-S01-T02
        title: Implement the smallest behavior that satisfies SYNC-001
        kind: implementation
      - id: SYNC-001-S01-T03
        title: Add automated coverage for SYNC-001 acceptance criteria
        kind: test
      - id: SYNC-001-S01-T04
        title: Record demo notes and traceability evidence for SYNC-001
        kind: demo
  - id: SYNC-002-S02
    title: The system shall record every durable mutation as an entity-scoped,
      idempotent sync operation with actor, target, path, dependencies,
      revisions, and issue time
    requirementIds:
      - SYNC-002
    acceptanceCriteria:
      - Given a character HP change is accepted, when the operation log is
        inspected, then it includes actor id, entity id, path, before/after
        revisions, and idempotency data.
      - Given the same operation is replayed, when idempotency is checked, then
        no duplicate mutation is applied.
      - Given an operation depends on an earlier operation, when replay order is
        computed, then dependencies are applied before dependent operations or
        the dependent operation is deferred.
      - Given a remote operation no longer passes replay-time visibility or
        permission checks, when replay is attempted, then it is rejected rather
        than conflicted.
    tasks:
      - id: SYNC-002-S02-T01
        title: Confirm architecture and interface shape for SYNC-002
        kind: design
      - id: SYNC-002-S02-T02
        title: Implement the smallest behavior that satisfies SYNC-002
        kind: implementation
      - id: SYNC-002-S02-T03
        title: Add automated coverage for SYNC-002 acceptance criteria
        kind: test
      - id: SYNC-002-S02-T04
        title: Record demo notes and traceability evidence for SYNC-002
        kind: demo
  - id: SYNC-011-S03
    title: Sync replay shall validate operation dependencies, schema version, actor
      authority, visibility, permission, and target existence before applying
      remote or queued local operations
    requirementIds:
      - SYNC-011
    acceptanceCriteria:
      - Given a delete operation arrives before a dependent update, when replay
        validates dependencies, then the dependent update is rejected or
        deferred with a structured reason.
      - Given an operation targets a renamed or deleted entity, when replay
        runs, then it resolves through recorded identity metadata or creates a
        durable conflict/diagnostic rather than writing to the wrong entity.
    tasks:
      - id: SYNC-011-S03-T01
        title: Confirm architecture and interface shape for SYNC-011
        kind: design
      - id: SYNC-011-S03-T02
        title: Implement the smallest behavior that satisfies SYNC-011
        kind: implementation
      - id: SYNC-011-S03-T03
        title: Add automated coverage for SYNC-011 acceptance criteria
        kind: test
      - id: SYNC-011-S03-T04
        title: Record demo notes and traceability evidence for SYNC-011
        kind: demo
testPlan:
  - Run unit tests for domain reducers, command validators, and data transforms
    touched by this epic.
  - Run UI or integration checks for any visible prototype behavior touched by
    this epic.
  - Run `pnpm v2:workpack:validate` before handoff.
demoNotesTemplate:
  - Describe the user-visible path demonstrated.
  - List the requirement IDs exercised by the demo.
  - Record any gaps intentionally deferred out of this epic.
stopConditions:
  - Stop if the v2 stack ADR is missing or contradicts the implementation
    approach.
  - Stop if implementing the epic requires runtime imports from v1 app code.
  - Stop if hidden visibility, permission, sync, or persistence behavior is
    ambiguous.
  - Stop if the generated workpack no longer validates.
completionEvidence:
  - Targeted tests pass.
  - Traceability from requirement IDs to implementation and tests is documented.
  - Demo notes are filled in for visible behavior.
  - Workpack status is updated after completion.

stories:
  - id: CMD-004-S01
    title: The DM shall be able to inspect and change each participant's Player View
      assignment from a Command Center controller
    requirementIds:
      - CMD-004
    acceptanceCriteria:
      - Given three connected players, when the DM assigns different Scene views
        to two players, then each receives only their assigned view.
      - Given a player disconnects, when the DM changes their assignment, then
        the assignment is saved and delivered on reconnect.

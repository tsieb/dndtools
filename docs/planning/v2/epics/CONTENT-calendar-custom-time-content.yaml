stories:
  - id: CONTENT-011-S01
    title: An authorized editor shall be able to create calendar-aware notes and
      structured objects with custom-date fields, timeline references, and
      stable display formatting
    requirementIds:
      - CONTENT-011
    acceptanceCriteria:
      - Given a note has a custom calendar date in frontmatter, when rendered in
        note, graph, search, and session recap surfaces, then the formatted date
        is consistent.
      - Given a player cannot see a dated note, when calendar or timeline views
        load, then that event is omitted or generalized according to visibility
        policy.
    tasks:
      - id: CONTENT-011-S01-T01
        title: Confirm architecture and interface shape for CONTENT-011
        kind: design
      - id: CONTENT-011-S01-T02
        title: Implement the smallest behavior that satisfies CONTENT-011
        kind: implementation
      - id: CONTENT-011-S01-T03
        title: Add automated coverage for CONTENT-011 acceptance criteria
        kind: test
      - id: CONTENT-011-S01-T04
        title: Record demo notes and traceability evidence for CONTENT-011
        kind: demo
testPlan:
  - Run unit tests for domain reducers, command validators, and data transforms
    touched by this epic.
  - Run UI or integration checks for any visible prototype behavior touched by
    this epic.
  - Run `pnpm v2:workpack:validate` before handoff.
demoNotesTemplate:
  - Describe the user-visible path demonstrated.
  - List the requirement IDs exercised by the demo.
  - Record any gaps intentionally deferred out of this epic.
stopConditions:
  - Stop if the v2 stack ADR is missing or contradicts the implementation
    approach.
  - Stop if implementing the epic requires runtime imports from v1 app code.
  - Stop if hidden visibility, permission, sync, or persistence behavior is
    ambiguous.
  - Stop if the generated workpack no longer validates.
completionEvidence:
  - Targeted tests pass.
  - Traceability from requirement IDs to implementation and tests is documented.
  - Demo notes are filled in for visible behavior.
  - Workpack status is updated after completion.

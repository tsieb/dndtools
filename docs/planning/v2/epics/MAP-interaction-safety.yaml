schemaVersion: 1
id: MAP-interaction-safety
title: 'MAP: Interaction safety'
status: approved
approved: true
domain: MAP
capabilityBranch: Interaction safety
objective: Deliver the interaction safety capability branch for MAP, traced to
  the included v2 requirements.
requirementIds:
  - MAP-015
excludedRequirementIds: []
architectureContracts:
  - 'Contract 1: Processing / Display Decoupling'
  - 'Contract 4: Scene and Widget Contract'
expectedAffectedAreas:
  - apps/v2
  - docs/planning/v2
  - map model
  - map renderer
dependencies: []
parallelSafety:
  fileOwnership:
    - apps/v2/map/
    - docs/planning/v2/
  requiresInterfaceContract: true
  notes: Parallel execution requires explicit interface contracts and
    non-overlapping generated file ownership.
stories:
  - id: MAP-015-S01
    title: A map user shall be able to interact with POI popovers, sheets, overlays,
      and canvas controls without pointer, hover, or focus handlers dismissing
      the active control prematurely
    requirementIds:
      - MAP-015
    acceptanceCriteria:
      - Given a POI popover with action buttons, when the pointer moves from the
        POI marker into the popover, then the popover remains open.
      - Given a compact long-press sheet is open, when the user taps an action
        inside it, then the sheet action executes instead of closing from
        underlying map handlers.
    tasks:
      - id: MAP-015-S01-T01
        title: Confirm architecture and interface shape for MAP-015
        kind: design
      - id: MAP-015-S01-T02
        title: Implement the smallest behavior that satisfies MAP-015
        kind: implementation
      - id: MAP-015-S01-T03
        title: Add automated coverage for MAP-015 acceptance criteria
        kind: test
      - id: MAP-015-S01-T04
        title: Record demo notes and traceability evidence for MAP-015
        kind: demo
testPlan:
  - Run unit tests for domain reducers, command validators, and data transforms
    touched by this epic.
  - Run UI or integration checks for any visible prototype behavior touched by
    this epic.
  - Run `pnpm v2:workpack:validate` before handoff.
demoNotesTemplate:
  - Describe the user-visible path demonstrated.
  - List the requirement IDs exercised by the demo.
  - Record any gaps intentionally deferred out of this epic.
stopConditions:
  - Stop if the v2 stack ADR is missing or contradicts the implementation
    approach.
  - Stop if implementing the epic requires runtime imports from v1 app code.
  - Stop if hidden visibility, permission, sync, or persistence behavior is
    ambiguous.
  - Stop if the generated workpack no longer validates.
completionEvidence:
  - Targeted tests pass.
  - Traceability from requirement IDs to implementation and tests is documented.
  - Demo notes are filled in for visible behavior.
  - Workpack status is updated after completion.

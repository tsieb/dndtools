schemaVersion: 1
id: AUDIO-playback-and-session-state
title: 'AUDIO: Playback and session state'
status: proposed
approved: false
domain: AUDIO
capabilityBranch: Playback and session state
objective: Deliver the playback and session state capability branch for AUDIO,
  traced to the included v2 requirements.
requirementIds:
  - AUDIO-002
  - AUDIO-003
excludedRequirementIds: []
architectureContracts:
  - 'Contract 1: Processing / Display Decoupling'
  - 'Contract 2: Cloud Sync & Offline Model'
  - 'Contract 4: Scene and Widget Contract'
expectedAffectedAreas:
  - apps/v2
  - docs/planning/v2
  - audio model
  - playback surface
dependencies: []
parallelSafety:
  fileOwnership:
    - apps/v2/audio/
    - docs/planning/v2/
  requiresInterfaceContract: true
  notes: Parallel execution requires explicit interface contracts and
    non-overlapping generated file ownership.
stories:
  - id: AUDIO-002-S01
    title: The DM shall be able to control playback through an audio widget on the
      Command Center, including play, pause, stop, volume, crossfade, and active
      track display
    requirementIds:
      - AUDIO-002
    acceptanceCriteria:
      - Given a local audio track is available, when the DM presses play, then
        session audio state records the active track.
      - Given browser autoplay policy blocks playback, when a player device
        receives audio state, then it shows a user-action-required degraded
        state.
      - Given a player locally mutes or lowers volume, when the DM changes
        session audio state, then the player preference remains device-local and
        does not mutate authoritative session audio.
    tasks:
      - id: AUDIO-002-S01-T01
        title: Confirm architecture and interface shape for AUDIO-002
        kind: design
      - id: AUDIO-002-S01-T02
        title: Implement the smallest behavior that satisfies AUDIO-002
        kind: implementation
      - id: AUDIO-002-S01-T03
        title: Add automated coverage for AUDIO-002 acceptance criteria
        kind: test
      - id: AUDIO-002-S01-T04
        title: Record demo notes and traceability evidence for AUDIO-002
        kind: demo
  - id: AUDIO-003-S02
    title: The system shall persist currently playing audio state in Session State
      and sync it to collaborators as session state, not widget-private state
    requirementIds:
      - AUDIO-003
    acceptanceCriteria:
      - Given audio is playing during a session, when a second DM device
        reconnects, then it receives active audio state.
      - Given a widget is removed from a Scene, when audio is session-owned,
        then removing the widget does not delete session audio state without a
        stop command.
      - Given remote participants are unavailable, when the DM changes local
        audio state, then the state is queued or marked undelivered without
        blocking local playback.
    tasks:
      - id: AUDIO-003-S02-T01
        title: Confirm architecture and interface shape for AUDIO-003
        kind: design
      - id: AUDIO-003-S02-T02
        title: Implement the smallest behavior that satisfies AUDIO-003
        kind: implementation
      - id: AUDIO-003-S02-T03
        title: Add automated coverage for AUDIO-003 acceptance criteria
        kind: test
      - id: AUDIO-003-S02-T04
        title: Record demo notes and traceability evidence for AUDIO-003
        kind: demo
testPlan:
  - Run unit tests for domain reducers, command validators, and data transforms
    touched by this epic.
  - Run UI or integration checks for any visible prototype behavior touched by
    this epic.
  - Run `pnpm v2:workpack:validate` before handoff.
demoNotesTemplate:
  - Describe the user-visible path demonstrated.
  - List the requirement IDs exercised by the demo.
  - Record any gaps intentionally deferred out of this epic.
stopConditions:
  - Stop if the v2 stack ADR is missing or contradicts the implementation
    approach.
  - Stop if implementing the epic requires runtime imports from v1 app code.
  - Stop if hidden visibility, permission, sync, or persistence behavior is
    ambiguous.
  - Stop if the generated workpack no longer validates.
completionEvidence:
  - Targeted tests pass.
  - Traceability from requirement IDs to implementation and tests is documented.
  - Demo notes are filled in for visible behavior.
  - Workpack status is updated after completion.

schemaVersion: 1
id: PLAT-migration-and-diagnostics
title: "PLAT: Migration and diagnostics"
status: complete
approved: true
domain: PLAT
capabilityBranch: Migration and diagnostics
objective: Deliver the migration and diagnostics capability branch for PLAT,
  traced to the included v2 requirements.
requirementIds:
  - PLAT-008
  - PLAT-009
  - PLAT-017
excludedRequirementIds: []
architectureContracts:
  - "Contract 2: Cloud Sync & Offline Model"
  - "Contract 4: Scene and Widget Contract"
expectedAffectedAreas:
  - apps/gm
  - docs/planning/v2
  - platform services
  - runtime shell
dependencies: []
parallelSafety:
  fileOwnership:
    - apps/gm/plat/
    - docs/planning/v2/
  requiresInterfaceContract: true
  notes: Parallel execution requires explicit interface contracts and
    non-overlapping generated file ownership.
stories:
  - id: PLAT-008-S01
    title: The system shall provide migration, integrity verification, safety
      snapshots, write-ahead recovery, and dry-run upgrade checks for vault
      schema and durable state documents
    requirementIds:
      - PLAT-008
    acceptanceCriteria:
      - Given a vault needs migration, when dry-run runs, then the user receives
        required changes and blocking issues before mutation.
      - Given migration fails mid-write, when the app restarts, then write-ahead
        recovery or rollback restores a consistent state.
    tasks:
      - id: PLAT-008-S01-T01
        title: Confirm architecture and interface shape for PLAT-008
        kind: design
      - id: PLAT-008-S01-T02
        title: Implement the smallest behavior that satisfies PLAT-008
        kind: implementation
      - id: PLAT-008-S01-T03
        title: Add automated coverage for PLAT-008 acceptance criteria
        kind: test
      - id: PLAT-008-S01-T04
        title: Record demo notes and traceability evidence for PLAT-008
        kind: demo
  - id: PLAT-009-S02
    title: The DM or platform administrator shall be able to view system health,
      diagnostics, sync/source status, platform capability status, and
      exportable support bundles without leaking secrets by default
    requirementIds:
      - PLAT-009
    acceptanceCriteria:
      - Given a sync source fails, when system health opens, then source status
        and remediation are shown.
      - Given diagnostics are exported, when the bundle is generated, then
        secrets and raw absolute paths are redacted unless explicitly included
        by the user.
      - Given a player or observer requests an exportable support bundle, when
        permissions are evaluated, then export is denied unless an explicit
        DM/admin diagnostic grant exists.
    tasks:
      - id: PLAT-009-S02-T01
        title: Confirm architecture and interface shape for PLAT-009
        kind: design
      - id: PLAT-009-S02-T02
        title: Implement the smallest behavior that satisfies PLAT-009
        kind: implementation
      - id: PLAT-009-S02-T03
        title: Add automated coverage for PLAT-009 acceptance criteria
        kind: test
      - id: PLAT-009-S02-T04
        title: Record demo notes and traceability evidence for PLAT-009
        kind: demo
  - id: PLAT-017-S03
    title: Participants shall be able to view non-leaking connection, sync, platform
      capability, and session delivery status relevant to their own session
      without receiving DM/admin diagnostics or support bundles
    requirementIds:
      - PLAT-017
    acceptanceCriteria:
      - Given a player is disconnected or stale, when they open participant
        status, then they see reconnecting, offline, stale, or unavailable state
        without hidden entity names, source paths, or DM diagnostics.
      - Given a handout, Scene projection, or sync source is unavailable to a
        participant, when status renders, then the reason is generic and
        action-oriented without revealing whether hidden content exists.
      - Given the DM exports diagnostics, when participant-safe status data is
        included, then it excludes secrets, raw paths, hidden titles, and
        private player content by default.
    tasks:
      - id: PLAT-017-S03-T01
        title: Confirm architecture and interface shape for PLAT-017
        kind: design
      - id: PLAT-017-S03-T02
        title: Implement the smallest behavior that satisfies PLAT-017
        kind: implementation
      - id: PLAT-017-S03-T03
        title: Add automated coverage for PLAT-017 acceptance criteria
        kind: test
      - id: PLAT-017-S03-T04
        title: Record demo notes and traceability evidence for PLAT-017
        kind: demo
qualityBar:
  - "Correctness: every mapped acceptance criterion is implemented or explicitly
    deferred with reviewer-visible evidence."
  - "Architecture integrity: changes obey ADR-014, the architecture contracts,
    package boundaries, and no-v1-runtime-import rules."
  - "Traceability: requirement IDs are tied to code, tests, demo notes, and any
    documentation changes."
  - "Test depth: unit, integration, e2e, boundary, accessibility, performance,
    security, permission, sync, and migration coverage are chosen according to
    risk."
  - "User experience: visible flows are complete, accessible, responsive,
    resilient to empty/error/loading states, and consistent with the design
    system."
  - "Data safety: persistence, offline behavior, sync assumptions, conflict
    handling, actor filtering, and privacy boundaries fail closed."
  - "Maintainability: modules remain cohesive, typed, readable, locally scoped,
    and free of speculative abstractions or unrelated refactors."
  - "Operational quality: diagnostics, metrics, docs, generated files, and
    handoff evidence are current before completion."
gitWorkflow:
  - Start from a clean working tree. Run `git status --short` before editing and
    stop if unrelated changes overlap this epic.
  - Use one branch per epic from the correct base branch, and keep all commits
    scoped to the assigned epic.
  - Never reset, overwrite, or reformat unrelated user changes. Work around
    existing dirty files unless they block the epic.
  - Commit the code, docs, tests, generated workpack updates, and completion
    evidence needed for the epic before handoff.
  - "Leave a clean slate when the epic is complete: no untracked files, no
    unstaged edits, and no stale generated planning diffs caused by the epic."
statusAutomation:
  - Do not hand-edit generated epic packets, `status.yaml`,
    `requirements-index.yaml`, `initiative-map.yaml`, or `parallel-batches.yaml`
    for status changes.
  - Use `pnpm workpack:set-status -- --epic PLAT-migration-and-diagnostics
    --status active` when implementation starts.
  - Create `docs/planning/v2/epics/PLAT-migration-and-diagnostics.completion.md`
    with demo, tests, traceability, gaps, and git evidence before marking
    complete.
  - Use `pnpm workpack:complete -- --epic PLAT-migration-and-diagnostics` to
    update `workpack-state.yaml` and regenerate all derived planning files
    together.
  - Run `pnpm workpack:validate` after any status or generation command;
    validation fails if generated files drift from the source of truth.
testPlan:
  - Run unit tests for domain reducers, command validators, and data transforms
    touched by this epic.
  - Run UI or integration checks for any visible prototype behavior touched by
    this epic.
  - Run domain-specific quality gates for accessibility, performance, security,
    permissions, sync/offline behavior, migrations, and docs when those areas
    are touched.
  - Run `pnpm workpack:validate` before handoff.
demoNotesTemplate:
  - Describe the user-visible path demonstrated.
  - List the requirement IDs exercised by the demo.
  - Record any gaps intentionally deferred out of this epic.
stopConditions:
  - Stop if the v2 stack ADR is missing or contradicts the implementation
    approach.
  - Stop if implementing the epic requires runtime imports from v1 app code.
  - Stop if hidden visibility, permission, sync, or persistence behavior is
    ambiguous.
  - Stop if the generated workpack no longer validates.
  - Stop if `git status --short` shows unrelated changes that overlap the files
    this epic needs.
completionEvidence:
  - Targeted tests pass.
  - Traceability from requirement IDs to implementation and tests is documented.
  - Demo notes are filled in for visible behavior.
  - Quality review covers correctness, architecture, security, permissions,
    accessibility, performance, persistence, sync/offline assumptions,
    maintainability, UX polish, and documentation.
  - Completion evidence file records demo path, tests run, changed files,
    requirement coverage, known gaps, git branch, commit or PR, and final `git
    status --short` output.
  - Workpack status is updated with the programmatic complete command after
    completion evidence exists.
  - The epic leaves a clean git slate with no untracked or unstaged files caused
    by the work.
completionEvidenceFile: docs/planning/v2/epics/PLAT-migration-and-diagnostics.completion.md

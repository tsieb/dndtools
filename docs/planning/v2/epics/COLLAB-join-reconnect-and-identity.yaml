parallelSafety:
  fileOwnership:
    - apps/gm/collab/
    - docs/planning/v2/
  requiresInterfaceContract: true
  notes: Parallel execution requires explicit interface contracts and
    non-overlapping generated file ownership.
stories:
  - id: COLLAB-001-S01
    title: The DM shall be able to start a collaborative session and issue
      invitations or local pairing codes that authenticate participants as DM,
      Player, or Observer
    requirementIds:
      - COLLAB-001
    acceptanceCriteria:
      - Given a player uses a valid invitation, when they join, then their role,
        participant id, grants, visible scenes, and sync cursor are returned.
      - Given an expired or revoked invitation is used, when join is attempted,
        then no session state is disclosed.
      - Given a local paired session has already authenticated participants,
        when remote network is unavailable, then local paired join continues
        according to platform capability.
    tasks:
      - id: COLLAB-001-S01-T01
        title: Confirm architecture and interface shape for COLLAB-001
        kind: design
      - id: COLLAB-001-S01-T02
        title: Implement the smallest behavior that satisfies COLLAB-001
        kind: implementation
      - id: COLLAB-001-S01-T03
        title: Add automated coverage for COLLAB-001 acceptance criteria
        kind: test
      - id: COLLAB-001-S01-T04
        title: Record demo notes and traceability evidence for COLLAB-001
        kind: demo
  - id: COLLAB-002-S02
    title: A participant shall be able to reconnect to an active session and receive
      only catch-up operations allowed by their current role, visibility,
      grants, and sync cursor
    requirementIds:
      - COLLAB-002
    acceptanceCriteria:
      - Given a player reconnects after grant revocation, when catch-up sync
        starts, then revoked grant capabilities are not restored from cache.
      - Given hidden content changed while disconnected, when catch-up sync
        runs, then hidden operations are not sent to the player stream.
      - Given a mobile participant reconnects after sleep, when catch-up sync
        runs, then operations are delivered in dependency order and commands are
        revalidated against current grants before UI controls re-enable.
    tasks:
      - id: COLLAB-002-S02-T01
        title: Confirm architecture and interface shape for COLLAB-002
        kind: design
      - id: COLLAB-002-S02-T02
        title: Implement the smallest behavior that satisfies COLLAB-002
        kind: implementation
      - id: COLLAB-002-S02-T03
        title: Add automated coverage for COLLAB-002 acceptance criteria
        kind: test
      - id: COLLAB-002-S02-T04
        title: Record demo notes and traceability evidence for COLLAB-002
        kind: demo
  - id: COLLAB-013-S03
    title: Mobile and reconnect catch-up shall preserve operation ordering, handout
      delivery/revocation semantics, cache invalidation, and stale-control
      disabling across sleep, backgrounding, and intermittent connectivity
    requirementIds:
      - COLLAB-013
    acceptanceCriteria:
      - Given a mobile device wakes after missing Scene projection, handout
        delivery, grant revocation, and combat updates, when catch-up completes,
        then dependencies are applied in order and visible controls match
        current authority.
      - Given a revoked handout remains in local cache during offline mode, when
        the device receives revocation or sealed-cache expiry applies, then the
        handout becomes unreadable before any stale UI can open it.
      - Given catch-up fails mid-stream, when the participant UI renders, then
        it shows stale/reconnecting state and disables durable commands that
        require current grants.
    tasks:
      - id: COLLAB-013-S03-T01
        title: Confirm architecture and interface shape for COLLAB-013
        kind: design
      - id: COLLAB-013-S03-T02
        title: Implement the smallest behavior that satisfies COLLAB-013
        kind: implementation
      - id: COLLAB-013-S03-T03
        title: Add automated coverage for COLLAB-013 acceptance criteria
        kind: test
      - id: COLLAB-013-S03-T04
        title: Record demo notes and traceability evidence for COLLAB-013
        kind: demo
qualityBar:
  - "Correctness: every mapped acceptance criterion is implemented or explicitly
    deferred with reviewer-visible evidence."
  - "Architecture integrity: changes obey ADR-014, the architecture contracts,
    package boundaries, and no-v1-runtime-import rules."
  - "Traceability: requirement IDs are tied to code, tests, demo notes, and any
    documentation changes."
  - "Test depth: unit, integration, e2e, boundary, accessibility, performance,
    security, permission, sync, and migration coverage are chosen according to
    risk."
  - "User experience: visible flows are complete, accessible, responsive,
    resilient to empty/error/loading states, and consistent with the design
    system."
  - "Data safety: persistence, offline behavior, sync assumptions, conflict
    handling, actor filtering, and privacy boundaries fail closed."
  - "Maintainability: modules remain cohesive, typed, readable, locally scoped,
    and free of speculative abstractions or unrelated refactors."
  - "Operational quality: diagnostics, metrics, docs, generated files, and
    handoff evidence are current before completion."
gitWorkflow:
  - Start from a clean working tree. Run `git status --short` before editing and
    stop if unrelated changes overlap this epic.
  - Use one branch per epic from the correct base branch, and keep all commits
    scoped to the assigned epic.
  - Never reset, overwrite, or reformat unrelated user changes. Work around
    existing dirty files unless they block the epic.
  - Commit the code, docs, tests, generated workpack updates, and completion
    evidence needed for the epic before handoff.
  - "Leave a clean slate when the epic is complete: no untracked files, no
    unstaged edits, and no stale generated planning diffs caused by the epic."
statusAutomation:
  - Do not hand-edit generated epic packets, `status.yaml`,
    `requirements-index.yaml`, `initiative-map.yaml`, or `parallel-batches.yaml`
    for status changes.
  - Use `pnpm workpack:set-status -- --epic COLLAB-join-reconnect-and-identity
    --status active` when implementation starts.
  - Create
    `docs/planning/v2/epics/COLLAB-join-reconnect-and-identity.completion.md`
    with demo, tests, traceability, gaps, and git evidence before marking
    complete.
  - Use `pnpm workpack:complete -- --epic COLLAB-join-reconnect-and-identity` to
    update `workpack-state.yaml` and regenerate all derived planning files
    together.
  - Run `pnpm workpack:validate` after any status or generation command;
    validation fails if generated files drift from the source of truth.
testPlan:
  - Run unit tests for domain reducers, command validators, and data transforms
    touched by this epic.
  - Run UI or integration checks for any visible prototype behavior touched by
    this epic.
  - Run domain-specific quality gates for accessibility, performance, security,
    permissions, sync/offline behavior, migrations, and docs when those areas
    are touched.
  - Run `pnpm workpack:validate` before handoff.
demoNotesTemplate:
  - Describe the user-visible path demonstrated.
  - List the requirement IDs exercised by the demo.
  - Record any gaps intentionally deferred out of this epic.
stopConditions:
  - Stop if the v2 stack ADR is missing or contradicts the implementation
    approach.
  - Stop if implementing the epic requires runtime imports from v1 app code.
  - Stop if hidden visibility, permission, sync, or persistence behavior is
    ambiguous.
  - Stop if the generated workpack no longer validates.
  - Stop if `git status --short` shows unrelated changes that overlap the files
    this epic needs.
completionEvidence:
  - Targeted tests pass.
  - Traceability from requirement IDs to implementation and tests is documented.
  - Demo notes are filled in for visible behavior.
  - Quality review covers correctness, architecture, security, permissions,
    accessibility, performance, persistence, sync/offline assumptions,
    maintainability, UX polish, and documentation.
  - Completion evidence file records demo path, tests run, changed files,
    requirement coverage, known gaps, git branch, commit or PR, and final `git
    status --short` output.
  - Workpack status is updated with the programmatic complete command after
    completion evidence exists.
  - The epic leaves a clean git slate with no untracked or unstaged files caused
    by the work.
completionEvidenceFile: docs/planning/v2/epics/COLLAB-join-reconnect-and-identity.completion.md

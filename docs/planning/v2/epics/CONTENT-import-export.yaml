schemaVersion: 1
id: CONTENT-import-export
title: 'CONTENT: Import/export'
status: proposed
approved: false
domain: CONTENT
capabilityBranch: Import/export
objective: Deliver the import/export capability branch for CONTENT, traced to
  the included v2 requirements.
requirementIds:
  - CONTENT-007
  - CONTENT-008
excludedRequirementIds: []
architectureContracts:
  - 'Contract 2: Cloud Sync & Offline Model'
  - 'Contract 3: Role, Visibility & Permission Grant Model'
expectedAffectedAreas:
  - apps/v2
  - docs/planning/v2
  - content model
  - editor integration
dependencies: []
parallelSafety:
  fileOwnership:
    - apps/v2/content/
    - docs/planning/v2/
  requiresInterfaceContract: true
  notes: Parallel execution requires explicit interface contracts and
    non-overlapping generated file ownership.
stories:
  - id: CONTENT-007-S01
    title: The DM shall be able to import local markdown archives and Obsidian vault
      content with preview, conflict policy selection, resumable progress, and
      preservation of properties, aliases, tags, and links
    requirementIds:
      - CONTENT-007
    acceptanceCriteria:
      - Given an Obsidian vault import, when preview runs, then conflicts and
        unsupported metadata are listed before any write.
      - Given import is interrupted, when resumed, then already completed safe
        writes are not duplicated.
    tasks:
      - id: CONTENT-007-S01-T01
        title: Confirm architecture and interface shape for CONTENT-007
        kind: design
      - id: CONTENT-007-S01-T02
        title: Implement the smallest behavior that satisfies CONTENT-007
        kind: implementation
      - id: CONTENT-007-S01-T03
        title: Add automated coverage for CONTENT-007 acceptance criteria
        kind: test
      - id: CONTENT-007-S01-T04
        title: Record demo notes and traceability evidence for CONTENT-007
        kind: demo
  - id: CONTENT-008-S02
    title: The DM shall be able to export a vault or selected content as portable
      markdown plus validation report without including device-local secrets,
      absolute paths, or hidden player-inaccessible data unless explicitly
      exporting as DM backup
    requirementIds:
      - CONTENT-008
    acceptanceCriteria:
      - Given export runs for sharing with players, when the package is
        generated, then DM-only fields and device-local secrets are absent.
      - Given export runs for DM backup, when the package is generated, then it
        includes all selected content plus a validation report.
    tasks:
      - id: CONTENT-008-S02-T01
        title: Confirm architecture and interface shape for CONTENT-008
        kind: design
      - id: CONTENT-008-S02-T02
        title: Implement the smallest behavior that satisfies CONTENT-008
        kind: implementation
      - id: CONTENT-008-S02-T03
        title: Add automated coverage for CONTENT-008 acceptance criteria
        kind: test
      - id: CONTENT-008-S02-T04
        title: Record demo notes and traceability evidence for CONTENT-008
        kind: demo
testPlan:
  - Run unit tests for domain reducers, command validators, and data transforms
    touched by this epic.
  - Run UI or integration checks for any visible prototype behavior touched by
    this epic.
  - Run `pnpm v2:workpack:validate` before handoff.
demoNotesTemplate:
  - Describe the user-visible path demonstrated.
  - List the requirement IDs exercised by the demo.
  - Record any gaps intentionally deferred out of this epic.
stopConditions:
  - Stop if the v2 stack ADR is missing or contradicts the implementation
    approach.
  - Stop if implementing the epic requires runtime imports from v1 app code.
  - Stop if hidden visibility, permission, sync, or persistence behavior is
    ambiguous.
  - Stop if the generated workpack no longer validates.
completionEvidence:
  - Targeted tests pass.
  - Traceability from requirement IDs to implementation and tests is documented.
  - Demo notes are filled in for visible behavior.
  - Workpack status is updated after completion.

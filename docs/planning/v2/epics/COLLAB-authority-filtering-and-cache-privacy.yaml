stories:
  - id: COLLAB-008-S01
    title: The system shall resolve authoritative session commands so valid DM
      commands supersede non-DM commands where session policy grants DM
      authority
    requirementIds:
      - COLLAB-008
    acceptanceCriteria:
      - Given a player and DM concurrently adjust a shared session timer, when
        policy declares DM authority, then the valid DM command determines final
        state or creates an auditable conflict per policy.
      - Given a player's command is outside grants, when replayed remotely, then
        it is rejected rather than conflicted.
    tasks:
      - id: COLLAB-008-S01-T01
        title: Confirm architecture and interface shape for COLLAB-008
        kind: design
      - id: COLLAB-008-S01-T02
        title: Implement the smallest behavior that satisfies COLLAB-008
        kind: implementation
      - id: COLLAB-008-S01-T03
        title: Add automated coverage for COLLAB-008 acceptance criteria
        kind: test
      - id: COLLAB-008-S01-T04
        title: Record demo notes and traceability evidence for COLLAB-008
        kind: demo
  - id: COLLAB-009-S02
    title: The system shall filter player and observer replication streams before
      data leaves the sync service or host device, so hidden content is not
      delivered and merely hidden in the UI
    requirementIds:
      - COLLAB-009
    acceptanceCriteria:
      - Given a player stream is generated, when a DM-only note operation
        exists, then the operation is absent from that stream.
      - Given a player gains visibility later, when catch-up sync runs, then
        only newly authorized content is delivered.
    tasks:
      - id: COLLAB-009-S02-T01
        title: Confirm architecture and interface shape for COLLAB-009
        kind: design
      - id: COLLAB-009-S02-T02
        title: Implement the smallest behavior that satisfies COLLAB-009
        kind: implementation
      - id: COLLAB-009-S02-T03
        title: Add automated coverage for COLLAB-009 acceptance criteria
        kind: test
      - id: COLLAB-009-S02-T04
        title: Record demo notes and traceability evidence for COLLAB-009
        kind: demo
  - id: COLLAB-010-S03
    title: The system shall purge or seal participant device caches when a player
      leaves a session unless the DM has granted persistent access to the cached
      content
    requirementIds:
      - COLLAB-010
    acceptanceCriteria:
      - Given a player leaves a session, when their device receives the
        leave/revoke operation, then session-only cached content is removed or
        made unreadable.
      - Given the DM granted persistent access to a handout, when the session
        ends, then that handout remains available according to the grant.
      - Given a player is offline when removed, when cached session content has
        an expiry or sealed key policy, then it becomes unreadable according to
        local policy before or at next reconnect.
      - Given cache purge fails on a participant device, when the DM inspects
        session privacy status, then the participant is marked as
        purge-unconfirmed without exposing device secrets.
    tasks:
      - id: COLLAB-010-S03-T01
        title: Confirm architecture and interface shape for COLLAB-010
        kind: design
      - id: COLLAB-010-S03-T02
        title: Implement the smallest behavior that satisfies COLLAB-010
        kind: implementation
      - id: COLLAB-010-S03-T03
        title: Add automated coverage for COLLAB-010 acceptance criteria
        kind: test
      - id: COLLAB-010-S03-T04
        title: Record demo notes and traceability evidence for COLLAB-010
        kind: demo
  - id: COLLAB-014-S04
    title: Participant cache sealing and revocation shall use an explicit
      session-cache policy covering TTL, key invalidation, persistent-grant
      exceptions, and offline revocation behavior
    requirementIds:
      - COLLAB-014
    acceptanceCriteria:
      - Given a player leaves a session without persistent grants, when their
        session-only cache policy is evaluated, then cached session content is
        purged or made unreadable by sealed-key invalidation within the
        configured TTL.
      - Given the player is offline when revoked, when local sealed-cache expiry
        is reached, then session-only content becomes unreadable before
        reconnect even if the revoke operation has not been delivered.
      - Given persistent access exists for a handout or note, when session cache
        purge runs, then only the persistently granted content remains readable
        and all session-only content is removed or sealed.
      - Given cache purge or key invalidation cannot be confirmed, when the DM
        opens privacy status, then the participant is marked purge-unconfirmed
        without exposing device secrets.
    tasks:
      - id: COLLAB-014-S04-T01
        title: Confirm architecture and interface shape for COLLAB-014
        kind: design
      - id: COLLAB-014-S04-T02
        title: Implement the smallest behavior that satisfies COLLAB-014
        kind: implementation
      - id: COLLAB-014-S04-T03
        title: Add automated coverage for COLLAB-014 acceptance criteria
        kind: test
      - id: COLLAB-014-S04-T04
        title: Record demo notes and traceability evidence for COLLAB-014
        kind: demo
qualityBar:
  - "Correctness: every mapped acceptance criterion is implemented or explicitly
    deferred with reviewer-visible evidence."
  - "Architecture integrity: changes obey ADR-014, the architecture contracts,
    package boundaries, and no-v1-runtime-import rules."
  - "Traceability: requirement IDs are tied to code, tests, demo notes, and any
    documentation changes."
  - "Test depth: unit, integration, e2e, boundary, accessibility, performance,
    security, permission, sync, and migration coverage are chosen according to
    risk."
  - "User experience: visible flows are complete, accessible, responsive,
    resilient to empty/error/loading states, and consistent with the design
    system."
  - "Data safety: persistence, offline behavior, sync assumptions, conflict
    handling, actor filtering, and privacy boundaries fail closed."
  - "Maintainability: modules remain cohesive, typed, readable, locally scoped,
    and free of speculative abstractions or unrelated refactors."
  - "Operational quality: diagnostics, metrics, docs, generated files, and
    handoff evidence are current before completion."
gitWorkflow:
  - Start from a clean working tree. Run `git status --short` before editing and
    stop if unrelated changes overlap this epic.
  - "Create a fresh branch for this epic off the main v2 branch
    `v2-clean-slate`: `git checkout v2-clean-slate && git pull && git checkout
    -b epic/COLLAB-authority-filtering-and-cache-privacy`. Keep all commits
    scoped to the assigned epic."
  - Never reset, overwrite, or reformat unrelated user changes. Work around
    existing dirty files unless they block the epic.
  - Commit the code, docs, tests, generated workpack updates, and completion
    evidence needed for the epic before handoff.
  - "On completion, merge the epic branch back into the main v2 branch and push
    the result: `git checkout v2-clean-slate && git pull && git merge --no-ff
    epic/COLLAB-authority-filtering-and-cache-privacy && git push origin
    v2-clean-slate`."
  - "Leave a clean slate when the epic is complete: no untracked files, no
    unstaged edits, and no stale generated planning diffs caused by the epic."
statusAutomation:
  - Do not hand-edit generated epic packets, `status.yaml`,
    `requirements-index.yaml`, `initiative-map.yaml`, or `parallel-batches.yaml`
    for status changes.
  - Use `pnpm v2:workpack:set-status -- --epic
    COLLAB-authority-filtering-and-cache-privacy --status active` when
    implementation starts.
  - Create
    `docs/planning/v2/epics/COLLAB-authority-filtering-and-cache-privacy.completion.md`
    with demo, tests, traceability, gaps, and git evidence before marking
    complete.
  - Use `pnpm v2:workpack:complete -- --epic
    COLLAB-authority-filtering-and-cache-privacy` to update
    `workpack-state.yaml` and regenerate all derived planning files together.
  - Run `pnpm v2:workpack:validate` after any status or generation command;
    validation fails if generated files drift from the source of truth.
testPlan:
  - Run unit tests for domain reducers, command validators, and data transforms
    touched by this epic.
  - Run UI or integration checks for any visible prototype behavior touched by
    this epic.
  - Run domain-specific quality gates for accessibility, performance, security,
    permissions, sync/offline behavior, migrations, and docs when those areas
    are touched.
  - Run `pnpm v2:workpack:validate` before handoff.
demoNotesTemplate:
  - Describe the user-visible path demonstrated.
  - List the requirement IDs exercised by the demo.
  - Record any gaps intentionally deferred out of this epic.
stopConditions:
  - Stop if the v2 stack ADR is missing or contradicts the implementation
    approach.
  - Stop if implementing the epic requires runtime imports from v1 app code.
  - Stop if hidden visibility, permission, sync, or persistence behavior is
    ambiguous.
  - Stop if the generated workpack no longer validates.
  - Stop if `git status --short` shows unrelated changes that overlap the files
    this epic needs.
completionEvidence:
  - Targeted tests pass.
  - Traceability from requirement IDs to implementation and tests is documented.
  - Demo notes are filled in for visible behavior.
  - Quality review covers correctness, architecture, security, permissions,
    accessibility, performance, persistence, sync/offline assumptions,
    maintainability, UX polish, and documentation.
  - Completion evidence file records demo path, tests run, changed files,
    requirement coverage, known gaps, git branch, commit or PR, and final `git
    status --short` output.
  - Workpack status is updated with the programmatic complete command after
    completion evidence exists.
  - The epic leaves a clean git slate with no untracked or unstaged files caused
    by the work.

schemaVersion: 1
id: COLLAB-authority-filtering-and-cache-privacy
title: 'COLLAB: Authority, filtering, and cache privacy'
status: proposed
approved: false
domain: COLLAB
capabilityBranch: Authority, filtering, and cache privacy
objective: Deliver the authority, filtering, and cache privacy capability branch
  for COLLAB, traced to the included v2 requirements.
requirementIds:
  - COLLAB-008
  - COLLAB-009
  - COLLAB-010
  - COLLAB-014
excludedRequirementIds: []
architectureContracts:
  - 'Contract 2: Cloud Sync & Offline Model'
  - 'Contract 3: Role, Visibility & Permission Grant Model'
expectedAffectedAreas:
  - apps/v2
  - docs/planning/v2
  - collaboration transport
  - participant state
dependencies: []
parallelSafety:
  fileOwnership:
    - apps/v2/collab/
    - docs/planning/v2/
  requiresInterfaceContract: true
  notes: Parallel execution requires explicit interface contracts and
    non-overlapping generated file ownership.
stories:
  - id: COLLAB-008-S01
    title: The system shall resolve authoritative session commands so valid DM
      commands supersede non-DM commands where session policy grants DM
      authority
    requirementIds:
      - COLLAB-008
    acceptanceCriteria:
      - Given a player and DM concurrently adjust a shared session timer, when
        policy declares DM authority, then the valid DM command determines final
        state or creates an auditable conflict per policy.
      - Given a player's command is outside grants, when replayed remotely, then
        it is rejected rather than conflicted.
    tasks:
      - id: COLLAB-008-S01-T01
        title: Confirm architecture and interface shape for COLLAB-008
        kind: design
      - id: COLLAB-008-S01-T02
        title: Implement the smallest behavior that satisfies COLLAB-008
        kind: implementation
      - id: COLLAB-008-S01-T03
        title: Add automated coverage for COLLAB-008 acceptance criteria
        kind: test
      - id: COLLAB-008-S01-T04
        title: Record demo notes and traceability evidence for COLLAB-008
        kind: demo
  - id: COLLAB-009-S02
    title: The system shall filter player and observer replication streams before
      data leaves the sync service or host device, so hidden content is not
      delivered and merely hidden in the UI
    requirementIds:
      - COLLAB-009
    acceptanceCriteria:
      - Given a player stream is generated, when a DM-only note operation
        exists, then the operation is absent from that stream.
      - Given a player gains visibility later, when catch-up sync runs, then
        only newly authorized content is delivered.
    tasks:
      - id: COLLAB-009-S02-T01
        title: Confirm architecture and interface shape for COLLAB-009
        kind: design
      - id: COLLAB-009-S02-T02
        title: Implement the smallest behavior that satisfies COLLAB-009
        kind: implementation
      - id: COLLAB-009-S02-T03
        title: Add automated coverage for COLLAB-009 acceptance criteria
        kind: test
      - id: COLLAB-009-S02-T04
        title: Record demo notes and traceability evidence for COLLAB-009
        kind: demo
  - id: COLLAB-010-S03
    title: The system shall purge or seal participant device caches when a player
      leaves a session unless the DM has granted persistent access to the cached
      content
    requirementIds:
      - COLLAB-010
    acceptanceCriteria:
      - Given a player leaves a session, when their device receives the
        leave/revoke operation, then session-only cached content is removed or
        made unreadable.
      - Given the DM granted persistent access to a handout, when the session
        ends, then that handout remains available according to the grant.
      - Given a player is offline when removed, when cached session content has
        an expiry or sealed key policy, then it becomes unreadable according to
        local policy before or at next reconnect.
      - Given cache purge fails on a participant device, when the DM inspects
        session privacy status, then the participant is marked as
        purge-unconfirmed without exposing device secrets.
    tasks:
      - id: COLLAB-010-S03-T01
        title: Confirm architecture and interface shape for COLLAB-010
        kind: design
      - id: COLLAB-010-S03-T02
        title: Implement the smallest behavior that satisfies COLLAB-010
        kind: implementation
      - id: COLLAB-010-S03-T03
        title: Add automated coverage for COLLAB-010 acceptance criteria
        kind: test
      - id: COLLAB-010-S03-T04
        title: Record demo notes and traceability evidence for COLLAB-010
        kind: demo
  - id: COLLAB-014-S04
    title: Participant cache sealing and revocation shall use an explicit
      session-cache policy covering TTL, key invalidation, persistent-grant
      exceptions, and offline revocation behavior
    requirementIds:
      - COLLAB-014
    acceptanceCriteria:
      - Given a player leaves a session without persistent grants, when their
        session-only cache policy is evaluated, then cached session content is
        purged or made unreadable by sealed-key invalidation within the
        configured TTL.
      - Given the player is offline when revoked, when local sealed-cache expiry
        is reached, then session-only content becomes unreadable before
        reconnect even if the revoke operation has not been delivered.
      - Given persistent access exists for a handout or note, when session cache
        purge runs, then only the persistently granted content remains readable
        and all session-only content is removed or sealed.
      - Given cache purge or key invalidation cannot be confirmed, when the DM
        opens privacy status, then the participant is marked purge-unconfirmed
        without exposing device secrets.
    tasks:
      - id: COLLAB-014-S04-T01
        title: Confirm architecture and interface shape for COLLAB-014
        kind: design
      - id: COLLAB-014-S04-T02
        title: Implement the smallest behavior that satisfies COLLAB-014
        kind: implementation
      - id: COLLAB-014-S04-T03
        title: Add automated coverage for COLLAB-014 acceptance criteria
        kind: test
      - id: COLLAB-014-S04-T04
        title: Record demo notes and traceability evidence for COLLAB-014
        kind: demo
testPlan:

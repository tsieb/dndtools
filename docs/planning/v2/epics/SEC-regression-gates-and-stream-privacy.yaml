schemaVersion: 1
id: SEC-regression-gates-and-stream-privacy
title: "SEC: Regression gates and stream privacy"
status: approved
approved: true
domain: SEC
capabilityBranch: Regression gates and stream privacy
objective: Deliver the regression gates and stream privacy capability branch for
  SEC, traced to the included v2 requirements.
requirementIds:
  - SEC-008
  - SEC-010
  - SEC-011
excludedRequirementIds: []
architectureContracts:
  - "Contract 1: Processing / Display Decoupling"
  - "Contract 2: Cloud Sync & Offline Model"
  - "Contract 3: Role, Visibility & Permission Grant Model"
  - "Contract 4: Scene and Widget Contract"
expectedAffectedAreas:
  - apps/v2
  - docs/planning/v2
  - security boundary
  - threat controls
dependencies: []
parallelSafety:
  fileOwnership:
    - apps/v2/sec/
    - docs/planning/v2/
  requiresInterfaceContract: true
  notes: Parallel execution requires explicit interface contracts and
    non-overlapping generated file ownership.
stories:
  - id: SEC-008-S01
    title: Security regression tests shall cover IPC validation, storage
      containment, markdown sanitization, widget host permission denial, sync
      stream filtering, MCP staged write enforcement, and cloud join
      authorization
    requirementIds:
      - SEC-008
    acceptanceCriteria:
      - Given a security-critical boundary is added without tests, when
        architecture tests run, then the missing coverage fails the gate.
      - Given a known player-data leak fixture is tested, when player queries
        run, then hidden data never appears in returned payloads.
    tasks:
      - id: SEC-008-S01-T01
        title: Confirm architecture and interface shape for SEC-008
        kind: design
      - id: SEC-008-S01-T02
        title: Implement the smallest behavior that satisfies SEC-008
        kind: implementation
      - id: SEC-008-S01-T03
        title: Add automated coverage for SEC-008 acceptance criteria
        kind: test
      - id: SEC-008-S01-T04
        title: Record demo notes and traceability evidence for SEC-008
        kind: demo
  - id: SEC-010-S02
    title: Player and observer replication stream tests shall assert absence of
      hidden entity data, hidden metadata, revealing counts, and hidden
      relationship edges across notes, maps, characters, Scenes, search, graph,
      widgets, MCP, and sync status
    requirementIds:
      - SEC-010
    acceptanceCriteria:
      - Given a fixture contains hidden content in every major domain, when
        player and observer streams are generated, then no hidden value, title,
        id, edge, snippet, or revealing count is present.
      - Given a new query surface is added, when security coverage is evaluated,
        then the surface is included in replication filtering tests before
        release.
    tasks:
      - id: SEC-010-S02-T01
        title: Confirm architecture and interface shape for SEC-010
        kind: design
      - id: SEC-010-S02-T02
        title: Implement the smallest behavior that satisfies SEC-010
        kind: implementation
      - id: SEC-010-S02-T03
        title: Add automated coverage for SEC-010 acceptance criteria
        kind: test
      - id: SEC-010-S02-T04
        title: Record demo notes and traceability evidence for SEC-010
        kind: demo
  - id: SEC-011-S03
    title: Widget host network and exfiltration controls shall constrain outbound
      requests, storage access, clipboard use, telemetry, and cross-widget
      communication through explicit host permissions and audit
    requirementIds:
      - SEC-011
    acceptanceCriteria:
      - Given a widget attempts to send hidden actor data, raw vault content,
        tokens, diagnostics, or absolute paths over an approved network
        permission, when the host validates the payload, then the request is
        blocked or redacted according to policy.
      - Given a widget has network permission for one destination class, when it
        requests another destination, then the request is denied and audited.
      - Given a widget stores local state, when inspected, then it cannot use
        widget-local storage as the sole source of truth for canonical
        vault/session data.
      - Given a widget crashes or violates host policy, when isolated, then
        other widgets and core app state remain available.
    tasks:
      - id: SEC-011-S03-T01
        title: Confirm architecture and interface shape for SEC-011
        kind: design
      - id: SEC-011-S03-T02
        title: Implement the smallest behavior that satisfies SEC-011
        kind: implementation
      - id: SEC-011-S03-T03
        title: Add automated coverage for SEC-011 acceptance criteria
        kind: test
      - id: SEC-011-S03-T04
        title: Record demo notes and traceability evidence for SEC-011
        kind: demo
qualityBar:
  - "Correctness: every mapped acceptance criterion is implemented or explicitly
    deferred with reviewer-visible evidence."
  - "Architecture integrity: changes obey ADR-014, the architecture contracts,
    package boundaries, and no-v1-runtime-import rules."
  - "Traceability: requirement IDs are tied to code, tests, demo notes, and any
    documentation changes."
  - "Test depth: unit, integration, e2e, boundary, accessibility, performance,
    security, permission, sync, and migration coverage are chosen according to
    risk."
  - "User experience: visible flows are complete, accessible, responsive,
    resilient to empty/error/loading states, and consistent with the design
    system."
  - "Data safety: persistence, offline behavior, sync assumptions, conflict
    handling, actor filtering, and privacy boundaries fail closed."
  - "Maintainability: modules remain cohesive, typed, readable, locally scoped,
    and free of speculative abstractions or unrelated refactors."
  - "Operational quality: diagnostics, metrics, docs, generated files, and
    handoff evidence are current before completion."
gitWorkflow:
  - Start from a clean working tree. Run `git status --short` before editing and
    stop if unrelated changes overlap this epic.
  - Use one branch per epic from the correct base branch, and keep all commits
    scoped to the assigned epic.
  - Never reset, overwrite, or reformat unrelated user changes. Work around
    existing dirty files unless they block the epic.
  - Commit the code, docs, tests, generated workpack updates, and completion
    evidence needed for the epic before handoff.
  - "Leave a clean slate when the epic is complete: no untracked files, no
    unstaged edits, and no stale generated planning diffs caused by the epic."
statusAutomation:
  - Do not hand-edit generated epic packets, `status.yaml`,
    `requirements-index.yaml`, `initiative-map.yaml`, or `parallel-batches.yaml`
    for status changes.
  - Use `pnpm v2:workpack:set-status -- --epic
    SEC-regression-gates-and-stream-privacy --status active` when implementation
    starts.
  - Create
    `docs/planning/v2/epics/SEC-regression-gates-and-stream-privacy.completion.md`
    with demo, tests, traceability, gaps, and git evidence before marking
    complete.
  - Use `pnpm v2:workpack:complete -- --epic
    SEC-regression-gates-and-stream-privacy` to update `workpack-state.yaml` and
    regenerate all derived planning files together.
  - Run `pnpm v2:workpack:validate` after any status or generation command;
    validation fails if generated files drift from the source of truth.
testPlan:
  - Run unit tests for domain reducers, command validators, and data transforms
    touched by this epic.
  - Run UI or integration checks for any visible prototype behavior touched by
    this epic.
  - Run domain-specific quality gates for accessibility, performance, security,
    permissions, sync/offline behavior, migrations, and docs when those areas
    are touched.
  - Run `pnpm v2:workpack:validate` before handoff.
demoNotesTemplate:
  - Describe the user-visible path demonstrated.
  - List the requirement IDs exercised by the demo.
  - Record any gaps intentionally deferred out of this epic.
stopConditions:
  - Stop if the v2 stack ADR is missing or contradicts the implementation
    approach.
  - Stop if implementing the epic requires runtime imports from v1 app code.
  - Stop if hidden visibility, permission, sync, or persistence behavior is
    ambiguous.
  - Stop if the generated workpack no longer validates.
  - Stop if `git status --short` shows unrelated changes that overlap the files
    this epic needs.
completionEvidence:
  - Targeted tests pass.
  - Traceability from requirement IDs to implementation and tests is documented.
  - Demo notes are filled in for visible behavior.
  - Quality review covers correctness, architecture, security, permissions,
    accessibility, performance, persistence, sync/offline assumptions,
    maintainability, UX polish, and documentation.
  - Completion evidence file records demo path, tests run, changed files,
    requirement coverage, known gaps, git branch, commit or PR, and final `git
    status --short` output.
  - Workpack status is updated with the programmatic complete command after
    completion evidence exists.
  - The epic leaves a clean git slate with no untracked or unstaged files caused
    by the work.

schemaVersion: 1
id: PLAT-platform-profiles-and-shells
title: "PLAT: Platform profiles and shells"
status: approved
approved: true
domain: PLAT
capabilityBranch: Platform profiles and shells
objective: Deliver the platform profiles and shells capability branch for PLAT,
  traced to the included v2 requirements.
requirementIds:
  - PLAT-001
  - PLAT-002
  - PLAT-003
  - PLAT-004
  - PLAT-005
  - PLAT-016
excludedRequirementIds: []
architectureContracts:
  - "Contract 1: Processing / Display Decoupling"
  - "Contract 2: Cloud Sync & Offline Model"
  - "Contract 4: Scene and Widget Contract"
expectedAffectedAreas:
  - apps/v2
  - docs/planning/v2
  - platform services
  - runtime shell
dependencies: []
parallelSafety:
  fileOwnership:
    - apps/v2/plat/
    - docs/planning/v2/
  requiresInterfaceContract: true
  notes: Parallel execution requires explicit interface contracts and
    non-overlapping generated file ownership.
stories:
  - id: PLAT-001-S01
    title: The shell shall select desktop, tablet, mobile, or web platform profiles
      at runtime from capability descriptors rather than feature components
      branching on raw viewport width
    requirementIds:
      - PLAT-001
    acceptanceCriteria:
      - Given a device has touch input and compact viewport, when profile
        detection runs, then the shell selects a profile and passes capabilities
        to GUI packages.
      - Given a feature component needs layout variation, when implemented, then
        it branches on profile capability rather than `window.innerWidth`.
    tasks:
      - id: PLAT-001-S01-T01
        title: Confirm architecture and interface shape for PLAT-001
        kind: design
      - id: PLAT-001-S01-T02
        title: Implement the smallest behavior that satisfies PLAT-001
        kind: implementation
      - id: PLAT-001-S01-T03
        title: Add automated coverage for PLAT-001 acceptance criteria
        kind: test
      - id: PLAT-001-S01-T04
        title: Record demo notes and traceability evidence for PLAT-001
        kind: demo
  - id: PLAT-002-S02
    title: The desktop shell shall provide trusted filesystem storage, OS dialogs,
      updates, protocol handling, titlebar controls, context menus, file
      watching, and MCP sidecar lifecycle behind typed platform services
    requirementIds:
      - PLAT-002
    acceptanceCriteria:
      - Given the renderer requests a vault file, when running on desktop, then
        the request crosses typed IPC into trusted platform services.
      - Given titlebar state changes, when maximized/restored, then controls
        reflect current shell state and respect platform-specific hitbox
        dimensions.
      - Given desktop titlebar controls render, when target-size audit runs,
        then hitboxes meet the platform chrome baseline and remain inside the
        declared titlebar height.
    tasks:
      - id: PLAT-002-S02-T01
        title: Confirm architecture and interface shape for PLAT-002
        kind: design
      - id: PLAT-002-S02-T02
        title: Implement the smallest behavior that satisfies PLAT-002
        kind: implementation
      - id: PLAT-002-S02-T03
        title: Add automated coverage for PLAT-002 acceptance criteria
        kind: test
      - id: PLAT-002-S02-T04
        title: Record demo notes and traceability evidence for PLAT-002
        kind: demo
  - id: PLAT-003-S03
    title: The mobile GUI shall provide density-reduced access to all Must-have
      commands through sheets, drawers, tabs, command menus, and focused views
      without creating alternate data models
    requirementIds:
      - PLAT-003
    acceptanceCriteria:
      - Given a Scene has multiple widgets, when opened on mobile, then widgets
        can be operated through focused or stacked views backed by the same
        Scene state.
      - Given a mobile workflow lacks room for a desktop panel, when adapted,
        then the same command remains reachable through an alternate control.
    tasks:
      - id: PLAT-003-S03-T01
        title: Confirm architecture and interface shape for PLAT-003
        kind: design
      - id: PLAT-003-S03-T02
        title: Implement the smallest behavior that satisfies PLAT-003
        kind: implementation
      - id: PLAT-003-S03-T03
        title: Add automated coverage for PLAT-003 acceptance criteria
        kind: test
      - id: PLAT-003-S03-T04
        title: Record demo notes and traceability evidence for PLAT-003
        kind: demo
  - id: PLAT-004-S04
    title: The web/PWA runtime shall use browser-safe storage and cloud-cache
      capabilities while preserving local-first behavior for cached vault
      content
    requirementIds:
      - PLAT-004
    acceptanceCriteria:
      - Given a PWA has cached content, when offline, then the user can read and
        edit supported cached vault content.
      - Given a filesystem-only feature is unavailable, when invoked in web
        profile, then the app shows degraded capability status.
      - Given a PWA has never cached a vault or auth state, when opened offline,
        then it shows first-time setup unavailable without blocking already
        cached local vaults in the same browser profile.
      - Given cloud or Google Docs auth expires while the PWA is offline, when
        the user edits cached content, then the edit remains local/queued and
        reauthorization is requested only when network returns.
      - Given a service worker update is pending, when cached vault content is
        open, then the update policy preserves current local writes and reports
        any reload requirement before activation.
    tasks:
      - id: PLAT-004-S04-T01
        title: Confirm architecture and interface shape for PLAT-004
        kind: design
      - id: PLAT-004-S04-T02
        title: Implement the smallest behavior that satisfies PLAT-004
        kind: implementation
      - id: PLAT-004-S04-T03
        title: Add automated coverage for PLAT-004 acceptance criteria
        kind: test
      - id: PLAT-004-S04-T04
        title: Record demo notes and traceability evidence for PLAT-004
        kind: demo
  - id: PLAT-005-S05
    title: The Android runtime shall use Capacitor platform services for storage,
      file access, keyboard adaptation, and share/import flows without exposing
      native APIs to feature components
    requirementIds:
      - PLAT-005
    acceptanceCriteria:
      - Given the Android app imports a file, when the operation runs, then
        feature logic receives a platform service result rather than raw native
        API access.
      - Given the virtual keyboard opens in editor, when layout adjusts, then
        the active input remains visible and controls remain reachable.
    tasks:
      - id: PLAT-005-S05-T01
        title: Confirm architecture and interface shape for PLAT-005
        kind: design
      - id: PLAT-005-S05-T02
        title: Implement the smallest behavior that satisfies PLAT-005
        kind: implementation
      - id: PLAT-005-S05-T03
        title: Add automated coverage for PLAT-005 acceptance criteria
        kind: test
      - id: PLAT-005-S05-T04
        title: Record demo notes and traceability evidence for PLAT-005
        kind: demo
  - id: PLAT-016-S06
    title: The web/PWA release shall publish a cached read/write support matrix
      covering notes, maps, Scenes, characters, sessions, handouts, assets,
      search, graph, sync status, and unsupported platform features
    requirementIds:
      - PLAT-016
    acceptanceCriteria:
      - Given release review runs, when the PWA matrix is inspected, then each
        core domain is marked as cached read, cached write, queued write,
        unavailable, or unsupported with the required fallback.
      - Given release review runs, when the PWA matrix is inspected, then auth
        state, first-time auth limits, service-worker cache/update policy,
        storage quota, and eviction recovery behavior are declared for each
        affected domain.
      - Given browser storage eviction removes cached assets, when the user
        opens affected content, then missing assets are reported and core cached
        metadata remains safe.
      - Given a queued PWA edit reconnects, when sync resumes, then the edit is
        replayed through the same operation validation as desktop.
      - Given a PWA feature depends on filesystem, OS credential store, protocol
        handling, or MCP sidecar access, when invoked, then it reports
        unsupported capability rather than attempting a native path.
    tasks:
      - id: PLAT-016-S06-T01
        title: Confirm architecture and interface shape for PLAT-016
        kind: design
      - id: PLAT-016-S06-T02
        title: Implement the smallest behavior that satisfies PLAT-016
        kind: implementation
      - id: PLAT-016-S06-T03
        title: Add automated coverage for PLAT-016 acceptance criteria
        kind: test
      - id: PLAT-016-S06-T04
        title: Record demo notes and traceability evidence for PLAT-016
        kind: demo
qualityBar:
  - "Correctness: every mapped acceptance criterion is implemented or explicitly
    deferred with reviewer-visible evidence."
  - "Architecture integrity: changes obey ADR-014, the architecture contracts,
    package boundaries, and no-v1-runtime-import rules."
  - "Traceability: requirement IDs are tied to code, tests, demo notes, and any
    documentation changes."
  - "Test depth: unit, integration, e2e, boundary, accessibility, performance,
    security, permission, sync, and migration coverage are chosen according to
    risk."
  - "User experience: visible flows are complete, accessible, responsive,
    resilient to empty/error/loading states, and consistent with the design
    system."
  - "Data safety: persistence, offline behavior, sync assumptions, conflict
    handling, actor filtering, and privacy boundaries fail closed."
  - "Maintainability: modules remain cohesive, typed, readable, locally scoped,
    and free of speculative abstractions or unrelated refactors."
  - "Operational quality: diagnostics, metrics, docs, generated files, and
    handoff evidence are current before completion."
gitWorkflow:
  - Start from a clean working tree. Run `git status --short` before editing and
    stop if unrelated changes overlap this epic.
  - Use one branch per epic from the correct base branch, and keep all commits
    scoped to the assigned epic.
  - Never reset, overwrite, or reformat unrelated user changes. Work around
    existing dirty files unless they block the epic.
  - Commit the code, docs, tests, generated workpack updates, and completion
    evidence needed for the epic before handoff.
  - "Leave a clean slate when the epic is complete: no untracked files, no
    unstaged edits, and no stale generated planning diffs caused by the epic."
statusAutomation:
  - Do not hand-edit generated epic packets, `status.yaml`,
    `requirements-index.yaml`, `initiative-map.yaml`, or `parallel-batches.yaml`
    for status changes.
  - Use `pnpm v2:workpack:set-status -- --epic PLAT-platform-profiles-and-shells
    --status active` when implementation starts.
  - Create
    `docs/planning/v2/epics/PLAT-platform-profiles-and-shells.completion.md`
    with demo, tests, traceability, gaps, and git evidence before marking
    complete.
  - Use `pnpm v2:workpack:complete -- --epic PLAT-platform-profiles-and-shells`
    to update `workpack-state.yaml` and regenerate all derived planning files
    together.
  - Run `pnpm v2:workpack:validate` after any status or generation command;
    validation fails if generated files drift from the source of truth.
testPlan:
  - Run unit tests for domain reducers, command validators, and data transforms
    touched by this epic.
  - Run UI or integration checks for any visible prototype behavior touched by
    this epic.
  - Run domain-specific quality gates for accessibility, performance, security,
    permissions, sync/offline behavior, migrations, and docs when those areas
    are touched.
  - Run `pnpm v2:workpack:validate` before handoff.
demoNotesTemplate:
  - Describe the user-visible path demonstrated.
  - List the requirement IDs exercised by the demo.
  - Record any gaps intentionally deferred out of this epic.
stopConditions:
  - Stop if the v2 stack ADR is missing or contradicts the implementation
    approach.
  - Stop if implementing the epic requires runtime imports from v1 app code.
  - Stop if hidden visibility, permission, sync, or persistence behavior is
    ambiguous.
  - Stop if the generated workpack no longer validates.
  - Stop if `git status --short` shows unrelated changes that overlap the files
    this epic needs.
completionEvidence:
  - Targeted tests pass.
  - Traceability from requirement IDs to implementation and tests is documented.
  - Demo notes are filled in for visible behavior.
  - Quality review covers correctness, architecture, security, permissions,
    accessibility, performance, persistence, sync/offline assumptions,
    maintainability, UX polish, and documentation.
  - Completion evidence file records demo path, tests run, changed files,
    requirement coverage, known gaps, git branch, commit or PR, and final `git
    status --short` output.
  - Workpack status is updated with the programmatic complete command after
    completion evidence exists.
  - The epic leaves a clean git slate with no untracked or unstaged files caused
    by the work.

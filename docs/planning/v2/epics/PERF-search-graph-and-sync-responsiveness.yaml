schemaVersion: 1
id: PERF-search-graph-and-sync-responsiveness
title: 'PERF: Search, graph, and sync responsiveness'
status: proposed
approved: false
domain: PERF
capabilityBranch: Search, graph, and sync responsiveness
objective: Deliver the search, graph, and sync responsiveness capability branch
  for PERF, traced to the included v2 requirements.
requirementIds:
  - PERF-004
  - PERF-008
excludedRequirementIds: []
architectureContracts:
  - 'Contract 2: Cloud Sync & Offline Model'
expectedAffectedAreas:
  - apps/v2
  - docs/planning/v2
  - performance budgets
  - measurement
dependencies: []
parallelSafety:
  fileOwnership:
    - apps/v2/perf/
    - docs/planning/v2/
  requiresInterfaceContract: true
  notes: Parallel execution requires explicit interface contracts and
    non-overlapping generated file ownership.
stories:
  - id: PERF-004-S01
    title: Graph and search indexing shall use incremental, source-aware algorithms
      and background scheduling so large vaults remain navigable during updates
    requirementIds:
      - PERF-004
    acceptanceCriteria:
      - Given a large vault receives one changed note, when indexing runs, then
        navigation and search remain responsive.
      - Given background indexing is incomplete, when search runs, then
        stale/partial status is visible without returning hidden data.
    tasks:
      - id: PERF-004-S01-T01
        title: Confirm architecture and interface shape for PERF-004
        kind: design
      - id: PERF-004-S01-T02
        title: Implement the smallest behavior that satisfies PERF-004
        kind: implementation
      - id: PERF-004-S01-T03
        title: Add automated coverage for PERF-004 acceptance criteria
        kind: test
      - id: PERF-004-S01-T04
        title: Record demo notes and traceability evidence for PERF-004
        kind: demo
  - id: PERF-008-S02
    title: Search, graph, and sync background work shall preserve interactive
      responsiveness by using scheduling, cancellation, resumable batches, and
      stale/partial result indicators
    requirementIds:
      - PERF-008
    acceptanceCriteria:
      - Given a large vault reindex is running, when the user searches,
        navigates, or advances combat, then the command remains within the
        configured responsiveness budget.
      - Given background work is cancelled or interrupted, when resumed, then it
        continues from a checkpoint or restarts with a visible diagnostic.
    tasks:
      - id: PERF-008-S02-T01
        title: Confirm architecture and interface shape for PERF-008
        kind: design
      - id: PERF-008-S02-T02
        title: Implement the smallest behavior that satisfies PERF-008
        kind: implementation
      - id: PERF-008-S02-T03
        title: Add automated coverage for PERF-008 acceptance criteria
        kind: test
      - id: PERF-008-S02-T04
        title: Record demo notes and traceability evidence for PERF-008
        kind: demo
testPlan:
  - Run unit tests for domain reducers, command validators, and data transforms
    touched by this epic.
  - Run UI or integration checks for any visible prototype behavior touched by
    this epic.
  - Run `pnpm v2:workpack:validate` before handoff.
demoNotesTemplate:
  - Describe the user-visible path demonstrated.
  - List the requirement IDs exercised by the demo.
  - Record any gaps intentionally deferred out of this epic.
stopConditions:
  - Stop if the v2 stack ADR is missing or contradicts the implementation
    approach.
  - Stop if implementing the epic requires runtime imports from v1 app code.
  - Stop if hidden visibility, permission, sync, or persistence behavior is
    ambiguous.
  - Stop if the generated workpack no longer validates.
completionEvidence:
  - Targeted tests pass.
  - Traceability from requirement IDs to implementation and tests is documented.
  - Demo notes are filled in for visible behavior.
  - Workpack status is updated after completion.

schemaVersion: 1
id: GRAPH-visualization
title: 'GRAPH: Visualization'
status: proposed
approved: false
domain: GRAPH
capabilityBranch: Visualization
objective: Deliver the visualization capability branch for GRAPH, traced to the
  included v2 requirements.
requirementIds:
  - GRAPH-004
excludedRequirementIds: []
architectureContracts:
  - 'Contract 3: Role, Visibility & Permission Grant Model'
expectedAffectedAreas:
  - apps/v2
  - docs/planning/v2
  - graph index
  - relationship intelligence
dependencies: []
parallelSafety:
  fileOwnership:
    - apps/v2/graph/
    - docs/planning/v2/
  requiresInterfaceContract: true
  notes: Parallel execution requires explicit interface contracts and
    non-overlapping generated file ownership.
stories:
  - id: GRAPH-004-S01
    title: A user shall be able to view a filtered graph visualization by folder,
      tag, entity type, source, relationship type, and visibility-safe search
      text
    requirementIds:
      - GRAPH-004
    acceptanceCriteria:
      - Given a graph with notes and maps, when the user filters by `map`, then
        only visible map nodes and their visible edges are shown.
      - Given the graph is opened on mobile, when filters are used, then the
        graph remains accessible through a simplified control surface.
    tasks:
      - id: GRAPH-004-S01-T01
        title: Confirm architecture and interface shape for GRAPH-004
        kind: design
      - id: GRAPH-004-S01-T02
        title: Implement the smallest behavior that satisfies GRAPH-004
        kind: implementation
      - id: GRAPH-004-S01-T03
        title: Add automated coverage for GRAPH-004 acceptance criteria
        kind: test
      - id: GRAPH-004-S01-T04
        title: Record demo notes and traceability evidence for GRAPH-004
        kind: demo
testPlan:
  - Run unit tests for domain reducers, command validators, and data transforms
    touched by this epic.
  - Run UI or integration checks for any visible prototype behavior touched by
    this epic.
  - Run `pnpm v2:workpack:validate` before handoff.
demoNotesTemplate:
  - Describe the user-visible path demonstrated.
  - List the requirement IDs exercised by the demo.
  - Record any gaps intentionally deferred out of this epic.
stopConditions:
  - Stop if the v2 stack ADR is missing or contradicts the implementation
    approach.
  - Stop if implementing the epic requires runtime imports from v1 app code.
  - Stop if hidden visibility, permission, sync, or persistence behavior is
    ambiguous.
  - Stop if the generated workpack no longer validates.
completionEvidence:
  - Targeted tests pass.
  - Traceability from requirement IDs to implementation and tests is documented.
  - Demo notes are filled in for visible behavior.
  - Workpack status is updated after completion.

schemaVersion: 1
id: CHAR-collaboration-and-dm-edits
title: "CHAR: Collaboration and DM edits"
status: complete
approved: true
domain: CHAR
capabilityBranch: Collaboration and DM edits
objective: Deliver the collaboration and dm edits capability branch for CHAR,
  traced to the included v2 requirements.
requirementIds:
  - CHAR-004
  - CHAR-005
  - CHAR-014
excludedRequirementIds: []
architectureContracts:
  - "Contract 2: Cloud Sync & Offline Model"
  - "Contract 3: Role, Visibility & Permission Grant Model"
expectedAffectedAreas:
  - apps/gm
  - docs/planning/v2
  - character model
  - character UI
dependencies: []
parallelSafety:
  fileOwnership:
    - apps/gm/char/
    - docs/planning/v2/
  requiresInterfaceContract: true
  notes: Parallel execution requires explicit interface contracts and
    non-overlapping generated file ownership.
stories:
  - id: CHAR-004-S01
    title: The DM and a character owner shall be able to collaborate on a character
      at the same time, with accepted operations merged by field or surfaced as
      conflicts for same-path edits
    requirementIds:
      - CHAR-004
    acceptanceCriteria:
      - Given the DM edits a DM-only note field while the owner edits backstory,
        when sync reconciles, then both changes persist.
      - Given both edit the same scalar field concurrently, when sync
        reconciles, then a conflict record is created for DM resolution.
    tasks:
      - id: CHAR-004-S01-T01
        title: Confirm architecture and interface shape for CHAR-004
        kind: design
      - id: CHAR-004-S01-T02
        title: Implement the smallest behavior that satisfies CHAR-004
        kind: implementation
      - id: CHAR-004-S01-T03
        title: Add automated coverage for CHAR-004 acceptance criteria
        kind: test
      - id: CHAR-004-S01-T04
        title: Record demo notes and traceability evidence for CHAR-004
        kind: demo
  - id: CHAR-005-S02
    title: The DM shall be able to edit any character field through validated
      commands, with DM edits visibly attributed in history without creating a
      separate hidden override value layer
    requirementIds:
      - CHAR-005
    acceptanceCriteria:
      - Given the DM changes a player's character HP, when the command is
        accepted, then the character revision records DM actor attribution.
      - Given a player reads their character, when a DM-only field was edited by
        the DM, then hidden content remains omitted.
      - Given the DM changes a player-visible field on an owned character, when
        the owner views current character state, then the field is visually
        flagged as DM-authored without creating a parallel override value.
    tasks:
      - id: CHAR-005-S02-T01
        title: Confirm architecture and interface shape for CHAR-005
        kind: design
      - id: CHAR-005-S02-T02
        title: Implement the smallest behavior that satisfies CHAR-005
        kind: implementation
      - id: CHAR-005-S02-T03
        title: Add automated coverage for CHAR-005 acceptance criteria
        kind: test
      - id: CHAR-005-S02-T04
        title: Record demo notes and traceability evidence for CHAR-005
        kind: demo
  - id: CHAR-014-S03
    title: Collaborative character views shall distinguish current DM-authored
      player-visible edits, player-authored edits, and unresolved conflicts
      without exposing DM-only fields
    requirementIds:
      - CHAR-014
    acceptanceCriteria:
      - Given a DM edits a visible character field during collaboration, when
        the owner views that field, then the current value shows DM attribution
        and history access.
      - Given a DM edits a `dm-only` field, when the owner views the same
        character, then no label, placeholder, or history entry reveals the
        hidden field's existence unless policy explicitly exposes it.
    tasks:
      - id: CHAR-014-S03-T01
        title: Confirm architecture and interface shape for CHAR-014
        kind: design
      - id: CHAR-014-S03-T02
        title: Implement the smallest behavior that satisfies CHAR-014
        kind: implementation
      - id: CHAR-014-S03-T03
        title: Add automated coverage for CHAR-014 acceptance criteria
        kind: test
      - id: CHAR-014-S03-T04
        title: Record demo notes and traceability evidence for CHAR-014
        kind: demo
qualityBar:
  - "Correctness: every mapped acceptance criterion is implemented or explicitly
    deferred with reviewer-visible evidence."
  - "Architecture integrity: changes obey ADR-014, the architecture contracts,
    package boundaries, and no-v1-runtime-import rules."
  - "Traceability: requirement IDs are tied to code, tests, demo notes, and any
    documentation changes."
  - "Test depth: unit, integration, e2e, boundary, accessibility, performance,
    security, permission, sync, and migration coverage are chosen according to
    risk."
  - "User experience: visible flows are complete, accessible, responsive,
    resilient to empty/error/loading states, and consistent with the design
    system."
  - "Data safety: persistence, offline behavior, sync assumptions, conflict
    handling, actor filtering, and privacy boundaries fail closed."
  - "Maintainability: modules remain cohesive, typed, readable, locally scoped,
    and free of speculative abstractions or unrelated refactors."
  - "Operational quality: diagnostics, metrics, docs, generated files, and
    handoff evidence are current before completion."
gitWorkflow:
  - Start from a clean working tree. Run `git status --short` before editing and
    stop if unrelated changes overlap this epic.
  - Use one branch per epic from the correct base branch, and keep all commits
    scoped to the assigned epic.
  - Never reset, overwrite, or reformat unrelated user changes. Work around
    existing dirty files unless they block the epic.
  - Commit the code, docs, tests, generated workpack updates, and completion
    evidence needed for the epic before handoff.
  - "Leave a clean slate when the epic is complete: no untracked files, no
    unstaged edits, and no stale generated planning diffs caused by the epic."
statusAutomation:
  - Do not hand-edit generated epic packets, `status.yaml`,
    `requirements-index.yaml`, `initiative-map.yaml`, or `parallel-batches.yaml`
    for status changes.
  - Use `pnpm workpack:set-status -- --epic CHAR-collaboration-and-dm-edits
    --status active` when implementation starts.
  - Create
    `docs/planning/v2/epics/CHAR-collaboration-and-dm-edits.completion.md` with
    demo, tests, traceability, gaps, and git evidence before marking complete.
  - Use `pnpm workpack:complete -- --epic CHAR-collaboration-and-dm-edits` to
    update `workpack-state.yaml` and regenerate all derived planning files
    together.
  - Run `pnpm workpack:validate` after any status or generation command;
    validation fails if generated files drift from the source of truth.
testPlan:
  - Run unit tests for domain reducers, command validators, and data transforms
    touched by this epic.
  - Run UI or integration checks for any visible prototype behavior touched by
    this epic.
  - Run domain-specific quality gates for accessibility, performance, security,
    permissions, sync/offline behavior, migrations, and docs when those areas
    are touched.
  - Run `pnpm workpack:validate` before handoff.
demoNotesTemplate:
  - Describe the user-visible path demonstrated.
  - List the requirement IDs exercised by the demo.
  - Record any gaps intentionally deferred out of this epic.
stopConditions:
  - Stop if the v2 stack ADR is missing or contradicts the implementation
    approach.
  - Stop if implementing the epic requires runtime imports from v1 app code.
  - Stop if hidden visibility, permission, sync, or persistence behavior is
    ambiguous.
  - Stop if the generated workpack no longer validates.
  - Stop if `git status --short` shows unrelated changes that overlap the files
    this epic needs.
completionEvidence:
  - Targeted tests pass.
  - Traceability from requirement IDs to implementation and tests is documented.
  - Demo notes are filled in for visible behavior.
  - Quality review covers correctness, architecture, security, permissions,
    accessibility, performance, persistence, sync/offline assumptions,
    maintainability, UX polish, and documentation.
  - Completion evidence file records demo path, tests run, changed files,
    requirement coverage, known gaps, git branch, commit or PR, and final `git
    status --short` output.
  - Workpack status is updated with the programmatic complete command after
    completion evidence exists.
  - The epic leaves a clean git slate with no untracked or unstaged files caused
    by the work.
completionEvidenceFile: docs/planning/v2/epics/CHAR-collaboration-and-dm-edits.completion.md

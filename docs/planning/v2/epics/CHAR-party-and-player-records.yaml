schemaVersion: 1
id: CHAR-party-and-player-records
title: 'CHAR: Party and player records'
status: proposed
approved: false
domain: CHAR
capabilityBranch: Party and player records
objective: Deliver the party and player records capability branch for CHAR,
  traced to the included v2 requirements.
requirementIds:
  - CHAR-011
  - CHAR-012
  - CHAR-015
  - CHAR-016
excludedRequirementIds: []
architectureContracts:
  - 'Contract 1: Processing / Display Decoupling'
  - 'Contract 2: Cloud Sync & Offline Model'
  - 'Contract 3: Role, Visibility & Permission Grant Model'
  - 'Contract 4: Scene and Widget Contract'
expectedAffectedAreas:
  - apps/v2
  - docs/planning/v2
  - character model
  - character UI
dependencies: []
parallelSafety:
  fileOwnership:
    - apps/v2/char/
    - docs/planning/v2/
  requiresInterfaceContract: true
  notes: Parallel execution requires explicit interface contracts and
    non-overlapping generated file ownership.
stories:
  - id: CHAR-011-S01
    title: The DM and players shall be able to view a party overview with visible
      HP/status/resource summaries, marching order, and party inventory
      according to visibility and grants
    requirementIds:
      - CHAR-011
    acceptanceCriteria:
      - Given three visible PCs, when the party overview opens, then visible
        combat summaries and marching order are shown.
      - Given one character is not visible to a participant, when the party
        overview loads, then that character is omitted.
    tasks:
      - id: CHAR-011-S01-T01
        title: Confirm architecture and interface shape for CHAR-011
        kind: design
      - id: CHAR-011-S01-T02
        title: Implement the smallest behavior that satisfies CHAR-011
        kind: implementation
      - id: CHAR-011-S01-T03
        title: Add automated coverage for CHAR-011 acceptance criteria
        kind: test
      - id: CHAR-011-S01-T04
        title: Record demo notes and traceability evidence for CHAR-011
        kind: demo
  - id: CHAR-012-S02
    title: A player shall be able to keep a character journal, bookmarks, NPC
      impressions, personal quests, and session highlights scoped to their
      character permissions
    requirementIds:
      - CHAR-012
    acceptanceCriteria:
      - Given a player owns a character, when they add a private journal entry,
        then the entry is visible to the player and DM according to the
        permission model.
      - Given a player without ownership attempts to edit the journal, when they
        submit content, then the command is rejected.
      - Given a journal entry is `shared` only through the owning character's
        `owner` grant, when other players, observers, search, graph, widgets, or
        MCP responses are generated, then the entry content and revealing
        metadata are absent.
    tasks:
      - id: CHAR-012-S02-T01
        title: Confirm architecture and interface shape for CHAR-012
        kind: design
      - id: CHAR-012-S02-T02
        title: Implement the smallest behavior that satisfies CHAR-012
        kind: implementation
      - id: CHAR-012-S02-T03
        title: Add automated coverage for CHAR-012 acceptance criteria
        kind: test
      - id: CHAR-012-S02-T04
        title: Record demo notes and traceability evidence for CHAR-012
        kind: demo
  - id: CHAR-015-S03
    title: Observer character access shall be denied by default, including party
      overviews, combat detail panels, search results, widgets, and MCP
      responses, unless a specific visible non-character projection is delivered
    requirementIds:
      - CHAR-015
    acceptanceCriteria:
      - Given an observer views shared combat, when character data is requested,
        then no character sheet, private resource, or owner journal data is
        returned.
      - Given a DM projects a visible stat-block summary to observers, when it
        renders, then only the explicitly projected summary fields are
        delivered.
    tasks:
      - id: CHAR-015-S03-T01
        title: Confirm architecture and interface shape for CHAR-015
        kind: design
      - id: CHAR-015-S03-T02
        title: Implement the smallest behavior that satisfies CHAR-015
        kind: implementation
      - id: CHAR-015-S03-T03
        title: Add automated coverage for CHAR-015 acceptance criteria
        kind: test
      - id: CHAR-015-S03-T04
        title: Record demo notes and traceability evidence for CHAR-015
        kind: demo
  - id: CHAR-016-S04
    title: Character journal visibility shall be explicit per entry using canonical
      visibility states and ownership grants, with DM access, owner access,
      other-player filtering, and cross-surface invalidation enforced by the
      data layer
    requirementIds:
      - CHAR-016
    acceptanceCriteria:
      - Given a player creates a journal entry, when no visibility is selected,
        then the entry defaults to `shared` for the owning character's `owner`
        grant and remains DM-auditable.
      - Given the DM changes journal visibility, when sync streams update, then
        affected player caches, search results, graph edges, and widgets are
        invalidated before new content is delivered.
      - Given a journal entry is `shared` with Player A through a viewer-capable
        grant, when Player A and Player B query journals, then only Player A
        receives the entry.
      - Given a journal entry is visible only to the owner, when another player,
        observer, widget, search, graph, or MCP surface requests it, then no
        title, snippet, id, count, or relationship edge is returned.
    tasks:
      - id: CHAR-016-S04-T01
        title: Confirm architecture and interface shape for CHAR-016
        kind: design
      - id: CHAR-016-S04-T02
        title: Implement the smallest behavior that satisfies CHAR-016
        kind: implementation
      - id: CHAR-016-S04-T03
        title: Add automated coverage for CHAR-016 acceptance criteria
        kind: test
      - id: CHAR-016-S04-T04
        title: Record demo notes and traceability evidence for CHAR-016
        kind: demo
testPlan:
  - Run unit tests for domain reducers, command validators, and data transforms
    touched by this epic.
  - Run UI or integration checks for any visible prototype behavior touched by
    this epic.
  - Run `pnpm v2:workpack:validate` before handoff.
demoNotesTemplate:
  - Describe the user-visible path demonstrated.
  - List the requirement IDs exercised by the demo.
  - Record any gaps intentionally deferred out of this epic.
stopConditions:
  - Stop if the v2 stack ADR is missing or contradicts the implementation
    approach.
  - Stop if implementing the epic requires runtime imports from v1 app code.
  - Stop if hidden visibility, permission, sync, or persistence behavior is
    ambiguous.
  - Stop if the generated workpack no longer validates.
completionEvidence:
  - Targeted tests pass.
  - Traceability from requirement IDs to implementation and tests is documented.
  - Demo notes are filled in for visible behavior.
  - Workpack status is updated after completion.

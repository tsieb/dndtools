parallelSafety:
  fileOwnership:
    - apps/v2/perm/
    - docs/planning/v2/
  requiresInterfaceContract: true
  notes: Parallel execution requires explicit interface contracts and
    non-overlapping generated file ownership.
stories:
  - id: PERM-001-S01
    title: The system shall assign every authenticated session participant exactly
      one base role of DM, Player, or Observer and compute their base permission
      floor from that role
    requirementIds:
      - PERM-001
    acceptanceCriteria:
      - Given a participant joins a session, when join succeeds, then the
        participant has exactly one base role.
      - Given an unauthenticated participant requests session data, when
        evaluated, then no anonymous role is inferred and access is denied.
    tasks:
      - id: PERM-001-S01-T01
        title: Confirm architecture and interface shape for PERM-001
        kind: design
      - id: PERM-001-S01-T02
        title: Implement the smallest behavior that satisfies PERM-001
        kind: implementation
      - id: PERM-001-S01-T03
        title: Add automated coverage for PERM-001 acceptance criteria
        kind: test
      - id: PERM-001-S01-T04
        title: Record demo notes and traceability evidence for PERM-001
        kind: demo
  - id: PERM-011-S02
    title: Observer permission computation shall always produce a read-only surface
      with no character data and no write-capable grants, even if stale or
      invalid grant records exist
    requirementIds:
      - PERM-011
    acceptanceCriteria:
      - Given an observer has a stale write-capable grant record, when effective
        permissions are computed, then the write grant is ignored and a
        consistency error is surfaced to the DM.
      - Given an observer requests character data by id, when the query
        resolves, then no character fields are returned.
    tasks:
      - id: PERM-011-S02-T01
        title: Confirm architecture and interface shape for PERM-011
        kind: design
      - id: PERM-011-S02-T02
        title: Implement the smallest behavior that satisfies PERM-011
        kind: implementation
      - id: PERM-011-S02-T03
        title: Add automated coverage for PERM-011 acceptance criteria
        kind: test
      - id: PERM-011-S02-T04
        title: Record demo notes and traceability evidence for PERM-011
        kind: demo

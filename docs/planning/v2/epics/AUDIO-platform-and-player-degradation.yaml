schemaVersion: 1
id: AUDIO-platform-and-player-degradation
title: "AUDIO: Platform and player degradation"
status: active
approved: true
domain: AUDIO
capabilityBranch: Platform and player degradation
objective: Deliver the platform and player degradation capability branch for
  AUDIO, traced to the included v2 requirements.
requirementIds:
  - AUDIO-006
  - AUDIO-007
  - AUDIO-008
  - AUDIO-012
  - AUDIO-013
excludedRequirementIds: []
architectureContracts:
  - "Contract 3: Role, Visibility & Permission Grant Model"
expectedAffectedAreas:
  - apps/v2
  - docs/planning/v2
  - audio model
  - playback surface
dependencies: []
parallelSafety:
  fileOwnership:
    - apps/v2/audio/
    - docs/planning/v2/
  requiresInterfaceContract: true
  notes: Parallel execution requires explicit interface contracts and
    non-overlapping generated file ownership.
stories:
  - id: AUDIO-006-S01
    title: Audio features shall degrade gracefully on platforms that lack audio
      permissions, background playback, output routing, or required local assets
    requirementIds:
      - AUDIO-006
    acceptanceCriteria:
      - Given a mobile browser blocks background playback, when audio sync state
        changes, then the app shows a degraded status rather than retrying
        indefinitely.
      - Given a participant cannot play an audio asset, when the DM inspects
        session status, then the participant's audio delivery state is visible
        without exposing device secrets.
    tasks:
      - id: AUDIO-006-S01-T01
        title: Confirm architecture and interface shape for AUDIO-006
        kind: design
      - id: AUDIO-006-S01-T02
        title: Implement the smallest behavior that satisfies AUDIO-006
        kind: implementation
      - id: AUDIO-006-S01-T03
        title: Add automated coverage for AUDIO-006 acceptance criteria
        kind: test
      - id: AUDIO-006-S01-T04
        title: Record demo notes and traceability evidence for AUDIO-006
        kind: demo
  - id: AUDIO-007-S02
    title: Any release that enables audio shall allow participants to control
      device-local audio consent, mute, output, and volume preferences without
      changing DM-authored session audio state
    requirementIds:
      - AUDIO-007
    acceptanceCriteria:
      - Given a participant declines audio playback, when the DM starts a track,
        then the participant device remains silent and reports consent-blocked
        status.
      - Given a participant changes local volume, when sync state is inspected,
        then authoritative session volume is unchanged.
    tasks:
      - id: AUDIO-007-S02-T01
        title: Confirm architecture and interface shape for AUDIO-007
        kind: design
      - id: AUDIO-007-S02-T02
        title: Implement the smallest behavior that satisfies AUDIO-007
        kind: implementation
      - id: AUDIO-007-S02-T03
        title: Add automated coverage for AUDIO-007 acceptance criteria
        kind: test
      - id: AUDIO-007-S02-T04
        title: Record demo notes and traceability evidence for AUDIO-007
        kind: demo
  - id: AUDIO-008-S03
    title: Any release that enables audio shall make audio visualizers, transitions,
      and state announcements respect reduced motion, live announcement, and
      non-color accessibility requirements
    requirementIds:
      - AUDIO-008
    acceptanceCriteria:
      - Given reduced motion is active, when audio crossfade or visualizer
        effects would animate, then the effects are reduced or disabled
        according to the resolved motion state.
      - Given playback state changes, when announced to assistive technology,
        then announcements are concise and not repeated for high-frequency
        progress updates.
    tasks:
      - id: AUDIO-008-S03-T01
        title: Confirm architecture and interface shape for AUDIO-008
        kind: design
      - id: AUDIO-008-S03-T02
        title: Implement the smallest behavior that satisfies AUDIO-008
        kind: implementation
      - id: AUDIO-008-S03-T03
        title: Add automated coverage for AUDIO-008 acceptance criteria
        kind: test
      - id: AUDIO-008-S03-T04
        title: Record demo notes and traceability evidence for AUDIO-008
        kind: demo
  - id: AUDIO-012-S04
    title: Audio output routing shall use platform-declared capabilities and fall
      back to default output or unavailable-routing status when routing is
      unsupported
    requirementIds:
      - AUDIO-012
    acceptanceCriteria:
      - Given output routing is unsupported on a platform, when playback starts,
        then the app uses default output or reports unavailable routing without
        failing session audio state.
      - Given a participant changes device-local output routing where supported,
        when session audio state syncs, then the route choice remains
        device-local and does not mutate DM-authored playback state.
    tasks:
      - id: AUDIO-012-S04-T01
        title: Confirm architecture and interface shape for AUDIO-012
        kind: design
      - id: AUDIO-012-S04-T02
        title: Implement the smallest behavior that satisfies AUDIO-012
        kind: implementation
      - id: AUDIO-012-S04-T03
        title: Add automated coverage for AUDIO-012 acceptance criteria
        kind: test
      - id: AUDIO-012-S04-T04
        title: Record demo notes and traceability evidence for AUDIO-012
        kind: demo
  - id: AUDIO-013-S05
    title: Audio playback shall enforce performance-safe failure modes so repeated
      failures or excessive resource use degrade audio without blocking other
      session commands
    requirementIds:
      - AUDIO-013
    acceptanceCriteria:
      - Given playback repeatedly fails or consumes excessive resources, when
        safety limits trigger, then the track is stopped or degraded and the DM
        sees diagnostics without blocking other session commands.
      - Given audio is degraded by safety limits, when the DM advances combat,
        rolls dice, or projects a handout, then those session commands remain
        within their configured responsiveness budgets.
    tasks:
      - id: AUDIO-013-S05-T01
        title: Confirm architecture and interface shape for AUDIO-013
        kind: design
      - id: AUDIO-013-S05-T02
        title: Implement the smallest behavior that satisfies AUDIO-013
        kind: implementation
      - id: AUDIO-013-S05-T03
        title: Add automated coverage for AUDIO-013 acceptance criteria
        kind: test
      - id: AUDIO-013-S05-T04
        title: Record demo notes and traceability evidence for AUDIO-013
        kind: demo
qualityBar:
  - "Correctness: every mapped acceptance criterion is implemented or explicitly
    deferred with reviewer-visible evidence."
  - "Architecture integrity: changes obey ADR-014, the architecture contracts,
    package boundaries, and no-v1-runtime-import rules."
  - "Traceability: requirement IDs are tied to code, tests, demo notes, and any
    documentation changes."
  - "Test depth: unit, integration, e2e, boundary, accessibility, performance,
    security, permission, sync, and migration coverage are chosen according to
    risk."
  - "User experience: visible flows are complete, accessible, responsive,
    resilient to empty/error/loading states, and consistent with the design
    system."
  - "Data safety: persistence, offline behavior, sync assumptions, conflict
    handling, actor filtering, and privacy boundaries fail closed."
  - "Maintainability: modules remain cohesive, typed, readable, locally scoped,
    and free of speculative abstractions or unrelated refactors."
  - "Operational quality: diagnostics, metrics, docs, generated files, and
    handoff evidence are current before completion."
gitWorkflow:
  - Start from a clean working tree. Run `git status --short` before editing and
    stop if unrelated changes overlap this epic.
  - Use one branch per epic from the correct base branch, and keep all commits
    scoped to the assigned epic.
  - Never reset, overwrite, or reformat unrelated user changes. Work around
    existing dirty files unless they block the epic.
  - Commit the code, docs, tests, generated workpack updates, and completion
    evidence needed for the epic before handoff.
  - "Leave a clean slate when the epic is complete: no untracked files, no
    unstaged edits, and no stale generated planning diffs caused by the epic."
statusAutomation:
  - Do not hand-edit generated epic packets, `status.yaml`,
    `requirements-index.yaml`, `initiative-map.yaml`, or `parallel-batches.yaml`
    for status changes.
  - Use `pnpm v2:workpack:set-status -- --epic
    AUDIO-platform-and-player-degradation --status active` when implementation
    starts.
  - Create
    `docs/planning/v2/epics/AUDIO-platform-and-player-degradation.completion.md`
    with demo, tests, traceability, gaps, and git evidence before marking
    complete.
  - Use `pnpm v2:workpack:complete -- --epic
    AUDIO-platform-and-player-degradation` to update `workpack-state.yaml` and
    regenerate all derived planning files together.
  - Run `pnpm v2:workpack:validate` after any status or generation command;
    validation fails if generated files drift from the source of truth.
testPlan:
  - Run unit tests for domain reducers, command validators, and data transforms
    touched by this epic.
  - Run UI or integration checks for any visible prototype behavior touched by
    this epic.
  - Run domain-specific quality gates for accessibility, performance, security,
    permissions, sync/offline behavior, migrations, and docs when those areas
    are touched.
  - Run `pnpm v2:workpack:validate` before handoff.
demoNotesTemplate:
  - Describe the user-visible path demonstrated.
  - List the requirement IDs exercised by the demo.
  - Record any gaps intentionally deferred out of this epic.
stopConditions:
  - Stop if the v2 stack ADR is missing or contradicts the implementation
    approach.
  - Stop if implementing the epic requires runtime imports from v1 app code.
  - Stop if hidden visibility, permission, sync, or persistence behavior is
    ambiguous.
  - Stop if the generated workpack no longer validates.
  - Stop if `git status --short` shows unrelated changes that overlap the files
    this epic needs.
completionEvidence:
  - Targeted tests pass.
  - Traceability from requirement IDs to implementation and tests is documented.
  - Demo notes are filled in for visible behavior.
  - Quality review covers correctness, architecture, security, permissions,
    accessibility, performance, persistence, sync/offline assumptions,
    maintainability, UX polish, and documentation.
  - Completion evidence file records demo path, tests run, changed files,
    requirement coverage, known gaps, git branch, commit or PR, and final `git
    status --short` output.
  - Workpack status is updated with the programmatic complete command after
    completion evidence exists.
  - The epic leaves a clean git slate with no untracked or unstaged files caused
    by the work.

stories:
  - id: CHAR-007-S01
    title: A character owner or combat participant shall be able to update combat
      resources such as HP, temporary HP, conditions, death saves, spell slots,
      class resources, and concentration during a session
    requirementIds:
      - CHAR-007
    acceptanceCriteria:
      - Given a player has `combat-participant` on a sidekick, when they update
        HP, then the command is accepted and shared combat widgets refresh.
      - Given the same player attempts to change the sidekick's name, when they
        submit the command, then it is rejected.
    tasks:
      - id: CHAR-007-S01-T01
        title: Confirm architecture and interface shape for CHAR-007
        kind: design
      - id: CHAR-007-S01-T02
        title: Implement the smallest behavior that satisfies CHAR-007
        kind: implementation
      - id: CHAR-007-S01-T03
        title: Add automated coverage for CHAR-007 acceptance criteria
        kind: test
      - id: CHAR-007-S01-T04
        title: Record demo notes and traceability evidence for CHAR-007
        kind: demo
  - id: CHAR-008-S02
    title: A character owner shall be able to manage spells, prepared spells, slots,
      class resources, rest recovery, and expenditure history as structured
      character state
    requirementIds:
      - CHAR-008
    acceptanceCriteria:
      - Given a spellcaster has available slots, when the owner casts a spell,
        then the appropriate slot/resource state changes and history records the
        command.
      - Given a rest command applies recovery rules, when accepted, then
        resources reset according to character data and rule configuration.
    tasks:
      - id: CHAR-008-S02-T01
        title: Confirm architecture and interface shape for CHAR-008
        kind: design
      - id: CHAR-008-S02-T02
        title: Implement the smallest behavior that satisfies CHAR-008
        kind: implementation
      - id: CHAR-008-S02-T03
        title: Add automated coverage for CHAR-008 acceptance criteria
        kind: test
      - id: CHAR-008-S02-T04
        title: Record demo notes and traceability evidence for CHAR-008
        kind: demo
  - id: CHAR-009-S03
    title: A character owner shall be able to complete level-up or advancement flows
      using XP or milestone modes with validation before the character revision
      is finalized
    requirementIds:
      - CHAR-009
    acceptanceCriteria:
      - Given a character is eligible for level-up, when the owner selects class
        options, then invalid or incomplete choices block finalization.
      - Given the DM reviews a level-up, when they approve or edit it, then the
        resulting revision is attributed and synced.
      - Given advancement is in progress offline with cached rules, when the app
        restarts, then the pending advancement draft and validation state are
        restored.
    tasks:
      - id: CHAR-009-S03-T01
        title: Confirm architecture and interface shape for CHAR-009
        kind: design
      - id: CHAR-009-S03-T02
        title: Implement the smallest behavior that satisfies CHAR-009
        kind: implementation
      - id: CHAR-009-S03-T03
        title: Add automated coverage for CHAR-009 acceptance criteria
        kind: test
      - id: CHAR-009-S03-T04
        title: Record demo notes and traceability evidence for CHAR-009
        kind: demo
qualityBar:
  - "Correctness: every mapped acceptance criterion is implemented or explicitly
    deferred with reviewer-visible evidence."
  - "Architecture integrity: changes obey ADR-014, the architecture contracts,
    package boundaries, and no-v1-runtime-import rules."
  - "Traceability: requirement IDs are tied to code, tests, demo notes, and any
    documentation changes."
  - "Test depth: unit, integration, e2e, boundary, accessibility, performance,
    security, permission, sync, and migration coverage are chosen according to
    risk."
  - "User experience: visible flows are complete, accessible, responsive,
    resilient to empty/error/loading states, and consistent with the design
    system."
  - "Data safety: persistence, offline behavior, sync assumptions, conflict
    handling, actor filtering, and privacy boundaries fail closed."
  - "Maintainability: modules remain cohesive, typed, readable, locally scoped,
    and free of speculative abstractions or unrelated refactors."
  - "Operational quality: diagnostics, metrics, docs, generated files, and
    handoff evidence are current before completion."
gitWorkflow:
  - Start from a clean working tree. Run `git status --short` before editing and
    stop if unrelated changes overlap this epic.
  - Use one branch per epic from the correct base branch, and keep all commits
    scoped to the assigned epic.
  - Never reset, overwrite, or reformat unrelated user changes. Work around
    existing dirty files unless they block the epic.
  - Commit the code, docs, tests, generated workpack updates, and completion
    evidence needed for the epic before handoff.
  - "Leave a clean slate when the epic is complete: no untracked files, no
    unstaged edits, and no stale generated planning diffs caused by the epic."
statusAutomation:
  - Do not hand-edit generated epic packets, `status.yaml`,
    `requirements-index.yaml`, `initiative-map.yaml`, or `parallel-batches.yaml`
    for status changes.
  - Use `pnpm workpack:set-status -- --epic
    CHAR-combat-resources-and-advancement --status active` when implementation
    starts.
  - Create
    `docs/planning/v2/epics/CHAR-combat-resources-and-advancement.completion.md`
    with demo, tests, traceability, gaps, and git evidence before marking
    complete.
  - Use `pnpm workpack:complete -- --epic CHAR-combat-resources-and-advancement`
    to update `workpack-state.yaml` and regenerate all derived planning files
    together.
  - Run `pnpm workpack:validate` after any status or generation command;
    validation fails if generated files drift from the source of truth.
testPlan:
  - Run unit tests for domain reducers, command validators, and data transforms
    touched by this epic.
  - Run UI or integration checks for any visible prototype behavior touched by
    this epic.
  - Run domain-specific quality gates for accessibility, performance, security,
    permissions, sync/offline behavior, migrations, and docs when those areas
    are touched.
  - Run `pnpm workpack:validate` before handoff.
demoNotesTemplate:
  - Describe the user-visible path demonstrated.
  - List the requirement IDs exercised by the demo.
  - Record any gaps intentionally deferred out of this epic.
stopConditions:
  - Stop if the v2 stack ADR is missing or contradicts the implementation
    approach.
  - Stop if implementing the epic requires runtime imports from v1 app code.
  - Stop if hidden visibility, permission, sync, or persistence behavior is
    ambiguous.
  - Stop if the generated workpack no longer validates.
  - Stop if `git status --short` shows unrelated changes that overlap the files
    this epic needs.
completionEvidence:
  - Targeted tests pass.
  - Traceability from requirement IDs to implementation and tests is documented.
  - Demo notes are filled in for visible behavior.
  - Quality review covers correctness, architecture, security, permissions,
    accessibility, performance, persistence, sync/offline assumptions,
    maintainability, UX polish, and documentation.
  - Completion evidence file records demo path, tests run, changed files,
    requirement coverage, known gaps, git branch, commit or PR, and final `git
    status --short` output.
  - Workpack status is updated with the programmatic complete command after
    completion evidence exists.
  - The epic leaves a clean git slate with no untracked or unstaged files caused
    by the work.
completionEvidenceFile: docs/planning/v2/epics/CHAR-combat-resources-and-advancement.completion.md

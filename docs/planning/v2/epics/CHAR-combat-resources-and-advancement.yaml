schemaVersion: 1
id: CHAR-combat-resources-and-advancement
title: 'CHAR: Combat, resources, and advancement'
status: proposed
approved: false
domain: CHAR
capabilityBranch: Combat, resources, and advancement
objective: Deliver the combat, resources, and advancement capability branch for
  CHAR, traced to the included v2 requirements.
requirementIds:
  - CHAR-007
  - CHAR-008
  - CHAR-009
excludedRequirementIds: []
architectureContracts: []
expectedAffectedAreas:
  - apps/v2
  - docs/planning/v2
  - character model
  - character UI
dependencies: []
parallelSafety:
  fileOwnership:
    - apps/v2/char/
    - docs/planning/v2/
  requiresInterfaceContract: true
  notes: Parallel execution requires explicit interface contracts and
    non-overlapping generated file ownership.
stories:
  - id: CHAR-007-S01
    title: A character owner or combat participant shall be able to update combat
      resources such as HP, temporary HP, conditions, death saves, spell slots,
      class resources, and concentration during a session
    requirementIds:
      - CHAR-007
    acceptanceCriteria:
      - Given a player has `combat-participant` on a sidekick, when they update
        HP, then the command is accepted and shared combat widgets refresh.
      - Given the same player attempts to change the sidekick's name, when they
        submit the command, then it is rejected.
    tasks:
      - id: CHAR-007-S01-T01
        title: Confirm architecture and interface shape for CHAR-007
        kind: design
      - id: CHAR-007-S01-T02
        title: Implement the smallest behavior that satisfies CHAR-007
        kind: implementation
      - id: CHAR-007-S01-T03
        title: Add automated coverage for CHAR-007 acceptance criteria
        kind: test
      - id: CHAR-007-S01-T04
        title: Record demo notes and traceability evidence for CHAR-007
        kind: demo
  - id: CHAR-008-S02
    title: A character owner shall be able to manage spells, prepared spells, slots,
      class resources, rest recovery, and expenditure history as structured
      character state
    requirementIds:
      - CHAR-008
    acceptanceCriteria:
      - Given a spellcaster has available slots, when the owner casts a spell,
        then the appropriate slot/resource state changes and history records the
        command.
      - Given a rest command applies recovery rules, when accepted, then
        resources reset according to character data and rule configuration.
    tasks:
      - id: CHAR-008-S02-T01
        title: Confirm architecture and interface shape for CHAR-008
        kind: design
      - id: CHAR-008-S02-T02
        title: Implement the smallest behavior that satisfies CHAR-008
        kind: implementation
      - id: CHAR-008-S02-T03
        title: Add automated coverage for CHAR-008 acceptance criteria
        kind: test
      - id: CHAR-008-S02-T04
        title: Record demo notes and traceability evidence for CHAR-008
        kind: demo
  - id: CHAR-009-S03
    title: A character owner shall be able to complete level-up or advancement flows
      using XP or milestone modes with validation before the character revision
      is finalized
    requirementIds:
      - CHAR-009
    acceptanceCriteria:
      - Given a character is eligible for level-up, when the owner selects class
        options, then invalid or incomplete choices block finalization.
      - Given the DM reviews a level-up, when they approve or edit it, then the
        resulting revision is attributed and synced.
      - Given advancement is in progress offline with cached rules, when the app
        restarts, then the pending advancement draft and validation state are
        restored.
    tasks:
      - id: CHAR-009-S03-T01
        title: Confirm architecture and interface shape for CHAR-009
        kind: design
      - id: CHAR-009-S03-T02
        title: Implement the smallest behavior that satisfies CHAR-009
        kind: implementation
      - id: CHAR-009-S03-T03
        title: Add automated coverage for CHAR-009 acceptance criteria
        kind: test
      - id: CHAR-009-S03-T04
        title: Record demo notes and traceability evidence for CHAR-009
        kind: demo
testPlan:
  - Run unit tests for domain reducers, command validators, and data transforms
    touched by this epic.
  - Run UI or integration checks for any visible prototype behavior touched by
    this epic.
  - Run `pnpm v2:workpack:validate` before handoff.
demoNotesTemplate:
  - Describe the user-visible path demonstrated.
  - List the requirement IDs exercised by the demo.
  - Record any gaps intentionally deferred out of this epic.
stopConditions:
  - Stop if the v2 stack ADR is missing or contradicts the implementation
    approach.
  - Stop if implementing the epic requires runtime imports from v1 app code.
  - Stop if hidden visibility, permission, sync, or persistence behavior is
    ambiguous.
  - Stop if the generated workpack no longer validates.
completionEvidence:
  - Targeted tests pass.
  - Traceability from requirement IDs to implementation and tests is documented.
  - Demo notes are filled in for visible behavior.
  - Workpack status is updated after completion.

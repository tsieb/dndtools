schemaVersion: 1
id: PERF-budget-ownership-and-measurement
title: 'PERF: Budget ownership and measurement'
status: approved
approved: true
domain: PERF
capabilityBranch: Budget ownership and measurement
objective: Deliver the budget ownership and measurement capability branch for
  PERF, traced to the included v2 requirements.
requirementIds:
  - PERF-001
  - PERF-007
excludedRequirementIds: []
architectureContracts:
  - 'Contract 1: Processing / Display Decoupling'
  - 'Contract 2: Cloud Sync & Offline Model'
  - 'Contract 4: Scene and Widget Contract'
expectedAffectedAreas:
  - apps/v2
  - docs/planning/v2
  - performance budgets
  - measurement
dependencies: []
parallelSafety:
  fileOwnership:
    - apps/v2/perf/
    - docs/planning/v2/
  requiresInterfaceContract: true
  notes: Parallel execution requires explicit interface contracts and
    non-overlapping generated file ownership.
stories:
  - id: PERF-001-S01
    title: The system shall define measurable performance budgets for startup, vault
      open, Scene render, widget update, map pan/zoom, graph indexing, search,
      sync reconciliation, and test suite tiers before feature implementation
    requirementIds:
      - PERF-001
    acceptanceCriteria:
      - Given a new feature domain starts implementation, when planning is
        reviewed, then relevant budgets and measurement method exist.
      - Given a budget is exceeded in CI or profiling, when reported, then the
        owning domain and user-facing risk are identified.
      - Given initial v2 budgets are reviewed, when no measured baseline exists
        yet, then provisional targets are declared with dataset, device class,
        and review date rather than left as "fast enough".
    tasks:
      - id: PERF-001-S01-T01
        title: Confirm architecture and interface shape for PERF-001
        kind: design
      - id: PERF-001-S01-T02
        title: Implement the smallest behavior that satisfies PERF-001
        kind: implementation
      - id: PERF-001-S01-T03
        title: Add automated coverage for PERF-001 acceptance criteria
        kind: test
      - id: PERF-001-S01-T04
        title: Record demo notes and traceability evidence for PERF-001
        kind: demo
  - id: PERF-007-S02
    title: Initial v2 performance budgets shall include concrete provisional
      thresholds for smoke CI, startup, vault open, Scene first render, widget
      update, map pan/zoom, search, graph indexing, and sync reconciliation
    requirementIds:
      - PERF-007
    acceptanceCriteria:
      - Given the smoke CI path runs on supported CI hardware, when measured,
        then it completes in under three minutes or has an approved temporary
        exception.
      - Given startup, vault open, Scene render, map pan/zoom, search, graph
        indexing, or sync reconciliation benchmarks run, then each reports
        pass/fail against a named target, fixture size, and platform profile.
    tasks:
      - id: PERF-007-S02-T01
        title: Confirm architecture and interface shape for PERF-007
        kind: design
      - id: PERF-007-S02-T02
        title: Implement the smallest behavior that satisfies PERF-007
        kind: implementation
      - id: PERF-007-S02-T03
        title: Add automated coverage for PERF-007 acceptance criteria
        kind: test
      - id: PERF-007-S02-T04
        title: Record demo notes and traceability evidence for PERF-007
        kind: demo
testPlan:
  - Run unit tests for domain reducers, command validators, and data transforms
    touched by this epic.
  - Run UI or integration checks for any visible prototype behavior touched by
    this epic.
  - Run `pnpm v2:workpack:validate` before handoff.
demoNotesTemplate:
  - Describe the user-visible path demonstrated.
  - List the requirement IDs exercised by the demo.
  - Record any gaps intentionally deferred out of this epic.
stopConditions:
  - Stop if the v2 stack ADR is missing or contradicts the implementation
    approach.
  - Stop if implementing the epic requires runtime imports from v1 app code.
  - Stop if hidden visibility, permission, sync, or persistence behavior is
    ambiguous.
  - Stop if the generated workpack no longer validates.
completionEvidence:
  - Targeted tests pass.
  - Traceability from requirement IDs to implementation and tests is documented.
  - Demo notes are filled in for visible behavior.
  - Workpack status is updated after completion.

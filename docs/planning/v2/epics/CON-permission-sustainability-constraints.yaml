    title: The system must never allow per-instance raw field-list grants to replace
      schema-defined capability sets for player permissions
    requirementIds:
      - CON-004
    acceptanceCriteria:
      - Given a grant command contains a raw field list, when validated, then it
        is rejected.
      - Given the DM needs a new permission grouping, when supported, then it is
        added as a named schema-defined capability set for that entity type.

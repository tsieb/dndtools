schemaVersion: 1
id: SYNC-cloud-device-local-storage
title: "SYNC: Cloud/device-local storage"
status: complete
approved: true
domain: SYNC
capabilityBranch: Cloud/device-local storage
objective: Deliver the cloud/device-local storage capability branch for SYNC,
  traced to the included v2 requirements.
requirementIds:
  - SYNC-007
  - SYNC-008
  - SYNC-017
excludedRequirementIds: []
architectureContracts:
  - "Contract 2: Cloud Sync & Offline Model"
  - "Contract 3: Role, Visibility & Permission Grant Model"
expectedAffectedAreas:
  - apps/gm
  - docs/planning/v2
  - sync engine
  - source adapters
dependencies: []
parallelSafety:
  fileOwnership:
    - apps/gm/sync/
    - docs/planning/v2/
  requiresInterfaceContract: true
  notes: Parallel execution requires explicit interface contracts and
    non-overlapping generated file ownership.
stories:
  - id: SYNC-007-S01
    title: The system shall store cloud-enabled vault identity, durable operation
      logs, compacted snapshots, collaboration session state, permission
      metadata, assets, and conflict records in cloud storage only when cloud
      sync is enabled for the vault
    requirementIds:
      - SYNC-007
    acceptanceCriteria:
      - Given cloud sync is disabled, when local writes occur, then no cloud
        storage writes are attempted.
      - Given cloud sync is enabled, when operations are compacted, then
        snapshots and operation history retain enough data for sync and
        recovery.
    tasks:
      - id: SYNC-007-S01-T01
        title: Confirm architecture and interface shape for SYNC-007
        kind: design
      - id: SYNC-007-S01-T02
        title: Implement the smallest behavior that satisfies SYNC-007
        kind: implementation
      - id: SYNC-007-S01-T03
        title: Add automated coverage for SYNC-007 acceptance criteria
        kind: test
      - id: SYNC-007-S01-T04
        title: Record demo notes and traceability evidence for SYNC-007
        kind: demo
  - id: SYNC-008-S02
    title: The system shall keep auth refresh tokens, OS credential records, raw
      absolute paths, rebuildable indexes, presence, local diagnostics, and
      temporary UI state device-local unless explicitly exported by the user
    requirementIds:
      - SYNC-008
    acceptanceCriteria:
      - Given a cloud sync payload is generated, when inspected, then it
        contains no raw absolute filesystem paths or auth refresh tokens.
      - Given a user exports diagnostics, when export is requested, then the
        user receives an explicit action and generated bundle rather than
        automatic cloud upload.
    tasks:
      - id: SYNC-008-S02-T01
        title: Confirm architecture and interface shape for SYNC-008
        kind: design
      - id: SYNC-008-S02-T02
        title: Implement the smallest behavior that satisfies SYNC-008
        kind: implementation
      - id: SYNC-008-S02-T03
        title: Add automated coverage for SYNC-008 acceptance criteria
        kind: test
      - id: SYNC-008-S02-T04
        title: Record demo notes and traceability evidence for SYNC-008
        kind: demo
  - id: SYNC-017-S03
    title: Cloud sync payloads and stored cloud artifacts shall follow the
      release-approved encryption, key custody, rotation, and recovery model for
      the vault before cloud sync can be enabled
    requirementIds:
      - SYNC-017
    acceptanceCriteria:
      - Given cloud sync is enabled for a vault, when sync payloads are
        generated, then encryption at rest, encryption in transit, key owner,
        and recovery mode match the approved cloud security decision record.
      - Given a participant or device key is revoked, when future sync payloads
        are generated, then the revoked key can no longer decrypt newly
        authorized cloud artifacts.
      - Given key recovery is unavailable or intentionally unsupported, when a
        user attempts recovery, then the app reports the approved recovery
        limitation without weakening encryption or exposing other vaults.
    tasks:
      - id: SYNC-017-S03-T01
        title: Confirm architecture and interface shape for SYNC-017
        kind: design
      - id: SYNC-017-S03-T02
        title: Implement the smallest behavior that satisfies SYNC-017
        kind: implementation
      - id: SYNC-017-S03-T03
        title: Add automated coverage for SYNC-017 acceptance criteria
        kind: test
      - id: SYNC-017-S03-T04
        title: Record demo notes and traceability evidence for SYNC-017
        kind: demo
qualityBar:
  - "Correctness: every mapped acceptance criterion is implemented or explicitly
    deferred with reviewer-visible evidence."
  - "Architecture integrity: changes obey ADR-014, the architecture contracts,
    package boundaries, and no-v1-runtime-import rules."
  - "Traceability: requirement IDs are tied to code, tests, demo notes, and any
    documentation changes."
  - "Test depth: unit, integration, e2e, boundary, accessibility, performance,
    security, permission, sync, and migration coverage are chosen according to
    risk."
  - "User experience: visible flows are complete, accessible, responsive,
    resilient to empty/error/loading states, and consistent with the design
    system."
  - "Data safety: persistence, offline behavior, sync assumptions, conflict
    handling, actor filtering, and privacy boundaries fail closed."
  - "Maintainability: modules remain cohesive, typed, readable, locally scoped,
    and free of speculative abstractions or unrelated refactors."
  - "Operational quality: diagnostics, metrics, docs, generated files, and
    handoff evidence are current before completion."
gitWorkflow:
  - Start from a clean working tree. Run `git status --short` before editing and
    stop if unrelated changes overlap this epic.
  - Use one branch per epic from the correct base branch, and keep all commits
    scoped to the assigned epic.
  - Never reset, overwrite, or reformat unrelated user changes. Work around
    existing dirty files unless they block the epic.
  - Commit the code, docs, tests, generated workpack updates, and completion
    evidence needed for the epic before handoff.
  - "Leave a clean slate when the epic is complete: no untracked files, no
    unstaged edits, and no stale generated planning diffs caused by the epic."
statusAutomation:
  - Do not hand-edit generated epic packets, `status.yaml`,
    `requirements-index.yaml`, `initiative-map.yaml`, or `parallel-batches.yaml`
    for status changes.
  - Use `pnpm workpack:set-status -- --epic SYNC-cloud-device-local-storage
    --status active` when implementation starts.
  - Create
    `docs/planning/v2/epics/SYNC-cloud-device-local-storage.completion.md` with
    demo, tests, traceability, gaps, and git evidence before marking complete.
  - Use `pnpm workpack:complete -- --epic SYNC-cloud-device-local-storage` to
    update `workpack-state.yaml` and regenerate all derived planning files
    together.
  - Run `pnpm workpack:validate` after any status or generation command;
    validation fails if generated files drift from the source of truth.
testPlan:
  - Run unit tests for domain reducers, command validators, and data transforms
    touched by this epic.
  - Run UI or integration checks for any visible prototype behavior touched by
    this epic.
  - Run domain-specific quality gates for accessibility, performance, security,
    permissions, sync/offline behavior, migrations, and docs when those areas
    are touched.
  - Run `pnpm workpack:validate` before handoff.
demoNotesTemplate:
  - Describe the user-visible path demonstrated.
  - List the requirement IDs exercised by the demo.
  - Record any gaps intentionally deferred out of this epic.
stopConditions:
  - Stop if the v2 stack ADR is missing or contradicts the implementation
    approach.
  - Stop if implementing the epic requires runtime imports from v1 app code.
  - Stop if hidden visibility, permission, sync, or persistence behavior is
    ambiguous.
  - Stop if the generated workpack no longer validates.
  - Stop if `git status --short` shows unrelated changes that overlap the files
    this epic needs.
completionEvidence:
  - Targeted tests pass.
  - Traceability from requirement IDs to implementation and tests is documented.
  - Demo notes are filled in for visible behavior.
  - Quality review covers correctness, architecture, security, permissions,
    accessibility, performance, persistence, sync/offline assumptions,
    maintainability, UX polish, and documentation.
  - Completion evidence file records demo path, tests run, changed files,
    requirement coverage, known gaps, git branch, commit or PR, and final `git
    status --short` output.
  - Workpack status is updated with the programmatic complete command after
    completion evidence exists.
  - The epic leaves a clean git slate with no untracked or unstaged files caused
    by the work.
completionEvidenceFile: docs/planning/v2/epics/SYNC-cloud-device-local-storage.completion.md

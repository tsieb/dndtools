  - id: CANVAS-widget-data-safety
    status: complete
    completionEvidenceFile: docs/planning/v2/epics/CANVAS-widget-data-safety.completion.md
  - id: CANVAS-widget-lifecycle
    status: complete
    completionEvidenceFile: docs/planning/v2/epics/CANVAS-widget-lifecycle.completion.md
  - id: CMD-home-scene
    status: complete

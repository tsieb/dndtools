- region "Add widget":
    - heading "Add widget" [level=3]
    - button "Close"
    - searchbox "Search widgets"
    - group "Filter by category":
        - button "All" [pressed]
        - button "Atmosphere"
        - button "Characters"
        - button "Combat"
        - button "Dice & Timers"
        - button "Maps"
        - button "Notes"
        - button "Reference"
    - group "Make something new":
        - button "Generate with assistant": Generate with assistant Describe it, then review the draft before anything is installed.
        - button "Build your own": Build your own Design a tile from scratch in the widget builder.
    - status: 10 widgets shown
    - list "Widget library":
        - listitem:
            - text: Audio Atmosphere Ambient audio playback controls.
            - button "Audio"
        - listitem:
            - text: Character Characters A character stat block (HP, AC, abilities).
            - button "Character"
        - listitem:
            - text: Dice Dice & Timers Quick-roll buttons that record rolls to the session.
            - button "Dice"
        - listitem:
            - text: Handout Reference A shareable handout message.
            - button "Handout"
        - listitem:
            - text: Initiative Tracker Combat The live turn order with round and active turn.
            - button "Initiative Tracker"
        - listitem:
            - text: Map Maps A bound map with its visible layers.
            - button "Map"
        - listitem:
            - text: Note Notes A free-text note rendered inline on the canvas.
            - button "Note"
        - listitem:
            - text: Prep Reference A checklist of prep notes for the session.
            - button "Prep"
        - listitem:
            - text: Quick Reference Reference A compact table of reference content.
            - button "Quick Reference"
        - listitem:
            - text: Timer Dice & Timers A session countdown with start/pause/advance controls.
            - button "Timer"

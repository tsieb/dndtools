AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  dndtools web-hosting stack — serves the built gm-react SPA (apps/gm-react `dist/`)
  from a PRIVATE, encrypted S3 bucket fronted by CloudFront with Origin Access Control
  (the bucket is never public; only this distribution can read it). A CloudFront
  Response Headers Policy attaches a Content-Security-Policy that MIRRORS the Electron
  shell's `connect-src` (Cognito + API Gateway https/wss in this region) plus the usual
  hardening headers (HSTS, no-sniff, frame-deny). Scale-to-zero and effectively $0 idle:
  S3 + CloudFront bill per request/GB only. The custom domain is OPTIONAL and entirely
  parameter-driven (PrimaryHostName / SecondaryHostName / WebCertificateArn / HostedZoneId):
  supply all four and the stack attaches the aliases, the us-east-1 certificate from the
  edge-cert stack, Route53 alias records, and a canonical-host redirect; leave them blank
  and it serves on the default *.cloudfront.net certificate exactly as before.
  Cross-stack values are published to SSM for the CI deploy/upload step (no ImportValue).

Parameters:
  ProjectName:
    Type: String
    Default: dndtools
  Stage:
    Type: String
    Default: dev
    AllowedValues: [dev, prod]
  AiConnectSources:
    Type: String
    Default: 'https://api.anthropic.com https://api.openai.com'
    AllowedPattern: '^https://[A-Za-z0-9.-]+(?::[0-9]{1,5})?(?: https://[A-Za-z0-9.-]+(?::[0-9]{1,5})?)*$'
    Description: >-
      Space-separated HTTPS origins approved for browser AI API calls. Keep this
      identical to the VITE_AI_ALLOWED_ORIGINS value published below.

  # --- Custom domain (all four default to '' = keep the *.cloudfront.net behaviour) ----
  # These are deliberately parameters rather than hardcoded hostnames: the domain is
  # expected to change (lamplight.click now, lamplight.run later), and a rename must be a
  # parameter flip plus a certificate revalidation, never a template rewrite.
  PrimaryHostName:
    Type: String
    Default: ''
    AllowedPattern: '^$|^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+$'
    Description: >-
      Canonical hostname this stage serves on, e.g. lamplight.click (prod) or
      dev.lamplight.click (dev). Blank keeps the default CloudFront domain.
  SecondaryHostName:
    Type: String
    Default: ''
    AllowedPattern: '^$|^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+$'
    Description: >-
      Additional hostname served by the same distribution and permanently redirected to
      PrimaryHostName, e.g. www.lamplight.click. Blank for stages that need only one name.
  WebCertificateArn:
    Type: String
    Default: ''
    AllowedPattern: '^$|^arn:aws:acm:us-east-1:[0-9]{12}:certificate/[0-9a-f-]+$'
    Description: >-
      ACM certificate covering both hostnames. MUST be issued in us-east-1 (a CloudFront
      constraint) — the pattern enforces that, because a certificate from any other region
      is accepted by CloudFormation and then silently rejected by CloudFront. Output of the
      edge-cert stack; passed across regions as a parameter since SSM cannot be read
      cross-region.
  HostedZoneId:
    Type: String
    Default: ''
    Description: Route53 zone that owns the hostnames above; alias records are written here.

Conditions:
  # A custom domain is only wired up when the hostname, its certificate, and the zone to
  # publish records into are ALL present. Any subset would produce a half-configured
  # distribution — aliases without a certificate fail outright, records without aliases
  # resolve to a distribution that answers every request with a 403.
  HasCustomDomain: !And
    - !Not [!Equals [!Ref PrimaryHostName, '']]
    - !Not [!Equals [!Ref WebCertificateArn, '']]
    - !Not [!Equals [!Ref HostedZoneId, '']]
  HasSecondaryHost: !And
    - !Condition HasCustomDomain
    - !Not [!Equals [!Ref SecondaryHostName, '']]

Resources:
  # --- Private origin bucket: holds dist/ assets; only CloudFront (OAC) may read. -----
  # Versioned so a bad deploy can be rolled back; noncurrent versions expire in 30 days
  # to keep storage cost near zero.
  WebBucket:
    Type: AWS::S3::Bucket
    Properties:
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: expire-old-noncurrent-versions
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 30
          - Id: remove-expired-delete-markers
            Status: Enabled
            ExpiredObjectDeleteMarker: true
          - Id: abort-incomplete-multipart
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7

  # --- Origin Access Control: CloudFront signs (SigV4) its reads to the S3 origin, so
  # the bucket can stay fully private (no public ACLs, no legacy OAI). -----------------
  WebOac:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${ProjectName}-${Stage}-web-oac'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # --- Response Headers Policy: the web CSP + hardening headers. ----------------------
  # The CSP `connect-src` MUST stay in sync with the Electron shell
  # (apps/gm-react/electron/main.cjs). The pre-paint preferences live in the
  # same-origin /prepaint.js, so script-src needs no unsafe-inline. style-src keeps
  # unsafe-inline because React uses style props. `connect-src` allows the app plus
  # Cognito (SRP) and the EXACT API Gateway ids deployed for this stage (not another
  # account's API in the same region), the Open5e compendium API, and Google Docs.
  # Google Identity Services loads its script/frame from accounts.google.com and exchanges tokens
  # with Google over the explicitly listed origins. Fonts are self-hosted (@fontsource),
  # so `font-src 'self' data:` (no external font host).
  WebHeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub '${ProjectName}-${Stage}-web-headers'
        Comment: CSP + security headers for the gm-react SPA (mirrors the Electron CSP).
        SecurityHeadersConfig:
          ContentSecurityPolicy:
            Override: true
            ContentSecurityPolicy: !Sub >-
              default-src 'self'; base-uri 'self'; object-src 'none';
              frame-ancestors 'none'; form-action 'self';
              script-src 'self' https://accounts.google.com; style-src 'self' 'unsafe-inline';
              img-src 'self' data: blob: https:; media-src 'self' data: blob: https:;
              font-src 'self' data:; worker-src 'self' blob:;
              frame-src https://accounts.google.com;
              connect-src 'self' https://cognito-idp.${AWS::Region}.amazonaws.com
              https://{{resolve:ssm:/${ProjectName}/${Stage}/sync/api-id}}.execute-api.${AWS::Region}.amazonaws.com
              https://{{resolve:ssm:/${ProjectName}/${Stage}/app-api/api-id}}.execute-api.${AWS::Region}.amazonaws.com
              wss://{{resolve:ssm:/${ProjectName}/${Stage}/signaling/api-id}}.execute-api.${AWS::Region}.amazonaws.com
              https://api.open5e.com https://docs.googleapis.com https://accounts.google.com
              https://oauth2.googleapis.com ${AiConnectSources}
          StrictTransportSecurity:
            Override: true
            AccessControlMaxAgeSec: 31536000
            IncludeSubdomains: true
            Preload: true
          ContentTypeOptions:
            Override: true
          FrameOptions:
            Override: true
            FrameOption: DENY
          ReferrerPolicy:
            Override: true
            # User-authored remote scene/audio URLs are allowed on web. Never disclose even the hosted
            # app origin to those third-party media hosts.
            ReferrerPolicy: no-referrer
          XSSProtection:
            Override: true
            Protection: true
            ModeBlock: true

  # --- CloudFront distribution: HTTPS-only, compressed, cheapest price class. ---------
  # HashRouter (`base: './'`) means every real request is `/`, `/index.html`, or
  # `/assets/…` — there is no server-side route rewrite to configure. PriceClass_100
  # (NA + EU edges) is the cheapest tier; raise it only if latency elsewhere matters.
  WebDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub '${ProjectName}-${Stage} gm-react SPA'
        DefaultRootObject: index.html
        HttpVersion: http2and3
        PriceClass: PriceClass_100
        Aliases: !If
          - HasCustomDomain
          - !If
            - HasSecondaryHost
            - [!Ref PrimaryHostName, !Ref SecondaryHostName]
            - [!Ref PrimaryHostName]
          - !Ref 'AWS::NoValue'
        Origins:
          - Id: web-s3-origin
            DomainName: !GetAtt WebBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt WebOac.Id
            S3OriginConfig:
              OriginAccessIdentity: '' # empty: OAC (above) supersedes the legacy OAI
        DefaultCacheBehavior:
          TargetOriginId: web-s3-origin
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          # AWS-managed CachingOptimized policy (long-lived cache, gzip/br).
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          ResponseHeadersPolicyId: !Ref WebHeadersPolicy
          FunctionAssociations: !If
            - HasSecondaryHost
            - - EventType: viewer-request
                FunctionARN: !GetAtt CanonicalHostFunction.FunctionMetadata.FunctionARN
            - !Ref 'AWS::NoValue'
        # Without a domain the distribution keeps CloudFront's own certificate. With one, SNI
        # (not a dedicated IP) and a floor of TLS 1.2 — TLSv1.2_2021 is the strongest policy
        # that does not drop real browsers.
        ViewerCertificate: !If
          - HasCustomDomain
          - AcmCertificateArn: !Ref WebCertificateArn
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2021
          - CloudFrontDefaultCertificate: true

  # --- Canonicalisation: one URL per page. --------------------------------------------
  # Both hostnames are aliases of the SAME distribution, so without this every page would
  # answer 200 on two origins — split caches, duplicate indexing, and OAuth/CORS allowlists
  # that have to name both. A viewer-request function is the cheapest correct fix (no origin
  # round trip, no second distribution): it 301s the secondary host to the primary and lets
  # everything else fall through untouched.
  # The path and query are preserved; the fragment never reaches the server, so HashRouter
  # routes survive the redirect client-side.
  CanonicalHostFunction:
    Type: AWS::CloudFront::Function
    Condition: HasSecondaryHost
    Properties:
      Name: !Sub '${ProjectName}-${Stage}-canonical-host'
      AutoPublish: true
      FunctionConfig:
        Comment: !Sub 'Permanent redirect ${SecondaryHostName} -> ${PrimaryHostName}'
        Runtime: cloudfront-js-2.0
      FunctionCode: !Sub |
        function handler(event) {
          var request = event.request;
          var host = request.headers.host && request.headers.host.value;
          if (host !== '${SecondaryHostName}') return request;
          var qs = [];
          for (var key in request.querystring) {
            var q = request.querystring[key];
            if (q.multiValue) {
              for (var i = 0; i < q.multiValue.length; i++) {
                qs.push(encodeURIComponent(key) + '=' + encodeURIComponent(q.multiValue[i].value));
              }
            } else if (q.value) {
              qs.push(encodeURIComponent(key) + '=' + encodeURIComponent(q.value));
            } else {
              qs.push(encodeURIComponent(key));
            }
          }
          return {
            statusCode: 301,
            statusDescription: 'Moved Permanently',
            headers: {
              location: { value: 'https://${PrimaryHostName}' + request.uri + (qs.length ? '?' + qs.join('&') : '') },
            },
          };
        }

  # --- DNS: alias records for every served hostname. -----------------------------------
  # Alias (not CNAME) so the apex works at all — a CNAME at a zone apex is illegal — and so
  # the records cost nothing to resolve. Z2FDTNDATAQYW2 is CloudFront's fixed, global hosted
  # zone id; it is the same constant in every account and region, not a value from this stack.
  # A and AAAA are both published because the distribution answers on IPv6 by default; a
  # v6-only client would otherwise fail to resolve the site at all.
  PrimaryAliasRecords:
    Type: AWS::Route53::RecordSetGroup
    Condition: HasCustomDomain
    Properties:
      HostedZoneId: !Ref HostedZoneId
      RecordSets:
        - Name: !Ref PrimaryHostName
          Type: A
          AliasTarget:
            DNSName: !GetAtt WebDistribution.DomainName
            HostedZoneId: Z2FDTNDATAQYW2
            EvaluateTargetHealth: false
        - Name: !Ref PrimaryHostName
          Type: AAAA
          AliasTarget:
            DNSName: !GetAtt WebDistribution.DomainName
            HostedZoneId: Z2FDTNDATAQYW2
            EvaluateTargetHealth: false

  SecondaryAliasRecords:
    Type: AWS::Route53::RecordSetGroup
    Condition: HasSecondaryHost
    Properties:
      HostedZoneId: !Ref HostedZoneId
      RecordSets:
        - Name: !Ref SecondaryHostName
          Type: A
          AliasTarget:
            DNSName: !GetAtt WebDistribution.DomainName
            HostedZoneId: Z2FDTNDATAQYW2
            EvaluateTargetHealth: false
        - Name: !Ref SecondaryHostName
          Type: AAAA
          AliasTarget:
            DNSName: !GetAtt WebDistribution.DomainName
            HostedZoneId: Z2FDTNDATAQYW2
            EvaluateTargetHealth: false

  # --- Bucket policy: grant ONLY this distribution (by ARN) read access. --------------
  WebBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontOacRead
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: 's3:GetObject'
            Resource: !Sub '${WebBucket.Arn}/*'
            Condition:
              StringEquals:
                'AWS:SourceArn': !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${WebDistribution}'

  # --- Publish coordinates the CI upload step reads (bucket to sync, dist to invalidate).
  ParamWebBucket:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub '/${ProjectName}/${Stage}/web/bucket-name'
      Type: String
      Value: !Ref WebBucket
  ParamWebDistributionId:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub '/${ProjectName}/${Stage}/web/distribution-id'
      Type: String
      Value: !Ref WebDistribution
  # The CANONICAL origin, which is what every downstream consumer must agree on: identity
  # builds Cognito callback/logout URLs from it, sync-api and app-api build their CORS
  # allowlist from it, and the client build embeds it. Once a custom domain exists the
  # cloudfront.net name must NOT be published here — users would land on the custom domain
  # and be rejected by an allowlist naming the other one.
  ParamWebUrl:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub '/${ProjectName}/${Stage}/web/url'
      Type: String
      Value: !If
        - HasCustomDomain
        - !Sub 'https://${PrimaryHostName}'
        - !Sub 'https://${WebDistribution.DomainName}'

  ParamAiConnectOrigins:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub '/${ProjectName}/${Stage}/web/ai-connect-origins'
      Type: String
      Value: !Ref AiConnectSources
      Description: Browser AI origins compiled into the web app and allowed by CSP.

Outputs:
  WebUrl:
    Description: Canonical public HTTPS URL of the hosted SPA.
    Value: !If
      - HasCustomDomain
      - !Sub 'https://${PrimaryHostName}'
      - !Sub 'https://${WebDistribution.DomainName}'
  WebDistributionDomain:
    Description: >-
      The distribution's own *.cloudfront.net name. Always reachable, and the alias target
      to check when diagnosing DNS.
    Value: !GetAtt WebDistribution.DomainName
  WebBucket:
    Description: Private origin bucket that CI syncs dist/ into.
    Value: !Ref WebBucket
  WebDistributionId:
    Description: CloudFront distribution id CI invalidates after each upload.
    Value: !Ref WebDistribution

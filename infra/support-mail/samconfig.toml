version = 0.1

# Prod only, operator-deployed (`infra/deploy.sh support-mail prod`); no workflow deploys it. The
# mailbox is for the public domain, which only the prod account serves, so there is no dev env.
# The forwarding destination is read from SSM `/dndtools/prod/support-mail/forward-to`, which the
# operator sets before the first deploy (infra/README.md, "Support mailbox").

[prod.global.parameters]
stack_name = "dndtools-prod-support-mail"

[prod.deploy.parameters]
profile = "dndtools-prod"
region = "ca-central-1"
capabilities = "CAPABILITY_IAM CAPABILITY_NAMED_IAM"
confirm_changeset = true
resolve_s3 = true
s3_prefix = "dndtools-prod-support-mail"
parameter_overrides = "ProjectName=dndtools Stage=prod HostedZoneId=Z07658511EFS4B5KGNYUX LogRetentionDays=90"
tags = "project=dndtools stage=prod service=support-mail owner=platform data-class=customer managed-by=sam"

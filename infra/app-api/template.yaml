AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >-
  dndtools app-api stack — the application backend for account-scoped features that
  are NOT E2EE vault sync: marketplace module publish/discover, player invites
  (server-minted join links), the public campaign wiki (player-safe published pages,
  readable without an account), account/device management, and plan entitlements
  (explicit simulated preview in dev; production self-service plan changes are disabled).
  One HTTP API with a native Cognito JWT authorizer, one on-demand
  single-table DynamoDB (pk/sk + TTL) for accounts/entitlements/invites/listings/wikis,
  one private S3 bucket for marketplace module payloads and wiki page bundles. Unlike
  sync-api this stack sees PLAINTEXT payloads (they are published for sharing, not
  private vault data) — nothing here may ever store vault content. Scale-to-zero:
  $0 idle. Cross-stack values are read from SSM at deploy time (no ImportValue).

Parameters:
  ProjectName:
    Type: String
    Default: dndtools
  Stage:
    Type: String
    Default: dev
    AllowedValues: [dev, prod]
  WebOrigin:
    Type: String
    Default: 'https://invalid.example'
    Description: Deployed web app origin allowed by CORS (localhost dev origins are always included). Also the trusted base for invite-email join links (built server-side, never from caller input).
  InviteSender:
    Type: String
    Default: ''
    Description: >-
      Verified Amazon SES sender address for emailed invites (e.g. invites@yourdomain).
      LEAVE EMPTY to ship email delivery disabled (fail-closed): invites still mint their
      link + QR and the API returns emailStatus="not-configured". Set this ONLY to an
      address/domain already verified in SES for this account+region, or sends will fail
      (fail-open — the invite is still returned with emailStatus="failed").
  SyncOpsTableName:
    Type: String
    Default: ''
    Description: >-
      Physical sync-api operations table used only to strongly verify the terminal account-purge
      marker. A new stage deliberately deploys app-api once with this empty, then sync-api publishes
      its generated table name and app-api is refreshed. Empty fails account deletion closed.
  LogRetentionDays:
    Type: Number
    Default: 30
    AllowedValues: [14, 30, 60, 90, 180, 365]

  ReserveLambdaConcurrency:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: >-
      Attach the per-function ReservedConcurrentExecutions throttling guardrails. Requires the
      account's Lambda "Concurrent executions" quota to be above its 10-concurrency floor — a
      fresh account cannot reserve at all (reservation must leave >=10 unreserved), so a new
      account deploys with 'false' until the quota increase (requested 2026-07-23) is granted.

Conditions:
  ShouldReserveConcurrency: !Equals [!Ref ReserveLambdaConcurrency, 'true']
  IsProd: !Equals [!Ref Stage, prod]
  HasSyncOpsTable: !Not [!Equals [!Ref SyncOpsTableName, '']]

Globals:
  Function:
    Runtime: nodejs24.x
    Architectures: [arm64]
    MemorySize: 256
    Timeout: 20
    Tracing: Active
    PermissionsBoundary: !Sub '{{resolve:ssm:/${ProjectName}/${Stage}/meta/permissions-boundary-arn}}'

Resources:
  # --- Marketplace module payloads + wiki page bundles (`wikis/` prefix): -------
  # --- private, encrypted-at-rest S3; only the Lambda reads/writes it (wiki -----
  # --- reads are served THROUGH the handler, never as public bucket access). ----
  ModulesBucket:
    Type: AWS::S3::Bucket
    # Published modules and campaign wikis are customer content. A stack removal or
    # replacement must never turn an infrastructure change into a data-deletion event.
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: expire-old-noncurrent-versions
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 30
          - Id: remove-expired-delete-markers
            Status: Enabled
            ExpiredObjectDeleteMarker: true
          - Id: abort-incomplete-multipart
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7

  # --- Single-table application data (on-demand) -------------------------------
  # pk / sk layout (tenant isolation by Cognito sub in pk where account-scoped):
  #   account#<sub>            | profile                  — account row
  #   account#<sub>            | entitlement              — plan row {plan, simulated:true}
  #   account#<sub>            | invite#<inviteId>        — owner's pending invite
  #   invite#<token>           | redeem                   — token → invite lookup (TTL `expiresAt`)
  #   module#<moduleId>        | listing                  — marketplace listing (payload in S3)
  #   modules                  | listing#<moduleId>       — browse partition (single-tenant scan-free list)
  #   account#<sub>            | wiki                     — owner's published-wiki status (stable wikiId)
  #   wiki#<wikiId>            | site                     — public wikiId → site lookup (pages in S3)
  AppTable:
    Type: AWS::DynamoDB::Table
    # Account, entitlement, invite, listing, and wiki rows are durable application data.
    # Explicit account-deletion routes still purge a user's rows; these policies only
    # protect against CloudFormation stack deletion and replacement.
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: pk, AttributeType: S }
        - { AttributeName: sk, AttributeType: S }
      KeySchema:
        - { AttributeName: pk, KeyType: HASH }
        - { AttributeName: sk, KeyType: RANGE }
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  AppFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/${ProjectName}/${Stage}/lambda/app-api'
      RetentionInDays: !Ref LogRetentionDays

  AppAccessLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/${ProjectName}/${Stage}/apigateway/app-api'
      RetentionInDays: !Ref LogRetentionDays

  # --- HTTP API with a native Cognito JWT authorizer ---------------------------
  AppHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref Stage
      AccessLogSettings:
        # Not !GetAtt ...Arn — see the note in infra/signaling/template.yaml: GetAtt's
        # `:*` suffix is stripped by API Gateway and leaves the stage permanently DRIFTED.
        DestinationArn: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:${AppAccessLogGroup}'
        Format: >-
          {"requestId":"$context.requestId","routeKey":"$context.routeKey","status":"$context.status","responseLength":"$context.responseLength","integrationError":"$context.integrationErrorMessage"}
      DefaultRouteSettings:
        ThrottlingBurstLimit: 20
        ThrottlingRateLimit: 10
      Auth:
        DefaultAuthorizer: CognitoJwt
        Authorizers:
          CognitoJwt:
            IdentitySource: '$request.header.Authorization'
            JwtConfiguration:
              issuer: !Sub 'https://cognito-idp.${AWS::Region}.amazonaws.com/{{resolve:ssm:/${ProjectName}/${Stage}/identity/user-pool-id}}'
              audience:
                - !Sub '{{resolve:ssm:/${ProjectName}/${Stage}/identity/app-client-id}}'
      CorsConfiguration:
        # AllowOrigins MUST stay a literal YAML list. Making the list *itself* an !If breaks
        # SAM's HttpApi transform: it emits `x-amazon-apigateway-cors: <the Fn::If>` in place of
        # the cors object, losing allowHeaders/allowMethods entirely, and API Gateway then ignores
        # the malformed key and configures NO CORS AT ALL. That fails silently — the stack deploys
        # green and only the browser notices. Conditioning individual *elements* is fine, since
        # CloudFormation resolves AWS::NoValue by dropping that entry from the list.
        # No 'dndtools://app' here: API Gateway rejects a custom-scheme origin outright
        # ("Invalid format for origin"), which fails the whole stack update. The desktop and
        # mobile builds are not browsers and are not subject to CORS, so they never needed it.
        AllowOrigins:
          - !If [IsProd, !Ref 'AWS::NoValue', 'http://localhost:5273']
          - !If [IsProd, !Ref 'AWS::NoValue', 'http://localhost:4273']
          - !Ref WebOrigin
        AllowHeaders:
          - authorization
          - content-type
          # Presented password for a password-protected wiki read (header, not query,
          # so it never lands in access logs or browser history).
          - x-wiki-password
        AllowMethods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS

  # --- The app-api handler ------------------------------------------------------
  AppFn:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../../packages/cloud-fns/build/app-api-handler
      Handler: index.handler
      ReservedConcurrentExecutions: !If [ShouldReserveConcurrency, 10, !Ref 'AWS::NoValue']
      LoggingConfig:
        LogFormat: JSON
        ApplicationLogLevel: INFO
        SystemLogLevel: WARN
        LogGroup: !Ref AppFunctionLogGroup
      Environment:
        Variables:
          APP_TABLE: !Ref AppTable
          SYNC_OPS_TABLE: !If [HasSyncOpsTable, !Ref SyncOpsTableName, '']
          MODULES_BUCKET: !Ref ModulesBucket
          USER_POOL_ID: !Sub '{{resolve:ssm:/${ProjectName}/${Stage}/identity/user-pool-id}}'
          # Invite email delivery (optional; empty INVITE_SENDER = disabled/fail-closed).
          # WEB_ORIGIN is the trusted base for the join link the email carries.
          INVITE_SENDER: !Ref InviteSender
          WEB_ORIGIN: !Ref WebOrigin
          # Send through the same configuration set Cognito uses, so bounce and complaint
          # rates cover ALL of this project's mail rather than only the account traffic.
          # Owned by the identity stack, which deploys before this one.
          SES_CONFIGURATION_SET: !Sub '{{resolve:ssm:/${ProjectName}/${Stage}/identity/email-config-set}}'
          # Fail closed unless the template explicitly identifies a non-production preview.
          ENTITLEMENT_PREVIEW_ENABLED: !If [IsProd, 'false', 'true']
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref AppTable }
        - S3CrudPolicy: { BucketName: !Ref ModulesBucket }
        # Account deletion reads one strongly consistent usage#quota marker from the sync table.
        # No scan, query, write, or wildcard table permission is needed.
        - !If
          - HasSyncOpsTable
          - Statement:
              - Effect: Allow
                Action: dynamodb:GetItem
                Resource: !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${SyncOpsTableName}'
          - !Ref AWS::NoValue
        - Statement:
            - Effect: Allow
              Action:
                - s3:GetObjectVersion
                - s3:DeleteObjectVersion
              Resource: !Sub '${ModulesBucket.Arn}/*'
        # Emailed invites: send ONLY as the configured verified sender (ses:FromAddress
        # condition), across whatever SES identity authorizes it. Harmless when
        # InviteSender is empty — the handler never calls SES without a sender configured.
        - Statement:
            - Effect: Allow
              Action:
                - ses:SendEmail
              Resource: !Sub 'arn:${AWS::Partition}:ses:${AWS::Region}:${AWS::AccountId}:identity/*'
              Condition:
                StringEquals:
                  ses:FromAddress: !Ref InviteSender
        # Account/device management acts on the caller's OWN Cognito identity only —
        # the handler derives the username from the verified JWT, never from input.
        - Statement:
            - Effect: Allow
              Action:
                - cognito-idp:AdminGetUser
                - cognito-idp:AdminUpdateUserAttributes
                - cognito-idp:AdminUserGlobalSignOut
                - cognito-idp:AdminDeleteUser
                - cognito-idp:AdminListDevices
                - cognito-idp:AdminForgetDevice
              Resource: !Sub '{{resolve:ssm:/${ProjectName}/${Stage}/identity/user-pool-arn}}'
      Events:
        # Account -----------------------------------------------------------------
        GetProfile:
          Type: HttpApi
          Properties:
            ApiId: !Ref AppHttpApi
            Method: GET
            Path: /account/profile
        PutProfile:
          Type: HttpApi
          Properties:
            ApiId: !Ref AppHttpApi
            Method: PUT
            Path: /account/profile
        GetDevices:
          Type: HttpApi
          Properties:
            ApiId: !Ref AppHttpApi
            Method: GET
            Path: /account/devices
        RevokeDevices:
          Type: HttpApi
          Properties:
            ApiId: !Ref AppHttpApi
            Method: POST
            Path: /account/devices/revoke
        ExportAccount:
          Type: HttpApi
          Properties:
            ApiId: !Ref AppHttpApi
            Method: POST
            Path: /account/export
        DeleteAccount:
          Type: HttpApi
          Properties:
            ApiId: !Ref AppHttpApi
            Method: DELETE
            Path: /account
        # Entitlements (dev preview; production POST returns 403) -------------------
        GetEntitlements:
          Type: HttpApi
          Properties:
            ApiId: !Ref AppHttpApi
            Method: GET
            Path: /account/entitlements
        PutEntitlements:
          Type: HttpApi
          Properties:
            ApiId: !Ref AppHttpApi
            Method: POST
            Path: /account/entitlements
        # Marketplace ---------------------------------------------------------------
        ListModules:
          Type: HttpApi
          Properties:
            ApiId: !Ref AppHttpApi
            Method: GET
            Path: /marketplace/modules
        PublishModule:
          Type: HttpApi
          Properties:
            ApiId: !Ref AppHttpApi
            Method: POST
            Path: /marketplace/modules
        GetModule:
          Type: HttpApi
          Properties:
            ApiId: !Ref AppHttpApi
            Method: GET
            Path: '/marketplace/modules/{moduleId}'
        DeleteModule:
          Type: HttpApi
          Properties:
            ApiId: !Ref AppHttpApi
            Method: DELETE
            Path: '/marketplace/modules/{moduleId}'
        # Campaign wiki ---------------------------------------------------------------
        GetOwnWiki:
          Type: HttpApi
          Properties:
            ApiId: !Ref AppHttpApi
            Method: GET
            Path: /wiki
        PublishWiki:
          Type: HttpApi
          Properties:
            ApiId: !Ref AppHttpApi
            Method: PUT
            Path: /wiki
        UnpublishWiki:
          Type: HttpApi
          Properties:
            ApiId: !Ref AppHttpApi
            Method: DELETE
            Path: /wiki
        # Reading a published campaign wiki must work for players/readers with NO
        # account: unauthenticated like invite-resolve. It resolves a high-entropy,
        # strictly-shaped wiki id to the player-safe page bundle the owner published;
        # password-protected wikis additionally require the x-wiki-password header
        # (salted-scrypt check in the handler). Never returns the owner's sub.
        ReadWiki:
          Type: HttpApi
          Properties:
            ApiId: !Ref AppHttpApi
            Method: GET
            Path: '/wikis/{wikiId}'
            Auth:
              Authorizer: NONE
        # Invites -------------------------------------------------------------------
        CreateInvite:
          Type: HttpApi
          Properties:
            ApiId: !Ref AppHttpApi
            Method: POST
            Path: /invites
        ListInvites:
          Type: HttpApi
          Properties:
            ApiId: !Ref AppHttpApi
            Method: GET
            Path: /invites
        RevokeInvite:
          Type: HttpApi
          Properties:
            ApiId: !Ref AppHttpApi
            Method: DELETE
            Path: '/invites/{inviteId}'
        # Redeeming a join link must work for an invitee with NO account yet: this is
        # unauthenticated (like ReadWiki above). It resolves a high-entropy single-use token
        # to non-secret join metadata; the actual session join still runs the P2P/cloud
        # join authz (PIN + pairing key), so an intercepted link alone admits no one.
        ResolveInvite:
          Type: HttpApi
          Properties:
            ApiId: !Ref AppHttpApi
            Method: GET
            Path: '/invites/resolve/{token}'
            Auth:
              Authorizer: NONE

  AppFunctionErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: App API Lambda returned one or more unhandled errors in five minutes.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref AppFn
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Sub '{{resolve:ssm:/${ProjectName}/${Stage}/ops/alerts-topic-arn}}'

  AppApi5xxMetric:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref AppAccessLogGroup
      FilterPattern: '{ $.status = 5* }'
      MetricTransformations:
        - MetricNamespace: Dndtools/Api
          MetricName: !Sub '${ProjectName}-${Stage}-app-api-5xx'
          MetricValue: '1'
          DefaultValue: 0

  AppApi5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: App API returned one or more 5xx responses in five minutes.
      Namespace: Dndtools/Api
      MetricName: !Sub '${ProjectName}-${Stage}-app-api-5xx'
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Sub '{{resolve:ssm:/${ProjectName}/${Stage}/ops/alerts-topic-arn}}'

  AppFunctionThrottlesAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: App API Lambda concurrency throttling was observed.
      Namespace: AWS/Lambda
      MetricName: Throttles
      Dimensions:
        - Name: FunctionName
          Value: !Ref AppFn
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Sub '{{resolve:ssm:/${ProjectName}/${Stage}/ops/alerts-topic-arn}}'

  AppApiDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub '${ProjectName}-${Stage}-app-api'
      DashboardBody: !Sub >-
        {"widgets":[{"type":"metric","width":12,"height":6,"properties":{"title":"App API Lambda","region":"${AWS::Region}","stat":"Sum","period":300,"metrics":[["AWS/Lambda","Invocations","FunctionName","${AppFn}"],[".","Errors",".","."],[".","Throttles",".","."]]}},{"type":"metric","width":12,"height":6,"properties":{"title":"App API latency","region":"${AWS::Region}","stat":"p95","period":300,"metrics":[["AWS/Lambda","Duration","FunctionName","${AppFn}"]]}}]}

  # --- Publish the API URL for the client build --------------------------------
  ParamAppApiUrl:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub '/${ProjectName}/${Stage}/app-api/url'
      Type: String
      Value: !Sub 'https://${AppHttpApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}'

  ParamAppApiId:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub '/${ProjectName}/${Stage}/app-api/api-id'
      Type: String
      Value: !Ref AppHttpApi

  ParamAppTableName:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub '/${ProjectName}/${Stage}/app-api/table-name'
      Type: String
      Value: !Ref AppTable

Outputs:
  AppApiUrl:
    Description: HTTP API base URL for the application backend (send Authorization=<cognito-id-token>).
    Value: !Sub 'https://${AppHttpApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}'
  AppTable:
    Value: !Ref AppTable
  ModulesBucket:
    Value: !Ref ModulesBucket
  ApiId:
    Value: !Ref AppHttpApi

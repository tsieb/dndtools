version = 0.1

# Foundation stack config. Each stack directory carries its own samconfig so it
# can be built and deployed independently. Config-envs mirror the Stage values.

[dev.global.parameters]
stack_name = "dndtools-dev-foundation"

[dev.deploy.parameters]
profile = "dndtools"
region = "ca-central-1"
capabilities = "CAPABILITY_NAMED_IAM"
confirm_changeset = false
resolve_s3 = true
s3_prefix = "dndtools-dev-foundation"
parameter_overrides = "ProjectName=dndtools Stage=dev NotificationEmail=jade@sieb.net MonthlyBudgetUsd=12 CreateStageDashboard=false GitHubOrg=tsieb GitHubRepo=dndtools GitHubBranch=main CreateGitHubOidcProvider=true"
tags = "project=dndtools stage=dev service=foundation owner=platform data-class=operational managed-by=sam"

[prod.global.parameters]
stack_name = "dndtools-prod-foundation"

[prod.deploy.parameters]
profile = "dndtools-prod"
region = "ca-central-1"
capabilities = "CAPABILITY_NAMED_IAM"
confirm_changeset = true
resolve_s3 = true
s3_prefix = "dndtools-prod-foundation"
parameter_overrides = "ProjectName=dndtools Stage=prod NotificationEmail=jade@sieb.net MonthlyBudgetUsd=20 CreateStageDashboard=true GitHubOrg=tsieb GitHubRepo=dndtools GitHubBranch=main GitHubEnvironment=production CreateGitHubOidcProvider=true CreateApiGatewayAccountRole=true"
tags = "project=dndtools stage=prod service=foundation owner=platform data-class=operational managed-by=sam"

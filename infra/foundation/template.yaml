AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  dndtools foundation stack — account-wide guardrails that every other stack
  depends on but that change rarely: a monthly cost Budget (pre-revenue tripwire),
  the GitHub Actions OIDC provider + CI deploy role (keyless deploys), and the
  SSM Parameter Store namespace convention (/dndtools/<stage>/...), and the single
  per-stage CloudWatch dashboard. Deploy this FIRST.

  Always-on billable resources, and why they are shaped the way they are:
    - KMS key encrypting the alerts topic: PROD ONLY (~$1/month). See AlertsKey.
    - CloudWatch dashboard: opt-in per stage, and free only while the ORGANISATION
      stays at or under three dashboards in total. See StageOverviewDashboard.
  Everything else here is free at this scale (Budgets, Cost Anomaly Detection, the
  first CloudTrail trail, SSM parameters, IAM).

Parameters:
  ProjectName:
    Type: String
    Default: dndtools
    Description: Project slug; used as the SSM namespace root and resource prefix.
  Stage:
    Type: String
    Default: dev
    AllowedValues: [dev, prod]
    Description: Deployment stage. Each stage is an independent set of parameters.
  NotificationEmail:
    Type: String
    Default: jade@sieb.net
    Description: >-
      Address that receives Budget threshold alerts, and that the operations SNS topic
      subscribes. Both stages use the same address deliberately: a split (dev on one
      address, prod on another) is how dev's $15 ceiling came to be breached in August
      2026 without anyone acting on it.

      An SNS email subscription needs a confirmation click, and AWS DELETES an
      unconfirmed subscription after three days — while CloudFormation still reports the
      subscription resource as CREATE_COMPLETE. Confirm it, then verify with
      `aws sns list-subscriptions-by-topic`; do not trust stack status for this.
  MonthlyBudgetUsd:
    Type: Number
    Default: 12
    Description: >-
      Monthly cost ceiling in USD; alerts fire at 40% actual, 80% forecast and 100%
      actual. Set it near the expected steady-state bill rather than at a comfortable
      distance from it — a ceiling generous enough never to be approached cannot detect
      a regression. The August 2026 dashboard regression tripled the org bill and still
      sat inside prod's then-$40 ceiling.
  GitHubOrg:
    Type: String
    Default: tsieb
    Description: GitHub org/user that owns the repo allowed to assume the deploy role.
  GitHubRepo:
    Type: String
    Default: dndtools
    Description: GitHub repo name allowed to assume the deploy role.
  GitHubBranch:
    Type: String
    Default: main
    Description: >-
      Branch whose GitHub Actions runs may assume the deploy role. The OIDC
      subject condition is built as
      repo:<org>/<repo>:ref:refs/heads/<branch>. Widen only deliberately.
  GitHubEnvironment:
    Type: String
    Default: production
    Description: >-
      Protected GitHub environment allowed to assume the prod deploy role. GitHub
      environment jobs use an OIDC subject of repo:<org>/<repo>:environment:<name>
      rather than a branch-ref subject.
  CreateGitHubOidcProvider:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: >-
      IAM permits only one provider for token.actions.githubusercontent.com per account.
      Set false for an additional stage in an account where the shared provider already exists.

  CreateStageDashboard:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: >-
      Create this stage's single CloudWatch overview dashboard.

      CloudWatch bills $3/dashboard/month beyond a free allowance of THREE
      dashboards, and that allowance is consumed across the whole ORGANISATION
      (consolidated billing), not per account. It is also consumed as
      dashboard-MONTHS, so eight dashboards exhaust three dashboard-months around
      day 12 — which is how a dashboard bill appears mid-month out of nowhere.

      Treat three as a hard org-wide budget. Prod holds one permanently; dev is off
      by default and meant to be flipped on only while actively debugging (set
      true, deploy, then set it back to false). Leave the third slot spare.

  CreateApiGatewayAccountRole:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: >-
      API Gateway's CloudWatch Logs role is one ACCOUNT-WIDE setting (AWS::ApiGateway::Account),
      required before any stage can enable access logging (the hardened signaling stage does).
      Exactly one stage's foundation may manage it; set false for additional stages in the same
      account — mirrors the CreateGitHubOidcProvider singleton pattern.

Conditions:
  IsProd: !Equals [!Ref Stage, prod]
  ShouldCreateGitHubOidcProvider: !Equals [!Ref CreateGitHubOidcProvider, 'true']
  ShouldCreateApiGatewayAccountRole: !Equals [!Ref CreateApiGatewayAccountRole, 'true']
  ShouldCreateStageDashboard: !Equals [!Ref CreateStageDashboard, 'true']

Resources:
  # --- API Gateway account logging role (account-wide singleton) -----------------
  # Stages that enable access logging (signaling) fail to deploy until this exists:
  # "CloudWatch Logs role ARN must be set in account settings to enable logging".
  ApiGatewayLogsRole:
    Type: AWS::IAM::Role
    Condition: ShouldCreateApiGatewayAccountRole
    Properties:
      RoleName: !Sub '${ProjectName}-apigateway-cloudwatch-logs'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: apigateway.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonAPIGatewayPushToCloudWatchLogs

  ApiGatewayAccount:
    Type: AWS::ApiGateway::Account
    Condition: ShouldCreateApiGatewayAccountRole
    Properties:
      CloudWatchRoleArn: !GetAtt ApiGatewayLogsRole.Arn

  # --- Cost guardrail: a monthly budget with escalating email alerts. -------
  # Budgets is a global service; the resource is fine to create from any region.
  #
  # BudgetName is deliberately NOT set, and that is load-bearing rather than an oversight.
  # `NotificationsWithSubscribers` is a Replacement-update property, so changing the alert
  # threshold set OR the subscriber address makes CloudFormation replace the budget — and
  # replacement is create-then-delete. With an explicit BudgetName the new budget collides
  # with the old one that is still standing, and the update dies with:
  #
  #   "A budget or resource with the same name but a different internalId already exists.
  #    (Service: Budgets, Status Code: 400)"
  #
  # A named budget therefore cannot have its notifications changed by CloudFormation, ever.
  # This wedged BOTH accounts: dndtools-prod-foundation sat in UPDATE_ROLLBACK_COMPLETE from
  # 2026-08-03 until 2026-09-03 for exactly this reason, and dev reproduced it on the first
  # attempt to repoint the alert email. Letting CloudFormation generate the physical name
  # costs a readable console label and buys a resource that can actually be updated.
  # The generated name is published as the BudgetName output and read from there.
  MonthlyCostBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount: !Ref MonthlyBudgetUsd
          Unit: USD
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 40 # early warning while the month can still be corrected
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref NotificationEmail
        - Notification:
            NotificationType: FORECASTED
            ComparisonOperator: GREATER_THAN
            Threshold: 80 # forecast to breach; fires long before the ceiling is hit
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref NotificationEmail
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 100 # hit the ceiling
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref NotificationEmail

  # --- Keyless CI: GitHub Actions OIDC provider + scoped deploy role. --------
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: ShouldCreateGitHubOidcProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      # AWS now validates GitHub's OIDC cert via its trust store and ignores
      # these thumbprints, but the property is still required. Both are GitHub's
      # published intermediate thumbprints.
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1
        - 1c58a3a8518e8759bf075b76b750d4f2df264fcd

  CiDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-${Stage}-ci-deploy'
      Description: !Sub >-
        Assumed by GitHub Actions (via OIDC) to run sam build/deploy for all
        dndtools stacks. This account is single-purpose, so compute/data access
        is broad within it (PowerUser), but IAM role/policy management is scoped
        to the "${ProjectName}-*" namespace and iam:PassRole is constrained by
        iam:PassedToService, so a compromised CI run cannot mint or pass an
        arbitrary AdministratorAccess role (no privilege-escalation-to-admin
        path). The role also cannot be assumed outside the named repo/branch.
      # Deny-all guardrail: even PowerUserAccess cannot touch the org, account
      # settings, or the account's own IAM users/root — blocks lateral moves and
      # persistence that PowerUser would otherwise permit in this account.
      PermissionsBoundary: !Ref CiDeployBoundary
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - ShouldCreateGitHubOidcProvider
                - !Ref GitHubOidcProvider
                - !Sub 'arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com'
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                'token.actions.githubusercontent.com:aud': sts.amazonaws.com
                'token.actions.githubusercontent.com:sub': !If
                  - IsProd
                  - !Sub 'repo:${GitHubOrg}/${GitHubRepo}:environment:${GitHubEnvironment}'
                  - !Sub 'repo:${GitHubOrg}/${GitHubRepo}:ref:refs/heads/${GitHubBranch}'
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/PowerUserAccess
      Policies:
        - PolicyName: iam-and-service-role-management
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # SAM/CloudFormation creates & manages the Lambda/EC2 service roles,
              # policies and instance profiles for the stacks. All such resources
              # are named "<stack>-..." and every stack is "${ProjectName}-*", so
              # scoping the mutating actions to that ARN prefix lets CI manage its
              # own roles but NOT create/alter an admin role elsewhere.
              - Sid: ManageProjectRolesAndPolicies
                Effect: Allow
                Action:
                  - 'iam:CreateRole'
                  - 'iam:DeleteRole'
                  - 'iam:GetRole'
                  - 'iam:UpdateRole'
                  - 'iam:UpdateAssumeRolePolicy'
                  - 'iam:AttachRolePolicy'
                  - 'iam:DetachRolePolicy'
                  - 'iam:PutRolePolicy'
                  - 'iam:DeleteRolePolicy'
                  - 'iam:GetRolePolicy'
                  - 'iam:ListRolePolicies'
                  - 'iam:ListAttachedRolePolicies'
                  - 'iam:TagRole'
                  - 'iam:UntagRole'
                  # Stack templates attach the stage permissions boundary to every service role
                  # they create (resolved from SSM). The conditional Deny below already forces the
                  # boundary to be exactly CiDeployBoundary; without these two actions the first
                  # hardened deploy of a pre-boundary stack fails mid-update and its rollback
                  # wedges in UPDATE_ROLLBACK_FAILED (observed on dndtools-dev-app-api).
                  - 'iam:PutRolePermissionsBoundary'
                  - 'iam:DeleteRolePermissionsBoundary'
                  - 'iam:CreateInstanceProfile'
                  - 'iam:DeleteInstanceProfile'
                  - 'iam:GetInstanceProfile'
                  - 'iam:AddRoleToInstanceProfile'
                  - 'iam:RemoveRoleFromInstanceProfile'
                Resource:
                  - !Sub 'arn:aws:iam::${AWS::AccountId}:role/${ProjectName}-*'
                  - !Sub 'arn:aws:iam::${AWS::AccountId}:instance-profile/${ProjectName}-*'
              # Force every role CI creates to carry the same permissions boundary,
              # so CI cannot bootstrap a role more powerful than itself.
              - Sid: RequireBoundaryOnCreatedRoles
                Effect: Deny
                Action:
                  - 'iam:CreateRole'
                  - 'iam:PutRolePermissionsBoundary'
                Resource: !Sub 'arn:aws:iam::${AWS::AccountId}:role/${ProjectName}-*'
                Condition:
                  StringNotEquals:
                    'iam:PermissionsBoundary': !Ref CiDeployBoundary
              # Customer-managed policies for the stacks (SAM inline policies attach
              # to the scoped roles above; standalone managed policies are "${ProjectName}-*").
              - Sid: ManageProjectManagedPolicies
                Effect: Allow
                Action:
                  - 'iam:CreatePolicy'
                  - 'iam:DeletePolicy'
                  - 'iam:CreatePolicyVersion'
                  - 'iam:DeletePolicyVersion'
                  - 'iam:GetPolicy'
                  - 'iam:GetPolicyVersion'
                  - 'iam:ListPolicyVersions'
                Resource: !Sub 'arn:aws:iam::${AWS::AccountId}:policy/${ProjectName}-*'
              # Foundation/bootstrap authority is deliberately outside the CI role. In particular,
              # CI cannot mutate its own trust/inline policies or publish a new default version of
              # the managed policy that is its permissions boundary.
              - Sid: DenyDeployRoleAndBoundaryMutation
                Effect: Deny
                Action:
                  - 'iam:DeleteRole'
                  - 'iam:UpdateRole'
                  - 'iam:UpdateAssumeRolePolicy'
                  - 'iam:AttachRolePolicy'
                  - 'iam:DetachRolePolicy'
                  - 'iam:PutRolePolicy'
                  - 'iam:DeleteRolePolicy'
                  - 'iam:PutRolePermissionsBoundary'
                  - 'iam:DeleteRolePermissionsBoundary'
                  - 'iam:DeletePolicy'
                  - 'iam:CreatePolicyVersion'
                  - 'iam:DeletePolicyVersion'
                  - 'iam:SetDefaultPolicyVersion'
                Resource:
                  - !Sub 'arn:aws:iam::${AWS::AccountId}:role/${ProjectName}-${Stage}-ci-deploy'
                  - !Ref CiDeployBoundary
              # PassRole is the escalation lever: constrain it to project roles AND
              # to the specific services SAM actually hands roles to, so CI can't
              # pass a role to an arbitrary/privileged principal.
              - Sid: PassProjectRolesToKnownServicesOnly
                Effect: Allow
                Action: 'iam:PassRole'
                Resource: !Sub 'arn:aws:iam::${AWS::AccountId}:role/${ProjectName}-*'
                Condition:
                  StringEquals:
                    'iam:PassedToService':
                      - lambda.amazonaws.com
                      - ec2.amazonaws.com
                      - apigateway.amazonaws.com
              # Service-linked roles have fixed, AWS-controlled trust policies and
              # cannot be repurposed, so a wildcard resource here is not an
              # escalation path (the service name is pinned by the API).
              - Sid: CreateServiceLinkedRoles
                Effect: Allow
                Action: 'iam:CreateServiceLinkedRole'
                Resource: '*'

  # Permissions boundary applied to the CI role (and every role it creates): the
  # ceiling of what any CI-managed principal can ever do in this account. It
  # grants broad service access for deploys but hard-denies IAM user/root
  # manipulation, Organizations, and account-level settings — the things a
  # single-purpose deploy pipeline never needs and an attacker would want.
  CiDeployBoundary:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub '${ProjectName}-${Stage}-ci-deploy-boundary'
      Description: Permissions ceiling for the CI deploy role and roles it creates.
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowServiceActions
            Effect: Allow
            Action: '*'
            Resource: '*'
          - Sid: DenyAccountAndIdentityTakeover
            Effect: Deny
            Action:
              - 'organizations:*'
              - 'account:*'
              - 'iam:CreateUser'
              - 'iam:CreateAccessKey'
              - 'iam:CreateLoginProfile'
              - 'iam:UpdateLoginProfile'
              - 'iam:AttachUserPolicy'
              - 'iam:PutUserPolicy'
              - 'iam:DeleteUserPolicy'
              - 'iam:DetachUserPolicy'
              - 'iam:DeleteUserPermissionsBoundary'
              # Boundary-stripping stays denied EVERYWHERE for CI (service roles included): CI can
              # already attach arbitrary inline policies to service roles, so their boundary is the
              # cap — deleting it would be a privilege-escalation lever via Lambda execution. The
              # operational consequence is that the ONE-TIME transition attaching boundaries to
              # pre-hardening stacks must be deployed with the operator (admin) profile — a CI
              # deploy that fails mid-transition cannot roll the attachment back and wedges in
              # UPDATE_ROLLBACK_FAILED (observed on dndtools-dev-app-api, 2026-07-23). At steady
              # state (boundary attached everywhere; new roles are born with it via CreateRole)
              # CI updates never touch boundaries again.
              - 'iam:DeleteRolePermissionsBoundary'
              - 'iam:CreateSAMLProvider'
              - 'iam:UpdateSAMLProvider'
            Resource: '*'
          # Make the boundary transitive: even a CI-created role with a broad attached policy cannot
          # create an unbounded successor or mutate the protected deploy role/boundary control plane.
          - Sid: RequireBoundaryOnDescendantRoles
            Effect: Deny
            Action:
              - 'iam:CreateRole'
              - 'iam:PutRolePermissionsBoundary'
            Resource: !Sub 'arn:aws:iam::${AWS::AccountId}:role/${ProjectName}-*'
            Condition:
              StringNotEquals:
                'iam:PermissionsBoundary': !Sub 'arn:aws:iam::${AWS::AccountId}:policy/${ProjectName}-${Stage}-ci-deploy-boundary'
          - Sid: DenyProtectedDeploymentControlPlane
            Effect: Deny
            Action:
              - 'iam:DeleteRole'
              - 'iam:UpdateRole'
              - 'iam:UpdateAssumeRolePolicy'
              - 'iam:AttachRolePolicy'
              - 'iam:DetachRolePolicy'
              - 'iam:PutRolePolicy'
              - 'iam:DeleteRolePolicy'
              - 'iam:PutRolePermissionsBoundary'
              - 'iam:DeleteRolePermissionsBoundary'
              - 'iam:DeletePolicy'
              - 'iam:CreatePolicyVersion'
              - 'iam:DeletePolicyVersion'
              - 'iam:SetDefaultPolicyVersion'
            Resource:
              - !Sub 'arn:aws:iam::${AWS::AccountId}:role/${ProjectName}-${Stage}-ci-deploy'
              - !Sub 'arn:aws:iam::${AWS::AccountId}:policy/${ProjectName}-${Stage}-ci-deploy-boundary'

  # --- SSM namespace: baseline meta params other stacks/build read. ---------
  ParamProject:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub '/${ProjectName}/${Stage}/meta/project'
      Type: String
      Value: !Ref ProjectName
      Description: Project slug (namespace root marker).
  ParamRegion:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub '/${ProjectName}/${Stage}/meta/region'
      Type: String
      Value: !Ref 'AWS::Region'
      Description: Primary region for regional resources.
  ParamDeployRoleArn:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub '/${ProjectName}/${Stage}/meta/ci-deploy-role-arn'
      Type: String
      Value: !GetAtt CiDeployRole.Arn
      Description: ARN the GitHub Actions workflow assumes to deploy.

  ParamPermissionsBoundaryArn:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub '/${ProjectName}/${Stage}/meta/permissions-boundary-arn'
      Type: String
      Value: !Ref CiDeployBoundary
      Description: Required permissions boundary for every CI-created Lambda and EC2 service role.

  # Deliberately non-secret, server-owned capability snapshot. Clients may use this for
  # presentation only; protected API behaviour must enforce its own policy. SSM changes
  # are CloudTrail-audited and production promotion records the config version.
  ParamFeatureFlags:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub '/${ProjectName}/${Stage}/config/feature-flags'
      Type: String
      Value: !If
        - IsProd
        - '{"version":1,"flags":{"experimental-ai-runs":false}}'
        - '{"version":1,"flags":{"experimental-ai-runs":true}}'
      Description: Non-secret, server-controlled feature flag snapshot. Owners and expiry are in config/stages.

  AuditTrailBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub '${ProjectName}-${Stage}-cloudtrail-${AWS::AccountId}'
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: expire-audit-objects
            Status: Enabled
            ExpirationInDays: !If [IsProd, 365, 30]
            NoncurrentVersionExpiration:
              NoncurrentDays: !If [IsProd, 365, 30]
      Tags:
        - { Key: project, Value: !Ref ProjectName }
        - { Key: stage, Value: !Ref Stage }
        - { Key: service, Value: foundation }
        - { Key: owner, Value: platform }
        - { Key: data-class, Value: operational }

  AuditTrailBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref AuditTrailBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AWSCloudTrailAclCheck
            Effect: Allow
            Principal:
              Service: cloudtrail.amazonaws.com
            Action: s3:GetBucketAcl
            Resource: !GetAtt AuditTrailBucket.Arn
            Condition:
              StringEquals:
                aws:SourceArn: !Sub 'arn:aws:cloudtrail:${AWS::Region}:${AWS::AccountId}:trail/${ProjectName}-${Stage}'
          - Sid: AWSCloudTrailWrite
            Effect: Allow
            Principal:
              Service: cloudtrail.amazonaws.com
            Action: s3:PutObject
            Resource: !Sub '${AuditTrailBucket.Arn}/AWSLogs/${AWS::AccountId}/*'
            Condition:
              StringEquals:
                s3:x-amz-acl: bucket-owner-full-control
                aws:SourceArn: !Sub 'arn:aws:cloudtrail:${AWS::Region}:${AWS::AccountId}:trail/${ProjectName}-${Stage}'

  AuditTrail:
    Type: AWS::CloudTrail::Trail
    DependsOn: AuditTrailBucketPolicy
    Properties:
      TrailName: !Sub '${ProjectName}-${Stage}'
      S3BucketName: !Ref AuditTrailBucket
      IncludeGlobalServiceEvents: true
      IsLogging: true
      IsMultiRegionTrail: true
      EnableLogFileValidation: true
      EventSelectors:
        - IncludeManagementEvents: true
          ReadWriteType: All

  ParamAuditTrailArn:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub '/${ProjectName}/${Stage}/ops/cloudtrail-arn'
      Type: String
      Value: !GetAtt AuditTrail.Arn
      Description: Account audit trail ARN for promotion/runbook checks.

  # Encryption on the alerts topic has exactly three possible shapes, and only two of them
  # deliver notifications. Getting this wrong is silent, so the full matrix is recorded here:
  #
  #   1. AWS-managed key `alias/aws/sns`  — BROKEN. Its policy grants only account principals
  #      calling through SNS and is NOT editable, so CloudWatch Alarms publishing failed with
  #      "CloudWatch Alarms does not have authorization to access the SNS topic encryption
  #      key." The failure is invisible from the alarm's own state: it still transitions to
  #      ALARM, the notification just never leaves. Every alarm in this project was silent
  #      from creation until 2026-08-02, proven by forcing an alarm transition in prod.
  #      Cost Anomaly Detection publishes here too and fails the same way. NEVER use this.
  #   2. This customer-managed key      — WORKS. Its policy names the publishing services
  #      explicitly. Costs ~$1/month per key, per account.
  #   3. No encryption at all           — WORKS. SNS server-side encryption is optional and
  #      is not what was ever broken; case 1 failed on the key POLICY, not on encryption.
  #      Free.
  #
  # Prod takes (2): the topic carries account-identifying operational detail and $1/month is
  # not worth arguing about. Dev takes (3): the same $1/month is 5% of an idle dev account's
  # bill, and dev alert traffic is cost-anomaly notices about an account with no user data in
  # it. If dev ever carries anything sensitive, flip this condition — do NOT reach for (1).
  AlertsKey:
    Condition: IsProd
    Type: AWS::KMS::Key
    # Deleting this key silently breaks alarm delivery again, and the topic outlives any
    # single deploy — keep it if the stack is ever torn down and rebuilt.
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: !Sub 'Encrypts the ${ProjectName}-${Stage} operational alerts topic.'
      EnableKeyRotation: true
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: AccountAdmin
            Effect: Allow
            Principal: { AWS: !Sub 'arn:aws:iam::${AWS::AccountId}:root' }
            Action: 'kms:*'
            Resource: '*'
          # Only the publishers that actually exist in this stack. Adding a new alarm
          # source (EventBridge, S3, SES event destinations) means adding it here too,
          # or its notifications will fail exactly as described above.
          - Sid: AllowAlarmPublishersToEncrypt
            Effect: Allow
            Principal:
              Service:
                - cloudwatch.amazonaws.com
                - costalerts.amazonaws.com
            Action:
              - 'kms:GenerateDataKey*'
              - 'kms:Decrypt'
            Resource: '*'
            Condition:
              StringEquals:
                'aws:SourceAccount': !Ref 'AWS::AccountId'

  AlertsKeyAlias:
    Condition: IsProd
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Sub 'alias/${ProjectName}-${Stage}-alerts'
      TargetKeyId: !Ref AlertsKey

  # Shared destination for service alarms. Email subscription confirmation is
  # required once per stage; downstream stacks resolve the topic ARN from SSM.
  OperationalAlertsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub '${ProjectName}-${Stage}-operational-alerts'
      # Unencrypted in dev by design — see the matrix on AlertsKey. AWS::NoValue removes the
      # property entirely rather than setting it empty, which SNS would reject.
      KmsMasterKeyId: !If [IsProd, !Ref AlertsKey, !Ref 'AWS::NoValue']
      Tags:
        - { Key: project, Value: !Ref ProjectName }
        - { Key: stage, Value: !Ref Stage }
        - { Key: service, Value: foundation }
        - { Key: owner, Value: platform }
        - { Key: data-class, Value: operational }

  # --- The stage's single CloudWatch dashboard --------------------------------
  # This replaces four per-stack dashboards (app-api, sync-api, signaling, identity).
  # They cost $3/month each beyond the org-wide allowance of three; see the
  # CreateStageDashboard parameter for how that allowance is actually consumed.
  #
  # It lives in `foundation` rather than in the service stacks because a dashboard is
  # a STAGE-level object: there is one per stage no matter how many stacks exist, and
  # foundation is the only stack guaranteed to be deployed before all of them.
  #
  # That inverts the usual dependency problem — foundation deploys FIRST, so it cannot
  # know the service stacks' Lambda function names, and those names are CloudFormation
  # generated (`dndtools-dev-app-api-AppFn-u8Pu5Apml7Gx`), so they cannot be hardcoded
  # either. Every widget therefore uses a metric SEARCH expression matched on the
  # `${ProjectName}-${Stage}` prefix that all of them share. That buys three things:
  #   - no cross-stack lookup, so no deploy-order coupling and no ParameterNotFound;
  #   - a new function/API/queue appears on the dashboard with no template change;
  #   - deploying this before any service stack exists is fine — SEARCH over a
  #     namespace with no metrics renders an empty widget rather than failing.
  # The cost is that widgets are empty until something is actually invoked, which is
  # indistinguishable from a healthy idle stage. Alarms, not this dashboard, are what
  # tell you something is wrong.
  StageOverviewDashboard:
    Type: AWS::CloudWatch::Dashboard
    Condition: ShouldCreateStageDashboard
    Properties:
      DashboardName: !Sub '${ProjectName}-${Stage}-overview'
      DashboardBody: !Sub >-
        {"widgets":[{"type":"metric","x":0,"y":0,"width":12,"height":6,"properties":{"title":"Lambda invocations","region":"${AWS::Region}","view":"timeSeries","stacked":false,"period":300,"metrics":[[{"expression":"SEARCH('{AWS/Lambda,FunctionName} MetricName=\"Invocations\" ${ProjectName}-${Stage}', 'Sum', 300)","id":"e1","label":"","region":"${AWS::Region}"}]]}},{"type":"metric","x":12,"y":0,"width":12,"height":6,"properties":{"title":"Lambda errors and throttles","region":"${AWS::Region}","view":"timeSeries","stacked":false,"period":300,"metrics":[[{"expression":"SEARCH('{AWS/Lambda,FunctionName} MetricName=\"Errors\" ${ProjectName}-${Stage}', 'Sum', 300)","id":"e1","label":"errors","region":"${AWS::Region}"}],[{"expression":"SEARCH('{AWS/Lambda,FunctionName} MetricName=\"Throttles\" ${ProjectName}-${Stage}', 'Sum', 300)","id":"e2","label":"throttles","region":"${AWS::Region}"}]]}},{"type":"metric","x":0,"y":6,"width":12,"height":6,"properties":{"title":"Lambda duration p95","region":"${AWS::Region}","view":"timeSeries","stacked":false,"period":300,"metrics":[[{"expression":"SEARCH('{AWS/Lambda,FunctionName} MetricName=\"Duration\" ${ProjectName}-${Stage}', 'p95', 300)","id":"e1","label":"","region":"${AWS::Region}"}]]}},{"type":"metric","x":12,"y":6,"width":12,"height":6,"properties":{"title":"API 5xx responses","region":"${AWS::Region}","view":"timeSeries","stacked":false,"period":300,"metrics":[[{"expression":"SEARCH('{Dndtools/Api} ${ProjectName}-${Stage}', 'Sum', 300)","id":"e1","label":"","region":"${AWS::Region}"}]]}},{"type":"metric","x":0,"y":12,"width":12,"height":6,"properties":{"title":"Email outcomes","region":"${AWS::Region}","view":"timeSeries","stacked":false,"period":3600,"metrics":[[{"expression":"SEARCH('{AWS/SES,ses:configuration-set} ${ProjectName}-${Stage}-email', 'Sum', 3600)","id":"e1","label":"","region":"${AWS::Region}"}]]}},{"type":"metric","x":12,"y":12,"width":12,"height":6,"properties":{"title":"Email account reputation","region":"${AWS::Region}","view":"timeSeries","stacked":false,"period":3600,"metrics":[["AWS/SES","Reputation.BounceRate"],[".","Reputation.ComplaintRate"]],"stat":"Average","yAxis":{"left":{"min":0}},"annotations":{"horizontal":[{"label":"AWS review (bounce)","value":0.05},{"label":"AWS review (complaint)","value":0.001}]}}},{"type":"metric","x":0,"y":18,"width":24,"height":6,"properties":{"title":"TURN relay heartbeat","region":"${AWS::Region}","view":"timeSeries","stacked":false,"period":60,"metrics":[["${ProjectName}/TURN","Healthy","Stage","${Stage}"]],"stat":"Minimum","yAxis":{"left":{"min":0,"max":1}}}}]}

  # Account-level monitor is stage-scoped because dev and prod live in separate
  # accounts. The low threshold provides an early warning; it never blocks usage.
  CostAnomalyMonitor:
    Type: AWS::CE::AnomalyMonitor
    Properties:
      MonitorName: !Sub '${ProjectName}-${Stage}-account-cost-anomalies'
      MonitorType: DIMENSIONAL
      MonitorDimension: SERVICE

  CostAnomalySubscription:
    Type: AWS::CE::AnomalySubscription
    Properties:
      SubscriptionName: !Sub '${ProjectName}-${Stage}-cost-anomaly-alerts'
      # SNS subscribers require immediate delivery; daily/weekly batching is email-only.
      Frequency: IMMEDIATE
      MonitorArnList: [!GetAtt CostAnomalyMonitor.MonitorArn]
      Subscribers:
        - Address: !Ref OperationalAlertsTopic
          Type: SNS
      Threshold: 1

  OperationalAlertsEmail:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref OperationalAlertsTopic
      Protocol: email
      Endpoint: !Ref NotificationEmail

  ParamOperationalAlertsTopicArn:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub '/${ProjectName}/${Stage}/ops/alerts-topic-arn'
      Type: String
      Value: !Ref OperationalAlertsTopic
      Description: Shared SNS destination for operational CloudWatch alarms.

Outputs:
  CiDeployRoleArn:
    Description: Set this as the GitHub Actions `role-to-assume` (repo variable AWS_DEPLOY_ROLE_ARN).
    Value: !GetAtt CiDeployRole.Arn
    Export:
      Name: !Sub '${ProjectName}-${Stage}-ci-deploy-role-arn'
  SsmNamespace:
    Description: Root SSM namespace all stacks read/write under.
    Value: !Sub '/${ProjectName}/${Stage}'
  BudgetName:
    Description: >-
      The monthly cost budget's CloudFormation-generated name. Not a stable slug — see
      MonthlyCostBudget for why the name is generated rather than declared.
    Value: !Ref MonthlyCostBudget
  OperationalAlertsTopicArn:
    Description: Confirm the email subscription before relying on alarm delivery.
    Value: !Ref OperationalAlertsTopic
  StageOverviewDashboardName:
    Condition: ShouldCreateStageDashboard
    Description: >-
      The stage's single CloudWatch dashboard. Empty widgets mean no traffic, not a broken
      dashboard — see StageOverviewDashboard.
    Value: !Sub '${ProjectName}-${Stage}-overview'
  CostAnomalyMonitorArn:
    Description: Daily account-level cost anomaly monitor (alerts through operations SNS).
    Value: !GetAtt CostAnomalyMonitor.MonitorArn
  AuditTrailArn:
    Description: Account CloudTrail ARN for audit and drift review.
    Value: !GetAtt AuditTrail.Arn

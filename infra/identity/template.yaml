AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  dndtools identity stack — Cognito user pool + public (PKCE) app client + hosted
  UI domain, plus the SES configuration set every outbound message is sent through.
  This is the single identity that gates BOTH the signaling WebSocket and the sync
  REST API (their JWT authorizers validate tokens from this pool). No always-on cost
  (Cognito bills per MAU above the free tier). Outputs are published to SSM
  (/dndtools/<stage>/identity/*) for downstream stacks and the client build to consume.

Parameters:
  ProjectName:
    Type: String
    Default: dndtools
  Stage:
    Type: String
    Default: dev
    AllowedValues: [dev, prod]
  DomainPrefix:
    Type: String
    Default: dndtools-dev-auth
    Description: >-
      Cognito hosted-UI domain prefix (must be globally unique within the region).
      Becomes https://<prefix>.auth.<region>.amazoncognito.com. Change if taken.
  CallbackUrls:
    Type: CommaDelimitedList
    Default: 'http://localhost:5273/,http://localhost:4273/,dndtools://auth'
    Description: >-
      Allowed OAuth redirect URIs. Web dev (Vite 5273 / preview 4273 — see
      apps/gm-react/vite.config.ts), the Electron custom-scheme loopback
      (dndtools://auth), plus the deployed web origin once web-hosting exists.
      HashRouter reads ?code= at the origin root.
  LogoutUrls:
    Type: CommaDelimitedList
    Default: 'http://localhost:5273/,http://localhost:4273/,dndtools://auth'
    Description: Allowed post-logout redirect URIs (same set as callbacks).
  CognitoEmailSourceArn:
    Type: String
    Default: ''
    Description: >-
      Verified SES identity ARN used by Cognito in production. Required for prod; leave blank in dev.
  CognitoEmailFrom:
    Type: String
    Default: ''
    Description: >-
      Verified From address displayed on Cognito confirmation and recovery messages. Required for prod.

  CreateAlarms:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: >-
      Create this stack's CloudWatch alarms.

      CloudWatch bills $0.10/alarm/month beyond a free allowance of TEN alarms, and
      like the dashboard allowance it is consumed across the whole ORGANISATION, as
      alarm-months. Prod alone sits at eleven alarms, so prod is already the budget.

      Dev sets this to false. That is not a cost decision alone: dev's alarms fired
      into a topic with no confirmed subscriber for their entire life, so they were
      never observability in the first place — they were $1.30/month of alarms that
      notified nobody. Turn them on in dev only alongside a confirmed subscription on
      the dev alerts topic, otherwise the same silence returns.

Rules:
  ProductionEmailMustUseSes:
    RuleCondition: !Equals [!Ref Stage, prod]
    Assertions:
      - Assert: !Not [!Equals [!Ref CognitoEmailSourceArn, '']]
        AssertDescription: Production identity requires a verified CognitoEmailSourceArn.
      - Assert: !Not [!Equals [!Ref CognitoEmailFrom, '']]
        AssertDescription: Production identity requires a verified CognitoEmailFrom address.

Conditions:
  ShouldCreateAlarms: !Equals [!Ref CreateAlarms, 'true']
  # ADMIN_USER_PASSWORD_AUTH is a non-SRP password flow used only by automated
  # verification scripts in dev. It is a standing weakening (anyone able to call
  # AdminInitiateAuth can attempt password auth), so it is enabled in dev only —
  # prod uses SRP/PKCE exclusively.
  IsDev: !Equals [!Ref Stage, dev]

Resources:
  UserPool:
    Type: AWS::Cognito::UserPool
    # Cognito identities are durable account state. DeletionProtection blocks an
    # ordinary delete; these policies also make replacement behavior explicit and
    # preserve the old pool for a deliberate user-migration or decommission runbook.
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      UserPoolName: !Sub '${ProjectName}-${Stage}'
      # Self-service signup with email as the username/login.
      UsernameAttributes:
        - email
      # Cognito cannot change this setting after a pool is created — and the existing dev pool was
      # created with the property entirely ABSENT (Cognito's historical case-sensitive default), so
      # even writing the equivalent explicit value is rejected as an update to an immutable
      # property. Dev therefore omits the property to match the live pool byte-for-byte (the client
      # still canonicalizes email addresses); production is a new pool and uses the recommended
      # case-insensitive behavior from its first deployment.
      UsernameConfiguration: !If
        - IsDev
        - !Ref 'AWS::NoValue'
        - CaseSensitive: false
      AutoVerifiedAttributes:
        - email
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: false
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: false
          TemporaryPasswordValidityDays: 7
      # The current client does not implement TOTP enrollment/challenges. Keep MFA off so an account
      # cannot enter a challenge state the app cannot complete; re-enable with the matching client flow.
      MfaConfiguration: 'OFF'
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      # Dev uses Cognito's low-volume default sender. Production is required by the template rule above
      # to use a verified SES identity so confirmation and recovery do not silently hit the 50/day cap.
      # ConfigurationSet is prod-only because it is only meaningful alongside DEVELOPER sending —
      # COGNITO_DEFAULT mail never touches this account's SES and so cannot be attributed to a set.
      EmailConfiguration: !If
        - IsDev
        - EmailSendingAccount: COGNITO_DEFAULT
        - EmailSendingAccount: DEVELOPER
          SourceArn: !Ref CognitoEmailSourceArn
          From: !Ref CognitoEmailFrom
          ConfigurationSet: !Ref EmailConfigurationSet
      UserAttributeUpdateSettings:
        AttributesRequireVerificationBeforeUpdate:
          - email
      # Device tracking backs the app-api "signed-in devices" list + per-device revoke.
      # Auto-remember (no user prompt, no new-device challenge) — the app surfaces the
      # list read-only and offers revoke; it never gates sign-in on device state.
      DeviceConfiguration:
        ChallengeRequiredOnNewDevice: false
        DeviceOnlyRememberedOnUserPrompt: false
      DeletionProtection: ACTIVE
      UserPoolTags:
        project: !Ref ProjectName
        stage: !Ref Stage

  # Public client for the SPA + Electron app: no client secret, PKCE only.
  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub '${ProjectName}-${Stage}-app'
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      # Browsers/Electron always use SRP (+ refresh). ADMIN_USER_PASSWORD_AUTH is
      # appended only in dev (see IsDev) for the automated verification scripts.
      ExplicitAuthFlows: !If
        - IsDev
        - - ALLOW_USER_SRP_AUTH
          - ALLOW_REFRESH_TOKEN_AUTH
          - ALLOW_ADMIN_USER_PASSWORD_AUTH
        - - ALLOW_USER_SRP_AUTH
          - ALLOW_REFRESH_TOKEN_AUTH
      AllowedOAuthFlows:
        - code
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthScopes:
        - openid
        - email
        - profile
      SupportedIdentityProviders:
        - COGNITO
      CallbackURLs: !Ref CallbackUrls
      LogoutURLs: !Ref LogoutUrls
      # Short access/id tokens, long-lived refresh — refresh token is held in the
      # OS credential store per SEC-004 (secret-custody), never in IndexedDB.
      AccessTokenValidity: 60
      IdTokenValidity: 60
      RefreshTokenValidity: 30
      TokenValidityUnits:
        AccessToken: minutes
        IdToken: minutes
        RefreshToken: days
      EnableTokenRevocation: true
      PreventUserExistenceErrors: ENABLED

  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Ref DomainPrefix
      UserPoolId: !Ref UserPool

  # --- Outbound email observability --------------------------------------------
  # Every message this project sends — Cognito verification/recovery codes and app-api
  # campaign invitations — is sent through this one configuration set, so bounce and
  # complaint rates describe the whole sending programme rather than a slice of it.
  # It is created in both stages: dev's Cognito mail bypasses SES entirely, but dev
  # app-api invites do not, and keeping the stacks uniform avoids a prod-only resource
  # whose first exercise would be in production.
  EmailConfigurationSet:
    Type: AWS::SES::ConfigurationSet
    Properties:
      Name: !Sub '${ProjectName}-${Stage}-email'
      ReputationOptions:
        # Publishes Reputation.BounceRate / Reputation.ComplaintRate to CloudWatch under
        # this set's dimension, in addition to the account-wide metrics the alarms below use.
        ReputationMetricsEnabled: true
      SendingOptions:
        SendingEnabled: true
      # SuppressionOptions is deliberately absent: omitting it INHERITS the account-level
      # suppression list, which is already enabled for BOUNCE and COMPLAINT. Specifying it
      # here would override that inheritance rather than add to it, which is how a set ends
      # up quietly suppressing less than the account does.

  # CloudWatch, not SNS, is the event destination. An SNS destination would need
  # sns:Publish granted to ses.amazonaws.com AND KMS access to the topic's key — and the
  # operational-alerts topic is encrypted with the AWS-MANAGED key alias/aws/sns, whose
  # policy cannot be edited to grant a service principal. Metrics + alarms reach the same
  # inbox by the same path as every other alarm in this project, with no per-recipient
  # address leaving SES (the handler in cloud-fns deliberately never logs recipients either).
  EmailEventsToCloudWatch:
    Type: AWS::SES::ConfigurationSetEventDestination
    Properties:
      ConfigurationSetName: !Ref EmailConfigurationSet
      EventDestination:
        Name: cloudwatch
        Enabled: true
        # No `open`/`click`: tracking those would require SES to rewrite links and embed a
        # pixel, which this project has no reason to do to a verification code.
        MatchingEventTypes:
          - send
          - delivery
          - bounce
          - complaint
          - reject
          - renderingFailure
          - deliveryDelay
        CloudWatchDestination:
          DimensionConfigurations:
            - DimensionName: ses:configuration-set
              DimensionValueSource: messageTag
              DefaultDimensionValue: !Sub '${ProjectName}-${Stage}-email'

  # Thresholds sit BELOW the levels at which AWS itself intervenes (review at 5% bounce /
  # 0.1% complaint, possible pause at 10% / 0.5%), so the alarm is a warning to act on
  # rather than a notification that action has already been taken against the account.
  EmailBounceRateAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: ShouldCreateAlarms
    Properties:
      AlarmDescription: >-
        SES account bounce rate is at or above 5% — the level at which AWS places a sending
        account under review. Inspect recent sends and stop the source before it climbs.
      Namespace: AWS/SES
      MetricName: Reputation.BounceRate
      # No dimensions: this is the ACCOUNT-wide rate, which is the number AWS actually acts
      # on. The per-set metric enabled above exists to attribute a spike, not to trigger.
      Statistic: Average
      Period: 3600
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 0.05
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Sub '{{resolve:ssm:/${ProjectName}/${Stage}/ops/alerts-topic-arn}}'

  EmailComplaintRateAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: ShouldCreateAlarms
    Properties:
      AlarmDescription: >-
        SES account complaint rate is at or above 0.1% — the level at which AWS places a
        sending account under review.
      Namespace: AWS/SES
      MetricName: Reputation.ComplaintRate
      Statistic: Average
      Period: 3600
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 0.001
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Sub '{{resolve:ssm:/${ProjectName}/${Stage}/ops/alerts-topic-arn}}'

  # --- Publish identity coordinates to SSM for downstream stacks + client build.
  ParamEmailConfigSet:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub '/${ProjectName}/${Stage}/identity/email-config-set'
      Type: String
      Value: !Ref EmailConfigurationSet
      Description: SES configuration set every outbound message is sent through.

  ParamUserPoolId:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub '/${ProjectName}/${Stage}/identity/user-pool-id'
      Type: String
      Value: !Ref UserPool
  ParamUserPoolArn:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub '/${ProjectName}/${Stage}/identity/user-pool-arn'
      Type: String
      Value: !GetAtt UserPool.Arn
  ParamClientId:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub '/${ProjectName}/${Stage}/identity/app-client-id'
      Type: String
      Value: !Ref UserPoolClient
  ParamHostedUiDomain:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub '/${ProjectName}/${Stage}/identity/hosted-ui-domain'
      Type: String
      Value: !Sub 'https://${DomainPrefix}.auth.${AWS::Region}.amazoncognito.com'
  ParamIssuerUrl:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub '/${ProjectName}/${Stage}/identity/issuer-url'
      Type: String
      Value: !Sub 'https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}'

Outputs:
  UserPoolId:
    Value: !Ref UserPool
    Export:
      Name: !Sub '${ProjectName}-${Stage}-user-pool-id'
  UserPoolArn:
    Value: !GetAtt UserPool.Arn
    Export:
      Name: !Sub '${ProjectName}-${Stage}-user-pool-arn'
  AppClientId:
    Value: !Ref UserPoolClient
    Export:
      Name: !Sub '${ProjectName}-${Stage}-app-client-id'
  HostedUiDomain:
    Value: !Sub 'https://${DomainPrefix}.auth.${AWS::Region}.amazoncognito.com'
  IssuerUrl:
    Value: !Sub 'https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}'
  EmailConfigurationSetName:
    Description: Pass to app-api as SesConfigurationSet so invite mail is measured too.
    Value: !Ref EmailConfigurationSet
    Export:
      Name: !Sub '${ProjectName}-${Stage}-email-config-set'

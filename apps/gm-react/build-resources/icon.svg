<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b211a"/>
      <stop offset="1" stop-color="#15110d"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e6bf72"/>
      <stop offset="1" stop-color="#c08a3e"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="1024" height="1024" rx="224" fill="url(#bg)"/>
  <!-- d20 silhouette (pointy-top hexagon with icosahedron facets) -->
  <g transform="translate(512,528)" stroke="#15110d" stroke-width="14" stroke-linejoin="round">
    <polygon points="0,-330 286,-165 286,165 0,330 -286,165 -286,-165" fill="url(#gold)"/>
    <!-- central top triangle -->
    <polygon points="0,-190 165,95 -165,95" fill="none"/>
    <!-- facet lines from hex corners to the central triangle -->
    <line x1="0" y1="-330" x2="0" y2="-190"/>
    <line x1="286" y1="-165" x2="165" y2="95"/>
    <line x1="-286" y1="-165" x2="-165" y2="95"/>
    <line x1="286" y1="165" x2="165" y2="95"/>
    <line x1="-286" y1="165" x2="-165" y2="95"/>
    <line x1="0" y1="330" x2="0" y2="95"/>
    <line x1="0" y1="95" x2="165" y2="95"/>
    <line x1="0" y1="95" x2="-165" y2="95"/>
  </g>
  <text x="512" y="600" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="150" fill="#15110d">20</text>
</svg>

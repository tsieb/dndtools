# electron-builder config for the DND Tools GM desktop shell (macOS + Linux + Windows, unsigned alpha).
#
# The renderer is the Vite build in `dist/` — react, dexie, @fontsource and @dndtools/core are all
# bundled there, so the packaged app needs NO node_modules at runtime. `files` therefore ships only
# the built bundle, the Electron main/preload, and package.json (which points `main` at the shell).
# This also sidesteps electron-builder walking the pnpm-symlinked node_modules / the `workspace:*`
# core dependency.
appId: com.dndtools.gm
productName: DND Tools GM
# Hyphenated artifact names (productName has spaces) so download URLs are clean.
artifactName: DND-Tools-GM-${version}-${arch}.${ext}

directories:
  output: release
  buildResources: build-resources

files:
  - dist/**/*
  - electron/**/*
  - package.json

# No native modules to rebuild — the app is pure JS bundled by Vite.
npmRebuild: false
asar: true

mac:
  target:
    - target: dmg
      arch:
        - arm64
        - x64
  category: public.app-category.productivity
  # Unsigned alpha: skip signing/notarization. Testers bypass Gatekeeper per INSTALL-ALPHA.md.
  identity: null
  hardenedRuntime: false
  gatekeeperAssess: false

linux:
  executableName: dndtools-gm
  target:
    - target: AppImage
      arch:
        - x64
  category: Game
  synopsis: Offline Game-Master workspace for tabletop RPGs
  desktop:
    entry:
      Name: DND Tools GM

win:
  target:
    - target: nsis
      arch:
        - x64
  # Unsigned alpha: no code-signing certificate. electron-builder's signing auto-discovery is
  # disabled in CI (CSC_IDENTITY_AUTO_DISCOVERY=false); testers get past SmartScreen once via
  # "More info -> Run anyway", documented in INSTALL-ALPHA.md. The .ico is auto-generated from
  # build-resources/icon.png (1024x1024).

# Assisted NSIS installer, tuned for beta testers: a per-user install (no admin/UAC prompt), a
# visible wizard that lets them pick the folder, Start-menu + desktop shortcuts, and a clean
# uninstaller registered in Add/Remove Programs.
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: DND Tools GM

# CI (release.yml) attaches the built dmg/AppImage/exe to a DRAFT GitHub Release for the pushed tag.
publish:
  - provider: github
    owner: tsieb
    repo: dndtools
    releaseType: draft

<!doctype html>
<html lang="en" data-theme="tavern">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="color-scheme" content="light dark" />
		<meta name="referrer" content="no-referrer" />
		<meta name="theme-color" content="#14100b" />
		<meta
			name="description"
			content="A local-first campaign workspace for preparing and running tabletop RPG sessions."
		/>
		<link rel="icon" type="image/svg+xml" href="/icon.svg" />
		<!--
			RC-PLT-2.1 — installable web app. The manifest and its icons are ordinary public assets,
			so Vite rewrites these origin-absolute hrefs to the relative `base` at build time and the
			same document still opens from Electron's `dndtools://app` and the Android WebView, where
			the manifest is simply ignored. Registration of the service worker is feature-detected in
			src/platform/serviceWorker.ts; nothing here assumes a browser that supports it.
		-->
		<link rel="manifest" href="/manifest.webmanifest" />
		<link rel="apple-touch-icon" href="/icon-192.png" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-title" content="Lamplight" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<title>Lamplight — Command Center</title>
		<!--
			Resolve theme / motion / density before first paint, at the document boot,
			so there is no flash of the wrong theme and the layout does not shift
			after hydration. These are the same contracts the design-package tokens read.
		-->
		<script src="/prepaint.js"></script>
		<!--
			Brand webfonts: Inter (UI), Cinzel (display ≥24px), JetBrains Mono (numerals/dice/IDs).
			Self-hosted, not CDN — the @font-face rules live in src/styles/tokens/fonts.css (vendored
			from @fontsource/*) and are bundled by Vite, so the app renders the real faces fully offline.
		--></head>
	<body>
		<div id="root"></div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>

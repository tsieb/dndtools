<!--
	Lamplight app icon — the locked brand mark on its tile.

	The mark is a GM screen seen from above: folded panels with the light behind them.
	Authored on the design system's 64 grid and scaled as a whole, so `stroke-width: 5.5`
	stays 5.5 grid units at every rendered size (the brand rule — thinning it closes the
	disc up first). The disc must never touch the fold; the gap between them is the light.
	Tile ground #0e0a06, radius 20.3% and mark at 65.6% of the tile, matching the
	design-system tiles exactly. Canonical source: the "DND Tools Design System" project,
	assets/logo.svg + guidelines/brand-mark.card.html.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
	<rect width="1024" height="1024" rx="208" fill="#0e0a06" />
	<g transform="translate(176 176) scale(10.5)">
		<circle cx="32" cy="13" r="5.5" fill="#e0b06f" />
		<path
			d="M9 47L23 25L41 47L55 25"
			fill="none"
			stroke="#f2e8d8"
			stroke-width="5.5"
			stroke-linejoin="round"
			stroke-linecap="round"
		/>
	</g>
</svg>

<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="color-scheme" content="light dark" />
		<title>DND Tools v2 — Scene workspace</title>
		<!--
			UX-VIS-001: apply the saved (or OS-resolved) theme to <html> before first paint so there
			is no flash of the wrong theme. Mirrors the resolution in $lib/state/theme.svelte; the
			store takes over on hydration and keeps `system` tracking the OS live.
		-->
		<script>
			(function () {
				try {
					var DARK = { tavern: 1, 'high-contrast': 1 };
					var NAMED = {
						tavern: 1,
						parchment: 1,
						'high-contrast': 1,
					};
					var pref = null;
					try {
						pref = window.localStorage.getItem('dndtools:v2:theme');
					} catch (e) {
						pref = null;
					}
					var osDark =
						typeof window.matchMedia === 'function'
							? window.matchMedia('(prefers-color-scheme: dark)').matches
							: true;
					var applied = NAMED[pref] ? pref : osDark ? 'tavern' : 'parchment';
					var root = document.documentElement;
					root.setAttribute('data-theme', applied);
					root.style.colorScheme = DARK[applied] ? 'dark' : 'light';
				} catch (e) {
					/* fail open to the stylesheet default (tavern) */
				}
			})();
		</script>
		<!--
			UX-VIS-010: resolve the motion preference before first paint so an initial animation never
			plays under reduced motion. Mirrors the precedence in $lib/platform/motion.svelte
			(user-explicit-off > OS-reduce > user-explicit-on > OS-no-preference); the store takes over
			on hydration and keeps it tracking the OS live.
		-->
		<script>
			(function () {
				try {
					var pref = null;
					try {
						pref = window.localStorage.getItem('dndtools:v2:motion');
					} catch (e) {
						pref = null;
					}
					var osReduce =
						typeof window.matchMedia === 'function'
							? window.matchMedia('(prefers-reduced-motion: reduce)').matches
							: true;
					var resolved = pref === 'reduced' || osReduce ? 'reduced' : 'full';
					document.documentElement.setAttribute('data-motion', resolved);
				} catch (e) {
					/* fail open: the :not([data-motion]) media fallback in styles.css applies */
				}
			})();
		</script>
		<!--
			UX-VIS-011: resolve the density mode before first paint so the layout does not shift after
			hydration. Mirrors the classification in $lib/platform/capabilities.ts (compact <=720px,
			expanded >=1200px) and the profile-linked mapping in $lib/platform/density.svelte: only the
			Desktop (expanded) viewport honours the stored preference; touch viewports lock to comfortable.
		-->
		<script>
			(function () {
				try {
					var w = window.innerWidth;
					var viewportClass = w <= 720 ? 'compact' : w >= 1200 ? 'expanded' : 'medium';
					var pref = null;
					try {
						pref = window.localStorage.getItem('dndtools:v2:density');
					} catch (e) {
						pref = null;
					}
					var allowed = { standard: 1, compact: 1, comfortable: 1 };
					var desktop = allowed[pref] ? pref : 'standard';
					var density = viewportClass === 'expanded' ? desktop : 'comfortable';
					document.documentElement.setAttribute('data-density', density);
				} catch (e) {
					/* fail open to the stylesheet default (standard) */
				}
			})();
		</script>
		<!--
			Brand webfonts (UX-VIS-004): Inter (UI), Cinzel (display headings >=24px), JetBrains Mono
			(numerals/dice/IDs). Loaded from Google Fonts; `display=swap` keeps text visible while the
			faces load. The token stacks in styles.css fall back to system fonts if the CDN is blocked.
		-->
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			rel="stylesheet"
			href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
		/>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div id="app">%sveltekit.body%</div>
	</body>
</html>

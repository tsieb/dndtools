appId: com.dndtools.desktop
productName: DND Tools
asar: true

directories:
  output: dist-desktop

files:
  - build/**/*
  - electron/dist/**/*
  - mcp/dist/**/*
  - package.json
  - '!**/*.map'

extraMetadata:
  main: electron/dist/main.cjs

publish:
  - provider: github
    owner: anthropics
    repo: dndtools

npmRebuild: false
artifactName: '${productName}-${version}-${os}-${arch}.${ext}'

protocols:
  - name: DND Tools Deep Link
    schemes:
      - dndtools

fileAssociations:
  - ext: md
    name: Markdown Document
    role: Editor

win:
  target:
    - target: nsis
      arch:
        - x64
  signAndEditExecutable: true

nsis:
  differentialPackage: true
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true

mac:
  category: public.app-category.productivity
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: electron/entitlements.mac.plist
  entitlementsInherit: electron/entitlements.mac.plist

linux:
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  category: Utility
